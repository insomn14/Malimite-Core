<!doctype html>
<!--
  MALIMITE — Vulnerability Assessment Report Template (Bilingual ID/EN)
  ======================================================================
  CARA PAKAI / HOW TO USE
  Tool cukup mengganti isi blok script ber-id "report-data" (lihat komentar HTML persis
  di atas blok tersebut) dengan JSON hasil scan. Seluruh halaman dirender dari data tersebut
  (tanpa template engine). The tool only needs to replace the JSON inside the script block
  with id "report-data" (see the HTML comment right above it). The whole page renders from
  it — no template engine.
  PENTING / IMPORTANT: escape "</" menjadi "<\/" saat serialisasi JSON (mis. evidence berisi
  "</script>") agar blok data tidak terputus. Python: json.dumps(d).replace("</", "<\\/")

  KONTRAK DATA / DATA CONTRACT (semua field opsional kecuali yang bertanda *)
  meta:      report_title, doc_number, classification, client, version, generated*, scan_id*,
             duration_ms, tool_version, period_start, period_end,
             prepared_by[], reviewed_by[], approved_by[], history[{version,date,author,change}]
  app:       bundle_id*, executable, platform*, language, universal, team_id, profile,
             profile_expires, app_version, sha256, classes, functions, strings
  summary:   occurrences, executive_note (string | {id,en})
  controls:  [{group, name, status: PRESENT|PARTIAL|ABSENT|UNKNOWN, signal, detail, rule, confidence}]
  findings*: [{id, severity: CRITICAL|HIGH|MEDIUM|LOW|INFO, cvss, cvss_vector, title, rule,
              source: MASTG|LLM, category, cwe, masvs, description, affected[{name,type,location}],
              evidence, poc[], remediation, reference, status: OPEN|IN_PROGRESS|FIXED|ACCEPTED|FALSE_POSITIVE}]
  code_surface: {entry_points[], classes[{name, fn}]}
  strings_sample: [{address, segment, value}], strings_total
  Teks bebas (title, description, remediation, executive_note) boleh string atau {"id":"…","en":"…"}.
  Free text fields accept a string or {"id":"…","en":"…"}.
  Jumlah per severity/kategori dihitung otomatis dari findings. Counts are computed from findings.
-->
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Malimite VA Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f7; --paper:#ffffff; --ink:#1b1f27; --muted:#5d6675; --faint:#8b93a1; --line:#e2e5ea; --soft:#f7f8fa;
  --brand:#2f3a8f; --brand-soft:#eceefb;
  --crit:#9b1c31; --crit-bg:#fbe9ec; --high:#c62828; --high-bg:#fdecec; --med:#b8650a; --med-bg:#fdf3e4;
  --low:#1f5fbf; --low-bg:#e8f0fc; --info:#4b5563; --info-bg:#eef0f3;
  --ok:#17803d; --ok-bg:#e6f5ec; --code:#f3f4f7;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1218; --paper:#161a22; --ink:#e6e8ec; --muted:#a2a9b6; --faint:#77808f; --line:#2a303b; --soft:#1b2029;
    --brand:#9aa6ff; --brand-soft:#232846;
    --crit:#ff7a8f; --crit-bg:#3a1820; --high:#ff8a80; --high-bg:#3a1c1c; --med:#f0b25a; --med-bg:#382a15;
    --low:#7fb0ff; --low-bg:#172840; --info:#b5bcc8; --info-bg:#232833; --ok:#6fd492; --ok-bg:#16301f; --code:#1d222c;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1218; --paper:#161a22; --ink:#e6e8ec; --muted:#a2a9b6; --faint:#77808f; --line:#2a303b; --soft:#1b2029;
  --brand:#9aa6ff; --brand-soft:#232846;
  --crit:#ff7a8f; --crit-bg:#3a1820; --high:#ff8a80; --high-bg:#3a1c1c; --med:#f0b25a; --med-bg:#382a15;
  --low:#7fb0ff; --low-bg:#172840; --info:#b5bcc8; --info-bg:#232833; --ok:#6fd492; --ok-bg:#16301f; --code:#1d222c;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 "IBM Plex Sans",system-ui,sans-serif}
code,pre,.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
a{color:var(--brand)}
/* language switching */
body[data-lang="id"] .l-en, body[data-lang="id"] .l-sep{display:none}
body[data-lang="en"] .l-id, body[data-lang="en"] .l-sep{display:none}
body[data-lang="both"] .l-en{color:var(--faint);font-weight:inherit}
.l-sep{color:var(--faint)}
/* toolbar */
.toolbar{position:sticky;top:0;z-index:5;display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap;
  padding:10px 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.toolbar .lbl{font-size:12px;color:var(--muted);margin-right:4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button,.btn{font:inherit;font-size:12px;padding:6px 12px;border:0;background:var(--paper);color:var(--ink);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--brand);color:#fff}
.btn{border:1px solid var(--line);border-radius:8px}
/* layout */
.wrap{max-width:960px;margin:0 auto;padding:24px 16px 64px}
.page{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:32px 36px;margin-bottom:20px}
@media (max-width:640px){.page{padding:20px 16px}}
h1{font-size:30px;line-height:1.2;margin:6px 0 4px}
h2{font-size:19px;margin:0 0 14px;padding-bottom:10px;border-bottom:2px solid var(--brand);display:flex;gap:10px;align-items:baseline}
h2 .num{color:var(--brand)}
h3{font-size:15px;margin:22px 0 8px}
p{margin:0 0 10px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)} .small{font-size:12px}
/* cover */
.cover{border-top:6px solid var(--brand)}
.brand-mark{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.brand-mark svg{width:28px;height:28px;color:var(--brand);flex:none}
.brand-mark .word{font-size:17px;font-weight:700;letter-spacing:.02em;color:var(--ink)}
.cover .app{font-size:16px;color:var(--muted)}
.cover-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 24px;margin-top:28px}
.kv{display:flex;flex-direction:column}.kv .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint)}
.kv .v{font-weight:500;word-break:break-word}
.badge-class{display:inline-block;margin-top:24px;padding:6px 12px;border:1.5px solid var(--high);color:var(--high);border-radius:6px;font-weight:700;font-size:12px;letter-spacing:.08em}
/* tables */
.tw{overflow-x:auto;margin:6px 0 14px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--soft);font-weight:600;font-size:12px;color:var(--muted)}
td.k{width:34%;color:var(--muted)}
td.c,th.c{text-align:center}
/* severity */
.sev{display:inline-block;padding:2px 8px;border-radius:5px;font-size:11px;font-weight:700;letter-spacing:.04em;white-space:nowrap}
.sev.CRITICAL{background:var(--crit-bg);color:var(--crit)} .sev.HIGH{background:var(--high-bg);color:var(--high)}
.sev.MEDIUM{background:var(--med-bg);color:var(--med)} .sev.LOW{background:var(--low-bg);color:var(--low)}
.sev.INFO{background:var(--info-bg);color:var(--info)}
.st{display:inline-block;padding:2px 8px;border-radius:5px;font-size:11px;font-weight:600;background:var(--info-bg);color:var(--info)}
.st.PRESENT,.st.FIXED{background:var(--ok-bg);color:var(--ok)} .st.ABSENT,.st.OPEN{background:var(--high-bg);color:var(--high)}
.st.PARTIAL,.st.IN_PROGRESS{background:var(--med-bg);color:var(--med)}
.tag{display:inline-block;padding:1px 7px;border:1px solid var(--line);border-radius:5px;font-size:11px;color:var(--muted);margin-right:4px}
.tag.LLM{border-color:var(--med);color:var(--med)}
/* stat cards */
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:8px 0 18px}
@media (max-width:700px){.stats{grid-template-columns:repeat(3,1fr)}}
.stat{border:1px solid var(--line);border-radius:10px;padding:12px}
.stat .n{font-size:28px;font-weight:700;line-height:1}
.stat .t{font-size:11px;font-weight:700;letter-spacing:.05em;margin-top:6px}
.stat.CRITICAL .n,.stat.CRITICAL .t{color:var(--crit)} .stat.HIGH .n,.stat.HIGH .t{color:var(--high)}
.stat.MEDIUM .n,.stat.MEDIUM .t{color:var(--med)} .stat.LOW .n,.stat.LOW .t{color:var(--low)}
.stat.INFO .n,.stat.INFO .t{color:var(--info)} .stat.TOTAL .n,.stat.TOTAL .t{color:var(--brand)}
.posture{display:flex;gap:16px;align-items:center;padding:14px 16px;border-radius:10px;background:var(--soft);border-left:5px solid var(--brand);margin-bottom:16px}
.posture .r{font-size:20px;font-weight:700}
.bars{display:grid;gap:6px;margin:6px 0 14px}
.bar{display:grid;grid-template-columns:120px 1fr 32px;gap:10px;align-items:center;font-size:12px}
.bar .track{height:10px;background:var(--soft);border-radius:5px;overflow:hidden}
.bar .fill{height:100%;background:var(--brand);border-radius:5px}
/* findings */
.finding{border:1px solid var(--line);border-radius:10px;margin:0 0 18px;overflow:hidden;break-inside:avoid-page}
.f-head{display:flex;gap:10px;align-items:flex-start;padding:14px 16px;background:var(--soft);border-bottom:1px solid var(--line)}
.f-head .fid{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted);white-space:nowrap;padding-top:2px}
.f-head .ft{font-weight:600;font-size:15px;flex:1}
.f-body{padding:14px 16px}
.f-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 16px;margin-bottom:12px}
.f-sec{margin-top:12px}
.f-sec .h{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
pre{background:var(--code);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:12px;white-space:pre-wrap;word-break:break-word;margin:0}
ol,ul{margin:0;padding-left:20px}
.affected{display:flex;flex-wrap:wrap;gap:6px}
.affected span{font-family:"IBM Plex Mono",monospace;font-size:11.5px;background:var(--code);border:1px solid var(--line);border-radius:5px;padding:2px 7px}
.note{font-size:12px;padding:8px 12px;border-radius:8px;background:var(--med-bg);color:var(--med);margin-top:12px}
.sign td{height:56px}
footer{text-align:center;font-size:11px;color:var(--faint);margin-top:8px}
/* print */
@media print{
  @page{size:A4;margin:16mm 14mm}
  /* Without this, browsers drop background-color on everything except <body>/links when printing
     or "Save as PDF" — the MASVS-category bar fill (.bar .fill), severity/status badges, the risk
     posture box, and the affected-asset chips all render colorless otherwise. */
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact;color-adjust:exact}
  body{background:#fff;font-size:11.5px}
  .toolbar{display:none}
  .wrap{max-width:none;padding:0}
  /* setiap bab dimulai di halaman baru / every chapter starts on a new page */
  .page{border:0;border-radius:0;padding:0;margin:0;break-before:page;break-after:auto}
  .page:first-of-type{break-before:auto}
  h2,h3,.f-sec .h{break-after:avoid}
  thead{display:table-header-group}
  tr,.kv,li{break-inside:avoid}
  .tw{overflow:visible}
  .finding{break-inside:avoid}
  a{color:inherit;text-decoration:none}
}
</style>
</head>
<body data-lang="both">

<div class="toolbar">
  <span class="lbl">Bahasa / Language</span>
  <div class="seg" role="group" aria-label="Language">
    <button data-lang="id">ID</button><button data-lang="en">EN</button><button data-lang="both" aria-pressed="true">ID + EN</button>
  </div>
  <button class="btn" onclick="window.print()">Cetak PDF / Print PDF</button>
</div>

<main class="wrap" id="app"></main>

<!-- ===== report-data : replaced by Malimite with the scan's JSON payload ===== -->
<script id="report-data" type="application/json">
__MALIMITE_REPORT_DATA_JSON__
</script>

<script>
(function(){
"use strict";
const D = JSON.parse(document.getElementById("report-data").textContent);

/* ---------- i18n ---------- */
const L = {
  report:["Laporan Vulnerability Assessment","Vulnerability Assessment Report"],
  docNo:["Nomor Dokumen","Document No."], client:["Klien","Client"], platform:["Platform","Platform"],
  period:["Periode Pengujian","Assessment Period"], generated:["Tanggal Laporan","Report Date"],
  scanId:["ID Pemindaian","Scan ID"], version:["Versi Dokumen","Document Version"], tool:["Alat","Tool"],
  preparedBy:["Disusun oleh","Prepared by"], reviewedBy:["Direview oleh","Reviewed by"], approvedBy:["Disetujui oleh","Approved by"],
  docInfo:["Informasi Dokumen","Document Information"], history:["Riwayat Versi","Version History"],
  date:["Tanggal","Date"], author:["Penulis","Author"], change:["Perubahan","Change"],
  exec:["Ringkasan Eksekutif","Executive Summary"], posture:["Postur Risiko Keseluruhan","Overall Risk Posture"],
  findings:["temuan","findings"], unique:["isu unik","unique issues"], occ:["kemunculan","occurrences"],
  byCat:["Temuan per Kategori MASVS","Findings by MASVS Category"], bySource:["Sumber Deteksi","Detection Source"],
  keyRec:["Rekomendasi Prioritas","Priority Recommendations"],
  scope:["Ruang Lingkup & Target","Scope & Target"], bundle:["Bundle & Signing","Bundle & Signing"],
  method:["Metodologi","Methodology"], rating:["Klasifikasi Tingkat Risiko","Risk Rating Classification"],
  level:["Tingkat","Level"], score:["Skor CVSS","CVSS Score"], desc:["Deskripsi","Description"], sla:["SLA Perbaikan","Remediation SLA"],
  summaryTbl:["Ringkasan Temuan","Findings Summary"], title:["Judul","Title"], category:["Kategori","Category"],
  source:["Sumber","Source"], status:["Status","Status"],
  controls:["Penilaian Kontrol Keamanan","Security Controls Assessment"], control:["Kontrol","Control"],
  detail:["Detail","Detail"], conf:["Keyakinan","Confidence"], group:["Grup","Group"],
  details:["Detail Temuan","Detailed Findings"], affected:["Komponen Terdampak","Affected Components"],
  evidence:["Bukti","Evidence"], poc:["Proof of Concept — Langkah Reproduksi","Proof of Concept — Steps to Reproduce"],
  remediation:["Rekomendasi Perbaikan","Remediation"], reference:["Referensi","Reference"],
  rule:["Aturan","Rule"], cwe:["CWE","CWE"], masvs:["MASVS","MASVS"],
  llmNote:["Temuan ini dihasilkan analisis berbasis LLM dan perlu diverifikasi manual sebelum ditindaklanjuti.","This finding was produced by LLM-assisted analysis and requires manual verification before action."],
  matrix:["Pemetaan MASVS","MASVS Mapping"],
  appendix:["Lampiran","Appendix"], surface:["Permukaan Kode","Code Surface"], entry:["Entry Points","Entry Points"],
  classIdx:["Indeks Kelas","Class Index"], fn:["fungsi","functions"], strings:["Sampel String","String Sample"],
  addr:["Alamat","Address"], seg:["Segmen","Segment"], value:["Nilai","Value"], scanMeta:["Metadata Pemindaian","Scan Metadata"],
  duration:["Durasi","Duration"], disclaimer:["Batasan & Penafian","Limitations & Disclaimer"],
  approval:["Lembar Persetujuan","Approval Sheet"], role:["Peran","Role"], name:["Nama","Name"], sign:["Tanda Tangan","Signature"],
  confidential:["RAHASIA","CONFIDENTIAL"], showing:["menampilkan","showing"], of:["dari","of"],
  noFindings:["Tidak ada temuan.","No findings."],
  glossary:["Glosarium Istilah & Singkatan","Glossary of Terms & Abbreviations"],
  term:["Istilah","Term"], meaning:["Arti / Keterangan","Meaning / Description"]
};
const SEV = ["CRITICAL","HIGH","MEDIUM","LOW","INFO"];
const SEVL = {CRITICAL:["Kritis","Critical"],HIGH:["Tinggi","High"],MEDIUM:["Sedang","Medium"],LOW:["Rendah","Low"],INFO:["Info","Info"]};
const STL = {OPEN:["Terbuka","Open"],IN_PROGRESS:["Dalam Perbaikan","In Progress"],FIXED:["Diperbaiki","Fixed"],ACCEPTED:["Risiko Diterima","Risk Accepted"],FALSE_POSITIVE:["Positif Palsu","False Positive"],
  PRESENT:["Ada","Present"],PARTIAL:["Sebagian","Partial"],ABSENT:["Tidak Ada","Absent"],UNKNOWN:["Tidak Diketahui","Unknown"]};

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const bi = (id,en) => id === en ? id : `<span class="l-id">${id}</span><span class="l-sep"> / </span><span class="l-en">${en}</span>`;
const t = k => L[k] ? bi(L[k][0], L[k][1]) : esc(k);
const pair = (m,k) => m[k] ? bi(m[k][0], m[k][1]) : esc(k);
/* inline `code` support for scanner text */
const fmt = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
const tx = v => (v && typeof v === "object") ? bi(fmt(v.id ?? v.en), fmt(v.en ?? v.id)) : fmt(v);
const link = s => /^https?:\/\//.test(s||"") ? `<a href="${esc(s)}" target="_blank" rel="noopener">${esc(s)}</a>` : esc(s);
const list = a => (a && a.length) ? a.map(esc).join(", ") : "—";
const sev = s => `<span class="sev ${esc(s)}">${pair(SEVL,s)}</span>`;
const st = s => `<span class="st ${esc(s)}">${pair(STL,s)}</span>`;
const kvRow = (k,v) => (v===undefined||v===null||v==="") ? "" : `<tr><td class="k">${k}</td><td>${v}</td></tr>`;

/* ---------- derived data ---------- */
const M = D.meta||{}, A = D.app||{};
const F = (D.findings||[]).slice().sort((a,b)=>SEV.indexOf(a.severity)-SEV.indexOf(b.severity) || (b.cvss||0)-(a.cvss||0));
F.forEach((f,i)=>{ f._id = f.id || `MAL-${String(i+1).padStart(2,"0")}`; });
const cnt = Object.fromEntries(SEV.map(s=>[s, F.filter(f=>f.severity===s).length]));
const occ = D.summary?.occurrences ?? F.reduce((n,f)=>n+Math.max(1,(f.affected||[]).length),0);
const byCat = {}; F.forEach(f=>{ byCat[f.category||"OTHER"]=(byCat[f.category||"OTHER"]||0)+1; });
const bySrc = {}; F.forEach(f=>{ bySrc[f.source||"OTHER"]=(bySrc[f.source||"OTHER"]||0)+1; });
const C = D.controls||[];
const cc = s => C.filter(c=>c.status===s).length;
const postureKey = cnt.CRITICAL ? "CRITICAL" : cnt.HIGH ? "HIGH" : cnt.MEDIUM ? "MEDIUM" : cnt.LOW ? "LOW" : "INFO";
const postureTxt = {
  CRITICAL:["Terdapat kerentanan kritis yang harus segera diperbaiki sebelum rilis.","Critical vulnerabilities exist and must be fixed before release."],
  HIGH:["Terdapat kerentanan tinggi yang perlu diprioritaskan dalam siklus rilis terdekat.","High-risk vulnerabilities require priority remediation in the next release cycle."],
  MEDIUM:["Tidak ada temuan kritis/tinggi; temuan sedang perlu dijadwalkan perbaikannya.","No critical/high issues; medium findings should be scheduled for remediation."],
  LOW:["Hanya temuan berisiko rendah; perbaiki sebagai bagian dari hardening.","Only low-risk findings; address them as part of hardening."],
  INFO:["Tidak ada kerentanan yang dapat dieksploitasi terdeteksi.","No exploitable vulnerabilities detected."]
}[postureKey];
const dur = M.duration_ms ? `${Math.round(M.duration_ms/1000)} s` : null;
const title = M.report_title ? tx(M.report_title) : t("report");

/* ---------- sections ---------- */
let n = 0; const H = k => `<h2><span class="num">${++n}.</span><span>${t(k)}</span></h2>`;

      ${f.source==="LLM"?`<div class="note">${t("llmNote")}</div>`:""}
    </div>
  </article>`).join("")}
</section>`;

const masvsCats = ["MASVS-STORAGE","MASVS-CRYPTO","MASVS-AUTH","MASVS-NETWORK","MASVS-PLATFORM","MASVS-CODE","MASVS-RESILIENCE","MASVS-PRIVACY"];
const masvsRow = c => { const fs = F.filter(f=>(f.masvs||"").startsWith(c)); return `<tr><td class="mono small">${c}</td>${SEV.map(s=>`<td class="c">${fs.filter(f=>f.severity===s).length||""}</td>`).join("")}<td class="c"><b>${fs.length||""}</b></td><td class="small">${fs.map(f=>`<a href="#${esc(f._id)}">${esc(f._id)}</a>`).join(", ")||"—"}</td></tr>`; };
const masvs = `
<section class="page flow">
  ${H("matrix")}
  <div class="tw"><table><thead><tr><th>MASVS</th>${SEV.map(s=>`<th class="c">${pair(SEVL,s)}</th>`).join("")}<th class="c">Total</th><th>ID</th></tr></thead>
  <tbody>${masvsCats.map(masvsRow).join("")}</tbody></table></div>
</section>`;

const cs = D.code_surface||{}, SS = D.strings_sample||[];
/* Only terms this report's own text actually uses — keep this list tight rather than exhaustive. */
const GLOSSARY = [
  ["VA", "Vulnerability Assessment — proses identifikasi, klasifikasi, dan pemeringkatan kerentanan keamanan secara sistematis.", "Vulnerability Assessment — the systematic process of identifying, classifying, and ranking security weaknesses."],
  ["OWASP", "Open Worldwide Application Security Project — organisasi nirlaba yang menerbitkan standar dan panduan keamanan aplikasi.", "Open Worldwide Application Security Project — a nonprofit publishing application-security standards and guidance."],
  ["MASVS", "OWASP Mobile Application Security Verification Standard — standar kontrol keamanan baku untuk aplikasi mobile; setiap temuan dipetakan ke kategori kontrolnya (mis. MASVS-NETWORK).", "OWASP Mobile Application Security Verification Standard — the baseline security-control standard for mobile apps; each finding is mapped to its control category (e.g. MASVS-NETWORK)."],
  ["MASTG", "OWASP Mobile Application Security Testing Guide — panduan teknis pengujian yang menjabarkan setiap kontrol MASVS menjadi kasus uji (mis. MASTG-TEST-0261).", "OWASP Mobile Application Security Testing Guide — the technical testing guide that breaks each MASVS control into concrete test cases (e.g. MASTG-TEST-0261)."],
  ["MSTG", "Nama lama dari MASTG (Mobile Security Testing Guide); masih dipakai sebagai ID aturan pada katalog deteksi versi lama.", "The former name of MASTG (Mobile Security Testing Guide); still used as the rule id in older detection-catalog entries."],
  ["CVSS", "Common Vulnerability Scoring System — sistem penilaian 0.0–10.0 untuk mengukur tingkat keparahan teknis suatu kerentanan.", "Common Vulnerability Scoring System — a 0.0–10.0 score measuring a vulnerability's technical severity."],
  ["CWE", "Common Weakness Enumeration — katalog standar untuk jenis kelemahan perangkat lunak (mis. CWE-798: Hardcoded Credentials).", "Common Weakness Enumeration — a standard catalog of software weakness types (e.g. CWE-798: Hardcoded Credentials)."],
  ["SLA", "Service Level Agreement — target batas waktu perbaikan yang disarankan berdasarkan tingkat keparahan temuan (lihat tabel Skala Penilaian Risiko).", "Service Level Agreement — the suggested remediation deadline based on a finding's severity (see the Risk Rating Scale table)."],
  ["LLM", "Large Language Model — model AI yang digunakan Malimite untuk analisis tambahan; temuan bersumber LLM selalu memerlukan verifikasi manual.", "Large Language Model — the AI model Malimite uses for supplementary analysis; LLM-sourced findings always require manual verification."],
  ["MAL", "Prefiks ID unik setiap temuan dalam laporan ini (mis. MAL-1), diikuti nomor baris temuan pada basis data pemindaian — bukan nomor urut keparahan.", "The unique-id prefix for every finding in this report (e.g. MAL-1), followed by that finding's row number in the scan database — not a severity ranking."],
  ["IPA/APK", "Format paket instalasi aplikasi: .ipa untuk iOS, .apk untuk Android — berkas yang dipindai Malimite.", "Application package formats: .ipa for iOS, .apk for Android — the file Malimite scans."],
  ["SHA-256", "Fungsi hash kriptografis yang menghasilkan sidik jari 256-bit suatu berkas, dipakai untuk memverifikasi integritas.", "A cryptographic hash function producing a 256-bit fingerprint of a file, used to verify integrity."]
];
const glossaryRows = GLOSSARY.map(([term,idDesc,enDesc])=>`<tr><td class="mono small">${esc(term)}</td><td>${bi(idDesc,enDesc)}</td></tr>`).join("");
const appendix = `
<section class="page flow">
  ${H("appendix")}
  <h3>A. ${t("scanMeta")}</h3>
  <div class="tw"><table><tbody>
    ${kvRow(t("scanId"),`<span class="mono small">${esc(M.scan_id)}</span>`)}${kvRow(t("generated"),esc(M.generated))}
    ${kvRow(t("duration"),esc(dur))}${kvRow(t("tool"),esc(M.tool_version||"Malimite"))}
  </tbody></table></div>
  <h3>B. ${t("surface")}</h3>
  <p class="small muted">${esc((cs.classes||[]).length)} ${bi("kelas","classes")} · ${esc(A.functions??"")} ${t("fn")} · ${esc((cs.entry_points||[]).length)} entry points</p>
  ${(cs.entry_points||[]).length?`<div class="affected" style="margin-bottom:10px">${cs.entry_points.map(e=>`<span>${esc(e)}</span>`).join("")}</div>`:""}
  ${(cs.classes||[]).length?`<div class="tw"><table><thead><tr><th>${t("classIdx")}</th><th class="c">${t("fn")}</th></tr></thead><tbody>${cs.classes.map(c=>`<tr><td class="mono small">${esc(c.name)}</td><td class="c">${esc(c.fn)}</td></tr>`).join("")}</tbody></table></div>`:""}
  ${SS.length?`<h3>C. ${t("strings")} <span class="small muted">(${t("showing")} ${SS.length} ${t("of")} ${esc(D.strings_total??SS.length)})</span></h3>
  <div class="tw"><table><thead><tr><th>${t("addr")}</th><th>${t("seg")}</th><th>${t("value")}</th></tr></thead><tbody>
  ${SS.map(s=>`<tr><td class="mono small">${esc(s.address)}</td><td class="mono small">${esc(s.segment)}</td><td class="mono small">${esc(s.value)}</td></tr>`).join("")}</tbody></table></div>`:""}
  <h3>D. ${t("reference")}</h3>
  <ul class="small">
    <li><a href="https://mas.owasp.org/MASVS/" target="_blank" rel="noopener">OWASP MASVS</a></li>
    <li><a href="https://mas.owasp.org/MASTG/" target="_blank" rel="noopener">OWASP MASTG</a></li>
    <li><a href="https://owasp.org/www-project-mobile-top-10/" target="_blank" rel="noopener">OWASP Mobile Top 10</a></li>
    <li><a href="https://www.first.org/cvss/calculator/3.1" target="_blank" rel="noopener">FIRST CVSS v3.1 Calculator</a></li>
  </ul>
  <h3>E. ${t("glossary")}</h3>
  <div class="tw"><table><thead><tr><th>${t("term")}</th><th>${t("meaning")}</th></tr></thead>
  <tbody>${glossaryRows}</tbody></table></div>
</section>`;

const signRows = [["preparedBy",M.prepared_by],["reviewedBy",M.reviewed_by],["approvedBy",M.approved_by]];
const approval = `
<section class="page flow sign">
  ${H("approval")}

</section>`;

document.getElementById("app").innerHTML = cover + exec + scope + rating + summary + details + masvs + appendix + approval;
document.title = `Malimite VA Report — ${A.bundle_id||""}`;

/* language toggle */
const btns = document.querySelectorAll(".seg button");
const setLang = l => {
  document.body.dataset.lang = l;
  document.documentElement.lang = l === "en" ? "en" : "id";
  btns.forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.lang===l)));
  try{ localStorage.setItem("malimite-lang", l); }catch(e){}
};
btns.forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.lang)));
let saved = null; try{ saved = localStorage.getItem("malimite-lang"); }catch(e){}
const qp = new URLSearchParams(location.search).get("lang");
setLang(qp || saved || "both");
})();
</script>
