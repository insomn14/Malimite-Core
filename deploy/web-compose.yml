# Malimite-Core — Web service (FastAPI). Isolated from the legacy API/worker
# stack in docker-compose.yml so ports do not collide.
#
# Usage:
#   docker compose -f deploy/web-compose.yml up --build
#   → http://localhost:7070
services:
  malimite-web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    image: malimite-web:latest
    container_name: malimite-web
    ports:
      # host:container. Loopback only by default: the chat spends your LLM quota. To expose it on the LAN set
      # MALIMITE_BIND=0.0.0.0 AND API_KEY (deploy/.env).
      - "${MALIMITE_BIND:-127.0.0.1}:7070:7070"
    environment:
      HOST: "0.0.0.0"
      PORT: "7070"
      SCAN_DIR: "/var/malimite/scans"
      GHIDRA_HOME: "/opt/ghidra"
      JADX_HOME: "/opt/jadx"
      CLI_JAR: "/app/cli.jar"
      # Learned rules (seeded from ./rules, mounted read-only below)
      MALIMITE_LEARNED_RULES_IOS:     "/var/malimite/rules/learned_rules_ios.json"
      MALIMITE_LEARNED_RULES_ANDROID: "/var/malimite/rules/learned_rules_android.json"
      # Optional auth / LLM defaults (copy values from web/.env.example as needed)
      API_KEY: "${API_KEY:-}"
      LLM_PROVIDER: "${LLM_PROVIDER:-none}"
      LLM_MODE: "${LLM_MODE:-summarize}"
      LLM_MODEL: "${LLM_MODEL:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      DEEPSEEK_BASE_URL: "${DEEPSEEK_BASE_URL:-https://api.deepseek.com}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://localhost:11434}"
      # Lets the "Import from Claude Code CLI" button (web UI, LLM Enrichment =
      # Claude OAuth) and `malimite claude-login --import` auto-detect an
      # already-completed `claude /login` session. Points at a *copy*
      # (./sync-claude-oauth.sh), not ~/.claude/.credentials.json directly —
      # that file is correctly 0600 and owned by the host uid, unreadable by
      # this container's unprivileged uid 10001. Entirely optional.
      CLAUDE_CODE_CREDENTIALS_PATH: "/home/malimite/.malimite/claude-code-credentials.json"
    volumes:
      # Persist scan outputs (SQLite, report.html, findings.sarif, scan.json)
      - malimite-scans:/var/malimite/scans
      # Learned rules seed (read-only)
      - ./rules:/var/malimite/rules:ro
      # Anthropic OAuth credential, shared by TWO consumers that both read/refresh the
      # same anthropic-oauth.json: the Java CLI (scan enrichment, llm_provider=claude-oauth
      # → ClaudeOAuthProvider.java) and the Python chat agent (AI Assistant tab, provider
      # claude-oauth → web/app/agent/anthropic_oauth.py). The container has no browser, so
      # the *initial* sign-in has to happen on the HOST:
      #   java -jar cli/target/malimite-cli.jar claude-login
      #   ./sync-claude-oauth.sh     # copies the result into ~/.malimite-docker
      # This mounts a dedicated ~/.malimite-docker (NOT ~/.malimite itself) because
      # the service runs as uid 10001 inside the container while the host user is a
      # different uid — sharing ~/.malimite directly would require chowning it to
      # 10001, which breaks host-side access to that directory. The mount is
      # read-write: both consumers refresh the access token roughly hourly and persist
      # the new pair back to this same path.
      - ${HOME}/.malimite-docker:/home/malimite/.malimite
    restart: unless-stopped
    # Caps this one container so a heavy iOS/Ghidra scan can't swap-storm the whole
    # host: without this, Ghidra's analysis can push system-wide swap past 90%, and
    # systemd-oomd (on the host) kills the ENTIRE container's cgroup — not just the
    # scan's subprocess — taking down every in-progress scan and the API with it.
    # With the limit, a single oversized scan hits ITS OWN container limit and gets
    # OOM-killed cleanly (reap_stale_running_scans() then reports it as an error),
    # while the rest of the host and other scans stay unaffected. Raise this if a
    # legitimate scan needs more headroom than Ghidra's own 2G heap + overhead.
    mem_limit: "6g"
    memswap_limit: "6g"

volumes:
  malimite-scans:
