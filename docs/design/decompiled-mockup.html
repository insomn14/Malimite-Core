.st{font-size:.7rem;font-weight:700;color:var(--green);background:#dcfce7;border-radius:999px;padding:.1rem .55rem}
.meta{color:var(--muted);font-size:.78rem}
.tabs{display:flex;gap:.1rem;padding:0 1rem;border-bottom:1px solid var(--border);overflow-x:auto}
.tab{display:inline-flex;align-items:center;gap:.35rem;padding:.6rem .62rem;font-size:.8rem;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}

.seg button{display:inline-flex;align-items:center;gap:.35rem;border:0;background:transparent;padding:.4rem .75rem;border-radius:8px;font-size:.78rem;font-weight:600;color:#4b5563;white-space:nowrap}
.seg button.on{background:#fff;color:var(--accent);box-shadow:0 1px 3px rgba(16,24,40,.12)}
.btn{display:inline-flex;align-items:center;gap:.35rem;border:1px solid var(--border);background:#fff;border-radius:8px;padding:.3rem .7rem;font-size:.78rem;font-weight:600;white-space:nowrap}

kbd{font:600 .66rem ui-monospace,monospace;border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:0 .3rem;background:#fff;color:var(--muted)}

}

/* ── tree ── */
const worst=(a,b)=>!a?b:!b?a:(RANK[a]<=RANK[b]?a:b);
const sevOf=n=>n.c?n.sev:(n.kids||[]).reduce((s,k)=>worst(s,sevOf(k)),null);
const cnt=n=>n.c?(n.sev?1:0):(n.kids||[]).reduce((s,k)=>s+cnt(k),0);
const flat=(ns,p='')=>ns.flatMap(n=>n.c?[{...n,p}]:flat(n.kids,p?p+'.'+n.n:n.n));
const treeHtml=ns=>ns.map(n=>n.c
 ?`<div class="tn${n.open?' on':''}" title="${n.c}">${n.ep?'<span class="epi" title="Entry point">⎆</span>':''}<span class="lb">${n.c}</span>${n.sev?`<span class="dot" style="background:${COL[n.sev]}"></span>`:''}</div>`
 :`<details${n.shut?'':' open'}><summary class="tn"><span class="ar">▸</span><span class="lb">${n.n}</span>${cnt(n)?`<span class="roll" style="color:${COL[sevOf(n)]}">● ${cnt(n)}</span>`:''}</summary><div class="kids">${treeHtml(n.kids)}</div></details>`).join('');
function treeBody(){
  const q=S.fq.trim().toLowerCase();if(!q)return treeHtml(A().tree);
  const hit=flat(A().tree).filter(n=>(n.p+'.'+n.c).toLowerCase().includes(q));
  return `<div class="rl" style="padding:.3rem .55rem;border:0">${hit.length} cocok · path penuh${S.plat==='ios'?'':''}</div>`+hit.map(n=>`<div class="tn" title="${n.p}.${n.c}"><span class="lb"><small>${hl(n.p+'.',S.fq)}</small>${hl(n.c,S.fq)}</span>${n.sev?`<span class="dot" style="background:${COL[n.sev]}"></span>`:''}</div>`).join('')||'<div class="rl">Tidak ada yang cocok.</div>';
}

 const t=e.target.closest('[data-c],[data-sub],[data-act],[data-chip],[data-rt],[data-et],[data-grp]');if(!t)return;
 const d=t.dataset;
 if(d.c){const v=d.c;if(v==='android'||v==='ios')S.plat=v;else if(v==='desktop'||v==='mobile')S.mobile=v==='mobile';else if(v==='dec'||v==='xref')S.screen=v;else S.pins=v==='pins1';S.t1=S.x1=false}
 else if(d.sub){S.sub=d.sub;S.t1=S.x1=false}
 else if(d.act){if(d.act==='xr'){if($('#frame').clientWidth>1100)S.xref=!S.xref;else{S.x1=!S.x1;S.t1=false}}else if(d.act==='wrap')S.wrap=!S.wrap;else if(d.act==='t1'){S.t1=!S.t1;S.x1=false}}
 else if(d.chip)S.chip=d.chip;else if(d.rt)S.rt=d.rt;else if(d.et)S.et=d.et;
 else if(d.grp){const shut=A().ecol===d.grp?!S.open[d.grp]:S.open[d.grp]===false;S.open[d.grp]=shut}
 render();
});
document.addEventListener('keydown',e=>{if(e.target.matches('input,select'))return;const i='1234'.indexOf(e.key);if(i>=0&&S.screen==='dec'){S.sub=['functions','strings','resources','entrypoints'][i];render()}});
render();
