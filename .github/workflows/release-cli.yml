name: Release CLI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish CLI JAR
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Validate release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Expected a semantic version tag such as v0.1.0 or v0.1.0-rc.1, got: $tag" >&2
            exit 1
          fi
          version="${tag#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set Maven release version
        run: >
          mvn -B -ntp versions:set
          -DnewVersion="${{ steps.version.outputs.version }}"
          -DprocessAllModules=true
          -DgenerateBackupPoms=false

      - name: Run core and CLI tests
        run: mvn -B -ntp test -pl core,cli -am

      - name: Build CLI fat JAR
        run: mvn -B -ntp package -pl cli -am -DskipTests

      - name: Smoke-test CLI
        run: |
          set -euo pipefail
          java -jar cli/target/malimite-cli.jar --help >/dev/null
          actual_version="$(java -jar cli/target/malimite-cli.jar --version)"
          expected_version="malimite ${{ steps.version.outputs.version }}"
          if [[ "$actual_version" != "$expected_version" ]]; then
            echo "Expected '$expected_version', got '$actual_version'" >&2
            exit 1
          fi

      - name: Prepare release assets
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          mkdir -p dist
          asset="malimite-cli-${version}.jar"
          cp cli/target/malimite-cli.jar "dist/${asset}"
          (
            cd dist
            sha256sum "$asset" > "${asset}.sha256"
          )
          echo "jar=dist/${asset}" >> "$GITHUB_OUTPUT"
          echo "checksum=dist/${asset}.sha256" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          JAR_ASSET: ${{ steps.assets.outputs.jar }}
          CHECKSUM_ASSET: ${{ steps.assets.outputs.checksum }}
        shell: bash
        run: |
          set -euo pipefail
          args=(
            "$GITHUB_REF_NAME"
            "$JAR_ASSET"
            "$CHECKSUM_ASSET"
            --title "Malimite CLI $GITHUB_REF_NAME"
            --generate-notes
            --verify-tag
          )
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
