# Configuration for org.slf4j:slf4j-simple, the logging backend bundled into the fat JAR.
# Reference: https://www.slf4j.org/api/org/slf4j/simple/SimpleLogger.html
#
# Without this file every log line defaults to "[thread] LEVEL logger - message" with no
# timestamp, which makes it impossible to tell how long a step (e.g. one LLM enrichment call)
# took just by reading analysis.log — the only place this matters is a long scan's duration,
# since the web UI's Log tab and analysis.log are both a raw passthrough of this process's
# stdout/stderr (see web/app/scanner.py's _run()).

org.slf4j.simpleLogger.showDateTime = true
# Time-only (no date): scans run in minutes, not across midnight, and the shorter prefix stays
# readable in both analysis.log and the web UI's Log tab.
org.slf4j.simpleLogger.dateTimeFormat = HH:mm:ss.SSS
