          ${ci ? kvRow('CI', [d.ci_triggered_by, d.ci_commit_sha && d.ci_commit_sha.slice(0, 12)].filter(Boolean).map(esc).join(' · ')
              + (d.ci_pipeline_url && /^https?:\/\//.test(d.ci_pipeline_url) ? ` · <a href="${escAttr(d.ci_pipeline_url)}" target="_blank" rel="noopener">pipeline</a>` : '')) : ''}
        </div>
      </div>`;
  return `
    <div class="sum-stats">${stats.map(([icon, n, label, t, tip]) => `
      <a class="sum-stat" href="${escAttr(decHash(id, t))}" title="${escAttr(tip || 'Open Decompiled › ' + decSubLabel(t))}">
        <span class="si">${ico(icon)}</span>
        <span style="min-width:0"><span class="sn" style="display:block"${t === 'resources' ? ' id="sum-res-n"' : ''}>${n === undefined ? '…' : num(n)}</span><span class="sl">${label}</span></span>
      </a>`).join('')}</div>
    <div class="sum-grid">${riskCard}${appCard}</div>
    <div class="sum-grid">
      ${scanCard}
      <div class="card">
        <div class="card-title" style="justify-content:space-between">
          <span style="display:inline-flex;align-items:center;gap:.5rem">${ico('logIn')} Entry Points</span>
          <span class="tab-n">${num(d.entry_point_count)}</span>
        </div>
        <div id="ep-mini"><div class="spinner"></div></div>
      </div>
    </div>`;
}

/* Entry points arrive as "<ClassName>.<FunctionName>". Android components store FunctionName as
   "<type>:<class>" (so a fully-qualified name repeats), native ones as "native:<lib>/<symbol>",
   iOS ones as "<Class>.<selector>". */
function splitQualified(name) {
  const n = String(name || ''), i = n.lastIndexOf('.');
  return i > 0 ? {short: n.slice(i + 1), pkg: n.slice(0, i)} : {short: n, pkg: ''};
}
function parseEntryPoint(raw) {
  const s = String(raw || '');
  const native = s.match(/^native:([^/]+)\/(.+)$/);
  if (native) return {raw: s, type: 'native', short: native[2], pkg: native[1], member: ''};
  const m = s.match(/^(.*)\.(activity-alias|activity|service|receiver|provider):(.+)$/i);
  if (m) return {raw: s, type: m[2].toLowerCase().replace('-alias', ''), ...splitQualified(m[3] || m[1]), member: ''};
  const colon = s.indexOf(':');
  const dot = s.lastIndexOf('.', colon < 0 ? s.length : colon);
  if (dot > 0) return {raw: s, type: 'method', ...splitQualified(s.slice(0, dot)), member: s.slice(dot + 1)};
  return {raw: s, type: '', short: s, pkg: '', member: ''};
}

/* The class an entry point lives in, or '' when there is nothing to open (native .so symbols have no class). */
function epClass(ep) {
  return ep.type === 'native' ? '' : (ep.pkg ? ep.pkg + '.' + ep.short : ep.short);
}

/* Row link to the entry point's class in Decompiled › Functions; a plain row for native symbols. */
function renderEntryPointItem(raw, id) {
  const ep = typeof raw === 'string' ? parseEntryPoint(raw) : raw;
  const cls = id ? epClass(ep) : '';
  const tag = cls ? 'a' : 'div';
  return `<${tag} class="ep-row${cls ? ' ep-link' : ''}" title="${escAttr(ep.raw)}"${cls ? ` href="${escAttr(decHash(id, 'functions', {class: cls}))}"` : ''}>
    <span class="ep-badge ${escAttr(ep.type)}">${esc(ep.type || 'entry')}</span>
    <div style="min-width:0">
      <div class="ep-nm">${esc(ep.short)}${ep.member ? `<span class="mem">.${esc(ep.member)}</span>` : ''}</div>
      ${ep.pkg ? `<div class="ep-pk">${esc(ep.pkg)}</div>` : ''}
    </div>
  </${tag}>`;
}

async function postSummaryHydrate(id) {
  const previewSize = 6;
  const resN = document.getElementById('sum-res-n');
  if (resN) decResourceTotal(id).then(n => { if (resN.isConnected) resN.textContent = n == null ? '—' : num(n); });
  const el = document.getElementById('ep-mini');
  if (!el) return;
  try {
    const eps = await api('/scans/'+id+'/entrypoints');
    // The original element is detached whenever the scan or tab is re-rendered.
    if (!el.isConnected || el !== document.getElementById('ep-mini')) return;
    if (!eps.length) { el.innerHTML='<div class="empty" style="padding:1rem">None detected.</div>'; return; }
    const preview = eps.slice(0, previewSize);
    const count = eps.length > previewSize
      ? `<span>Showing ${preview.length} of ${eps.length.toLocaleString()}</span>`
      : '<span></span>';
    const href = decHash(id, 'entrypoints');
    el.innerHTML = '<div class="ep-rows">' + preview.map(e => renderEntryPointItem(e, id)).join('') + '</div>'
      + `<div class="ep-foot">${count}<a class="link-strong" href="${escAttr(href)}">View all entry points ${ico('arrowRight')}</a></div>`;
  } catch(_) {
    if (el.isConnected && el === document.getElementById('ep-mini')) {
      el.innerHTML='<span class="muted">—</span>';
    }
  }
}

/* ── Decompiled tab: one shell (sub-nav + URL state) around Functions · Strings · Resources · Entry Points ──
   URL: #/scan/<id>/decompiled/<sub>?class=|q=|type=|hl=… — shareable. Every xref goes through
   openDecompiled(), which pushes a history entry (Back returns to the source); sub-nav clicks and
   state changes inside a view only replace the current one. Query values are untrusted input. */
const DEC_SUB_LS = 'malimite.decSub.';   // last sub-view per scan (per-viewer convenience; storage can be blocked)
const decStore = new Map();              // scan id → view state: queries, pages, filters — never row data (8 newest scans)
let decSt = null;                        // the state of the scan on screen

function decSubLabel(k) { return (DEC_SUBS.find(s => s[0] === k) || [])[1] || ''; }

function decHash(id, sub, params = {}) {
  const qs = new URLSearchParams();   // symmetric with the router's parser, so '+load', 'Foo$Bar' and '.' round-trip
  for (const [k, v] of Object.entries(params)) if (v != null && v !== '') qs.set(k, v);
  return '#/scan/' + encodeURIComponent(String(id)) + '/decompiled' + (sub ? '/' + sub : '') + (String(qs) ? '?' + qs : '');
}

window.openDecompiled = function(id, {sub, ...params} = {}) { location.hash = decHash(id, sub, params); };

/* Keeps the address bar in step with what the view shows, without adding history entries. */
function decReplaceUrl(params) {
  if (decSt && document.getElementById('dec-root')) history.replaceState(null, '', decHash(decSt.id, decSt.sub, params));
}

/* Scroll the active sub-nav item fully into view — and clear of the edge fade, which would otherwise dim it. */
function decRevealTab(b) {
  const box = document.getElementById('dec-tabs');
  if (!box || !b) return;
  const br = b.getBoundingClientRect(), tr = box.getBoundingClientRect(), last = b === box.lastElementChild;
  const left = br.left - tr.left - 8, right = br.right - tr.right + (last ? 8 : 40);
  if (left < 0) box.scrollLeft += left; else if (right > 0) box.scrollLeft += right;
}

/* A scan whose database is gone answers every data request with 404: there is nothing to download either. */
function decNoDb() {
  if (decSt) decSt.noDb = true;
  const z = document.getElementById('dec-zip');
  if (z) z.hidden = true;
}

/* Edge fade where a horizontally scrolling strip is clipped — the same can-scroll / at-end classes the tab bar uses.
   Returns the re-measure function (call it after the strip's content changes). */
function fadeX(el) {
  if (!el) return () => {};
  const sync = () => {
    if (!el.isConnected) { window.removeEventListener('resize', sync); return; }
    el.classList.toggle('can-scroll', el.scrollWidth > el.clientWidth + 2);
    el.classList.toggle('at-end', el.scrollLeft + el.clientWidth >= el.scrollWidth - 2);
  };
  el.addEventListener('scroll', sync, {passive: true});
  window.addEventListener('resize', sync);
  sync();
  return sync;
}

const _resTotals = new Map();   // scan id → Promise<number|null>; the sub-nav pill and the Summary tile share it
function decResourceTotal(id) {
  if (!_resTotals.has(id)) {
    _resTotals.set(id, api('/scans/' + id + '/resources?' + new URLSearchParams({page: 1, size: 10}))
      .then(r => Number(r.total) || 0).catch(() => { _resTotals.delete(id); return null; }));
  }
  return _resTotals.get(id);
}

/* True while `sub` of scan `id` is still the sub-view on screen — async views check it after every await,
   because #dec-view is shared and a late response must not paint over whatever the user switched to. */
function decActive(sub, id) { return !!decSt && decSt.sub === sub && decSt.id === id && !!document.getElementById('dec-view'); }

async function tabDecompiled(el, id, detail, nav = {}) {
  if (detail.state !== 'done') { el.innerHTML = notReadyHtml(detail, DEC_WHAT); return; }
  let st = decStore.get(id);
  if (!st) { st = {id, sub: null}; decStore.set(id, st); if (decStore.size > 8) decStore.delete(decStore.keys().next().value); }
  st.detail = detail;
  decSt = st;
  let saved = null;
  try { saved = localStorage.getItem(DEC_SUB_LS + id); } catch (_) { /* optional */ }
  const want = [nav.sub, st.sub, saved].find(k => DEC_SUBS.some(([s]) => s === k)) || 'functions';
  let root = el.querySelector('#dec-root');
  if (!root || root.dataset.scan !== id) {
    st.vulns = st.byClass = st.eps = null;   // a fresh visit re-reads findings and entry points (they may have been triaged meanwhile)
    st.noDb = detail.class_count == null && detail.string_count == null && detail.entry_point_count == null;   // counts unreadable: the scan's database is gone
    const counts = {functions: detail.class_count, strings: detail.string_count, entrypoints: detail.entry_point_count};
    el.innerHTML = `<div class="dec" id="dec-root" data-scan="${escAttr(id)}">
      <div class="dec-sub">
        <div class="seg fade-x" id="dec-tabs" role="tablist" aria-label="Decompiled sections">${DEC_SUBS.map(([k, label], i) =>
          `<button type="button" role="tab" id="dec-tab-${k}" data-decsub="${k}" aria-controls="dec-view" aria-keyshortcuts="${i + 1}" title="${label} (${i + 1})">${label}`
          + `<span class="n" id="dec-n-${k}">${k === 'resources' ? '…' : counts[k] != null ? compactNum(counts[k]) : ''}</span></button>`).join('')}</div>
        <span class="dec-sp"></span>
        <button type="button" class="btn btn-ghost btn-sm" id="dec-go" aria-haspopup="dialog" aria-keyshortcuts="Control+K Meta+K" aria-label="Go to…" title="Go to a class, entry point, string or resource (${goKeys})">${ico('search')}<span class="go-w">Go to…</span><kbd>${goKeys}</kbd></button>
        <button type="button" class="btn btn-ghost btn-sm" id="dec-zip" hidden title="Download every decompiled function as a .zip" aria-label="Download all sources as a .zip">${ico('download')} <span class="zip-w">All sources </span><span class="zip-w">(.zip)</span></button>
      </div>
      <div id="dec-view" role="tabpanel"></div>
    </div>`;
    root = el.querySelector('#dec-root');
    const tabs = root.querySelector('#dec-tabs'), fade = fadeX(tabs);
    tabs.addEventListener('click', ev => { const b = ev.target.closest('[data-decsub]'); if (b) decShow(b.dataset.decsub); });
    tabs.addEventListener('keydown', ev => {   // roving tabindex: arrows/Home/End move between the sub-views
      const keys = DEC_SUBS.map(s => s[0]), i = keys.indexOf(decSt.sub);
      const j = ev.key === 'ArrowRight' ? (i + 1) % keys.length : ev.key === 'ArrowLeft' ? (i + keys.length - 1) % keys.length
        : ev.key === 'Home' ? 0 : ev.key === 'End' ? keys.length - 1 : -1;
      if (j < 0) return;
      ev.preventDefault();
      decShow(keys[j]).then(() => document.getElementById('dec-tab-' + keys[j])?.focus());
    });
    root.querySelector('#dec-zip').addEventListener('click', decDownloadZip);
    root.querySelector('#dec-go').addEventListener('click', goOpen);
    decResourceTotal(id).then(n => {
      const pill = document.getElementById('dec-n-resources');
      if (!pill || decSt?.id !== id) return;
      pill.textContent = n == null ? '' : compactNum(n);   // on failure the pill just empties out (hidden by :empty)
      fade();
      decRevealTab(document.querySelector('#dec-tabs .active'));   // the pill changed the strip's width
    });
  }
  await decShow(want, nav.params);
}

/* Switch sub-view. `params` (from the URL) seeds the view; without it the view restores its own last state. */
async function decShow(sub, params) {
  const st = decSt, view = document.getElementById('dec-view');
  if (!st || !view) return;
  st.sub = sub;
  try { localStorage.setItem(DEC_SUB_LS + st.id, sub); } catch (_) { /* optional */ }
  document.querySelectorAll('#dec-tabs [data-decsub]').forEach(b => {
    const on = b.dataset.decsub === sub;
    b.classList.toggle('active', on);
    b.setAttribute('aria-selected', String(on));
    b.tabIndex = on ? 0 : -1;
    if (on) { view.setAttribute('aria-labelledby', b.id); decRevealTab(b); requestAnimationFrame(() => requestAnimationFrame(() => decRevealTab(b))); }
  });
  document.getElementById('dec-zip').hidden = sub !== 'functions' || !!st.noDb;
  params = params || new URLSearchParams();
  if (!String(params)) decReplaceUrl({});   // canonical URL (fills in the sub-view when the URL had none)
  if (sub === 'functions') await tabFunctions(view, st.id, st.detail, params);
  else if (sub === 'strings' || sub === 'resources') await decList(view, st.id, sub, params);
  else await tabEntryPoints(view, st.id, st.detail, params);
}

async function decDownloadZip(ev) {
  const btn = ev.currentTarget;
  btn.disabled = true;
  try {
    const r = await fetch(`/api/v1/scans/${decSt.id}/decompiled.zip`, {headers: headers()});
    if (!r.ok) throw new Error(await r.text());
    const a = document.createElement('a');
    a.href = URL.createObjectURL(await r.blob());
    a.download = `malimite-decompiled-${decSt.id.slice(0,8)}.zip`;
    a.click();
    URL.revokeObjectURL(a.href);
  } catch (e) { alert('Download failed: ' + (e.message || e)); }
  finally { btn.disabled = false; }
}

// 1–4 jump between the sub-views (never while typing, never with a modifier).
document.addEventListener('keydown', ev => {
  if (ev.ctrlKey || ev.metaKey || ev.altKey || ev.shiftKey || ev.key.length !== 1 || !decSt) return;
  const i = '1234'.indexOf(ev.key);
  if (i < 0 || ev.target.closest?.('input,textarea,select,[contenteditable]') || !document.getElementById('dec-root')) return;
  decShow(DEC_SUBS[i][0]);
});

/* ── Decompiled › Go to… (Ctrl/Cmd+K): one search box over the sub-views, classes, entry points, strings and resources ──
   Classes and entry points are matched here (the class list is the one Functions uses, fetched at most once); strings and resources
   are asked of the server — debounced, and a request-sequence guard drops any response that is no longer the newest. It is a modal
   dialog with a combobox/listbox: focus stays in the input, the arrow keys move aria-activedescendant. Activating a result only
   navigates; nothing here writes data or talks to the assistant. Every label comes from the scan, so it goes through esc() and
   decMark()/fnLabelHtml() — plain indexOf marking, never a RegExp built from the query. */
const GO_LOCAL_MS = 120, GO_REMOTE_MS = 200, GO_MAX_CLASSES = 30, GO_MAX_EPS = 10, GO_MAX_REMOTE = 10;
const goKeys = /Mac|iPhone|iPad/i.test((navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || navigator.userAgent || '') ? '⌘ K' : 'Ctrl K';
let goSt = null;   // the open palette: {id, ov, opener, q, res, opts, active, seq, lseq, t1, t2, inert}

const goLowerCache = new WeakMap();   // class list → lower-cased names, built once (72K classes stay responsive per keystroke)
function goLower(classes) {
  let l = goLowerCache.get(classes);
  if (!l) goLowerCache.set(classes, l = classes.map(c => c.toLowerCase()));
  return l;
}

/* The best matches first without sorting the list: one pass drops every class into a rank bucket (each capped), then the buckets
   are concatenated — 0 simple name equals the query · 1 simple name starts with it · 2 full name starts with it · 3 it occurs in
   the simple name · 4 it occurs in the package path. `q` is lower-cased. */
function goRankClasses(classes, q) {
  const lower = goLower(classes), buckets = [[], [], [], [], []];
  let total = 0;
  for (let i = 0; i < lower.length; i++) {
    const lo = lower[i], p = lo.indexOf(q);
    if (p < 0) continue;
    total++;
    const s = Math.max(lo.lastIndexOf('.'), lo.lastIndexOf('$')) + 1, inSimple = lo.indexOf(q, s);
    const rank = inSimple === s ? (lo.length - s === q.length ? 0 : 1) : p === 0 ? 2 : inSimple > s ? 3 : 4;
    if (buckets[rank].length < GO_MAX_CLASSES) buckets[rank].push(classes[i]);
  }
  return {items: buckets.flat().slice(0, GO_MAX_CLASSES), total};
}

const decSetCache = new WeakMap();
function decClassSet(classes) {
  let s = decSetCache.get(classes);
  if (!s) decSetCache.set(classes, s = new Set(classes));
  return s;
}

function goOpen() {
  if (!decSt || !document.getElementById('dec-root') || !decSt.detail || decSt.detail.state !== 'done') return;
  if (goSt) { const q = document.getElementById('go-q'); if (q) { q.focus(); q.select(); } return; }
  const ov = document.createElement('div');
  ov.className = 'go-ov'; ov.id = 'go-ov';
  ov.innerHTML = `<div class="go-dlg" role="dialog" aria-modal="true" aria-labelledby="go-title">
    <h2 class="sr-only" id="go-title">Go to…</h2>
    <div class="go-in">${ico('search')}<input id="go-q" type="text" role="combobox" aria-expanded="true" aria-controls="go-list" aria-autocomplete="list" aria-haspopup="listbox"
      aria-label="Go to a class, entry point, string or resource" placeholder="Go to a class, entry point, string or resource…" autocomplete="off" autocapitalize="off" spellcheck="false"/>
      <button type="button" class="go-x" id="go-x" aria-label="Close" title="Close (Esc)"><span class="go-k">Esc</span><span class="go-c" aria-hidden="true">✕</span></button></div>
    <div class="go-list" id="go-list" role="listbox" aria-label="Results"></div>
    <div class="sr-only" id="go-live" role="status" aria-live="polite"></div></div>`;
  const g = goSt = {id: decSt.id, ov, opener: document.activeElement, q: '', raw: '', res: {}, opts: [], active: '', seq: 0, lseq: 0, t1: 0, t2: 0, inert: []};
  document.body.appendChild(ov);
  for (const c of [...document.body.children]) if (c !== ov && !c.inert) { c.inert = true; g.inert.push(c); }   // nothing behind the dialog is reachable
  const input = ov.querySelector('#go-q'), list = ov.querySelector('#go-list');
  input.addEventListener('input', () => goInput(input.value));
  ov.addEventListener('mousedown', ev => { if (ev.target === ov) { ev.preventDefault(); goClose(true); } });   // preventDefault: the press must not move focus off the opener afterwards
  ov.querySelector('#go-x').addEventListener('click', () => goClose(true));
  list.addEventListener('click', ev => { const o = ev.target.closest('.go-o'); if (o && g.opts[Number(o.dataset.i)]) goActivate(g.opts[Number(o.dataset.i)]); });
  list.addEventListener('mousemove', ev => { const o = ev.target.closest('.go-o'); if (o && o.id !== g.active) goSetActive(o.id, false); });
  ov.addEventListener('keydown', goKey);
  goRender();
  input.focus();
}

function goClose(restoreFocus, toButton) {
  const g = goSt;
  if (!g) return;
  goSt = null;
  clearTimeout(g.t1); clearTimeout(g.t2);
  g.ov.remove();
  g.inert.forEach(c => { c.inert = false; });
  if (restoreFocus) {   // back to whatever opened it; after a navigation that element may be about to go away, so the Go to… button takes the focus
    const op = !toButton && g.opener && g.opener.isConnected && g.opener !== document.body ? g.opener : document.getElementById('dec-go');
    if (op) op.focus();
  }
}

function goKey(ev) {
  const g = goSt;
  if (!g) return;
  if (ev.key === 'Escape') { ev.preventDefault(); ev.stopPropagation(); goClose(true); return; }
  if (ev.key === 'Tab') {   // focus trap: input ⇄ close button
    const els = [...g.ov.querySelectorAll('#go-q, #go-x')], i = els.indexOf(document.activeElement);
    ev.preventDefault();
    els[(i + (ev.shiftKey ? els.length - 1 : 1)) % els.length].focus();
    return;
  }
  if (ev.target.id !== 'go-q') return;
  if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
    ev.preventDefault();
    if (!g.opts.length) return;
    const i = g.opts.findIndex(o => o.id === g.active), n = g.opts.length, down = ev.key === 'ArrowDown';
    goSetActive(g.opts[i < 0 ? (down ? 0 : n - 1) : (i + (down ? 1 : n - 1)) % n].id, true);   // wraps at both ends
  } else if (ev.key === 'Enter') {
    ev.preventDefault();
    const o = g.opts.find(x => x.id === g.active);
    if (o) goActivate(o);
  }
}

function goSetActive(id, scroll) {
  const g = goSt;
  if (!g) return;
  g.active = id;
  g.ov.querySelectorAll('.go-o[aria-selected=true]').forEach(e => e.setAttribute('aria-selected', 'false'));
  const el = id && document.getElementById(id), input = g.ov.querySelector('#go-q');
  if (el) { el.setAttribute('aria-selected', 'true'); if (scroll) el.scrollIntoView({block: 'nearest'}); input.setAttribute('aria-activedescendant', id); }
  else input.removeAttribute('aria-activedescendant');
}

/* Typing: commands + local matches after a short pause, the two server groups after a longer one. An empty box is instant and
   shows only the sub-views. Results from the previous text stay (dimmed) until the new ones land, so the list never flashes empty. */
function goInput(text) {
  const g = goSt;
  if (!g) return;
  clearTimeout(g.t1); clearTimeout(g.t2);
  g.raw = text; g.seq++; g.lseq++;
  const q = text.trim().toLowerCase();
  g.q = q;
  if (!q) { g.res = {}; goRender(); return; }
  for (const k of ['cls', 'ep', 'str', 'res']) g.res[k] = g.res[k] && g.res[k].st === 'ok' ? {...g.res[k], stale: true} : {st: 'load'};
  goRender();
  g.t1 = setTimeout(() => goLocal(q), GO_LOCAL_MS);
  g.t2 = setTimeout(() => goRemote(q, text.trim()), GO_REMOTE_MS);
}

function goLocal(q) {
  const g = goSt;
  if (!g) return;
  const my = ++g.lseq;
  decClasses(g.id).then(classes => {
    if (goSt !== g || g.lseq !== my) return;
    g.res.cls = {st: 'ok', ...goRankClasses(classes, q)};
    goRender();
  }).catch(e => { if (goSt === g && g.lseq === my) { g.res.cls = {st: 'err', msg: e.message}; goRender(); } });
  decEps(g.id).then(raw => {
    if (goSt !== g || g.lseq !== my) return;
    const idx = g.epIdx || (g.epIdx = raw.map(r => ({e: parseEntryPoint(r), lo: String(r).toLowerCase()})));
    const hits = idx.filter(x => x.lo.includes(q));
    g.res.ep = {st: 'ok', items: hits.slice(0, GO_MAX_EPS).map(x => x.e), total: hits.length};
    goRender();
  }).catch(e => { if (goSt === g && g.lseq === my) { g.res.ep = {st: 'err', msg: e.message}; goRender(); } });
}

function goRemote(q, text) {
  const g = goSt;
  if (!g) return;
  const my = ++g.seq;
  const ask = (kind, key) => api('/scans/' + g.id + '/' + kind + '?' + new URLSearchParams({page: 1, size: GO_MAX_REMOTE, q: text})).then(d => {
    if (goSt !== g || g.seq !== my) return;   // a newer keystroke owns the list now
    g.res[key] = {st: 'ok', items: Array.isArray(d.items) ? d.items : [], total: Math.max(0, Number(d.total) || 0)};
    goRender();
  }).catch(e => { if (goSt === g && g.seq === my) { g.res[key] = {st: 'err', msg: e.message}; goRender(); } });
  ask('strings', 'str'); ask('resources', 'res');
}

/* One option of the list: `o.t` says what activating it does; ids are stable per group and position (go-o-cls-0 …). */
function goRender() {
  const g = goSt;
  if (!g) return;
  const list = g.ov.querySelector('#go-list'), q = g.q, opts = [];
  const opt = (grp, o, inner) => {
    const j = opts.filter(x => x.grp === grp).length;
    o.grp = grp; o.id = `go-o-${grp}-${j}`; opts.push(o);
    return `<div class="go-o" role="option" id="${o.id}" data-i="${opts.length - 1}" aria-selected="false">${inner}</div>`;
  };
  const group = (key, title, count, body, stale) => `<div role="group" aria-labelledby="go-h-${key}" class="go-g${stale ? ' go-stale' : ''}"><div class="go-gh" id="go-h-${key}">${title}${count != null ? `<span class="n">${count.toLocaleString()}</span>` : ''}</div>${body}</div>`;
  const msg = (r, what, ok) => r.st === 'load' ? `<div class="go-msg">Searching ${what}…</div>` : r.st === 'err' ? `<div class="go-msg go-err">Couldn’t search ${what}: ${esc(r.msg || 'request failed')}</div>` : ok();
  let html = '';
  const subs = DEC_SUBS.filter(([, label]) => !q || label.toLowerCase().includes(q));
  if (subs.length) {
    html += group('sub', 'Go to', null, subs.map(([k, label]) => opt('sub', {t: 'sub', sub: k},
      `<span class="go-i">${ico('arrowRight')}</span><span class="go-t">Go to <b>${esc(label)}</b></span><span class="go-m">${esc((document.getElementById('dec-n-' + k) || {}).textContent || '')}</span>`)).join(''));
  }
  if (!q) html += '<div class="go-msg">Type to search classes, entry points, strings and resources.</div>';
  else {
    const c = g.res.cls || {st: 'load'}, e = g.res.ep || {st: 'load'}, s = g.res.str || {st: 'load'}, r = g.res.res || {st: 'load'};
    html += group('cls', 'Classes', c.st === 'ok' ? c.total : null, msg(c, 'classes', () => c.items.length
      ? c.items.map(cls => opt('cls', {t: 'cls', cls}, `<span class="go-i">${ico('code')}</span><span class="go-t" title="${escAttr(cls)}">${fnLabelHtml(cls, q)}</span>`)).join('')
        + (c.total > c.items.length ? `<div class="go-msg">Showing the best ${c.items.length} of ${c.total.toLocaleString()} — keep typing to narrow it down.</div>` : '')
      : '<div class="go-msg">No class matches.</div>'), c.stale);
    html += group('ep', 'Entry points', e.st === 'ok' ? e.total : null, msg(e, 'entry points', () => e.items.length
      ? e.items.map(ep => opt('ep', {t: 'ep', ep}, `<span class="go-i"><span class="ep-badge ${escAttr(ep.type)}">${esc(ep.type || 'entry')}</span></span><span class="go-t" title="${escAttr(ep.raw)}">${decMark(ep.short, q)}${ep.member ? `<span class="go-mem">.${decMark(ep.member, q)}</span>` : ''}${ep.pkg ? ` <small>${decMark(ep.pkg, q)}</small>` : ''}</span>`)).join('')
        + (e.total > e.items.length ? `<div class="go-msg">Showing ${e.items.length} of ${e.total.toLocaleString()}.</div>` : '')
      : '<div class="go-msg">No entry point matches.</div>'), e.stale);
    html += group('str', 'Strings', s.st === 'ok' ? s.total : null, msg(s, 'strings', () => s.items.length
      ? s.items.map(it => opt('str', {t: 'str', value: String(it.value)}, `<span class="go-i">${ico('fileText')}</span><span class="go-t go-mono" title="${escAttr(String(it.value).slice(0, 300))}">${decMark(String(it.value).slice(0, 160), q)}</span>${it.label ? `<span class="go-m">${esc(it.label)}</span>` : ''}`)).join('')
        + opt('str', {t: 'allstr', q: g.raw.trim()}, `<span class="go-i">${ico('arrowRight')}</span><span class="go-t go-all">Search all ${s.total.toLocaleString()} in Strings →</span>`)
      : '<div class="go-msg">No string matches.</div>'), s.stale);
    html += group('res', 'Resources', r.st === 'ok' ? r.total : null, msg(r, 'resources', () => r.items.length
      ? r.items.map(it => opt('res', {t: 'res', value: String(it.value)}, `<span class="go-i">${ico('layers')}</span><span class="go-t go-mono" title="${escAttr(String(it.resource_id || ''))}: ${escAttr(String(it.value).slice(0, 300))}"><small>${decMark(String(it.resource_id || ''), q)}</small> ${decMark(String(it.value).slice(0, 140), q)}</span><span class="go-m">${esc(it.type)}</span>`)).join('')
        + opt('res', {t: 'allres', q: g.raw.trim()}, `<span class="go-i">${ico('arrowRight')}</span><span class="go-t go-all">Search all ${r.total.toLocaleString()} in Resources →</span>`)
      : '<div class="go-msg">No resource matches.</div>'), r.stale);
  }
  g.opts = opts;
  list.innerHTML = html;
  goSetActive(opts.some(o => o.id === g.active) ? g.active : (opts[0] ? opts[0].id : ''), false);
  const pending = q && ['cls', 'ep', 'str', 'res'].some(k => !g.res[k] || g.res[k].st === 'load' || g.res[k].stale);
  g.ov.querySelector('#go-live').textContent = !q ? `${opts.length} places to go` : pending ? 'Searching…' : opts.length ? `${opts.length} results` : 'No results';
}

function goActivate(o) {
  const g = goSt;
  if (!g) return;
  const id = g.id, classes = decClassesNow(id);
  goClose(true, true);
  if (o.t === 'sub') decShow(o.sub);
  else if (o.t === 'cls') openDecompiled(id, {sub: 'functions', class: o.cls});
  else if (o.t === 'ep') {
    const cls = epClass(o.ep);   // the entry point's class when the scan has it; otherwise the Entry Points list narrowed to it
    if (cls && classes && decClassSet(classes).has(cls)) openDecompiled(id, {sub: 'functions', class: cls});
    else openDecompiled(id, {sub: 'entrypoints', q: o.ep.raw.slice(0, 200)});
  }
  else if (o.t === 'str') openDecompiled(id, {sub: 'strings', q: o.value.slice(0, 300)});
  else if (o.t === 'res') openDecompiled(id, {sub: 'resources', q: o.value.slice(0, 500), hl: o.value.slice(0, 2000)});
  else if (o.t === 'allstr') openDecompiled(id, {sub: 'strings', q: o.q});

// Ctrl+K (⌘K on macOS) anywhere inside the Decompiled tab of a finished scan — also from a text field; other pages keep the browser's own shortcut.
document.addEventListener('keydown', ev => {
  if (!(ev.ctrlKey || ev.metaKey) || ev.altKey || ev.shiftKey || String(ev.key).toLowerCase() !== 'k') return;

window.addEventListener('hashchange', () => goClose(false));   // the page underneath changed (Back, a link): the palette's scan may be gone

/* The scan's class names, fetched once and shared: Functions builds its tree from it and the Strings class chips resolve a
   short name against it. One scan at a time is kept; an open Functions view for the same scan is reused as is. */
let decClassCache = null;   // {id, p: Promise<string[]>}
function decClasses(id) {
  if (fnSt && fnSt.id === id) return Promise.resolve(fnSt.classes);
  if (!decClassCache || decClassCache.id !== id) {
    const c = decClassCache = {id, classes: null, p: api('/scans/' + id + '/classes?' + new URLSearchParams({limit: 200000})).then(rows => (c.classes = rows.map(r => r.class)))};
    c.p.catch(() => { if (decClassCache === c) decClassCache = null; });   // a failure is not cached: the next caller retries
  }
  return decClassCache.p;
}
function decClassesNow(id) {   // the class list when it is already in memory, else null (never fetches)
  return fnSt && fnSt.id === id ? fnSt.classes : decClassCache && decClassCache.id === id ? decClassCache.classes : null;
}
/* simple name (what follows the last "." — exactly how the Android string label is derived) → the classes carrying it */
const decSimpleIdx = new WeakMap();
function decClassesNamed(classes, short) {
  let m = decSimpleIdx.get(classes);
  if (!m) {
    m = new Map();
    for (const c of classes) { const k = c.slice(c.lastIndexOf('.') + 1); (m.get(k) || m.set(k, []).get(k)).push(c); }
    decSimpleIdx.set(classes, m);
  }
  return m.get(short) || [];
}

/* ── Decompiled › Functions: class browser · source viewer · Cross-refs ──
   State outlives sub-view switches for the same scan (fnSt.id === id): open files (with their scroll
   positions), expanded folders, the filter. The class list is windowed — only the ~40 rows in view exist in the
   DOM — so a 72K-class app and an uncapped 4.9K-class iOS list stay as responsive as a small one. */
let fnSt = null;
const FN_ROW_H = 28;                                  // px; mirrors --fn-row-h in the CSS
const FN_PAD = 4.8;                                   // px; .tlist's top/bottom padding (the mockup's .3rem): row i starts at FN_PAD + i * FN_ROW_H in the scroller
const fnListH = n => n * FN_ROW_H;
const FN_NATIVE = ['Global', 'Imports', 'Libraries'];   // the iOS native engine's pseudo-classes: pinned on top
const FN_COLL = new Intl.Collator();

function fnIsAndroid(detail) {
  return String(detail.platform||'').toUpperCase() === 'ANDROID';
}

function fnNode(key, parent) {
  return {key, parent, children: Object.create(null), className: '', open: false, kids: null, roll: 0, rollWorst: ''};
}
function fnIsFolder(n) { for (const _ in n.children) return true; return false; }
function fnKids(n) {   // folders first (the pinned Native one before all), then alphabetic; sorted once per node
  return n.kids || (n.kids = Object.values(n.children).sort((a, b) =>
    (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || (fnIsFolder(b) ? 1 : 0) - (fnIsFolder(a) ? 1 : 0) || FN_COLL.compare(a.key, b.key)));
}

// Android: ClassName is a dotted package ("com.foo.Bar"); inner classes ("Bar$Inner") become leaves nested
// under their outer class; the native engine's "native:<lib>/<Class>" pseudo-classes get one folder per library
// under a pinned "Native" folder. iOS/Mach-O names carry no such path convention (3,761 of 4,908 on the real
// scan are module-less ObjC), so iOS gets a flat sorted list — with Global/Imports/Libraries pinned — rather
// than a hierarchy fabricated from names.
//
// `children` is Object.create(null), not {} — a package/class segment literally named "constructor" or
// "__proto__" (seen in real, obfuscated APKs) would otherwise resolve to an inherited Object.prototype member,
// which is truthy, so `||` would never build the real node and the next segment access would throw.
/* "Outer$Inner" → ['Outer','Inner']; Kotlin's "Foo$$serializer" stays one segment, and no split ever yields an empty one. */
function fnInner(seg) {
  const p = seg.replace(/\$\$/g, '\u0001').split('$').map(x => x.replace(/\u0001/g, () => '$$')).filter(Boolean);
  return p.length ? p : [seg];
}

function fnBuildTree(classNames, detail) {
  if (!fnIsAndroid(detail)) {
    const native = FN_NATIVE.filter(c => classNames.includes(c));
    const rest = classNames.filter(c => !native.includes(c)).sort(FN_COLL.compare);
    return {flat: true, items: [
      ...(native.length ? [{hdr: 'Native', n: native.length}, ...native.map(cls => ({cls})),
        rest.length ? {hdr: 'Classes', n: rest.length} : {hdr: 'No other classes in this scan', n: null}] : []),
      ...rest.map(cls => ({cls}))]};
  }
  const root = fnNode('', null), byClass = new Map();
  for (const full of classNames) {
    const nat = /^native:([^/]+)\/(.+)$/.exec(full);
    const dotParts = full.split('.');
    const parts = nat ? ['Native', nat[1], nat[2]]
      : dotParts.flatMap((seg, i) => i === dotParts.length - 1 ? fnInner(seg) : [seg]);
    let node = root;
    for (let i = 0; i < parts.length; i++) {
      node = node.children[parts[i]] || (node.children[parts[i]] = fnNode(parts[i], node));
      if (nat && i === 0) node.pinned = true;
      if (i === parts.length - 1) { node.className = full; byClass.set(full, node); }
    }
  }
  return {flat: false, root, byClass};
}

function fnLanguageFor(origin, detail) {
  const o = String(origin||'').toUpperCase();
  if (o === 'ASC' || o === 'JADX') return 'java';
  if (String(detail.platform||'').toUpperCase() === 'IOS') return detail.is_swift ? 'swift' : 'objectivec';
  return 'cpp';
}

async function tabFunctions(el, id, detail, params) {

      el.innerHTML = `<div class="panel"><div class="empty-state"><div class="es-ico">${ico('code')}</div><strong>No classes in this scan</strong>

  const q = ((params && params.get('q')) || '').trim().slice(0, 200);   // a text to filter the tree by (alone: the user picks; with ?class=: both apply)
  let reset = false;
  if (!cls && s.missing) {   // no (or a blank) ?class= after a "Class not found": drop that state instead of showing it again
    s.activePath = null; s.missing = false; fnSetQuery(''); s.chipFind = s.chipEp = false;

  }

/* The tree filter: `qtext` is what was typed or linked, kept as written (the input and the URL show it); matching uses the lower-cased `query`. */
function fnSetQuery(text) {
  const s = fnSt;
  s.qtext = String(text).trim();
  s.query = s.hl = s.qtext.toLowerCase();
}
/* Keep the address bar in step with the open class and the filter, without adding history entries. */
function fnSyncUrl() {
  const s = fnSt;
  if (s) decReplaceUrl({class: s.activePath || '', q: (s.qtext || '').slice(0, 200)});
}

/* Findings + entry points, joined to classes: severity dots, folder roll-ups, the two filter chips, gutter
   markers and the Cross-refs panel all read from these. Fetched once per visit; the tree renders without them. */
function fnLoadSideData(id) {
  const s = fnSt;
  Promise.all([decByClass(id), decEps(id).catch(() => [])]).then(([byClass, raw]) => {
    if (fnSt !== s || !decActive('functions', id)) return;
    s.byClass = byClass;
    s.epByClass = new Map();
    for (const e of raw.map(parseEntryPoint)) {
      const c = epClass(e);
      if (c) (s.epByClass.get(c) || s.epByClass.set(c, []).get(c)).push(e);
    }
    fnComputeRoll();
    document.querySelectorAll('#fn-root [data-chip]').forEach(b => { b.disabled = false; });
    if (s.chipFind || s.chipEp) fnRenderTree(); else fnPaintRows(true);
    fnRenderXref();
    if (s.openFiles.some(f => f.class === s.activePath)) fnRenderViewer();   // the findings place gutter markers in the code
  });
}

/* Folder roll-ups: how many classes with findings sit below each folder, and the worst severity among them. */
function fnComputeRoll() {
  const s = fnSt;
  if (!s.byClass || s.tree.flat) return;
  for (const n of s.rolled) { n.roll = 0; n.rollWorst = ''; }
  s.rolled = [];
  for (const [cls, info] of s.byClass) {
    const node = s.tree.byClass.get(cls);
    if (!node) continue;
    for (let a = node.parent; a && a.parent; a = a.parent) {
      if (!a.roll) s.rolled.push(a);
      a.roll++;
      if (!a.rollWorst || SEV_RANK[info.worst] > SEV_RANK[a.rollWorst]) a.rollWorst = info.worst;
    }
  }
}

function fnRenderShell(el) {

// Drag-resize the tree pane. A no-op below the breakpoint where the tree becomes a sheet.
function fnWireDragHandle() {
  const handle = document.getElementById('fn-drag-handle');
  const pane = document.getElementById('fn-tree-pane');
  if (!handle || !pane) return;
  handle.addEventListener('mousedown', ev => {
    ev.preventDefault();
    handle.classList.add('dragging');
    const startX = ev.clientX;
    const startW = pane.getBoundingClientRect().width;
    const onMove = mv => {
      const w = Math.max(180, Math.min(520, startW + (mv.clientX - startX)));
      document.documentElement.style.setProperty('--fn-tree-w', w + 'px');
    };
    const onUp = () => {
      handle.classList.remove('dragging');
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      try {
        const w = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--fn-tree-w'));
        if (w) localStorage.setItem('malimite.fnTreeWidth', w);
      } catch(e) { /* per-viewer convenience only */ }
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
}

/* ── layout: Refs inline (>1100px) · overlay (900–1100) · full sheets (≤900); measured on the Decompiled shell ── */
function fnBand() {
  const w = document.getElementById('dec-root')?.clientWidth || 0;
  return w > 1100 ? 'wide' : w > 900 ? 'mid' : 'narrow';
}
function fnSyncLayout() {
  const root = document.getElementById('fn-root'), crumb = document.getElementById('fn-crumb');
  if (!root || !crumb) return;
  const band = fnBand();
  if (band === 'wide') root.classList.remove('x1');
  if (band !== 'narrow') root.classList.remove('t1');
  // the overlay starts under the toolbar row, so the ⇥ Refs toggle stays reachable while it is open
  root.style.setProperty('--fn-top', (crumb.getBoundingClientRect().bottom - root.getBoundingClientRect().top - 1) + 'px');
  fnFitCrumb();
  const on = band === 'wide' ? fnSt.xref : root.classList.contains('x1');
  const btn = document.getElementById('fn-refs-btn');
  btn.classList.toggle('on', on);
  btn.setAttribute('aria-pressed', String(on));
}
function fnToggleRefs() {
  const root = document.getElementById('fn-root'), s = fnSt;

  else if (root.classList.contains('x1')) { fnCloseSheets(true); return; }
  else fnOpenSheet('x1');
  fnSyncLayout();
}
/* Open the class browser (t1) or Cross-refs (x1) as an overlay/sheet; focus moves in, and Esc / ✕ / click-outside bring it back. */
function fnOpenSheet(cls) {
  const root = document.getElementById('fn-root');
  fnSt.opener = document.getElementById(cls === 'x1' ? 'fn-refs-btn' : 'fn-browse');   // focus returns here on close
  root.classList.remove('t1', 'x1');
  root.classList.add(cls);
  fnSyncLayout();
  if (cls === 't1') { fnPaintRows(true); document.getElementById('fn-filter').focus(); }
  else root.querySelector('.xclose').focus();
}
function fnCloseSheets(returnFocus) {
  const root = document.getElementById('fn-root');
  if (!root) return;
  const open = root.classList.contains('t1') || root.classList.contains('x1');
  root.classList.remove('t1', 'x1');
  fnSyncLayout();
  const op = fnSt?.opener;
  if (open && returnFocus && op && op.isConnected) op.focus();
  if (fnSt) fnSt.opener = null;
}
document.addEventListener('keydown', ev => {
  const root = document.getElementById('fn-root');
  if (ev.key === 'Escape' && root && (root.classList.contains('x1') || root.classList.contains('t1'))) { ev.preventDefault(); fnCloseSheets(true); }
});

/* ── class list ── */
function fnRowCls(r) { return r.cls || (r.node && r.node.className) || ''; }
function fnFirstRow() { return Math.max(0, fnSt.rows.findIndex(r => !r.hdr)); }

/* "<muted path>.<Class>" with the matched substring marked: a filtered row has to show where a class lives. */
function fnLabelHtml(full, q) {
  const p = full.lastIndexOf('.') + 1, lo = full.toLowerCase(), hit = new Uint8Array(full.length);
  if (q && lo.length === full.length) for (let i = lo.indexOf(q); i >= 0; i = lo.indexOf(q, i + q.length)) hit.fill(1, i, i + q.length);
  let html = '', i = 0;
  while (i < full.length) {
    const pre = i < p, h = hit[i];
    let j = i + 1;
    while (j < full.length && (j < p) === pre && hit[j] === h) j++;
    const text = esc(full.slice(i, j));
    html += (pre ? '<small>' : '') + (h ? `<mark>${text}</mark>` : text) + (pre ? '</small>' : '');
    i = j;
  }
  return html;
}

/* The rows of a filtered view: a flat list of full paths (no cap — the list is windowed), or null for the plain tree. */
function fnFilterRows() {
  const s = fnSt, q = s.query;
  if (!q && !s.chipFind && !s.chipEp) return null;
  if (!s.sorted) { s.sorted = s.classes.slice().sort(FN_COLL.compare); s.lower = s.sorted.map(c => c.toLowerCase()); }
  const out = [];
  for (let i = 0; i < s.sorted.length; i++) {
    const c = s.sorted[i];
    if ((!q || s.lower[i].includes(q)) && (!s.chipFind || s.byClass?.has(c)) && (!s.chipEp || s.epByClass?.has(c))) out.push({cls: c});
  }
  return out;
}

function fnFlatten() {   // the visible rows of the Android tree: expanded folders only
  const out = [], walk = (node, depth) => {
    const kids = fnKids(node);

  const r = rows[i], node = r && r.node, folder = !!node && fnIsFolder(node);

/* Select the open class in the list: expand its ancestors, mark it, move the cursor onto it and scroll it into view. */

async function fnOpenClass(className, opts = {}) {

  // can be revealed and selected in the plain tree. (A click inside a filtered list keeps the filter it was made in.)
  if (s.filtered && !opts.keepFilter && (opts.link || !s.rows.some(r => fnRowCls(r) === className))) fnClearFilter();   // keepFilter: a link that carries both ?class= and ?q=

  // offer the nearest thing — the tree filtered by the class's short name — instead of a blank or failing viewer.
  if (!s.classSet.has(className)) {

    return;
  }

  } else {

    // per-function boundary (typically Ghidra / native-engine origin). A single '<class>' row is one opaque text
    // blob as far as our data model goes; guessing method boundaries there with a regex would be a
    // fragile heuristic, so outline is simply not offered rather than risking a wrong jump target.
    // Every function block starts with exactly one header. The native engines (iOS native, Ghidra) already write their own
    // ("// Class: X" then "// Function: Y") — those rows are shown as stored, with no second header injected. Any other row
    // (Android JADX, a native row with no code) keeps the UI's "// Class.function [ORIGIN]" line. The stored code is never altered.
    // A class stored as ONE '<class>' row (Android JADX / ASC) is shown exactly as stored — its first line is the code's own
    // `package …` — and its origin moves to a chip in the toolbar. Anything else keeps the header per row, as before.
    const whole = rows.length === 1 && rows[0].function === '<class>' && String(rows[0].code || '').trim() !== '';
    let code = '', lineNo = 1;   // lineNo: the 1-based line the next appended text starts on
    const outline = rows.length > 1 ? [] : null;

      const ownHeader = /^\/\/ Class: /.test(body.slice(lead.length));
      const text = ownHeader || whole ? body : `// ${r.class}.${r.function} [${r.origin}]\n${body}`;
      if (outline) outline.push({name: r.function, line: lineNo + (ownHeader ? lead.split('\n').length - 1 : 0)});   // the header line itself
      code += text;

// On-demand decompile for Android classes with nothing stored yet (asc/jadx only — ghidra native

async function fnDecompileNow(className, tool) {

// New files (fresh fetch, fresh decompile) go through here; switching to an already-open tab does not.

function fnCloseFile(cls) {

/* Everything that follows "the active class changed": tab strip, breadcrumb, list selection, URL, Cross-refs. */

/* Short, unique labels for the open-file strip. A class shows its simple name ("Inner" for Outer$Inner); a native pseudo-class
   "native:libfoo.so/Global" reads "Global · libfoo.so" (the library is what tells two of them apart); when two open files
   still share a label, the nearest enclosing segments are added ("C0014a · a00") until they differ. The tab's title keeps the full name. */
function fnTabLabels(classes) {
  const info = classes.map(c => {
    const m = /^native:([^/]+)\/(.+)$/.exec(c);
    if (m) return {short: m[2], ctx: [m[1]], min: 1};
    const seg = c.split(/[.$]/).filter(Boolean), short = seg.pop() || c;
    return {short, ctx: seg.reverse(), min: 0};   // ctx: nearest enclosing segment first
  });

    const seen = new Map();
    info.forEach((_, i) => { const l = lab(i); (seen.get(l) || seen.set(l, []).get(l)).push(i); });
    let moved = false;
    for (const idx of seen.values()) if (idx.length > 1) for (const i of idx) if (k[i] < info[i].ctx.length) { k[i]++; moved = true; }
    if (!moved) break;
  }
  return info.map((_, i) => lab(i));
}

/* Breadcrumb: Android ancestors are buttons that expand and scroll the tree to that folder; iOS has no folders, so a

/* The class name must always show: hide ancestors from the left (a "…" stands in for them) until the path fits; if the

function fnFitCrumb() {

  if (!cur) return;

  if (el.scrollWidth > el.clientWidth + 1) el.classList.add('wrap');   // still too wide on its own (also a class with no package): let the name wrap

function fnCrumb(i) {

/* ── source viewer ── */

  let cur = '', last = 0, m;
  while ((m = re.exec(html))) {
    cur += html.slice(last, m.index); last = re.lastIndex;
    if (m[1]) { open.push(m[1]); cur += m[1]; }
    else if (m[2]) { open.pop(); cur += m[2]; }
    else { out.push(cur + '</span>'.repeat(open.length)); cur = open.join(''); }
  }
  out.push(cur + html.slice(last));
  return out;
}

/* Where a FUNCTION finding lands in the code: the function's header line. Multi-row classes (native engine) carry a
   header per function, found through the outline. A single decompiled blob (Android) has no line data, so the one
   declaration of that name is located — and when it is absent or ambiguous the finding stays class-level instead of
   being pinned to a guessed line. The pattern runs on the indentation-stripped line: with a leading \s* the indent itself
   satisfied "type + whitespace", so every indented call (`m5118a(x);`, `return m5118a(x)`) counted as a second declaration. */
function fnFunctionLine(file, fn) {
  if (!fn) return 0;
  if (file.outline) { const o = file.outline.find(x => x.name === fn); return o ? o.line : 0; }
  const re = new RegExp('^(?:@\\w+(?:\\([^)]*\\))?\\s+)*(?:(?:public|protected|private|static|final|abstract|synchronized|native|default)\\s+)*(?!return\\b|new\\b|else\\b|throw\\b|case\\b)[\\w$<>\\[\\].,? ]+?\\s+'
    + fn.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s*\\(');
  let hit = 0;
  for (let i = 0; i < file.lines.length; i++) {
    const l = file.lines[i];
    if (l.length < 400 && l.includes(fn) && re.test(l.trimStart())) { if (hit) return 0; hit = i + 1; }
  }
  return hit;
}

function fnMarkers(file) {

    if (ln && (lines.has(ln) || lines.size < 80)) (lines.get(ln) || lines.set(ln, []).get(ln)).push(it);
    else loose.push(it);
  }
  return {lines, loose, info};
}

/* esc() of `text` with the case-insensitive matches of `q` wrapped in <mark> (plain indexOf: no regex to escape). */
function decMark(text, q) {

        ...shown.map(t => [escAttr(t), esc(t || '(none)'), (Number(counts[t]) || 0).toLocaleString()])]);
      if (more.length) {   // the rest live in a native select: keyboard-operable, Esc closes, no custom menu to maintain
        box.insertAdjacentHTML('afterend', `<select class="ctl dec-more" id="dec-more" aria-label="More resource types"><option value="">More types…</option>${more.map(t =>
          `<option value="${escAttr(t)}">${esc(t || '(none)')} (${(Number(counts[t]) || 0).toLocaleString()})</option>`).join('')}</select>`);
      }
      view.typesBuilt = true;
      fadeX(box);
    }
    box.querySelectorAll('button').forEach(b => { const on = b.dataset.dectype === st.type; b.classList.toggle('active', on); b.setAttribute('aria-pressed', String(on)); });
    const more = el.querySelector('#dec-more');
    if (more) { more.value = [...more.options].some(o => o.value === st.type) ? st.type : ''; more.classList.toggle('on', !!more.value); }
  };
  const paintKinds = () => {
    el.querySelectorAll('#dec-kinds [data-kind]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.kind === st.kind)));
    const note = el.querySelector('#dec-kind-note');
    if (note) note.textContent = decKindNote(st.kind);
  };
  const paintRows = () => {
    el.querySelector('#dec-head').hidden = !view.items.length;
    rowsEl.innerHTML = view.items.map((r, i) => cfg.row(r, i, st, id, view.finds)).join('');
    emptyEl.innerHTML = view.items.length ? '' : `<div class="empty-state"><div class="es-ico">${ico('scanSearch')}</div><strong>No ${cfg.noun}s ${st.q || st.type || st.kind ? 'match' : 'found'}</strong>${
      st.q ? `Nothing${st.kind ? ` in ${esc(decKindLabel(st.kind))}` : ''} contains “${esc(st.q)}”.` : st.type ? 'Try another type.' : st.kind ? `No ${esc(decKindLabel(st.kind))} matched. Try another filter.` : ''}</div>`;
    rowsEl.classList.toggle('wrap', !!st.wrap);
    if (!isRes && view.items.some(r => r.label && r.segment === '__JADX')) {
      const items = view.items;   // the class list is shared with Functions (one fetch); until it lands the chips lead to a name filter
      decClasses(id).then(cl => { if (view.items === items && rowsEl.isConnected) decPaintClassLinks(rowsEl, items, id, cl); }).catch(() => {});
    }
  };
  const paintMeta = d => {
    const total = Math.max(0, Number(d.total) || 0), pages = Math.max(0, Number(d.pages) || 0);
    const all = isRes ? view.total : decSt.detail.string_count, filtered = !!(st.q || st.type || st.kind);
    el.querySelector('#dec-count').innerHTML = `<span>${total.toLocaleString()} ${cfg.noun}${total === 1 ? '' : 's'}${filtered ? ` match${total === 1 ? 'es' : ''}${st.q ? ` “${esc(st.q)}”` : ''}${st.type ? ` · type ${esc(st.type)}` : ''}${st.kind ? ` · ${esc(decKindLabel(st.kind))}` : ''}${all ? ` · of ${Number(all).toLocaleString()}` : ''}` : ''}</span>
      <span>Searching the <b>Value</b> column</span>`;
    const pager = el.querySelector('#dec-pager'), f = document.activeElement, keep = f && pager.contains(f) ? (f.getAttribute('aria-label') || f.dataset.dpage) : null;
    pager.innerHTML = total ? pagerHtml(st.page, pages, total, st.size, 'dpage', DEC_SIZES) : '';
    if (keep) (pager.querySelector(`[aria-label="${keep}"]:not(:disabled)`) || pager.querySelector(`[data-dpage="${keep}"]:not(:disabled)`) || pager.querySelector('.active'))?.focus({preventScroll: true});
  };
  const load = async () => {
    const my = ++decListSeq;
    root.classList.add('is-busy'); rowsEl.setAttribute('aria-busy', 'true');
    if (!view.items.length) emptyEl.innerHTML = '<div class="loading"><div class="spinner"></div></div>';   // also replaces a previous error / "no match" note
    try {
      const p = new URLSearchParams({page: st.page, size: st.size});
      if (st.q) p.set('q', st.q);
      if (isRes && st.type) p.set('type', st.type);
      if (!isRes && st.kind) p.set('kind', st.kind);
      const d = await api('/scans/' + id + '/' + kind + '?' + p);
      if (my !== decListSeq || !rowsEl.isConnected) return;
      view.items = Array.isArray(d.items) ? d.items : [];
      st.page = Math.max(1, Number(d.page) || 1);
      if (d.type_counts && typeof d.type_counts === 'object') view.counts = d.type_counts;
      if (isRes && st.type && view.counts && !Object.keys(view.counts).includes(st.type)) {   // a stale / hand-edited ?type=: show All, don't keep it
        st.type = ''; st.page = 1; syncUrl();
        return load();
      }
      paintTypes(); paintRows(); paintMeta(d);
      const hit = rowsEl.querySelector('.dec-hl');
      if (hit) hit.scrollIntoView({block: 'center'});
      else if (view.scrollTop) el.querySelector('.toolbar').scrollIntoView({block: 'start'});
    } catch (e) {
      if (my === decListSeq && rowsEl.isConnected) {
        view.items = []; rowsEl.innerHTML = ''; el.querySelector('#dec-head').hidden = true; el.querySelector('#dec-pager').innerHTML = '';
        emptyEl.innerHTML = `<div class="alert alert-error" style="margin:.75rem">${esc(e.message)}</div>`;
        if (e.status === 404) decNoDb();
      }
    } finally {
      if (my === decListSeq) { root.classList.remove('is-busy'); rowsEl.removeAttribute('aria-busy'); view.scrollTop = false; }
    }
  };
  const reload = (scrollTop = false) => { view.scrollTop = scrollTop; syncUrl(); return load(); };

  let timer = 0;
  qEl.addEventListener('input', () => {
    st.q = qEl.value.trim(); st.page = 1; st.hl = ''; paintFrom();
    clearTimeout(timer);
    timer = setTimeout(reload, 250);
  });
  root.addEventListener('click', ev => {
    const t = ev.target.closest('button');
    if (!t) return;
    if (t.dataset.kind != null) { st.kind = decKindOf(t.dataset.kind); st.page = 1; paintKinds(); reload(); }
    else if (t.id === 'dec-from-x') { st.q = st.hl = ''; st.page = 1; qEl.value = ''; paintFrom(); reload(); qEl.focus(); }
    else if (t.id === 'dec-wrap') { st.wrap = !st.wrap; t.setAttribute('aria-pressed', String(st.wrap)); rowsEl.classList.toggle('wrap', st.wrap); }
    else if (t.dataset.dectype != null) { st.type = t.dataset.dectype; st.page = 1; st.hl = ''; paintFrom(); paintTypes(); reload(); }
    else if (t.dataset.dpage && !t.disabled) { st.page = Number(t.dataset.dpage) || 1; reload(true); }
    else if (t.dataset.expand) {   // clamp ↔ full value (rendered from the item, so a 34K-char value only costs DOM when asked for)
      const row = view.items[Number(t.dataset.i)], val = t.previousElementSibling;
      if (!row || !val) return;
      const open = t.getAttribute('aria-expanded') !== 'true', v = String(row.value ?? '');
      val.classList.toggle('clamp', !open);
      val.classList.toggle('open', open);
      val.innerHTML = decMark(open || v.length <= DEC_CUT ? v : v.slice(0, DEC_CUT) + '…', st.q);
      t.setAttribute('aria-expanded', String(open));
      t.textContent = open ? 'Show less' : 'Show more';
    }
    else if (t.dataset.dact) {
      const row = view.items[Number(t.dataset.i)];
      if (!row) return;
      const text = String(row.value);
      if (t.dataset.dact === 'copy') decCopy(text, t);
      else decAskAi(id, isRes ? `What does this resource do, and is it a risk? ${row.resource_id}: ${text.slice(0, 300)}`
        : `Where is this string used and what is it for? "${text.slice(0, 300)}"`);
    }
  });
  root.addEventListener('change', ev => {
    if (ev.target.matches('select.pager-size')) { st.size = Number(ev.target.value) || 50; st.page = 1; reload(true); }
    else if (ev.target.id === 'dec-more') { st.type = ev.target.value; st.page = 1; st.hl = ''; paintFrom(); paintTypes(); reload(); }
  });

  paintFrom();
  paintKinds();
  syncUrl();
  if (isRes) decVulns(id).then(v => {   // chips arrive after the rows; repaint only if nobody is using a row action
    view.finds = decResourceFindings(v);
    if (rowsEl.isConnected && view.items.length && !rowsEl.contains(document.activeElement)) paintRows();
  });
  await load();
}

/* ── entry points ──
   Grouped by type (collapsible); native symbols are grouped per library, since a native entry has no class to
   open. Rows that do have a class are links to Decompiled › Functions. Toggling a group moves attributes in place
   instead of re-rendering, so focus stays on the header you pressed. */
const EP_TYPE_ORDER = ['activity', 'service', 'receiver', 'provider', 'native', 'method', ''];
const EP_LABELS = {activity: 'Activity', service: 'Service', receiver: 'Receiver', provider: 'Provider', native: 'Native', method: 'Method', '': 'Other'};
const EP_CHUNK = 100;   // rows a group shows before "Show more"

/* class FQN → {n, worst, items} for the non-false-positive FUNCTION / CLASS findings of each class.
   One computation (cached per visit) feeds the Functions tree + Cross-refs panel and the Entry Points chips. */
function decByClass(id) {
  const st = decSt;
  if (!st || st.id !== id) return Promise.resolve(new Map());
  return st.byClass || (st.byClass = decVulns(id).then(rows => {
    const m = new Map();
    for (const r of rows) {
      if (r.is_false_positive) continue;
      const cls = r.affected_type === 'FUNCTION'
        ? (fnClassFromFunctionLocation(r.affected_name, r.evidence_location) || (r.evidence_location && r.evidence_location.includes('.') ? r.evidence_location.slice(0, r.evidence_location.lastIndexOf('.')) : null))
        : r.affected_type === 'CLASS' ? r.affected_name
        : r.affected_type === 'RESOURCE' && r.affected_name === 'Component' ? fnComponentNameFromEvidence(r.evidence) : null;   // exported manifest component → its class
      const sev = String(r.effective_severity || r.severity || '').toUpperCase();
      if (!cls || !(sev in SEV_RANK)) continue;
      const e = m.get(cls) || m.set(cls, {n: 0, worst: sev, items: []}).get(cls);
      e.n++; e.items.push({sev, title: r.title || r.rule_id || 'Finding', rule: r.rule_id || '', fn: r.affected_name || '', loc: r.evidence_location || '', type: r.affected_type});
      if (SEV_RANK[sev] > SEV_RANK[e.worst]) e.worst = sev;   // SEV_RANK: bigger = more severe
    }
    for (const e of m.values()) e.items.sort((a, b) => SEV_RANK[b.sev] - SEV_RANK[a.sev]);
    return m;
  }));
}

/* Any link carrying data-vq hands that text to the Vulnerabilities tab as its search filter (same pending-value
   pattern as the severity tiles). Only a plain click: a middle/ctrl-click opens a fresh page that must not inherit it. */
document.addEventListener('click', ev => {
  const a = ev.target.closest?.('a[data-vq]');
  if (a && ev.button === 0 && !ev.ctrlKey && !ev.metaKey && !ev.shiftKey && !ev.altKey) {
    vulnPendingQ = a.dataset.vq;
    vulnPendingSev = a.dataset.vsev || null;
  }
});

/* "⚠ n" pill: the class's findings, worst severity colour; opens the Vulnerabilities tab filtered to the class. */
function decFindingsChip(id, cls, info) {
  if (!info) return '';
  return `<a class="dec-chip sev-${escAttr(info.worst.toLowerCase())}" href="#/scan/${escAttr(id)}/vulnerabilities" data-vq="${escAttr(cls)}" data-vsev=""
    title="${info.n} finding${info.n === 1 ? '' : 's'} in ${escAttr(cls)} — open in Vulnerabilities">${ico('alert')} ${info.n}</a>`;
}

async function tabEntryPoints(el, id, detail, params) {
  const st = decSt.ep || (decSt.ep = {q: '', type: 'all', open: {}, more: {}});
  if (params && String(params)) { st.q = (params.get('q') || '').slice(0, 200); st.type = params.get('type') || 'all'; }
  el.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
  let raw, byClass;
  try {
    [raw, byClass] = await Promise.all([decEps(id), decByClass(id)]);
  } catch (e) {
    if (decActive('entrypoints', id)) { el.innerHTML = `<div class="alert alert-error">${esc(e.message)}</div>`; if (e.status === 404) decNoDb(); }
    return;
  }
  if (!decActive('entrypoints', id)) return;
  if (!raw.length) {
    el.innerHTML = `<div class="panel"><div class="empty-state"><div class="es-ico">${ico('logIn')}</div>
      <strong>No entry points detected</strong>Exported components and native entry symbols appear here when found.</div></div>`;
    return;
  }
  const eps = raw.map(parseEntryPoint)
    .sort((a, b) => EP_TYPE_ORDER.indexOf(a.type) - EP_TYPE_ORDER.indexOf(b.type) || a.pkg.localeCompare(b.pkg) || a.short.localeCompare(b.short));
  const types = EP_TYPE_ORDER.filter(t => eps.some(e => e.type === t));
  if (st.type !== 'all' && !types.includes(st.type)) st.type = 'all';   // a stale / hand-edited ?type=
  el.innerHTML = `<div class="dec-ep">
    <div class="toolbar">
      <label class="search-ctl">${ico('search')}<input id="dec-q" class="ctl" type="search" autocomplete="off" placeholder="Filter class, package, member…" aria-label="Filter entry points by class, package or member"/></label>
      ${types.length > 1 ? '<div class="seg fade-x" id="dec-etype" role="group" aria-label="Filter by type"></div>' : ''}
    </div>
    <section class="panel dec-panel">
      <div class="result-line" id="dec-count" role="status"></div>
      <div id="dec-groups"></div>
    </section></div>`;
  const root = el.firstElementChild, qEl = el.querySelector('#dec-q'), box = el.querySelector('#dec-groups');
  qEl.value = st.q;
  const syncUrl = () => decReplaceUrl({q: st.q, type: st.type === 'all' ? '' : st.type});
  const seg = el.querySelector('#dec-etype');
  if (seg) {
    seg.innerHTML = segHtml('eptype', st.type, [['all', 'All', eps.length.toLocaleString()],
      ...types.map(t => [escAttr(t), esc(EP_LABELS[t]), eps.filter(e => e.type === t).length.toLocaleString()])]);
    fadeX(seg);
  }

  const rowHtml = (e, i) => {
    const cls = epClass(e), q = st.q;
    const open = cls ? decHash(id, 'functions', {class: cls}) : '';
    const name = e.type === 'native' ? e.short.replace(/^Global\./, '') : e.short;   // "Global" is Ghidra's root namespace: noise next to a library title
    const label = decMark(name, q) + (e.member ? `<span class="mem">.${decMark(e.member, q)}</span>` : '');
    return `<div class="dec-row dec-ep-row${cls ? ' ep-link' : ''}" role="listitem" title="${escAttr(e.raw)}">
      <span class="ep-badge ${escAttr(e.type)}">${esc(e.type === 'method' ? 'method' : e.type || 'entry')}</span>
      <div class="ep-body"><div class="ep-nm">${cls ? `<a class="ep-open" href="${escAttr(open)}" title="Open in Functions">${label}</a>` : label}</div>
        ${e.pkg && e.type !== 'native' ? `<div class="ep-pk">${decMark(e.pkg, q)}</div>` : ''}</div>
      <div class="dec-end">${cls ? decFindingsChip(id, cls, byClass.get(cls)) : ''}
        ${cls ? `<a class="btn btn-ghost btn-sm ep-fn" href="${escAttr(open)}">Functions ↗</a>` : ''}
        <span class="dec-acts"><button type="button" class="dec-ib" data-dact="ask" data-i="${i}" aria-label="Ask AI" title="Ask AI">${ico('sparkles')}</button></span></div></div>`;
  };
  /* One collapsible group: header button + body. `key` identifies it in st.open / st.more; `items` are [e, index] pairs. */
  const groupHtml = (key, title, items, {open, lib, inner}) => {
    const shown = items.slice(0, st.more[key] || EP_CHUNK), left = items.length - shown.length, gid = 'dec-g-' + key.replace(/[^\w-]/g, '_');
    return `<div class="dec-grp-wrap${lib ? ' lib' : ''}"><button type="button" class="dec-grp${lib ? ' lib' : ''}" data-grp="${escAttr(key)}" aria-expanded="${open}" aria-controls="${gid}">
        <span class="ar" aria-hidden="true">▸</span><span class="${lib ? 'mono' : ''}">${title}</span><span class="n">${items.length.toLocaleString()}</span></button>
      <div id="${gid}" class="dec-grp-body" role="list"${open ? '' : ' hidden'}>${inner ? inner : shown.map(([e, i]) => rowHtml(e, i)).join('')}
        ${!inner && left > 0 ? `<button type="button" class="btn btn-ghost btn-sm dec-more-rows" data-more="${escAttr(key)}">Show ${Math.min(left, EP_CHUNK)} more (${left.toLocaleString()} left)</button>` : ''}</div></div>`;
  };
  const paint = () => {
    const q = st.q.toLowerCase();
    const list = eps.map((e, i) => [e, i]).filter(([e]) => (st.type === 'all' || e.type === st.type) && (!q || `${e.raw} ${e.type}`.toLowerCase().includes(q)));
    el.querySelector('#dec-count').innerHTML = `<span>${(st.q || st.type !== 'all') ? `${list.length.toLocaleString()} of ${eps.length.toLocaleString()} entry point${eps.length === 1 ? '' : 's'}` : `${eps.length.toLocaleString()} entry point${eps.length === 1 ? '' : 's'}`}</span>
      <span>${st.q ? 'Matching class, package, member and library' : ''}</span>`;
    const isOpen = (key, dflt) => q ? true : (key in st.open ? st.open[key] : dflt);   // a filter expands everything that matched
    box.innerHTML = list.length ? EP_TYPE_ORDER.filter(t => list.some(([e]) => e.type === t)).map(t => {
      const items = list.filter(([e]) => e.type === t);
      if (t !== 'native') return groupHtml('t:' + t, esc(EP_LABELS[t]), items, {open: isOpen('t:' + t, true)});
      // native: a group row per library (title = library name, count = its symbols), symbols listed when expanded
      const libs = new Map();
      for (const it of items) (libs.get(it[0].pkg) || libs.set(it[0].pkg, []).get(it[0].pkg)).push(it);
      const inner = [...libs].map(([lib, rows]) => groupHtml('l:' + lib, decMark(lib, st.q), rows, {open: isOpen('l:' + lib, false), lib: true})).join('');
      return groupHtml('t:native', esc(EP_LABELS.native) + ` <span class="dec-sub-note">· grouped by library (${libs.size})</span>`, items, {open: isOpen('t:native', false), inner});
    }).join('') : `<div class="empty-state"><div class="es-ico">${ico('scanSearch')}</div><strong>No matches</strong>No entry points match this filter.</div>`;
  };

  qEl.addEventListener('input', () => { st.q = qEl.value.trim(); paint(); syncUrl(); });
  root.addEventListener('click', ev => {
    const t = ev.target.closest('button');
    if (!t) return;
    if (t.dataset.eptype) {
      st.type = t.dataset.eptype;
      seg.querySelectorAll('button').forEach(b => { const on = b.dataset.eptype === st.type; b.classList.toggle('active', on); b.setAttribute('aria-pressed', String(on)); });
      paint(); syncUrl();
    } else if (t.dataset.grp) {   // toggle in place: no re-render, so the header keeps focus
      const body = document.getElementById(t.getAttribute('aria-controls')), now = body.hidden;
      body.hidden = !now;
      t.setAttribute('aria-expanded', String(now));
      st.open[t.dataset.grp] = now;
    } else if (t.dataset.more) {
      const key = t.dataset.more;
      st.more[key] = (st.more[key] || EP_CHUNK) + EP_CHUNK;
      paint();
      box.querySelector(`[data-grp="${CSS.escape(key)}"]`)?.focus();
    } else if (t.dataset.dact === 'ask') {
      const e = eps[Number(t.dataset.i)];
      if (e) decAskAi(id, `Explain this entry point and what it exposes: ${e.raw}`);
    }
  });
  paint();
  syncUrl();
}

/* ── assessment tab (security controls inventory) ── */
let _assessRows = [];
let _assessSelectedIdx = -1;
let _assessDrawerOpen = false;

function assessStatusBadge(s) {
  const u = String(s||'UNKNOWN').toUpperCase();
  const bg = u === 'PRESENT' ? '#dcfce7;color:#16a34a' : u === 'PARTIAL' ? '#fef3c7;color:#d97706'
    : u === 'ABSENT' ? '#fee2e2;color:#dc2626' : '#f3f4f6;color:#6b7280';
  return `<span class="badge" style="background:${bg.split(';')[0]};${bg.includes('color')?bg.split(';').slice(1).join(';'):''}">${esc(u)}</span>`;
}

function assessGuide(a) {
  const label = a.title || a.control_id || 'this control';
  const summary = fieldOr(a.summary,
    `Inventories whether “${label}” appears implemented in this build. Absence of static signals does not prove the control is missing on packed or heavily obfuscated apps.`);
  const staticChecks = Array.isArray(a.static_checks) && a.static_checks.length ? a.static_checks : [
    'Search decompiled code (JADX for Android, Ghidra/Hopper for iOS) for APIs and types related to this control.',
    'Search strings, resources, and the manifest or Info.plist for related flags, permissions, and configuration values.',
    'Cross-check hits against third-party libraries so SDK noise is not mistaken for app-level enforcement.',
  ];
  const dynamicChecks = Array.isArray(a.dynamic_checks) && a.dynamic_checks.length ? a.dynamic_checks : [
    'On an authorized test device, exercise the related user flow and record whether the protection is actually enforced at runtime.',
    'Compare behavior on a stock device versus a lab device where the condition this control is meant to detect is present.',
    'Document observed prompts, errors, or degraded functionality. Do not use this as a bypass or exploit recipe.',
  ];
  return {summary, staticChecks, dynamicChecks};
}

function renderAssessSteps(steps) {
  return `<ol class="assess-steps">${(steps||[]).map(s => `<li>${esc(s)}</li>`).join('')}</ol>`;
}

function renderAssessDrawerBody(a) {
  const g = assessGuide(a);
  const reason = fieldOr(a.evidence, 'No evidence was recorded for this status.');
  const detail = fieldOr(a.detail, '');
  return `
    <div class="llm-section-label">Summary</div>
    <p style="font-size:.85rem;line-height:1.55;margin-bottom:1rem">${esc(g.summary)}</p>
    <div class="llm-section-label">Reason</div>
    <div class="assess-reason">${esc(reason)}</div>
    ${detail ? `<div class="assess-reason-meta">${esc(detail)}</div>` : ''}
    <div class="vuln-section">
      <div class="vuln-section-title">Static checking</div>
      ${renderAssessSteps(g.staticChecks)}
    </div>
    <div class="vuln-section">
      <div class="vuln-section-title">Dynamic checking</div>
      ${renderAssessSteps(g.dynamicChecks)}
    </div>`;
}

function closeAssessDrawer() {
  _assessDrawerOpen = false;
  _assessSelectedIdx = -1;
  const drawer = document.getElementById('assess-drawer');
  const backdrop = document.getElementById('assess-drawer-backdrop');
  if (drawer) drawer.classList.remove('open');
  if (backdrop) backdrop.classList.remove('open');
  $$('.assess-row.selected').forEach(r => r.classList.remove('selected'));
  document.removeEventListener('keydown', onAssessDrawerKeydown);
}

function onAssessDrawerKeydown(e) {
  if (e.key === 'Escape') closeAssessDrawer();
}

window.openAssessDrawer = function(idx) {
  const a = _assessRows[idx];
  if (!a) return;
  const drawer = document.getElementById('assess-drawer');
  const backdrop = document.getElementById('assess-drawer-backdrop');
  const title = document.getElementById('assess-drawer-title');
  const meta = document.getElementById('assess-drawer-meta');
  const body = document.getElementById('assess-drawer-body');
  if (!drawer || !body) return;

  _assessSelectedIdx = idx;
  title.textContent = a.title || a.control_id || 'Assessment';
  meta.innerHTML = `
    ${a.category ? `<span class="meta-chip">${esc(a.category)}</span>` : ''}
    ${assessStatusBadge(a.status)}
    ${a.confidence ? sevBadgeLevel(a.confidence) : ''}
    ${a.control_id ? `<span class="meta-chip">${esc(a.control_id)}</span>` : ''}
  `;
  body.innerHTML = renderAssessDrawerBody(a);

  document.removeEventListener('keydown', onAssessDrawerKeydown);
  document.addEventListener('keydown', onAssessDrawerKeydown);
  drawer.focus({preventScroll:true});
};

            <span class="n">${counts[k]}</span><span class="l">${l} ${ico('check')}</span></button>`).join('')}
      </div>
      <p style="color:var(--muted);font-size:.8rem;margin-bottom:1rem">Static best-effort inventory of implemented protections. Not counted in vulnerability severity totals. Click a control for summary, reason, and static/dynamic checks.</p>
      ${Object.keys(byCat).sort().map(cat => `
        <div class="card assess-cat" style="margin-bottom:.75rem">
          <div class="card-title">${esc(cat)} <span style="font-weight:400;color:var(--muted);font-size:.8rem">${byCat[cat].length}</span></div>
          ${byCat[cat].map(rowHtml).join('')}
        </div>`).join('')}
      <div id="assess-drawer-backdrop" class="llm-drawer-backdrop" onclick="closeAssessDrawer()"></div>
      <aside id="assess-drawer" class="llm-drawer" tabindex="-1" role="dialog" aria-label="Assessment control detail">
        <div class="llm-drawer-head">
          <div class="llm-drawer-head-main">
            <div id="assess-drawer-title" class="llm-drawer-title"></div>
            <div id="assess-drawer-meta" class="llm-drawer-meta"></div>
          </div>
          <button type="button" class="llm-drawer-close" onclick="closeAssessDrawer()" aria-label="Close">×</button>
        </div>
        <div id="assess-drawer-body" class="llm-drawer-body"></div>
      </aside>`;
    let statusFilter = '';
    document.getElementById('assess-tiles').addEventListener('click', ev => {
      const t = ev.target.closest('.sev-tile');
      if (!t) return;
      statusFilter = statusFilter === t.dataset.astat ? '' : t.dataset.astat;
      $$('#assess-tiles .sev-tile').forEach(x => {
        const on = x.dataset.astat === statusFilter;
        x.classList.toggle('active', on);

          const ok = !statusFilter || r.dataset.status === statusFilter;
          r.hidden = !ok;
