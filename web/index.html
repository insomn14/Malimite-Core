/* ── scan detail view ── */
const TABS = ['summary','vulnerabilities','assessment','functions','strings','resources','entrypoints','llm','assistant','log','downloads'];

function tabsForDetail(detail) {
  const mode = String(detail?.llm_mode || '').toLowerCase().replace(/-/g, '_');
  const showOff = mode === 'offensive' || mode === 'offense' || mode === 'frida' || mode === 'bypass';
  const tabs = TABS.filter(t => t !== 'assistant' || detail?.state === 'done');
  if (!showOff) return tabs;
  const i = tabs.indexOf('llm');
  tabs.splice(i >= 0 ? i : tabs.length, 0, 'offensive');
  return tabs;
}

const TAB_ICONS = {summary:'layers', vulnerabilities:'bug', assessment:'shield', functions:'code', strings:'type',
  resources:'folderOpen', entrypoints:'logIn', offensive:'crosshair', llm:'sparkles', assistant:'message', log:'terminal', downloads:'download'};
const TAB_LABELS = {llm:'LLM Findings', entrypoints:'Entry Points', assistant:'AI Assistant'};

function tabLabel(t) {
  return TAB_LABELS[t] || (t.charAt(0).toUpperCase() + t.slice(1));
}

function compactNum(n) {
  n = Number(n) || 0;
  if (n < 1000) return String(n);
  if (n < 1e6) return (n / 1000).toFixed(n < 10000 ? 1 : 0).replace(/\.0$/, '') + 'K';
  return (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
}

/** Small count pill shown next to a tab label (only when the number is known and meaningful). */
function tabCountHtml(t, d) {
  const vc = d.vulnerability_counts;
  const n = t === 'vulnerabilities' ? vc?.total
    : t === 'entrypoints' ? d.entry_point_count
    : t === 'llm' ? d.llm_finding_count
    : t === 'strings' ? d.string_count : null;
  if (n == null || (t !== 'vulnerabilities' && !n)) return '';
  const hot = t === 'vulnerabilities' && ((vc?.CRITICAL || 0) + (vc?.HIGH || 0)) > 0;
  return ` <span class="tab-n${hot ? ' hot' : ''}">${compactNum(n)}</span>`;
}

window.copyText = async function(text, btn) {
  try {
    await navigator.clipboard.writeText(String(text));
    if (btn) { const old = btn.innerHTML; btn.innerHTML = ico('check') + ' Copied'; setTimeout(() => { btn.innerHTML = old; }, 1200); }
  } catch (_) { prompt('Copy:', String(text)); }
};

/* Every result tab shows the same "no results yet" panel while a scan is still running (or when it
   failed), so a tab that hasn't been given data never looks like a different kind of error. */
function notReadyHtml(detail, what) {
  if (isEmptyScan(detail)) return emptyResultHtml(detail, what);
  const st = String(detail?.state || '').toLowerCase();
  const pending = st === 'running' || st === 'queued';
  const title = pending ? (st === 'queued' ? 'Scan is queued' : 'Scan is running') : 'Scan did not finish';
  const body = pending
    ? `${what} will appear here automatically once the analysis finishes.`
    : `The analysis stopped before it finished, so ${what} are unavailable for this scan. Check the Summary tab for the failure reason.`;
  const cls = pending ? 'running' : 'failed';
  return `<div class="state-panel ${cls}"><span class="big">${ico(pending ? 'loader' : 'circleX', pending ? 'ico-spin' : '')}</span>
    <div><strong>${esc(title)}</strong>${esc(body)}</div></div>`;
}

function scanKindFromDetail(d) {
  const p = String(d?.platform || '').toUpperCase();
  return p === 'IOS' ? 'ios' : p === 'ANDROID' ? 'android' : packageKindOf(d?.filename);
}

route('scan', async function(id, tab='summary') {
  render('<div class="loading"><div class="spinner"></div></div>');
  let detail;
  try { detail = await api('/scans/'+id); }
  catch(e) { render(`<div class="alert alert-error">${esc(e.message)}</div>`); return; }
  // AI Fix / Auto Enhance's provider dropdowns only offer providers the Config tab reports as
  // connected — refresh _configCache here so a scan opened via a direct link (no Home visit
  // first) still has it before the Vulnerabilities tab renders.
  try { await fetchConfigProviders(); } catch (_) { /* dropdowns fall back to "no providers" below */ }

  const tabs = tabsForDetail(detail);
  if (tab === 'offensive' && !tabs.includes('offensive')) tab = 'summary';
  const tabsHtml = tabs.map(t =>
    `<div class="tab${t===tab?' active':''}" data-tab="${t}" role="tab" tabindex="0" aria-selected="${t===tab}"
      onclick="goTab('${id}','${t}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();goTab('${id}','${t}')}">${ico(TAB_ICONS[t] || 'info')} ${tabLabel(t)}${tabCountHtml(t, detail)}</div>`
  ).join('');
  const kind = scanKindFromDetail(detail);
  const modeKey = String(detail.llm_mode || 'summarize').toLowerCase();
  const llmOn = detail.llm_enabled && detail.llm_provider && detail.llm_provider !== 'none';
  const started = detail.started_at || detail.created_at;
  const pkgLabel = /\.ipa$/i.test(detail.filename) ? 'IPA' : 'APK';

  render(`
    <section class="panel sd-head">
      ${platTile(kind)}
      <div class="sd-main">
        <div class="sd-title-row"><h1 class="sd-title">${esc(detail.bundle_id || detail.filename)}</h1>${statePill(detail.state, isEmptyScan(detail))}</div>
        <div class="sd-meta">
          <span title="Uploaded file">${ico('fileText')} ${esc(detail.filename)}</span>
          <span>${platformName(kind)}</span>
          <span><button type="button" class="sd-id" title="Copy full scan ID (${escAttr(detail.scan_id)})"
            onclick="copyText('${escAttr(detail.scan_id)}', this)">${esc(detail.scan_id.slice(0,8))}</button></span>
          <span>${ico(SCAN_MODES[modeKey]?.icon || 'zap')} ${esc(scanModeLabel(detail.llm_mode))}${llmOn ? ' · ' + esc(providerLabel(detail.llm_provider)) : ''}</span>
          <span title="${escAttr(fmt(started))}">${ico('clock')} ${esc(fmtShort(started))}${detail.finished_at ? ' · ' + dur(detail.started_at, detail.finished_at) : ''}</span>
        </div>
      </div>
      <div class="sd-actions">
        ${detail.has_html?`<a class="btn btn-outline" href="/api/v1/scans/${id}/report" target="_blank" rel="noopener">${ico('external')} HTML Report</a>`:''}
        ${detail.has_sarif?`<a class="btn btn-outline" href="/api/v1/scans/${id}/sarif">${ico('braces')} SARIF</a>`:''}
        ${detail.has_package?`<a class="btn btn-outline" href="/api/v1/scans/${id}/package">${ico('download')} ${pkgLabel}</a>`:''}
        <button class="btn btn-danger-outline" onclick="deleteScan('${id}', event)" title="Delete this scan">${ico('trash')} Delete</button>
      </div>
    </section>
    ${detail.scan_mode==='light'?`<div class="alert alert-warn" style="margin-bottom:.75rem"><strong>Light scan</strong> — Ghidra was skipped, so there is no pseudocode. ${(detail.rules_not_evaluated||[]).length} pseudocode-based rule(s) were <strong>not evaluated</strong> (${(detail.rules_not_evaluated||[]).map(esc).join(', ')}); absence of a finding for them does not mean the app is safe. Decompile single functions on demand from the Functions tab or the AI Assistant.</div>`:''}
    <div class="tabs sd-tabs" role="tablist" aria-label="Scan result sections">${tabsHtml}</div>
    <div id="tab-content"><div class="loading"><div class="spinner"></div></div></div>`);

  const tabBar = document.querySelector('.sd-tabs');
  const syncTabFade = () => {
    if (!tabBar.isConnected) { window.removeEventListener('resize', syncTabFade); return; }
    tabBar.classList.toggle('can-scroll', tabBar.scrollWidth > tabBar.clientWidth + 2);
    tabBar.classList.toggle('at-end', tabBar.scrollLeft + tabBar.clientWidth >= tabBar.scrollWidth - 2);
  };
  tabBar.addEventListener('scroll', syncTabFade, {passive: true});
  window.addEventListener('resize', syncTabFade);
  syncTabFade();
  tabBar.querySelector('.tab.active')?.scrollIntoView({block: 'nearest', inline: 'nearest'});

  await renderTab(id, tab, detail);

  // auto-refresh if running
  if (detail.state === 'queued' || detail.state === 'running') {
    const iv = setInterval(async () => {
      let d;
      try { d = await api('/scans/'+id); }
      catch (e) {
        // A transient network error should keep retrying, but a scan that's gone (e.g. deleted
        // from under this open tab) will 404 forever — polling silently is indistinguishable
        // from a scan that's still genuinely running, so this tab would show "running" forever.
        if (e.status === 404) { clearInterval(iv); render(`<div class="alert alert-error">${esc(e.message)}</div>`); }
        return;
      }
      if (d.state === 'done' || d.state === 'error') {
        clearInterval(iv);
        location.hash = '#/scan/' + id + '/summary';
      }
    }, 3000);
  }
});

window.goTab = function(id, tab) {
  history.replaceState(null,'','#/scan/'+id+'/'+tab);
  document.querySelectorAll('.sd-tabs .tab').forEach(t=>{
    t.classList.toggle('active', t.dataset.tab===tab);
    t.setAttribute('aria-selected', String(t.dataset.tab===tab));
  });
  api('/scans/'+id).then(detail => renderTab(id, tab, detail));
};

async function renderTab(id, tab, detail) {
  const el = document.getElementById('tab-content');
  if (!el) return;
  document.getElementById('app')?.classList.toggle('main-wide', tab === 'functions');
  if (typeof closeLlmDrawer === 'function') closeLlmDrawer();
  if (typeof closeAssessDrawer === 'function') closeAssessDrawer();
  // A scan that stored nothing must never be read as "no findings": every data tab says why it is
  // empty instead. Summary still renders (it shows the banner and lets you re-run / open the log).
  if (isEmptyScan(detail) && !['summary', 'log', 'downloads'].includes(tab)) {
    el.innerHTML = emptyResultHtml(detail, tabLabel(tab));
    return;
  }
  try {
    switch(tab) {
      case 'summary':
        el.innerHTML = await tabSummary(detail);
        postSummaryHydrate(id);
        if (detail.state === 'queued' || detail.state === 'running') startLiveLog(id);
        break;
      case 'vulnerabilities': await tabVulnerabilities(el, id, detail); break;
      case 'assessment':      await tabAssessment(el, id, detail); break;
      case 'functions':       await tabFunctions(el, id, detail); break;
      case 'strings':     await tabStrings(el, id, detail); break;
      case 'resources':   await tabResources(el, id, detail); break;
      case 'entrypoints': await tabEntryPoints(el, id, detail); break;
      case 'offensive':   await tabOffensive(el, id, detail); break;
      case 'llm':         await tabLlm(el, id, detail); break;
      case 'assistant':   await tabAssistant(el, id, detail); break;
      case 'log':         await tabLog(el, id); break;
      case 'downloads':   el.innerHTML = tabDownloads(id, detail); break;
      default:            el.innerHTML = '<div class="empty">Unknown tab.</div>';
    }
  } catch(e) {
    el.innerHTML = `<div class="alert alert-error">${esc(e.message)}</div>`;
  }
}

/* ── AI Assistant tab ── */
const chatState = {};
function chatSt(id) { return chatState[id] || (chatState[id] = {sid: null, fresh: false, sessions: [], ctrl: null, busy: false, attachedFiles: []}); }

const CHAT_PROMPTS = [
  'Give me a security overview of this app',
  'Find crypto misuse (weak algorithms, ECB, hardcoded keys)',
  'Find hardcoded secrets, tokens and URLs',
  'Where is certificate pinning implemented?',
];

/* mini markdown (headings, bold/italic, `code`, fenced code, lists, tables, quotes, hr).
   Every piece of model/tool text goes through esc() before any tag is added; no links/images are rendered. */
function chatInline(s) {
  return String(s).split(/(`[^`\n]+`)/).map(p => {
    if (p.length > 1 && p[0] === '`' && p[p.length - 1] === '`') return '<code>' + esc(p.slice(1, -1)) + '</code>';
    return esc(p)
      .replace(/\*\*(?=\S)(.+?)(?<=\S)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[^*\w])\*(?=[^\s*])(.+?)(?<=[^\s*])\*(?![*\w])/g, '$1<em>$2</em>');
  }).join('');
}

function chatSplitRow(row) {
  let r = row.trim();
  if (r.startsWith('|')) r = r.slice(1);
  if (r.endsWith('|')) r = r.slice(0, -1);
  return r.split(/\|(?=(?:[^`]*`[^`]*`)*[^`]*$)/).map(c => c.trim());
}

function chatBlocks(text) {
  const L = text.split('\n'), out = [];
  const isTableStart = i => L[i].includes('|') && i + 1 < L.length && /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(L[i + 1]);
  const isBlockStart = i => /^#{1,6}\s/.test(L[i]) || /^\s*([-*+]|\d+[.)])\s+/.test(L[i]) || /^>\s?/.test(L[i]) || isTableStart(i);
  let i = 0, m;
  while (i < L.length) {
    const l = L[i];
    if (!l.trim()) { i++; continue; }
    if ((m = l.match(/^(#{1,6})\s+(.*)$/))) {
      const n = Math.min(m[1].length + 2, 6);   // chat-sized: # -> h3
      out.push(`<h${n} class="chat-h">${chatInline(m[2])}</h${n}>`); i++; continue;
    }
    if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)) { out.push('<hr>'); i++; continue; }
    if (isTableStart(i)) {
      const head = chatSplitRow(l); i += 2;
      const rows = [];
      while (i < L.length && L[i].includes('|') && L[i].trim()) { rows.push(chatSplitRow(L[i])); i++; }
      out.push('<div class="chat-tbl"><table><thead><tr>' + head.map(c => `<th>${chatInline(c)}</th>`).join('') +
        '</tr></thead><tbody>' + rows.map(r => '<tr>' + head.map((_, k) => `<td>${chatInline(r[k] || '')}</td>`).join('') + '</tr>').join('') +
        '</tbody></table></div>');
      continue;
    }
    if (/^\s*([-*+]|\d+[.)])\s+/.test(l)) {
      const ordered = /^\s*\d/.test(l), items = [];
      while (i < L.length && (m = L[i].match(/^\s*(?:[-*+]|\d+[.)])\s+(.*)$/))) {
        let item = m[1]; i++;
        while (i < L.length && L[i].trim() && /^\s{2,}\S/.test(L[i]) && !/^\s*([-*+]|\d+[.)])\s+/.test(L[i])) { item += ' ' + L[i].trim(); i++; }
        items.push(item);
      }
      const tag = ordered ? 'ol' : 'ul';
      out.push(`<${tag}>` + items.map(t => `<li>${chatInline(t)}</li>`).join('') + `</${tag}>`);
      continue;
    }
    if (/^>\s?/.test(l)) {
      const q = [];
      while (i < L.length && /^>\s?/.test(L[i])) { q.push(L[i].replace(/^>\s?/, '')); i++; }
      out.push('<blockquote>' + q.map(chatInline).join('<br>') + '</blockquote>'); continue;
    }
    const para = [];
    while (i < L.length && L[i].trim() && !(para.length && isBlockStart(i))) { para.push(L[i]); i++; }
    out.push('<p>' + para.map(chatInline).join('<br>') + '</p>');
  }
  return out.join('');
}

function chatMd(text) {
  return String(text).split('```').map((part, i) => {
    if (i % 2) return '<pre class="chat-code">' + esc(part.replace(/^[^\n]*\n/, '')) + '</pre>';
    return chatBlocks(part);
  }).join('');
}

/* Elapsed time for the assistant's progress pill ("12s", "1m 04s"). */
function chatElapsed(ms) {
  const s = Math.max(0, Math.round(ms / 1000));
  return s < 60 ? `${s}s` : `${Math.floor(s / 60)}m ${String(s % 60).padStart(2, '0')}s`;
}

/* One progress pill pinned to the bottom of the conversation while a reply is being produced:
   what the model is doing right now (thinking / running a tool / writing) plus how long the turn
   has been running. Callers drive it through setPhase() and must stop() it when the turn ends —
   the persisted history has no equivalent, so leaving it behind would make a reloaded chat look
   different from the live one. */
function chatProgressStart() {
  const box = document.getElementById('chat-msgs');
  const el = document.createElement('div');
  el.className = 'chat-status';
  el.setAttribute('role', 'status');
  el.setAttribute('aria-live', 'polite');
  el.innerHTML = '<span class="sp" aria-hidden="true"></span><span class="lbl"></span><span class="sub"></span><span class="t"></span>';
  const t0 = Date.now();
  let phase = 'thinking', toolName = '', timer = 0;
  const paint = () => {
    if (!el.isConnected) { clearInterval(timer); return; }
    const writing = phase === 'writing';
    el.querySelector('.lbl').textContent = phase === 'tool' ? 'Running tool' : writing ? 'Writing answer' : 'Thinking';
    el.querySelector('.sub').textContent = phase === 'tool' ? (toolName || '') : '';
    el.querySelector('.t').textContent = chatElapsed(Date.now() - t0);
    el.classList.toggle('is-writing', writing);
  };
  if (box) { box.appendChild(el); box.scrollTop = box.scrollHeight; }
  paint();
  timer = setInterval(paint, 250);
  return {
    el,
    /** phase: 'thinking' | 'tool' | 'writing'. `name` labels the tool while phase is 'tool'. */
    setPhase(next, name) { phase = next; if (name !== undefined) toolName = name; paint(); },
    /** Keep the pill as the last child so it never sits above freshly-added bubbles/tool blocks. */
    keepLast() {
      const b = document.getElementById('chat-msgs');
      if (el.isConnected && b && el.parentNode === b && b.lastElementChild !== el) {
        b.appendChild(el);
        b.scrollTop = b.scrollHeight;
      }
    },
    stop() { clearInterval(timer); timer = 0; if (el.isConnected) el.remove(); },
  };
}

function chatToolHtml(tu, result) {
  const status = !result ? 'running' : (result.is_error || result.ok === false ? 'error' : 'ok');
  const body = result ? esc(result.preview != null ? result.preview : result.content) : '';
  return `<details class="chat-tool" data-tid="${escAttr(tu.id)}">
    <summary>${esc(tu.name)}(${esc(JSON.stringify(tu.args != null ? tu.args : tu.input))})
      <span class="badge badge-${status === 'ok' ? 'done' : status === 'error' ? 'error' : 'running'}">${status}</span></summary>
    <pre class="chat-code">${body}</pre></details>`;
}

function chatAdd(cls, html) {
  const box = document.getElementById('chat-msgs');
  if (!box) return null;
  const d = document.createElement('div');
  d.className = 'chat-msg ' + cls;
  d.innerHTML = html;
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
  return d;
}

/* Renders the user's own bubble right after Send: their typed text (if any) plus attachment
   chips — text files as a small label, images as an inline thumbnail. This is a local echo for
   immediate feedback; chatRenderHistory() re-renders the server's persisted version (same shapes)
   once the turn completes, so the two must stay visually consistent. */
function chatAddUserEcho(text, files) {
  const textHtml = text ? chatMd(text) : '';
  const imgs = files.filter(f => f.kind === 'image');
  const textFiles = files.filter(f => f.kind === 'text');
  let html = textHtml;
  if (imgs.length) {
    html += '<div class="chat-msg-images">' + imgs.map(f =>
      `<img src="data:${esc(f.mediaType)};base64,${f.content}" alt="${escAttr(f.name)}" title="${escAttr(f.name)}">`
    ).join('') + '</div>';
  }
  if (textFiles.length) {
    html += '<div class="chat-attachments">' + textFiles.map(f =>
      `<span class="chat-attach-chip">📎 ${esc(f.name)}</span>`
    ).join('') + '</div>';
  }
  return chatAdd('chat-user', html || '&nbsp;');
}

async function exportChat(id, st, detail) {
  // Local, not tabAssistant's own showErr closure: this function is top-level so other callers
  // besides the chat bar could reuse it later without dragging that closure along.
  const showErr = m => { const e = document.getElementById('chat-err'); if (e) e.innerHTML = m ? `<div class="alert alert-error">${esc(m)}</div>` : ''; };
  if (!st.sid) { showErr('No chat to export yet.'); return; }
  let data;
  try { data = await api('/scans/' + id + '/chat?session_id=' + encodeURIComponent(st.sid)); }
  catch (e) { showErr('Could not export: ' + e.message); return; }
  const sess = (data.sessions || []).find(s => s.id === st.sid) || {};
  const results = {};
  (data.messages || []).forEach(m => m.content.forEach(b => { if (b.type === 'tool_result') results[b.tool_use_id] = b; }));

  // A session title is the first 60 chars of the user's first message verbatim, so it can itself
  // contain newlines or a code fence (e.g. a message that opens with "```") — collapse it to one
  // line so it can't split the H1 across lines or open an unbalanced fence this early in the file.
  const titleLine = (sess.title || 'Malimite AI Assistant conversation').replace(/\s+/g, ' ').trim();
  const lines = [
    `# ${titleLine}`, '',
    `- App: ${detail.bundle_id || detail.filename}`,
    `- Scan ID: ${id}`,
    `- Provider / model: ${sess.provider || '?'} / ${sess.model || '?'}`,
    `- Exported: ${new Date().toISOString()}`, '',
    '---', ''
  ];
  (data.messages || []).forEach(m => {
    if (m.role === 'user') {
      let t = m.content.filter(b => b.type === 'text').map(b => b.text).join('');
      const imgCount = m.content.filter(b => b.type === 'image').length;
      if (imgCount) t += (t ? '\n\n' : '') + `_[${imgCount} image${imgCount > 1 ? 's' : ''} attached — not included in this export]_`;
      if (t) lines.push('**User:**', '', t, '');
    } else {
      m.content.forEach(b => {
        if (b.type === 'text' && b.text) {
          lines.push('**Assistant:**', '', b.text, '');
        } else if (b.type === 'tool_use') {
          const r = results[b.id];
          const status = r ? (r.is_error ? 'error' : 'ok') : 'no result recorded';
          const body = r ? String(r.content).split('\n') : ['(no result recorded)'];
          lines.push(`> 🔧 **${b.name}**(\`${JSON.stringify(b.input)}\`) → ${status}`, '>', '> \`\`\`',
            ...body.map(l => '> ' + l), '> ```', '');
        }
      });
    }
  });

  const slug = String(sess.title || 'chat').replace(/[^a-zA-Z0-9._-]+/g, '_').slice(0, 50);
  const blob = new Blob([lines.join('\n')], {type: 'text/markdown'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `malimite-chat-${id.slice(0, 8)}-${slug}.md`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function chatRenderHistory(messages) {
  const box = document.getElementById('chat-msgs');
  if (!box) return;
  box.innerHTML = '';
  const results = {};
  messages.forEach(m => m.content.forEach(b => { if (b.type === 'tool_result') results[b.tool_use_id] = b; }));
  messages.forEach(m => {
    if (m.role === 'user') {
      const t = m.content.filter(b => b.type === 'text').map(b => b.text).join('');
      const imgs = m.content.filter(b => b.type === 'image');
      let html = t ? chatMd(t) : '';
      if (imgs.length) {
        html += '<div class="chat-msg-images">' + imgs.map(b =>
          `<img src="data:${esc(b.source.media_type)};base64,${b.source.data}" alt="attached image">`
        ).join('') + '</div>';
      }
      if (html) chatAdd('chat-user', html);
    } else {
      const html = m.content.map(b => b.type === 'text' ? chatMd(b.text)
        : b.type === 'tool_use' ? chatToolHtml(b, results[b.id]) : '').join('');
      if (html) chatAdd('chat-ai', html);
    }
  });
  if (!messages.length) chatShowPrompts();
}

function chatShowPrompts() {
  const box = document.getElementById('chat-msgs');
  if (!box) return;
  box.innerHTML = '<div class="chat-hint">Ask about this app. The assistant reads the scan data and can decompile a class on demand.</div>' +
    '<div class="chat-chips">' + CHAT_PROMPTS.map(p => `<button class="btn btn-ghost btn-sm" data-p="${escAttr(p)}">${esc(p)}</button>`).join('') +
    '<button class="btn btn-ghost btn-sm" data-fill="Explain what class ">Explain class …</button></div>';
}

async function tabAssistant(el, id, detail) {
  if (detail.state !== 'done') { el.innerHTML = notReadyHtml(detail, 'The AI Assistant'); return; }
  const st = chatSt(id);
  el.innerHTML = `
    <div class="card chat-card">
      <div class="chat-bar">
        <select id="chat-session" title="Chat session"></select>
        <button class="btn btn-ghost btn-sm" id="chat-rename" title="Rename this chat">Rename</button>
        <button class="btn btn-ghost btn-sm" id="chat-fork" title="Start a new chat that continues from here">Fork</button>
        <button class="btn btn-ghost btn-sm" id="chat-new">New chat</button>
        <button class="btn btn-ghost btn-sm" id="chat-export" title="Download this conversation as Markdown">Export</button>
        <button class="btn btn-ghost btn-sm" id="chat-del">Delete</button>
        <span class="nav-spacer"></span>
        <select id="chat-provider" title="LLM provider" onchange="onChatProviderChange()">
          <option value="">Scan default${detail.llm_provider && detail.llm_provider !== 'none' ? ' (' + esc(detail.llm_provider) + ')' : ''}</option>
          <option value="claude">claude</option><option value="claude-oauth">claude (OAuth)</option><option value="openai">openai</option>
          <option value="deepseek">deepseek</option><option value="ollama">ollama</option>
          <option value="bedrock">bedrock</option><option value="glm">glm</option>
        </select>
        <select id="chat-model-select" hidden title="Model override" onchange="onChatModelSelectChange()"></select>
        <input id="chat-model" placeholder="${escAttr(detail.llm_model || 'model (default)')}" title="Model override"/>
      </div>
      <div id="chat-msgs" class="chat-msgs"></div>
      <div id="chat-err"></div>
      <div id="chat-attachment" class="chat-attachments" hidden></div>
      <div class="chat-input">
        <input type="file" id="chat-file" hidden multiple accept=".txt,.md,.markdown,.log,.csv,.json,.yaml,.yml,.xml,.toml,.ini,.cfg,.properties,.gradle,.py,.js,.jsx,.ts,.tsx,.java,.kt,.swift,.m,.mm,.c,.cpp,.h,.hpp,.go,.rs,.rb,.php,.sh,.sql,.png,.jpg,.jpeg,.webp,.gif"/>
        <button class="btn btn-ghost" id="chat-attach" type="button" title="Attach up to 5 text/code files or images">📎</button>
        <textarea id="chat-in" rows="2" placeholder="Ask about a class, function or behavior… (Enter to send, Shift+Enter for newline)"></textarea>
        <button class="btn btn-primary" id="chat-send">Send</button>
        <button class="btn btn-danger" id="chat-stop" style="display:none">Stop</button>
      </div>
      <div class="chat-note">AI output may be wrong. Decompiled code is untrusted input. Use only on software you are authorized to analyze.</div>
    </div>`;

  const $in = document.getElementById('chat-in');
  // Prefill left by another tab (e.g. Functions tab's "Ask AI Assistant"), consumed once. Fills
  // only — never auto-sends, so a click there never spends LLM quota without the user pressing
  // Enter/Send themselves.
  if (st.prefill) { $in.value = st.prefill; st.prefill = null; }
  const setBusy = b => {
    document.getElementById('chat-send').style.display = b ? 'none' : '';
    document.getElementById('chat-stop').style.display = b ? '' : 'none';
    $in.disabled = b;
  };
  const showErr = m => { const e = document.getElementById('chat-err'); if (e) e.innerHTML = m ? `<div class="alert alert-error">${esc(m)}</div>` : ''; };

  const lsKey = 'malimite.chat.' + id;   // last-open session per scan; best-effort (storage can be blocked)
  const saveSid = sid => { try { sid ? localStorage.setItem(lsKey, sid) : localStorage.removeItem(lsKey); } catch (_) {} };
  const savedSid = () => { try { return localStorage.getItem(lsKey); } catch (_) { return null; } };
  const when = c => { try { return new Date(c * 1000).toLocaleString([], {day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit'}); } catch (_) { return ''; } };

  /* dropdown = "+ New chat" followed by EVERY saved session, so starting a new chat never hides the old ones */
  function renderSessions() {
    const sel = document.getElementById('chat-session');
    if (!sel) return;
    sel.innerHTML = `<option value=""${st.sid ? '' : ' selected'}>＋ New chat</option>` +
      st.sessions.map(s => `<option value="${escAttr(s.id)}"${s.id === st.sid ? ' selected' : ''}>${esc(s.title || 'Untitled')} · ${esc(when(s.created))}</option>`).join('');
    ['chat-del', 'chat-rename', 'chat-fork'].forEach(bid => {
      const b = document.getElementById(bid);
      if (b) b.disabled = !st.sid;
    });
  }

  function startFresh() {
    st.sid = null; st.fresh = true;
    showErr(''); renderSessions(); chatShowPrompts();
  }

  /* sid: open that session; null: keep a pending "new chat" if the user asked for one, else resume
     the last-open (or newest) session. Always refreshes the full list from the server. */
  async function loadSession(sid) {
    let data = await api('/scans/' + id + '/chat');
    st.sessions = data.sessions;
    if (sid === null && st.fresh) { st.sid = null; renderSessions(); if (!document.querySelector('.chat-msg')) chatShowPrompts(); return; }
    const want = [sid, st.sid, savedSid()].find(x => x && st.sessions.some(s => s.id === x)) || (st.sessions[0] && st.sessions[0].id) || null;
    if (!want) { st.sid = null; st.fresh = false; renderSessions(); chatShowPrompts(); return; }
    if (want !== data.session_id) data = await api('/scans/' + id + '/chat?session_id=' + encodeURIComponent(want));
    st.sid = want; st.fresh = false; saveSid(want);
    renderSessions();
    chatRenderHistory(data.messages);
  }

  async function send(text) {
    text = (text || '').trim();
    const files = st.attachedFiles;
    if ((!text && !files.length) || st.busy) return;
    st.busy = true; setBusy(true); showErr('');
    document.querySelectorAll('.chat-hint,.chat-chips').forEach(n => n.remove());
    const savedInput = $in.value;   // restored below if the request is rejected before streaming starts
    const echoEl = chatAddUserEcho(text, files);
    $in.value = '';
    let bubble = null, buf = '', raf = 0, streaming = true;
    const paint = () => {
      raf = 0;
      if (!bubble) return;
      bubble.innerHTML = (bubble.dataset.pre || '') + chatMd(buf) + (streaming ? '<span class="chat-caret" aria-hidden="true"></span>' : '');
      const b = document.getElementById('chat-msgs');
      if (b) b.scrollTop = b.scrollHeight;
    };
    const ensureBubble = () => {
      if (bubble) return;
      bubble = chatAdd('chat-ai', '');
      buf = '';
      progress.keepLast();
    };
    const toolEls = {};

    /* Created as soon as the request goes out, so the wait before the first token is never a
       silent screen. */
    const progress = chatProgressStart();
    const stopStatus = () => {
      streaming = false;
      progress.stop();
      if (raf) cancelAnimationFrame(raf);
      paint();   // drop the caret from the last bubble
    };

    const handle = ev => {
      if (ev.type === 'session') { st.sid = ev.session_id; st.fresh = false; saveSid(st.sid); }
      else if (ev.type === 'token') {
        ensureBubble();
        progress.setPhase('writing');
        buf += ev.text;
        if (!raf) raf = requestAnimationFrame(paint);
      }
      else if (ev.type === 'tool_call') {
        bubble = null; buf = '';  // next text starts a fresh bubble after the tool block
        const d = chatAdd('chat-ai', chatToolHtml(ev, null));
        if (d) {
          d.dataset.args = JSON.stringify(ev.args);
          toolEls[ev.id] = d;
          const det = d.querySelector('details');
          if (det) det.open = true;   // expanded while it runs; collapsed once the result lands
        }
        progress.keepLast();
        progress.setPhase('tool', ev.name);
      } else if (ev.type === 'tool_result') {
        const d = toolEls[ev.id];
        if (d) d.innerHTML = chatToolHtml({id: ev.id, name: ev.name, args: JSON.parse(d.dataset.args || 'null')}, ev);
        progress.setPhase('thinking');   // back to waiting for the model's next step
      } else if (ev.type === 'error') { showErr(ev.message); }
    };
    st.ctrl = new AbortController();
    try {
      const body = {message: text, session_id: st.sid || null,
        attachments: files.map(f => f.kind === 'image'
          ? {kind: 'image', name: f.name, content: f.content, media_type: f.mediaType}
          : {kind: 'text', name: f.name, content: f.content}),
        provider: document.getElementById('chat-provider')?.value || null,
        model: (() => {
          const sel = document.getElementById('chat-model-select');
          if (sel && !sel.hidden && sel.value !== LLM_MODEL_CUSTOM) return sel.value;
          return document.getElementById('chat-model')?.value.trim() || null;
        })()};
      const r = await fetch('/api/v1/scans/' + id + '/chat', {method: 'POST', signal: st.ctrl.signal,
        headers: headers({'Content-Type': 'application/json'}), body: JSON.stringify(body)});
      if (!r.ok) {
        let d = await r.text();
        try { const j = JSON.parse(d); if (j && j.detail != null) d = formatApiErrorDetail(j.detail); } catch (_) {}
        throw new Error(d || r.statusText);
      }
      // Only now — request accepted by the server — is it safe to drop the user's typed text and
      // attachments. Clearing this any earlier (as the single-attachment version of this code did)
      // loses the user's attachments/text on every validation error (wrong provider, too-large
      // file, rate limit, …), forcing them to re-pick files after simply fixing the provider.
      st.attachedFiles = []; renderAttachment();
      const reader = r.body.getReader(), dec = new TextDecoder();
      let sse = '';
      for (;;) {
        const {done, value} = await reader.read();
        if (done) break;
        sse += dec.decode(value, {stream: true});
        let i;
        while ((i = sse.indexOf('\n\n')) >= 0) {
          const chunk = sse.slice(0, i); sse = sse.slice(i + 2);
          if (chunk.startsWith('data: ')) { try { handle(JSON.parse(chunk.slice(6))); } catch (_) {} }
        }
      }
    } catch (e) {
      if (e.name !== 'AbortError') {
        showErr(e.message);
        // The request never reached a successful response, so nothing was persisted server-side —
        // give the user their text and attachments back instead of silently discarding them, and
        // remove the local echo bubble (loadSession()'s own "was anything rendered" check in the
        // finally block below can't tell this stale bubble apart from a real, persisted message).
        if ($in) $in.value = savedInput;
        renderAttachment();
        if (echoEl && echoEl.isConnected) echoEl.remove();
      }
    } finally {
      if (raf) cancelAnimationFrame(raf);
      paint();
      stopStatus();
      st.busy = false; st.ctrl = null;
      if (document.getElementById('chat-in')) { setBusy(false); document.getElementById('chat-in').focus(); }
      loadSession(st.sid).catch(() => {});  // refresh the list/titles; replays what the server persisted
    }
  }

  function renderAttachment() {
    const box = document.getElementById('chat-attachment');
    if (!box) return;
    const files = st.attachedFiles;
    box.hidden = !files.length;
    box.innerHTML = files.map((f, i) => f.kind === 'image'
      ? `<span class="chat-attach-chip" data-idx="${i}">
          <img class="chat-attach-thumb" src="data:${esc(f.mediaType)};base64,${f.content}" alt="">
          ${esc(f.name)} <button type="button" data-remove="${i}" title="Remove attachment">&times;</button></span>`
      : `<span class="chat-attach-chip" data-idx="${i}">📎 ${esc(f.name)} (${f.content.length.toLocaleString()} chars)
          <button type="button" data-remove="${i}" title="Remove attachment">&times;</button></span>`
    ).join('');
    box.querySelectorAll('[data-remove]').forEach(b => {
      b.onclick = () => { st.attachedFiles.splice(Number(b.dataset.remove), 1); renderAttachment(); };
    });
  }

  // DeepSeek-Harness-sized limits: generous per-file text cap, a handful of files per message.
  // Mirrored server-side in Settings.chat_attachment_max_chars/_max_image_bytes/_max_count — the
  // server is the real gate (these are just fast, friendly client-side feedback).
  const MAX_ATTACH_CHARS = 50000;
  const MAX_ATTACH_IMAGE_BYTES = 5 * 1024 * 1024;
  const MAX_ATTACH_COUNT = 5;
  const IMAGE_EXT_MEDIA_TYPE = {png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', webp: 'image/webp', gif: 'image/gif'};

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(String(r.result).split(',', 2)[1] || '');
      r.onerror = () => reject(r.error || new Error('read failed'));
      r.readAsDataURL(file);
    });
  }

  async function addAttachment(file) {
    if (st.attachedFiles.length >= MAX_ATTACH_COUNT) {
      showErr(`You can attach at most ${MAX_ATTACH_COUNT} files per message. Remove one first.`);
      return;
    }
    const ext = (file.name.split('.').pop() || '').toLowerCase();
    const mediaType = file.type && file.type.startsWith('image/') ? file.type : IMAGE_EXT_MEDIA_TYPE[ext];
    if (mediaType) {
      if (file.size > MAX_ATTACH_IMAGE_BYTES) {
        showErr(`"${file.name}" is too large (${file.size.toLocaleString()} bytes, max ${MAX_ATTACH_IMAGE_BYTES.toLocaleString()}). Use a smaller image.`);
        return;
      }
      let b64;
      try { b64 = await fileToBase64(file); }
      catch (err) { showErr('Could not read "' + file.name + '": ' + err.message); return; }
      st.attachedFiles.push({kind: 'image', name: file.name, content: b64, mediaType});
      renderAttachment();
      return;
    }
    let text;
    try { text = await file.text(); }
    catch (err) { showErr('Could not read "' + file.name + '": ' + err.message); return; }
    if (text.length > MAX_ATTACH_CHARS) {
      showErr(`"${file.name}" is too long (${text.length.toLocaleString()} characters, max ${MAX_ATTACH_CHARS.toLocaleString()}). Trim it and try again.`);
      return;
    }
    if (text.includes('\u0000') || (text.match(/�/g) || []).length > text.length * 0.01) {
      showErr(`"${file.name}" does not look like a text file or a supported image type.`);
      return;
    }
    st.attachedFiles.push({kind: 'text', name: file.name, content: text});
    renderAttachment();
  }

  document.getElementById('chat-attach').onclick = () => document.getElementById('chat-file').click();
  document.getElementById('chat-file').onchange = async e => {
    const picked = Array.from(e.target.files || []);
    e.target.value = '';   // lets the same file(s) be re-picked later
    if (!picked.length) return;
    showErr('');
    for (const file of picked) {
      await addAttachment(file);   // sequential: each call's own error must not be clobbered by the next
    }
  };

  document.getElementById('chat-export').onclick = () => exportChat(id, st, detail);

  document.getElementById('chat-send').onclick = () => send($in.value);
  document.getElementById('chat-stop').onclick = () => st.ctrl && st.ctrl.abort();
  $in.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send($in.value); } };
  document.getElementById('chat-msgs').onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.p) send(b.dataset.p);
    else if (b.dataset.fill != null) { $in.value = b.dataset.fill; $in.focus(); }
  };
  document.getElementById('chat-new').onclick = () => { if (!st.busy) startFresh(); };
  document.getElementById('chat-del').onclick = async () => {
    if (st.busy || !st.sid || !confirm('Delete this chat? This cannot be undone.')) return;
    const r = await fetch('/api/v1/scans/' + id + '/chat/' + encodeURIComponent(st.sid), {method: 'DELETE', headers: headers()});
    if (!r.ok && r.status !== 404) { showErr('Could not delete chat: HTTP ' + r.status); return; }
    saveSid(null); st.sid = null; st.fresh = false;
    await loadSession(null);   // falls back to the newest remaining chat, or an empty new chat
  };
  document.getElementById('chat-session').onchange = e => {
    if (st.busy) { renderSessions(); return; }
    if (!e.target.value) startFresh(); else loadSession(e.target.value).catch(err => showErr(err.message));
  };
  document.getElementById('chat-rename').onclick = async () => {
    if (st.busy || !st.sid) return;
    const current = (st.sessions.find(s => s.id === st.sid) || {}).title || '';
    const title = prompt('Rename this chat:', current);
    if (title == null) return;   // cancelled
    const trimmed = title.trim();
    if (!trimmed) { showErr('Title cannot be empty.'); return; }
    try {
      await api('/scans/' + id + '/chat/' + encodeURIComponent(st.sid), {method: 'PATCH',
        headers: {'Content-Type': 'application/json'}, body: JSON.stringify({title: trimmed})});
    } catch (e) { showErr('Could not rename: ' + e.message); return; }
    await loadSession(st.sid);
  };
  document.getElementById('chat-fork').onclick = async () => {
    if (st.busy || !st.sid) return;
    let res;
    try {
      res = await api('/scans/' + id + '/chat/' + encodeURIComponent(st.sid) + '/fork', {method: 'POST'});
    } catch (e) { showErr('Could not fork: ' + e.message); return; }
    saveSid(res.session_id);
    await loadSession(res.session_id);
  };

  setBusy(st.busy);
  try { await loadSession(st.fresh ? null : st.sid); } catch (e) { showErr(e.message); chatShowPrompts(); }
}

/* ── log → human-friendly error reason ── */
function extractErrorReason(log) {
  if (!log) return {reason:'', hint:''};

  // Known patterns ranked by specificity (first match wins)
  const patterns = [
    {
      re: /Cannot run program "[^"]*analyzeHeadless"[\s\S]{0,200}No such file or directory/,
      reason: 'Ghidra is not installed at the configured path — the analyzeHeadless binary itself was never found, so nothing was imported or analyzed. This is unrelated to Java version or OSGi.',
      hint: 'Set <code>GHIDRA_HOME</code> to a real Ghidra installation (must contain <code>support/analyzeHeadless</code>) and restart Malimite.',
    },
    {
      re: /chainedImport.*null|DyldChainedImport\.getName/,
      reason: 'Ghidra Mach-O loader crashed on chained-fixups — a chained import entry has a null target name. This is a known upstream bug in Ghidra (verified present in 12.0.4 and 12.1) triggered by some IPAs built with recent Xcode toolchains.',
      hint: 'There is no clean workaround as of Ghidra 12.1. Options: (a) wait for an upstream fix, (b) re-build the IPA with chained-fixups disabled (linker flag <code>-fixup_chains</code> in some toolchain configs), or (c) skip this app from your scan queue. The CLI now fails fast (~15s) instead of hanging, so retrying gains nothing.',
    },
    {
      re: /DyldChainedFixups[\s\S]{0,200}NullPointerException/,
      reason: 'Ghidra Mach-O loader hit a NullPointerException while processing dyld chained fixups.',
      hint: 'Known Ghidra Mach-O parser issue. See the full log for the specific cause, and check the Ghidra issue tracker for updates.',
    },
    {
      re: /DumpClassData\.java:\d+: error: package org\.json does not exist/,
      reason: 'Ghidra imported the app, but DumpClassData.java failed to compile inside Ghidra: "package org.json does not exist". Stock Ghidra does not ship org.json and gives scripts no third-party classpath. This is not a Java version problem.',
      hint: 'Use a Malimite build whose DumpClassData.java has no org.json dependency: rebuild the CLI jar and the Docker image (<code>mvn -q -DskipTests package -pl core,cli</code> then <code>docker compose -f deploy/web-compose.yml up -d --build</code>), then upload the app again.',
    },
    {
      re: /DumpClassData\.java:\d+: error:/,
      reason: 'Ghidra imported the app, but DumpClassData.java failed to compile inside Ghidra.',
      hint: 'Open the full log and look at the first lines starting with <code>DumpClassData.java:NN: error:</code>. They name the missing symbol or class.',
    },
    {
      re: /osgi\.ee=UNKNOWN/,
      reason: 'Ghidra imported the app, but DumpClassData.java failed to load because Ghidra\'s OSGi script loader does not recognise this Java version (osgi.ee=UNKNOWN) — common with Java 23/25.',
      hint: 'Install Temurin/OpenJDK <strong>21</strong> and set <code>GHIDRA_JAVA_HOME</code> to its home (macOS: <code>$(/usr/libexec/java_home -v 21)</code>), then restart Malimite.',
    },
    {
      re: /GhidraScriptLoadException|ClassNotFoundException: DumpClassData/,
      reason: 'Ghidra imported the app, but DumpClassData.java could not be loaded.',
      hint: 'Check the full log just above <code>GhidraScriptLoadException</code>: compile errors (<code>DumpClassData.java:NN: error:</code>) or an unsupported Java version (<code>osgi.ee=UNKNOWN</code>) are the usual causes.',
    },
    {
      re: /Import succeeded[\s\S]{0,2000}before heartbeat|Post-analysis succeeded[\s\S]{0,2000}before heartbeat|before heartbeat[\s\S]{0,800}post-script likely failed|SCRIPT ERROR: DumpClassData/,
      reason: 'Ghidra imported the binary successfully, but DumpClassData never connected back to Malimite (heartbeat missing). This is a post-script/IPC failure, not a Mach-O parse crash.',
      hint: 'Open the full log and search for <code>SCRIPT ERROR</code> / <code>osgi.ee</code>. Only if you see <code>osgi.ee=UNKNOWN</code> (Java 23/25), switch Ghidra to Java 21 via <code>GHIDRA_JAVA_HOME</code>.',
    },
    {
      re: /Ghidra subprocess exited[\s\S]{0,200}before heartbeat/,
      reason: 'Ghidra exited before our post-script could connect. Often a Mach-O loader crash during import — but if the log also shows Import succeeded, treat it as a DumpClassData/IPC failure instead.',
      hint: 'Check the [ghidra-output] ERROR REPORT lines in the full log for the specific Ghidra exception or DumpClassData stack trace.',
    },
    {
      re: /Ghidra subprocess exited[\s\S]{0,200}before data/,
      reason: 'Ghidra started the post-script but the script died before sending data. Usually a script error or out-of-memory during decompilation.',
      hint: 'Check Ghidra script output and consider raising -Xmx for large binaries.',
    },
    {
      re: /Timed out[\s\S]{0,200}waiting for Ghidra data connection/,
      reason: 'Heartbeat succeeded, but DumpClassData never opened the data connection within 30 minutes. The post-script was likely still in early setup — or hung — before sending CONNECTED (not merely “binary too large”).',
      hint: 'Check [ghidra-output] for DumpClassData progress. After CONNECTED, long Swift decompiles are expected and are no longer limited by the 30-min accept watchdog. If this persists, look for script errors between HEARTBEAT and CONNECTED.',
    },
    {
      re: /Timed out[\s\S]{0,200}waiting for Ghidra heartbeat/,
      reason: 'Ghidra never reached the DumpClassData heartbeat within 30 minutes. Import/analysis may still be running, or Ghidra stalled before the post-script.',
      hint: 'Check [ghidra-output] for import progress or ERROR REPORT. Very large binaries can take a long time to import before the post-script starts.',
    },
    {
      re: /Timed out[\s\S]{0,200}waiting for Ghidra/,
      reason: 'Ghidra ran for the full accept deadline (30 min) without connecting. Binary may still be importing, or the post-script stalled before HEARTBEAT/CONNECTED.',
      hint: 'Check [ghidra-output] for progress. After CONNECTED, payload transfer is not limited by this deadline — exclude noisy libraries via CoreConfig if decompile itself is too slow.',
    },
    {
      re: /Only \.ipa(?:, \.apk(?:,)? or \.xapk| or \.apk)? files|wrong extension|not a valid IPA|not an APK/i,
      reason: 'Uploaded file failed IPA validation.',
      hint: 'Make sure the file is a real `.ipa` (not a renamed .zip) and has at least one .app bundle inside.',
    },
    {
      re: /ANTHROPIC_API_KEY missing|OPENAI_API_KEY missing/,
      reason: 'LLM enrichment was enabled but the corresponding API key was not provided.',
      hint: 'Either provide a valid API key on upload, or disable LLM in the upload form.',
    },
    {
      re: /OutOfMemoryError/,
      reason: 'Java ran out of heap memory during analysis.',
      hint: 'Try a smaller IPA or run the CLI with `-Xmx4g` (or higher) in JAVA_OPTS.',
    },
  ];

  for (const p of patterns) {
    if (p.re.test(log)) return {reason: p.reason, hint: p.hint};
  }

  // Fallback: surface the last "Caused by:" line, or last RuntimeException line
  const causedBy = log.match(/Caused by: [^\n]+/g);
  if (causedBy && causedBy.length) {
    return {reason: causedBy[causedBy.length - 1].trim(), hint: ''};
  }
  const runtimeEx = log.match(/^\S*Exception:[^\n]+/gm);
  if (runtimeEx && runtimeEx.length) {
    return {reason: runtimeEx[runtimeEx.length - 1].trim(), hint: ''};
  }
  return {reason: '(no exception found in log — check full log for context)', hint:''};
}

/* Keeps the running scan's "Live log" panel fed until the scan finishes or the panel goes away. */
async function startLiveLog(id) {
  const box = document.getElementById('live-log');
  if (!box) return;
  try {
    const {lines} = await api('/scans/'+id+'/log?tail=60');
    if (!box.isConnected) return;
    const atBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 20;
    box.textContent = (lines || []).join('\n') || 'Waiting for output…';
    if (atBottom) box.scrollTop = box.scrollHeight;
  } catch (_) { /* transient — keep polling */ }
  setTimeout(() => { if (box.isConnected) startLiveLog(id); }, 3000);
}

/* Entry points arrive as "<ClassName>.<FunctionName>". Android components store FunctionName as
   "<type>:<class>" (so a fully-qualified name repeats), native ones as "native:<lib>/<symbol>",
   iOS ones as "<Class>.<selector>". */
function splitQualified(name) {
  const n = String(name || ''), i = n.lastIndexOf('.');
  return i > 0 ? {short: n.slice(i + 1), pkg: n.slice(0, i)} : {short: n, pkg: ''};
}
function parseEntryPoint(raw) {
  const s = String(raw || '');
  const native = s.match(/^native:([^/]+)\/(.+)$/);
  if (native) return {raw: s, type: 'native', short: native[2], pkg: native[1], member: ''};
  const m = s.match(/^(.*)\.(activity-alias|activity|service|receiver|provider):(.+)$/i);
  if (m) return {raw: s, type: m[2].toLowerCase().replace('-alias', ''), ...splitQualified(m[3] || m[1]), member: ''};
  const colon = s.indexOf(':');
  const dot = s.lastIndexOf('.', colon < 0 ? s.length : colon);
  if (dot > 0) return {raw: s, type: 'method', ...splitQualified(s.slice(0, dot)), member: s.slice(dot + 1)};
  return {raw: s, type: '', short: s, pkg: '', member: ''};
}

function renderEntryPointItem(raw) {
  const ep = typeof raw === 'string' ? parseEntryPoint(raw) : raw;
  return `<div class="ep-row" title="${escAttr(ep.raw)}">
    <span class="ep-badge ${escAttr(ep.type)}">${esc(ep.type || 'entry')}</span>
    <div style="min-width:0">
      <div class="ep-nm">${esc(ep.short)}${ep.member ? `<span class="mem">.${esc(ep.member)}</span>` : ''}</div>
      ${ep.pkg ? `<div class="ep-pk">${esc(ep.pkg)}</div>` : ''}
    </div>
  </div>`;
}

async function postSummaryHydrate(id) {

/* ── functions tab: JADX-GUI-style file tree + source viewer ──
   State is kept across tab switches for the same scan (fnSt.id === id) so the user doesn't
   lose open files/scroll position by flipping to another tab and back; switching to a
   different scan rebuilds it from scratch. */
let fnSt = null;
// A class to auto-open the next time the Functions tab renders, left by another tab (e.g. the
// Vulnerabilities tab's "View in Functions" link) before calling goTab — same reasoning as
// chatSt(id).prefill: nothing reaches into this tab's DOM directly, so goTab's lack of an await
// never matters here.
let fnPendingOpen = null;

function fnIsAndroid(detail) {
  return String(detail.platform||'').toUpperCase() === 'ANDROID';
}

// Android: ClassName is a dotted package ("com.foo.Bar"); inner classes ("Bar$Inner") become
// leaves nested under their outer class. iOS/Mach-O class names carry no such path convention,
// so the tree falls back to a flat sorted list rather than fabricating a fake hierarchy.
function fnBuildTree(classNames, detail) {
  if (!fnIsAndroid(detail)) return {flat: true, items: classNames.slice().sort((a,b)=>a.localeCompare(b))};
  const root = {children: {}};
  for (const full of classNames) {
    const dotParts = full.split('.');
    const parts = dotParts.flatMap((seg,i) => i === dotParts.length-1 ? seg.split('$') : [seg]);
    let node = root;
    for (let i = 0; i < parts.length; i++) {
      node = node.children[parts[i]] || (node.children[parts[i]] = {children: {}});
      if (i === parts.length-1) node.className = full;
    }
  }
  return {flat: false, root};
}

function fnLanguageFor(origin, detail) {
  const o = String(origin||'').toUpperCase();
  if (o === 'ASC' || o === 'JADX') return 'java';
  if (String(detail.platform||'').toUpperCase() === 'IOS') return detail.is_swift ? 'swift' : 'objectivec';
  return 'cpp';
}

async function tabFunctions(el, id, detail) {
  if (detail.state !== 'done') { el.innerHTML = notReadyHtml(detail, 'Decompiled functions'); return; }
  if (!fnSt || fnSt.id !== id) {
    el.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
    let classes;
    try {
      const rows = await api('/scans/'+id+'/classes?'+new URLSearchParams({limit: 200000}));
      classes = rows.map(r => r.class);
    } catch(e) {
      el.innerHTML = `<div class="alert alert-error">${esc(e.message)}</div>`;
      return;
    }
    fnSt = {id, detail, classes, query: '', tree: fnBuildTree(classes, detail),
            openFiles: [], activePath: null, classSevMap: null};
    fnLoadSeverityMap(id);   // background; dots fill in once this resolves
    try {
      const savedW = localStorage.getItem('malimite.fnTreeWidth');
      if (savedW) document.documentElement.style.setProperty('--fn-tree-w', savedW + 'px');
    } catch(e) { /* per-viewer convenience only */ }
  }
  fnRenderShell(el);
  if (fnPendingOpen) {
    const target = fnPendingOpen;
    fnPendingOpen = null;
    fnOpenClass(target);
  }
}

function fnRenderShell(el) {
  el.innerHTML = `
    <div class="fn-wrap">
      <div class="fn-tree-pane" id="fn-tree-pane">
        <div class="fn-tree-search"><input id="fn-filter" type="text" placeholder="Filter classes…" autocomplete="off"/></div>
        <div class="fn-tree-list" id="fn-tree-list"></div>
      </div>
      <div class="fn-drag-handle" id="fn-drag-handle"></div>
      <div class="fn-tree-backdrop" id="fn-tree-backdrop" onclick="fnCloseDrawer()"></div>
      <div class="fn-viewer-pane">
        <div class="fn-open-tabs" id="fn-open-tabs"></div>
        <div id="fn-viewer-body" class="fn-viewer-body"></div>
      </div>
    </div>
    <button class="btn btn-ghost btn-sm fn-drawer-toggle" id="fn-drawer-toggle" onclick="fnOpenDrawer()">
      ☰ Classes (${fnSt.classes.length.toLocaleString()})
    </button>`;
  document.getElementById('fn-filter').value = fnSt.query;
  document.getElementById('fn-filter').addEventListener('input', ev => {
    fnSt.query = ev.target.value.trim().toLowerCase();
    fnRenderTree();
  });
  fnWireDragHandle();
  fnRenderTree();
  fnRenderOpenTabs();
  fnRenderViewer();
}

// Drag-resize the tree pane. A no-op above/below the breakpoint where the media query takes over
// the tree's width for the drawer layout — nothing here conflicts with that.
function fnWireDragHandle() {
  const handle = document.getElementById('fn-drag-handle');
  const pane = document.getElementById('fn-tree-pane');
  if (!handle || !pane) return;
  handle.addEventListener('mousedown', ev => {
    ev.preventDefault();
    handle.classList.add('dragging');
    const startX = ev.clientX;
    const startW = pane.getBoundingClientRect().width;
    const onMove = mv => {
      const w = Math.max(180, Math.min(520, startW + (mv.clientX - startX)));
      document.documentElement.style.setProperty('--fn-tree-w', w + 'px');
    };
    const onUp = () => {
      handle.classList.remove('dragging');
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      try {
        const w = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--fn-tree-w'));
        if (w) localStorage.setItem('malimite.fnTreeWidth', w);
      } catch(e) { /* per-viewer convenience only */ }
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
}

window.fnOpenDrawer = function() {
  document.getElementById('fn-tree-pane')?.classList.add('open');
  document.getElementById('fn-tree-backdrop')?.classList.add('open');
};
window.fnCloseDrawer = function() {
  document.getElementById('fn-tree-pane')?.classList.remove('open');
  document.getElementById('fn-tree-backdrop')?.classList.remove('open');
};

function fnMakeLeafRow(className, depth = 0) {
  const row = document.createElement('div');
  row.className = 'fn-tree-node';
  row.dataset.class = className;
  if (depth > 0) row.style.paddingLeft = (0.5 + depth * 0.9) + 'rem';
  const label = document.createElement('span');
  label.className = 'fn-tree-label';
  label.textContent = fnSt.tree.flat ? className : className.split(/[.$]/).pop();
  row.title = className;
  row.appendChild(label);
  row.addEventListener('click', () => fnOpenClass(className, row));
  return row;
}

// Lazy: a folder's children are only built into the DOM the first time it's expanded — cheap
// even for a scan with tens of thousands of classes (confirmed against a real 30k-class app).
function fnBuildNodeRow(key, node, depth) {
  const hasChildren = Object.keys(node.children).length > 0;
  if (!hasChildren) return fnMakeLeafRow(node.className, depth);

  const frag = document.createDocumentFragment();
  const row = document.createElement('div');
  row.className = 'fn-tree-node fn-tree-folder';
  row.style.paddingLeft = (0.5 + depth*0.9) + 'rem';
  const arrow = document.createElement('span');
  arrow.className = 'fn-tree-arrow';
  arrow.textContent = '▸';
  row.appendChild(arrow);
  const label = document.createElement('span');
  label.className = 'fn-tree-label';
  label.textContent = key;
  if (node.className) {   // a class that also has inner classes: label opens it, row toggles the folder
    label.dataset.class = node.className;
    label.style.cursor = 'pointer';
    label.title = node.className;
    label.addEventListener('click', ev => { ev.stopPropagation(); fnOpenClass(node.className, label); });
  }
  row.appendChild(label);

  const childrenWrap = document.createElement('div');
  childrenWrap.className = 'fn-tree-children';
  childrenWrap.hidden = true;
  row.addEventListener('click', () => {
    const opening = childrenWrap.hidden;
    if (opening && !childrenWrap.dataset.built) {
      childrenWrap.appendChild(fnBuildChildren(node, depth+1));
      childrenWrap.dataset.built = '1';
      fnApplySeverityDots();
    }
    childrenWrap.hidden = !opening;
    arrow.textContent = opening ? '▾' : '▸';
  });

  frag.appendChild(row);
  frag.appendChild(childrenWrap);
  return frag;
}

function fnBuildChildren(node, depth) {
  const frag = document.createDocumentFragment();
  const keys = Object.keys(node.children).sort((a,b) => {
    const aFolder = Object.keys(node.children[a].children).length > 0;
    const bFolder = Object.keys(node.children[b].children).length > 0;
    if (aFolder !== bFolder) return aFolder ? -1 : 1;   // folders first, then leaves, alphabetic within each
    return a.localeCompare(b);
  });
  for (const key of keys) frag.appendChild(fnBuildNodeRow(key, node.children[key], depth));
  return frag;
}

const FN_FILTER_CAP = 500;   // filtered results render as a flat list (pruning the real tree to only
                              // matching branches is a nicer v1.1; a flat cap is simpler and correct for v1)

function fnRenderTree() {
  const list = document.getElementById('fn-tree-list');
  if (!list) return;
  list.innerHTML = '';
  const q = fnSt.query;
  if (q || fnSt.tree.flat) {
    const pool = fnSt.tree.flat ? fnSt.tree.items : fnSt.classes.slice().sort((a,b)=>a.localeCompare(b));
    const filtered = q ? pool.filter(c => c.toLowerCase().includes(q)) : pool;
    if (!filtered.length) { list.innerHTML = '<div class="empty" style="padding:.75rem">No classes match.</div>'; return; }
    const frag = document.createDocumentFragment();
    for (const cls of filtered.slice(0, FN_FILTER_CAP)) frag.appendChild(fnMakeLeafRow(cls));
    list.appendChild(frag);
    if (filtered.length > FN_FILTER_CAP) {
      const more = document.createElement('div');
      more.className = 'empty';
      more.style.padding = '.5rem';
      more.textContent = `…and ${(filtered.length-FN_FILTER_CAP).toLocaleString()} more — refine your filter`;
      list.appendChild(more);
    }
  } else {
    list.appendChild(fnBuildChildren(fnSt.tree.root, 0));
  }
  fnApplySeverityDots();
}

async function fnOpenClass(className, rowEl) {
  document.querySelectorAll('#fn-tree-list .fn-tree-node.active').forEach(r => r.classList.remove('active'));
  rowEl?.classList.add('active');
  fnCloseDrawer();
  const existing = fnSt.openFiles.find(f => f.class === className);
  if (existing) { fnSt.activePath = className; fnRenderOpenTabs(); fnRenderViewer(); return; }

  fnSt.activePath = className;
  fnRenderOpenTabs();
  fnRenderViewer('loading');
  let rows;
  try {
    rows = await api('/scans/'+fnSt.id+'/source?'+new URLSearchParams({class_name: className}));
  } catch(e) {
    if (fnSt.activePath === className) fnRenderViewer('error', e.message);
    return;
  }
  if (fnSt.activePath !== className) return;   // user clicked elsewhere while this was in flight
  let file;
  if (!rows.length) {
    file = {class: className, code: null};
  } else {
    // Outline only when there's more than one row — that's the only case where we actually have a
    // per-function boundary (typically Ghidra origin). A single '<class>' row is one opaque text
    // blob as far as our data model goes; guessing method boundaries there with a regex would be a
    // fragile heuristic, so outline is simply not offered rather than risking a wrong jump target.
    let code = '';
    const outline = rows.length > 1 ? [] : null;
    rows.forEach((r, i) => {
      if (i > 0) code += '\n\n';
      if (outline) outline.push({name: r.function, line: code.split('\n').length});
      code += `// ${r.class}.${r.function} [${r.origin}]\n${r.code||''}`;
    });
    file = {class: className, code, language: fnLanguageFor(rows[0].origin, fnSt.detail), outline};
  }
  fnCommitFile(file);
}

// On-demand decompile for Android classes with nothing stored yet (asc/jadx only — ghidra native
// targets need a symbol/address picker this tree doesn't have, and stay chat-only).
async function fnDecompileNow(className, tool) {
  fnRenderViewer('loading');
  let data;
  try {
    const r = await fetch(`/api/v1/scans/${fnSt.id}/decompile`, {
      method: 'POST', headers: {...headers(), 'Content-Type': 'application/json'},
      body: JSON.stringify({tool, target: className}),
    });
    if (!r.ok) { const txt = await r.text(); throw new Error(txt); }
    data = await r.json();
  } catch(e) {
    if (fnSt.activePath === className) fnRenderViewer('error', e.message);
    return;
  }
  if (fnSt.activePath !== className) return;
  fnCommitFile({class: className, code: data.code, language: fnLanguageFor(tool, fnSt.detail), outline: null});
}

// New files (fresh fetch, fresh decompile) go through here; switching to an already-open tab does
// not — see fnRenderOpenTabs's own click handler.
function fnCommitFile(file) {
  fnSt.openFiles = fnSt.openFiles.filter(f => f.class !== file.class);
  fnSt.openFiles.push(file);
  if (fnSt.openFiles.length > 12) fnSt.openFiles.shift();   // simple FIFO cap on open tabs
  fnSt.activePath = file.class;
  fnRenderOpenTabs();
  fnRenderViewer();
}

function fnRenderOpenTabs() {
  const el = document.getElementById('fn-open-tabs');
  if (!el) return;
  if (!fnSt.openFiles.length) { el.innerHTML = ''; return; }
  el.innerHTML = fnSt.openFiles.map(f => `
    <div class="fn-open-tab${f.class===fnSt.activePath?' active':''}" data-class="${escAttr(f.class)}" title="${escAttr(f.class)}">
      <span class="fn-open-tab-label">${esc(f.class.split(/[.$]/).pop())}</span>
      <span class="fn-open-tab-close" data-close="${escAttr(f.class)}">×</span>
    </div>`).join('');
  el.querySelectorAll('.fn-open-tab').forEach(tabEl => tabEl.addEventListener('click', ev => {
    if (ev.target.closest('.fn-open-tab-close')) return;
    fnSt.activePath = tabEl.dataset.class;
    fnRenderOpenTabs();
    fnRenderViewer();
  }));
  el.querySelectorAll('.fn-open-tab-close').forEach(closeEl => closeEl.addEventListener('click', ev => {
    ev.stopPropagation();
    const cls = closeEl.dataset.close;
    fnSt.openFiles = fnSt.openFiles.filter(f => f.class !== cls);
    if (fnSt.activePath === cls) fnSt.activePath = fnSt.openFiles.at(-1)?.class || null;
    fnRenderOpenTabs();
    fnRenderViewer();
  }));
}

function fnRenderViewer(mode, errMsg) {
  const el = document.getElementById('fn-viewer-body');
  if (!el) return;
  if (mode === 'loading') { el.innerHTML = '<div class="loading"><div class="spinner"></div></div>'; return; }
  if (mode === 'error') { el.innerHTML = `<div class="alert alert-error">${esc(errMsg||'Failed to load source.')}</div>`; return; }
  const file = fnSt.activePath ? fnSt.openFiles.find(f => f.class === fnSt.activePath) : null;
  if (!file) { el.innerHTML = '<div class="empty" style="padding:2rem">Select a class from the tree to view its decompiled source.</div>'; return; }
  if (file.code === null) {
    const isAndroid = String(fnSt.detail.platform||'').toUpperCase() === 'ANDROID';
    el.innerHTML = isAndroid
      ? `<div class="empty" style="padding:2rem">No stored decompiled code for <code>${esc(file.class)}</code>.<br/>
          <button class="btn btn-sm" id="fn-dec-jadx" style="margin-top:.75rem">Decompile with JADX</button>
          <button class="btn btn-ghost btn-sm" id="fn-dec-asc">try ASC instead</button></div>`
      : `<div class="empty" style="padding:2rem">No stored decompiled code for <code>${esc(file.class)}</code>.<br/>
          Use the <code>decompile</code> tool in the <a href="#" onclick="event.preventDefault();goTab(${JSON.stringify(fnSt.id)},'assistant')">AI Assistant</a> tab to decompile it on demand.</div>`;
    if (isAndroid) {
      document.getElementById('fn-dec-jadx').onclick = () => fnDecompileNow(file.class, 'jadx');
      document.getElementById('fn-dec-asc').onclick = () => fnDecompileNow(file.class, 'asc');
    }
    return;
  }
  const lineCount = file.code.split('\n').length;
  const outlineHtml = file.outline ? `
    <details class="fn-outline"><summary>Outline (${file.outline.length})</summary>
      <div class="fn-outline-list">${file.outline.map(o =>
        `<div class="fn-outline-item" data-line="${o.line}">${esc(o.name)}</div>`).join('')}</div>
    </details>` : '';
  el.innerHTML = `
    <div class="fn-breadcrumb">
      <span>${esc(file.class)}</span>
      <span class="fn-breadcrumb-actions">
        ${outlineHtml}
        <button class="btn btn-ghost btn-sm" id="fn-ask-btn">Ask AI Assistant</button>
        <button class="btn btn-ghost btn-sm" id="fn-copy-btn">Copy</button>
      </span>
    </div>
    <div class="fn-code-scroll">
      <pre class="fn-gutter">${Array.from({length:lineCount},(_,i)=>i+1).join('\n')}</pre>
      <pre class="fn-code-pre"><code id="fn-code-el" class="hljs"></code></pre>
    </div>`;
  if (file.outline) {
    el.querySelectorAll('.fn-outline-item').forEach(item => item.addEventListener('click', () => {
      fnScrollToLine(+item.dataset.line);
      item.closest('details').open = false;
    }));
  }
  document.getElementById('fn-ask-btn').onclick = () => {
    chatSt(fnSt.id).prefill = 'Explain the class ' + file.class;
    goTab(fnSt.id, 'assistant');
  };
  const codeEl = document.getElementById('fn-code-el');
  // hljs.highlight() escapes its own output while emitting <span> tokens — it must receive the
  // RAW string. Never pre-escape with esc() first (that double-escapes), and never fall back to
  // innerHTML with raw text (decompiled code can contain attacker-influenced strings).
  try {
    if (file.language && window.hljs && hljs.getLanguage(file.language)) {
      codeEl.innerHTML = hljs.highlight(file.code, {language: file.language, ignoreIllegals: true}).value;
    } else {
      codeEl.textContent = file.code;
    }
  } catch(e) { codeEl.textContent = file.code; }
  document.getElementById('fn-copy-btn').onclick = () => { navigator.clipboard?.writeText(file.code).catch(()=>{}); };
}

function fnScrollToLine(line) {
  const codeEl = document.getElementById('fn-code-el');
  const scrollEl = document.querySelector('.fn-code-scroll');
  const file = fnSt?.activePath ? fnSt.openFiles.find(f => f.class === fnSt.activePath) : null;
  if (!codeEl || !scrollEl || !file) return;
  // Measured from the rendered element rather than hardcoded from our own CSS line-height, so it
  // stays correct even if the browser's actual font metrics differ slightly from what we asked for.
  const pxPerLine = codeEl.getBoundingClientRect().height / file.code.split('\n').length;
  scrollEl.scrollTop = Math.max(0, (line - 1) * pxPerLine - 40);
}

async function fnLoadSeverityMap(id) {
  let rows;
  try { rows = await api('/scans/'+id+'/vulnerabilities'); } catch(e) { return; }
  if (!fnSt || fnSt.id !== id) return;
  const order = {CRITICAL:0,HIGH:1,MEDIUM:2,LOW:3};
  const map = {};
  for (const r of rows) {
    if (r.affected_type !== 'FUNCTION' || !r.evidence_location || r.is_false_positive) continue;
    const i = String(r.evidence_location).lastIndexOf('.');
    if (i < 0) continue;
    const cls = r.evidence_location.slice(0, i);
    const sev = String(r.effective_severity || r.severity || '').toUpperCase();
    if (!(sev in order)) continue;
    if (!(cls in map) || order[sev] < order[map[cls]]) map[cls] = sev;
  }
  fnSt.classSevMap = map;
  fnApplySeverityDots();
}

function fnApplySeverityDots() {
  if (!fnSt?.classSevMap) return;
  document.querySelectorAll('#fn-tree-list [data-class]').forEach(elNode => {
    const label = elNode.classList.contains('fn-tree-label') ? elNode : elNode.querySelector('.fn-tree-label');
    const sev = fnSt.classSevMap[elNode.dataset.class];
    if (!label || !sev || label.querySelector('.fn-tree-sev')) return;
    const dot = document.createElement('span');
    dot.className = 'fn-tree-sev ' + sev;
    label.prepend(dot);
  });
}

async function loadStrings(root, id, state) {
  const table = root.querySelector('#str-table');
  const pager = root.querySelector('#str-pages');
  if (!table || !pager) return;
  const requestSeq = ++stringsRequestSeq;
  table.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
  pager.innerHTML = '';
  try {
    const params = new URLSearchParams({page:state.page, size:state.size});
    if (state.query) params.set('q', state.query);
    const data = await api('/scans/'+id+'/strings?'+params);
    if (requestSeq !== stringsRequestSeq || !root.isConnected
        || root !== document.getElementById('strings-root')) return;

    const items = Array.isArray(data.items) ? data.items : [];
    const total = Math.max(0, Number(data.total) || 0);
    const page = Math.max(1, Number(data.page) || 1);
    const size = Math.max(1, Number(data.size) || state.size);
    const pages = Math.max(0, Number(data.pages) || 0);
    state.page = page;

    table.innerHTML = items.length
      ? `<div class="tbl-wrap"><table class="strings-table">
          <thead><tr><th>Address</th><th>Value</th><th>Segment</th><th>Label</th></tr></thead>
          <tbody>${items.map(s=>`<tr>
            <td class="mono">${esc(s.address||'')}</td>
            <td class="truncate" title="${escAttr(s.value||'')}">${esc(s.value||'')}</td>
            <td>${esc(s.segment||'')}</td>
            <td>${esc(s.label||'')}</td>
          </tr>`).join('')}</tbody>
        </table></div>`
      : '<div class="empty">No strings found.</div>';

    const first = items.length ? (page - 1) * size + 1 : 0;
    const last = items.length ? first + items.length - 1 : 0;
    pager.innerHTML = `<span>Showing ${esc(String(first))}–${esc(String(last))} of ${esc(total.toLocaleString())} · Page ${esc(String(pages ? page : 0))} of ${esc(String(pages))}</span>
      <span class="strings-pagination-actions">
        <button class="page-btn" data-page="prev" ${page <= 1 ? 'disabled' : ''}>Previous</button>
        <button class="page-btn" data-page="next" ${pages === 0 || page >= pages ? 'disabled' : ''}>Next</button>
      </span>`;
    pager.querySelector('[data-page="prev"]').onclick = () => {
      if (state.page > 1) { state.page--; loadStrings(root, id, state); }
    };
    pager.querySelector('[data-page="next"]').onclick = () => {
      if (state.page < pages) { state.page++; loadStrings(root, id, state); }

  } catch(e) {
    if (requestSeq === stringsRequestSeq && root.isConnected
        && root === document.getElementById('strings-root')) {
      table.innerHTML=`<div class="alert alert-error">${esc(e.message)}</div>`;
    }
  }
}

/* ── entry points tab ── */
const EP_TYPE_ORDER = ['activity', 'service', 'receiver', 'provider', 'native', 'method', ''];
async function tabEntryPoints(el, id, detail) {
  if (detail.state !== 'done') { el.innerHTML = notReadyHtml(detail, 'Detected entry points'); return; }
  const pageSize = 50;
  const root = document.createElement('div');
  root.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
  el.replaceChildren(root);
  try {
    const raw = await api('/scans/'+id+'/entrypoints');
    if (!root.isConnected || !el.contains(root)) return;
    if (!raw.length) {
      root.innerHTML = `<div class="panel"><div class="empty-state"><div class="es-ico">${ico('logIn')}</div>
        <strong>No entry points detected</strong>Exported components and native entry symbols appear here when found.</div></div>`;
      return;
    }
    const eps = raw.map(parseEntryPoint)
      .sort((a, b) => EP_TYPE_ORDER.indexOf(a.type) - EP_TYPE_ORDER.indexOf(b.type) || a.short.localeCompare(b.short));
    const types = EP_TYPE_ORDER.filter(t => eps.some(e => e.type === t));
    let page = 1, query = '', type = 'all';
    root.innerHTML = `
      <div class="toolbar" style="margin-bottom:.9rem">
        <label class="search-ctl">${ico('scanSearch')}
          <input id="ep-filter" class="ctl" type="search" placeholder="Filter by class, package or member…" autocomplete="off" aria-label="Filter entry points"/></label>
        ${types.length > 1 ? '<div class="seg" id="ep-seg" role="group" aria-label="Filter by type"></div>' : ''}
      </div>
      <section class="panel">
        <div class="result-line" style="margin-bottom:.35rem"><span id="ep-count"></span></div>
        <div class="ep-rows" id="ep-full-list"></div>
        <div class="pager" id="ep-pages"></div>
      </section>`;

    const renderPage = () => {
      if (!root.isConnected || !el.contains(root)) return;
      const filtered = eps.filter(e => (type === 'all' || e.type === type)
        && (!query || `${e.raw} ${e.type}`.toLowerCase().includes(query)));
      const pages = Math.max(1, Math.ceil(filtered.length / pageSize));
      page = Math.min(Math.max(1, page), pages);
      const items = filtered.slice((page - 1) * pageSize, page * pageSize);
      const seg = root.querySelector('#ep-seg');
      if (seg) seg.innerHTML = segHtml('eptype', type, [['all', 'All', eps.length],
        ...types.map(t => [t, t ? t.charAt(0).toUpperCase() + t.slice(1) : 'Other', eps.filter(e => e.type === t).length])]);
      root.querySelector('#ep-count').textContent = (query || type !== 'all')
        ? `${filtered.length.toLocaleString()} of ${eps.length.toLocaleString()} entry points`
        : `${eps.length.toLocaleString()} entry points`;
      root.querySelector('#ep-full-list').innerHTML = items.length ? items.map(renderEntryPointItem).join('')
        : `<div class="empty-state"><div class="es-ico">${ico('scanSearch')}</div><strong>No matches</strong>No entry points match this filter.</div>`;
      root.querySelector('#ep-pages').innerHTML = pagerHtml(page, pages, filtered.length, pageSize, 'epage');
    };
    root.addEventListener('click', ev => {
      const b = ev.target.closest('button');
      if (!b || b.disabled) return;
      if (b.dataset.eptype) { type = b.dataset.eptype; page = 1; }
      else if (b.dataset.epage) page = Number(b.dataset.epage);
      else return;
      renderPage();
    });
    root.querySelector('#ep-filter').addEventListener('input', event => {
      query = event.target.value.trim().toLowerCase();
      page = 1;
      renderPage();
    });
    renderPage();
  } catch(e) {
    if (root.isConnected && el.contains(root)) {
      root.innerHTML=`<div class="alert alert-error">${esc(e.message)}</div>`;
    }
  }
}

function assessStatusBadge(s) {
  const u = String(s||'UNKNOWN').toUpperCase();
  const bg = u === 'PRESENT' ? '#dcfce7;color:#16a34a' : u === 'PARTIAL' ? '#fef3c7;color:#d97706'
    : u === 'ABSENT' ? '#fee2e2;color:#dc2626' : '#f3f4f6;color:#6b7280';
  return `<span class="badge" style="background:${bg.split(';')[0]};${bg.includes('color')?bg.split(';').slice(1).join(';'):''}">${esc(u)}</span>`;
}

function assessGuide(a) {
  const label = a.title || a.control_id || 'this control';
  const summary = fieldOr(a.summary,
    `Inventories whether “${label}” appears implemented in this build. Absence of static signals does not prove the control is missing on packed or heavily obfuscated apps.`);
  const staticChecks = Array.isArray(a.static_checks) && a.static_checks.length ? a.static_checks : [
    'Search decompiled code (JADX for Android, Ghidra/Hopper for iOS) for APIs and types related to this control.',
    'Search strings, resources, and the manifest or Info.plist for related flags, permissions, and configuration values.',
    'Cross-check hits against third-party libraries so SDK noise is not mistaken for app-level enforcement.',
  ];
  const dynamicChecks = Array.isArray(a.dynamic_checks) && a.dynamic_checks.length ? a.dynamic_checks : [
    'On an authorized test device, exercise the related user flow and record whether the protection is actually enforced at runtime.',
    'Compare behavior on a stock device versus a lab device where the condition this control is meant to detect is present.',
    'Document observed prompts, errors, or degraded functionality. Do not use this as a bypass or exploit recipe.',
  ];
  return {summary, staticChecks, dynamicChecks};
}

function renderAssessSteps(steps) {

function renderAssessDrawerBody(a) {
