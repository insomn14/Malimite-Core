<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Malimite — IPA Scanner</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f8f9fb;--surface:#fff;--border:#e2e4e9;--text:#1a1d23;
  --muted:#6b7280;--accent:#5571f7;--accent-h:#3d56e0;
  --high:#dc2626;--medium:#d97706;--low:#2563eb;--info:#6b7280;
  --green:#16a34a;--red:#dc2626;--yellow:#ca8a04;
  --radius:8px;--shadow:0 1px 3px rgba(0,0,0,.08);
}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}

/* nav */
nav{background:var(--surface);border-bottom:1px solid var(--border);padding:0 1.5rem;display:flex;align-items:center;gap:1rem;height:52px;position:sticky;top:0;z-index:100}
.nav-logo{font-weight:700;font-size:1.1rem;color:var(--text);display:flex;align-items:center;gap:.4rem}
.nav-logo svg{width:22px;height:22px}
nav a.nav-link{color:var(--muted);font-size:.875rem;padding:.25rem .5rem;border-radius:4px}
nav a.nav-link:hover,nav a.nav-link.active{color:var(--text);background:var(--bg)}
.nav-spacer{flex:1;min-width:0}
.nav-apikey{display:flex;align-items:center;gap:.5rem;min-width:0;font-size:.8rem;color:var(--muted)}
.nav-apikey input{min-width:0;padding:.3rem .5rem;border:1px solid var(--border);border-radius:4px;font-size:.8rem;width:160px;max-width:100%}
@media(max-width:900px){
  nav{height:auto;min-height:52px;flex-wrap:wrap;padding:.55rem 1.5rem}
  .nav-spacer{display:none}
  .nav-apikey{margin-left:auto}
}
@media(max-width:520px){
  nav{gap:.4rem .75rem;padding:.55rem 1rem}
  .nav-apikey{width:100%;margin-left:0}
  .nav-apikey input{flex:1;width:auto}
}

/* layout */
main{width:100%;max-width:1100px;min-width:0;margin:0 auto;padding:1.5rem}
main>*,#tab-content{min-width:0;max-width:100%}

/* cards */
.card{min-width:0;max-width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:1.25rem}
.card + .card{margin-top:1rem}
.card-title{min-width:0;font-weight:600;font-size:.95rem;margin-bottom:.75rem;display:flex;align-items:center;gap:.5rem}

/* grid */
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem}
.grid-4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.75rem}
.grid-2>*,.grid-3>*,.grid-4>*{min-width:0;max-width:100%}
@media(max-width:900px){
  .grid-2{grid-template-columns:1fr}
  .grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:640px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}}

/* stat tile */
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:.9rem 1.1rem}
.stat-val{font-size:1.6rem;font-weight:700;line-height:1}
.stat-label{font-size:.75rem;color:var(--muted);margin-top:.25rem}
.stat-sub{font-size:.65rem;color:var(--muted);margin-top:.2rem;opacity:.85}

/* upload */
.drop-zone{border:2px dashed var(--border);border-radius:var(--radius);padding:3rem;text-align:center;cursor:pointer;transition:all .15s}
.drop-zone:hover,.drop-zone.drag-over{background:#f0f3ff;border-color:var(--accent)}
.drop-zone p{color:var(--muted);font-size:.9rem;margin-top:.5rem}
.drop-file-btn{display:inline-block;margin-top:.8rem;padding:.5rem 1.2rem;background:var(--accent);color:#fff;border-radius:var(--radius);font-weight:600;cursor:pointer;font-size:.875rem}
.drop-file-btn:hover{background:var(--accent-h)}
input[type=file]{display:none}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.45rem .9rem;border-radius:var(--radius);font-size:.8rem;font-weight:600;cursor:pointer;border:none;transition:background .12s}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent-h)}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}.btn-ghost:hover{background:var(--bg)}
.btn-danger{background:#fee2e2;color:var(--red)}.btn-danger:hover{background:#fecaca}
.btn-sm{padding:.3rem .65rem;font-size:.75rem}

/* badges */
.badge{display:inline-block;padding:.15rem .5rem;border-radius:999px;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.badge-queued{background:#f3f4f6;color:var(--muted)}
.badge-running{background:#fef3c7;color:var(--yellow)}
.badge-done{background:#dcfce7;color:var(--green)}
.badge-error{background:#fee2e2;color:var(--red)}
.badge-critical{background:#fce7f3;color:#9d174d;border:1px solid #f9a8d4}
.badge-high{background:#fee2e2;color:var(--high)}
.badge-medium{background:#fef3c7;color:var(--medium)}
.badge-low{background:#dbeafe;color:var(--low)}
.badge-info{background:#f3f4f6;color:var(--info)}
.badge-ios{background:#e0e7ff;color:#3730a3}
.badge-android{background:#dcfce7;color:#166534}

/* vulnerability cards */
.vuln-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:.75rem;overflow:hidden}
.vuln-head{display:flex;align-items:center;gap:.75rem;padding:.75rem 1rem;cursor:pointer;user-select:none;transition:background .1s}
.vuln-head:hover{background:var(--bg)}
.vuln-head-l{display:flex;align-items:center;gap:.6rem;flex:1;min-width:0;flex-wrap:wrap}
.vuln-head-r{display:flex;align-items:center;gap:.6rem;font-size:.72rem;color:var(--muted)}
.vuln-id{font-size:.72rem;color:var(--muted);font-weight:600}
.vuln-title{font-weight:600;font-size:.88rem;color:var(--text);flex:1;min-width:0}
.vuln-cvss{font-size:.72rem;font-weight:700;color:var(--muted);background:var(--bg);padding:.1rem .45rem;border-radius:4px}
.vuln-cat{padding:.1rem .5rem;background:var(--bg);border-radius:4px;font-weight:600}
.vuln-chev{font-size:.75rem;color:var(--muted)}
.vuln-body{padding:0 1rem 1rem;border-top:1px solid var(--border)}
.vuln-section{margin-top:1rem}
.vuln-section p{font-size:.85rem;line-height:1.55;color:var(--text)}
.vuln-section-title{font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.4rem}
.vuln-code,.vuln-poc{background:#111;color:#e2e8f0;padding:.65rem .85rem;border-radius:6px;font-family:monospace;font-size:.72rem;white-space:pre-wrap;word-break:break-word;max-height:300px;overflow-y:auto}
.vuln-poc{background:#0c1a2b;color:#bcd9ff}

/* triage editor */
.vuln-card.is-fp{opacity:.55}
.vuln-card.is-fp .vuln-title{text-decoration:line-through;text-decoration-color:#999}
.vuln-card.is-overridden{box-shadow:inset 3px 0 0 var(--accent)}
.vuln-status-strip{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;font-size:.72rem;color:var(--muted);margin-bottom:.6rem;padding:.4rem .6rem;background:var(--bg);border-radius:4px}
.vuln-status-strip .label{font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.triage-form{background:var(--bg);border-radius:6px;padding:.8rem;margin-top:.85rem;display:grid;grid-template-columns:1fr 1fr;gap:.6rem;align-items:end}
.triage-form .full{grid-column:1/-1}
.triage-form label{display:flex;flex-direction:column;gap:.25rem;font-size:.75rem;color:var(--muted);font-weight:600}
.triage-form select,.triage-form input,.triage-form textarea{padding:.35rem .55rem;border:1px solid var(--border);border-radius:4px;font-size:.8rem;font-family:inherit;background:var(--surface)}
.triage-form textarea{resize:vertical;min-height:60px}
.triage-actions{display:flex;gap:.4rem;align-items:center}
.triage-msg{font-size:.72rem;color:var(--green);font-weight:600}
.triage-msg.err{color:var(--red)}
.btn-link{background:transparent;border:0;color:var(--accent);font-size:.72rem;font-weight:600;cursor:pointer;padding:.2rem .4rem}
.btn-link:hover{text-decoration:underline}
.badge-falseposit{background:#e5e7eb;color:#374151}
.badge-accepted{background:#fef3c7;color:#92400e}
.badge-fixed{background:#dcfce7;color:#166534}
.badge-open{background:#dbeafe;color:#1e40af}

/* table */
.tbl-wrap{width:100%;max-width:100%;min-width:0;overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:.8rem}
th,td{padding:.5rem .75rem;text-align:left;border-bottom:1px solid var(--border)}
th{font-weight:600;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;background:var(--bg)}
tr:hover td{background:#fafbfc}
td.mono{font-family:monospace;font-size:.75rem}
td.truncate{max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* tabs */
.tabs{display:flex;gap:0;width:100%;max-width:100%;min-width:0;overflow-x:auto;overflow-y:hidden;contain:inline-size;overscroll-behavior-x:contain;border-bottom:2px solid var(--border);margin-bottom:1.25rem;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.tab{flex:0 0 auto;white-space:nowrap;padding:.5rem 1rem;font-size:.8rem;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:color .1s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}

/* log */
.log-box{max-width:100%;background:#111;color:#e2e8f0;border-radius:var(--radius);padding:.9rem 1rem;font-family:monospace;font-size:.72rem;max-height:400px;overflow:auto;white-space:pre-wrap;word-break:break-all}

/* code viewer */
.fn-code{max-width:100%;background:#111;color:#e2e8f0;border-radius:0 0 var(--radius) var(--radius);padding:.75rem;font-family:monospace;font-size:.72rem;max-height:300px;overflow:auto;white-space:pre;display:none}
.fn-row td{cursor:pointer;user-select:none}
.fn-row.open td:first-child::before{content:"▾ "}
.fn-row:not(.open) td:first-child::before{content:"▸ "}

/* search bar */
.search-bar{display:flex;gap:.5rem;margin-bottom:1rem}
.search-bar input,.search-bar select{min-width:0;padding:.4rem .7rem;border:1px solid var(--border);border-radius:var(--radius);font-size:.8rem;flex:1}
.search-bar select{flex:0 0 auto;max-width:280px}

/* pagination */
.pagination{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;min-width:0;max-width:100%;margin-top:.75rem;font-size:.8rem;color:var(--muted)}
.pagination .page-btn{padding:.3rem .65rem;border:1px solid var(--border);border-radius:4px;cursor:pointer;background:var(--surface)}
.pagination .page-btn:hover{background:var(--bg)}
.pagination .page-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.pagination .page-btn:disabled{cursor:not-allowed;opacity:.45;background:var(--surface)}
.strings-table{min-width:700px}
.strings-pagination{justify-content:space-between}
.strings-pagination-actions{display:flex;align-items:center;gap:.5rem}
.llm-table{min-width:700px}
.llm-pagination{justify-content:space-between}
.llm-pagination-actions{display:flex;align-items:center;gap:.5rem}

/* scan list row */
.scan-row{display:flex;align-items:center;gap:1rem;min-width:0;padding:.75rem 1rem;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s}
.scan-row>:first-child{min-width:0}
.scan-row:hover{background:var(--bg)}
.scan-name{font-weight:600;font-size:.875rem;overflow-wrap:anywhere}
.scan-meta{font-size:.75rem;color:var(--muted)}
.scan-meta span+span::before{content:" · "}

/* all scans */
.scans-card{overflow:hidden}
.scans-card-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.75rem;margin-bottom:1rem}
.scans-card-head .card-title{margin:0}
.scans-table{table-layout:fixed}
.scans-table th:nth-child(1){width:34%}
.scans-table th:nth-child(2){width:12%}
.scans-table th:nth-child(3){width:11%}
.scans-table th:nth-child(4){width:22%}
.scans-table th:nth-child(5){width:11%}
.scans-table th:nth-child(6){width:10%}
.scans-table td{vertical-align:middle}
.scans-table td:nth-child(2),.scans-table td:nth-child(4),.scans-table td:nth-child(5){white-space:nowrap}
.scans-table td:last-child{text-align:right}
.scans-file-link{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.scan-sort-button{display:inline-flex;align-items:center;gap:.2rem;border:0;background:transparent;color:inherit;font:inherit;font-weight:inherit;text-transform:inherit;letter-spacing:inherit;cursor:pointer}
.scan-sort-button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
.scans-mobile-toolbar,.scans-card-list{display:none}
.scans-mobile-toolbar{align-items:center;flex-wrap:wrap;gap:.5rem;margin-bottom:.75rem}
.scans-mobile-toolbar label{font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.scans-mobile-toolbar select{min-width:0;flex:1;padding:.4rem .6rem;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text);font:inherit}
.scans-direction{flex-shrink:0;justify-content:center;min-width:6.5rem}
.scans-card-list{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.scans-list-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.8rem 1rem;padding:1rem;background:var(--surface);border-bottom:1px solid var(--border)}
.scans-list-item:last-child{border-bottom:0}
.scans-list-main{min-width:0}
.scans-list-name{display:block;font-weight:650;font-size:.9rem;line-height:1.4;overflow-wrap:anywhere;word-break:break-word}
.scans-list-meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.65rem 1rem;margin-top:.75rem}
.scans-meta-item{min-width:0}
.scans-meta-label{display:block;margin-bottom:.1rem;color:var(--muted);font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.scans-meta-value{display:block;min-width:0;font-size:.78rem;overflow-wrap:anywhere}
.scans-list-actions{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;gap:.75rem}
@media(max-width:900px){
  .scans-desktop{display:none}
  .scans-mobile-toolbar,.scans-card-list{display:flex}
  .scans-card-list{flex-direction:column}
}
@media(max-width:520px){
  main{padding:1rem}
  .card{padding:1rem}
  .scans-card-head{align-items:stretch}
  .scans-card-head .card-title{flex:1 1 8rem}
  .scans-list-item{gap:.75rem;padding:.85rem}
  .scans-list-meta{grid-template-columns:repeat(2,minmax(0,1fr))}
}

/* progress */
progress{width:100%;height:6px;border-radius:3px;appearance:none;margin-top:.75rem}
progress::-webkit-progress-bar{background:var(--border);border-radius:3px}
progress::-webkit-progress-value{background:var(--accent);border-radius:3px}

/* alerts */
.alert{padding:.75rem 1rem;border-radius:var(--radius);font-size:.85rem;margin-bottom:1rem}
.alert-info{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}
.alert-error{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}
.alert-warn{background:#fffbeb;color:#92400e;border:1px solid #fde68a}

/* detail header */
.detail-header{display:flex;align-items:flex-start;gap:1rem;min-width:0;max-width:100%;margin-bottom:1.25rem}
.detail-header>:first-child{min-width:0}
.detail-title{font-size:1.1rem;font-weight:700;overflow-wrap:anywhere}
.detail-sub{font-size:.8rem;color:var(--muted);margin-top:.2rem;overflow-wrap:anywhere}
.detail-actions{margin-left:auto;display:flex;gap:.5rem}

/* kv list */
.kv{display:grid;grid-template-columns:minmax(6rem,160px) minmax(0,1fr);gap:.35rem .75rem;font-size:.82rem}
.kv-key{min-width:0;color:var(--muted);font-weight:500}
.kv-val{min-width:0;font-family:monospace;overflow-wrap:anywhere;word-break:normal}
@media(max-width:900px){
  .detail-header{flex-wrap:wrap}
  .detail-header>:first-child{flex:1 1 28rem}
  .detail-actions{flex-wrap:wrap;justify-content:flex-end}
}
@media(max-width:640px){
  .detail-actions{width:100%;margin-left:0;justify-content:flex-start}
  .kv{grid-template-columns:minmax(5.5rem,7rem) minmax(0,1fr)}
}

/* entry-point lists (summary mini + full tab) */
.ep-list{list-style:none;margin:0;padding:0}
.ep-item{display:flex;align-items:baseline;gap:.45rem;padding:.35rem 0;border-bottom:1px solid var(--border);font-size:.78rem;line-height:1.45;min-width:0}
.ep-item:last-child{border-bottom:none}
.ep-type{flex-shrink:0;font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:.1rem .4rem;border-radius:4px;background:var(--bg);color:var(--muted)}
.ep-type-activity{background:#dbeafe;color:#1e40af}
.ep-type-service{background:#dcfce7;color:#166534}
.ep-type-receiver{background:#fef3c7;color:#92400e}
.ep-type-provider{background:#e0e7ff;color:#3730a3}
.ep-type-native{background:#f3e8ff;color:#6b21a8}
.ep-name{font-weight:600;color:var(--text);flex-shrink:0}
.ep-class{font-family:monospace;color:var(--muted);overflow-wrap:anywhere;word-break:break-word;min-width:0}
#ep-mini .ep-item{overflow:hidden}
#ep-mini .ep-name,#ep-mini .ep-class{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#ep-mini .ep-name{flex-shrink:1}
.ep-summary-footer{display:flex;align-items:center;justify-content:space-between;gap:.75rem;margin-top:.75rem;padding-top:.65rem;border-top:1px solid var(--border);font-size:.75rem}
.ep-summary-count{color:var(--muted)}
.ep-pagination{justify-content:space-between;flex-wrap:wrap}
.ep-pagination-actions{display:flex;align-items:center;gap:.5rem}

/* loading / empty */
.loading{text-align:center;padding:3rem;color:var(--muted)}
.empty{text-align:center;padding:2.5rem;color:var(--muted);font-size:.875rem}

/* spinner */
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite;display:inline-block}

/* hidden */
[hidden]{display:none!important}

/* LLM findings list + detail drawer */
.llm-row{cursor:pointer}
.llm-row:hover td{background:#f0f3ff}
.llm-row.selected td{background:#eef2ff}
.llm-row.selected td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.llm-preview{color:var(--muted);font-size:.75rem;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.th-sort{cursor:pointer;user-select:none;white-space:nowrap}
.th-sort:hover{color:var(--text)}
.th-sort .sort-ind{display:inline-block;min-width:0.9em;margin-left:.2rem;font-size:.65rem;color:var(--muted);opacity:0}
.th-sort:hover .sort-ind{opacity:.45}
.th-sort.active{color:var(--text)}
.th-sort.active .sort-ind{opacity:1;color:var(--accent)}
.llm-drawer-backdrop{position:fixed;inset:0;background:rgba(26,29,35,.28);z-index:200;opacity:0;pointer-events:none;transition:opacity .2s}
.llm-drawer-backdrop.open{opacity:1;pointer-events:auto}
.llm-drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100vw);max-width:100%;visibility:hidden;background:var(--surface);border-left:1px solid var(--border);box-shadow:-8px 0 24px rgba(0,0,0,.08);z-index:210;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .22s ease,visibility 0s linear .22s;outline:none}
.llm-drawer.open{visibility:visible;transform:translateX(0);transition-delay:0s}
.llm-drawer-head{display:flex;align-items:flex-start;gap:.75rem;padding:1rem 1.1rem;border-bottom:1px solid var(--border);flex-shrink:0}
.llm-drawer-head-main{flex:1;min-width:0}
.llm-drawer-title{font-weight:700;font-size:.95rem;word-break:break-word}
.llm-drawer-meta{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;margin-top:.45rem;font-size:.72rem;color:var(--muted)}
.meta-chip{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:.1rem .45rem;font-weight:600;font-size:.72rem;color:var(--muted)}
.llm-drawer-close{flex-shrink:0;width:32px;height:32px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--muted);font-size:1.1rem;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.llm-drawer-close:hover{background:var(--bg);color:var(--text)}
.llm-drawer-body{flex:1;overflow-y:auto;padding:1rem 1.1rem 1.5rem}
.llm-empty-state{text-align:center;padding:2rem 1rem;color:var(--muted);font-size:.875rem;background:var(--bg);border:1px dashed var(--border);border-radius:var(--radius)}
.llm-empty-state strong{display:block;color:var(--text);margin-bottom:.35rem}
.llm-vuln-item{border:1px solid var(--border);border-radius:var(--radius);padding:.85rem;margin-bottom:.75rem;background:var(--bg)}
.llm-vuln-item:last-child{margin-bottom:0}
.llm-vuln-item-head{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;margin-bottom:.5rem}
.llm-vuln-item-title{font-weight:600;font-size:.88rem;flex:1;min-width:0}
.llm-kv{display:grid;grid-template-columns:minmax(5rem,100px) minmax(0,1fr);gap:.3rem .6rem;font-size:.8rem;margin:.5rem 0}
.llm-kv .k{color:var(--muted);font-weight:500}
.llm-kv .v{word-break:break-word}
.llm-prose{background:#111;color:#e2e8f0;border-radius:var(--radius);padding:.85rem 1rem;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.75rem;white-space:pre-wrap;word-break:break-word;line-height:1.55}
.llm-section-label{font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:0 0 .55rem}

/* Assessment list + detail drawer (reuses .llm-drawer* overlay) */
.assess-row{display:flex;gap:.75rem;padding:.65rem 1.25rem;margin:0 -1.25rem;border:0;border-bottom:1px solid var(--border);align-items:flex-start;cursor:pointer;width:calc(100% + 2.5rem);max-width:none;background:transparent;text-align:left;font:inherit;color:inherit;box-sizing:border-box;appearance:none;-webkit-appearance:none}
.assess-row:hover{background:#f0f3ff}
.assess-row.selected{background:#eef2ff;box-shadow:inset 3px 0 0 var(--accent)}
.assess-row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.assess-row:last-child{border-bottom:0}
.assess-steps{margin:.15rem 0 0 1.15rem;font-size:.85rem;line-height:1.55;color:var(--text)}
.assess-steps li{margin:.4rem 0}
.assess-reason{font-size:.85rem;line-height:1.55;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:.7rem .85rem;white-space:pre-wrap;word-break:break-word}
.assess-reason-meta{font-size:.72rem;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);margin-top:.45rem;word-break:break-word}

/* Offensive campaign (Mockup C) */
.off-campaign{display:flex;flex-direction:column;gap:.75rem}
.off-phases{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.5rem}
@media(max-width:800px){.off-phases{grid-template-columns:1fr 1fr}}
.off-phase{border:1px solid var(--border);border-radius:var(--radius);padding:.7rem .85rem;background:var(--surface);cursor:pointer;text-align:left}
.off-phase:hover{background:var(--bg)}
.off-phase.active{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent);background:#eef2ff}
.off-phase-label{font-size:.68rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.off-phase-title{font-weight:600;font-size:.85rem;margin-top:.15rem}
.off-phase-count{font-size:.75rem;color:var(--muted);margin-top:.2rem}
.off-split{display:grid;grid-template-columns:minmax(220px,1fr) minmax(280px,1.4fr);gap:.75rem;align-items:stretch;min-height:360px;min-width:0}
.off-list,.off-detail{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.off-list{align-self:stretch;height:100%;min-height:0}
.off-detail{overflow:visible}
.off-list-head,.off-detail-head{padding:.65rem .85rem;border-bottom:1px solid var(--border);font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.off-list-head{position:sticky;top:0;background:var(--surface);z-index:1;flex-shrink:0}
.off-list-body,.off-detail-body{overflow-y:auto;min-width:0}
.off-detail-body{flex:1 0 auto}
.off-list-body{flex:1;min-height:0}
.off-list-foot{display:flex;justify-content:space-between;align-items:center;gap:.5rem;padding:.5rem .65rem;border-top:1px solid var(--border);background:var(--surface);font-size:.72rem;color:var(--muted);min-width:0;flex-shrink:0}
@media(max-width:800px){
  .off-split{grid-template-columns:1fr;min-height:0;align-items:start}
  .off-list{align-self:start;height:auto}
  .off-list-body{max-height:min(46vh,320px);flex:0 1 auto}
}
.off-list-foot .off-list-count{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.off-list-pager{display:flex;align-items:center;gap:.35rem;flex-shrink:0}
.off-list-pager span{white-space:nowrap}
.off-list-pager .page-btn{padding:.2rem .5rem;line-height:1;font-size:.8rem}
.off-target{position:relative;padding:.7rem .85rem .7rem 1rem;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s ease}
.off-target:last-child{border-bottom:0}
.off-target::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent;transition:background .12s ease}
.off-target:hover{background:var(--bg)}
.off-target:hover::before{background:var(--border)}
.off-target:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.off-target.active{background:#eef2ff}
.off-target.active::before{background:var(--accent)}
.off-target.active .off-target-title{color:var(--accent-h)}
.off-target-title{font-weight:600;font-size:.84rem;line-height:1.35;overflow-wrap:anywhere;word-break:break-word}
.off-target-meta{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;margin-top:.4rem;font-size:.72rem;color:var(--muted);min-width:0}
.off-target-cat{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.68rem;font-weight:600;letter-spacing:.02em;color:var(--muted);text-transform:uppercase;overflow-wrap:anywhere;word-break:break-word;min-width:0}
.off-detail-body{padding:.85rem 1rem 1.1rem}
.off-detail-title{font-weight:700;font-size:.95rem;margin-bottom:.35rem}
.off-code{background:#111;color:#e2e8f0;padding:.65rem .85rem;border-radius:6px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.72rem;white-space:pre-wrap;word-break:break-word;max-height:260px;overflow-y:auto}
.off-toolbar{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;padding:.75rem 0 0;border-top:1px solid var(--border);margin-top:.25rem}
.off-warn{margin-top:.75rem;font-size:.78rem}
@media(max-width:640px){
  .llm-drawer{width:100vw}
  .triage-form{grid-template-columns:1fr}
  .search-bar{flex-wrap:wrap}
  .search-bar select{flex:1 1 100%;max-width:100%}
}

/* learned rules */
.learned-paths{display:flex;flex-direction:column;gap:.35rem;margin-bottom:.9rem;font-size:.78rem;color:var(--muted)}
.learned-paths code{font-size:.75rem;word-break:break-all}
.learned-paths .path-row{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem}
.learned-summary{margin:0 0 1rem}
.learned-plat-strip{display:flex;flex-wrap:wrap;gap:1rem;align-items:center;font-size:.8rem;color:var(--muted);margin:.75rem 0 0;padding:.65rem .85rem;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius)}
.learned-plat-strip .plat-stat{display:inline-flex;align-items:center;gap:.35rem}
.learned-plat-strip .plat-n{font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
.regex-cell{max-width:320px}
.regex-cell .regex-text{display:block;font-family:monospace;font-size:.72rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.regex-cell.expanded .regex-text{white-space:pre-wrap;word-break:break-all;overflow:visible;text-overflow:unset}
.affected-list{display:flex;flex-direction:column;gap:.45rem}
.affected-item{font-size:.8rem;padding:.45rem .6rem;background:var(--bg);border:1px solid var(--border);border-radius:6px}
.affected-item .aff-name{font-family:monospace;font-weight:600;word-break:break-all}
.affected-item .aff-meta{font-size:.72rem;color:var(--muted);margin-top:.15rem;word-break:break-all}
.vuln-loc-count{font-size:.72rem;font-weight:600;color:var(--muted);background:var(--bg);padding:.1rem .45rem;border-radius:4px;white-space:nowrap}
.regex-cell .regex-toggle{display:none;margin-top:.2rem;font-size:.68rem;font-weight:600;color:var(--accent);cursor:pointer;background:none;border:0;padding:0}
.regex-cell.long .regex-toggle{display:inline}
</style>

<script>
/* ── LLM provider change handler ── */
window.onProviderChange = function() {
  const provider = document.getElementById('llm-provider')?.value || 'none';
  const keyRow   = document.getElementById('llm-key-row');
  const keyLabel = document.getElementById('llm-key-label');
  if (!keyRow) return;
  const needsKey = provider === 'openai' || provider === 'claude' || provider === 'deepseek';
  keyRow.hidden = !needsKey;
  if (provider === 'openai') keyLabel.innerHTML = 'OpenAI API Key (sk-...) <span style="color:var(--red)">*</span>';
  if (provider === 'claude') keyLabel.innerHTML = 'Anthropic API Key (sk-ant-...) <span style="color:var(--red)">*</span>';
  if (provider === 'deepseek') keyLabel.innerHTML = 'DeepSeek API Key <span style="color:var(--red)">*</span>';
  const modelEl = document.getElementById('llm-model');
  const modelSelect = document.getElementById('llm-model-select');
  if (modelEl && modelSelect) {
    const useDeepSeek = provider === 'deepseek';
    modelEl.hidden = useDeepSeek;
    modelSelect.hidden = !useDeepSeek;
    if (useDeepSeek && !modelSelect.value) modelSelect.value = 'deepseek-v4-flash';
    if (!useDeepSeek) modelEl.placeholder = provider === 'openai' ? 'e.g. gpt-4o-mini'
      : provider === 'claude' ? 'e.g. claude-sonnet-4-6' : 'leave empty for default';
  }
  // Clear any previous error when switching provider
  clearKeyError();
};

window.clearKeyError = function() {
  const keyInput = document.getElementById('llm-api-key');
  const keyError = document.getElementById('llm-key-error');
  if (keyInput) keyInput.style.borderColor = '';
  if (keyError) keyError.hidden = true;
};

window.onLlmModeChange = function() {
  const mode = document.getElementById('llm-mode')?.value || '';
  const warn = document.getElementById('offensive-warn');
  if (warn) warn.hidden = mode !== 'offensive';
  if (mode === 'offensive') {
    const provider = document.getElementById('llm-provider');
    if (provider && (provider.value === 'none' || !provider.value)) {
      provider.value = 'deepseek';
      onProviderChange();
    }
  }
};

/* ── config ── */
const keyEl = () => document.getElementById('nav-key');
function apiKey() { return keyEl() ? keyEl().value : ''; }

function headers(extra={}) {
  const h = {'Accept':'application/json', ...extra};
  if (apiKey()) h['X-Api-Key'] = apiKey();
  return h;
}

async function api(path, opts={}) {
  const r = await fetch('/api/v1' + path, {headers: headers(opts.headers||{}), ...opts});
  if (!r.ok) {
    const txt = await r.text().catch(()=>'');
    throw new Error(txt || r.statusText);
  }
  return r.json();
}

/* ── router ── */
const routes = {};
function route(pattern, fn) { routes[pattern] = fn; }

function router() {
  const hash = location.hash.replace(/^#\/?/,'') || '';
  document.querySelectorAll('.nav-link').forEach(a => {
    const r = a.dataset.route;
    a.classList.toggle('active',
      (r==='home' && hash==='') || (r!=='home' && hash.startsWith(r)));
  });
  const parts = hash.split('/');
  if (parts[0]==='scan' && parts[1]) return routes['scan'](parts[1], parts[2]||'summary');
  if (routes[parts[0]]) return routes[parts[0]](parts[1]);
  routes['home']();
}

function $(s) { return document.querySelector(s); }
function $$(s) { return [...document.querySelectorAll(s)]; }

/* ── utils ── */
function badge(state) {
  const normalized = String(state||'queued').toLowerCase();
  const safeState = ['queued','running','done','error'].includes(normalized) ? normalized : 'queued';
  return `<span class="badge badge-${safeState}">${esc(state||'queued')}</span>`;
}
function sevBadge(text='') {
  if (/\bCRITICAL\b/i.test(text)) return '<span class="badge badge-critical">CRITICAL</span>';
  if (/\bHIGH\b/i.test(text)) return '<span class="badge badge-high">HIGH</span>';
  if (/\bMEDIUM\b/i.test(text)) return '<span class="badge badge-medium">MEDIUM</span>';
  if (/\bLOW\b/i.test(text)) return '<span class="badge badge-low">LOW</span>';
  return '<span class="badge badge-info">INFO</span>';
}
function sevBadgeLevel(level='') {
  const s = String(level||'').toUpperCase();
  if (s === 'CRITICAL') return '<span class="badge badge-critical">CRITICAL</span>';
  if (s === 'HIGH') return '<span class="badge badge-high">HIGH</span>';
  if (s === 'MEDIUM') return '<span class="badge badge-medium">MEDIUM</span>';
  if (s === 'LOW') return '<span class="badge badge-low">LOW</span>';
  if (!s) return '<span class="badge badge-info">INFO</span>';
  return `<span class="badge badge-info">${esc(s)}</span>`;
}
function fmt(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleString();
}
function dur(a, b) {
  if (!a||!b) return '—';
  const ms = new Date(b)-new Date(a);
  if (ms < 60000) return (ms/1000).toFixed(1)+'s';
  return (ms/60000).toFixed(1)+'m';
}
function esc(s='') {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escAttr(s='') {
  return esc(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function num(n) { return n==null?'—':n.toLocaleString(); }

/** True for blank or LLM filler like "...", "…", "1. ...\n2. ...". */
function isEmptyField(s) {
  if (s == null) return true;
  const t = String(s).trim();
  if (!t) return true;
  if (/^[.\u2026\s]+$/.test(t)) return true;
  if (/^(todo|tbd|n\/a|none|placeholder)$/i.test(t)) return true;
  if (/^(\d+\.\s*[.\u2026]+\s*)+$/s.test(t)) return true;
  return false;
}
function fieldOr(s, fallback) {
  return isEmptyField(s) ? fallback : s;
}

/* ── scans list view ── */
let _scansCache = [];
/** @type {{key:string, dir:'asc'|'desc'}} */
let _scansSort = {key: 'started', dir: 'desc'};

/** Workflow severity: error < running < queued < done */
const SCAN_STATE_RANK = { error: 0, running: 1, queued: 2, done: 3 };

function scanDurationMs(s) {
  if (!s || !s.started_at || !s.finished_at) return null;
  const ms = new Date(s.finished_at) - new Date(s.started_at);
  return Number.isFinite(ms) ? ms : null;
}

function scanSortValue(s, key) {
  switch (key) {
    case 'file': return String(s.filename||'').toLowerCase();
    case 'scan_id': return String(s.scan_id||'').toLowerCase();
    case 'state': return SCAN_STATE_RANK[String(s.state||'').toLowerCase()] ?? 99;
    case 'started': return s.created_at ? new Date(s.created_at).getTime() : 0;
    case 'duration': {
      const ms = scanDurationMs(s);
      // Missing/running duration sorts first when asc, last when desc
      return ms == null ? -1 : ms;
    }
    default: return '';
  }
}

function sortedScans() {
  const scans = _scansCache.slice();
  const {key, dir} = _scansSort;
  const mul = dir === 'asc' ? 1 : -1;
  scans.sort((a, b) => {
    const va = scanSortValue(a, key);
    const vb = scanSortValue(b, key);
    let cmp = 0;
    if (typeof va === 'number' && typeof vb === 'number') cmp = va - vb;
    else cmp = String(va).localeCompare(String(vb), undefined, {sensitivity:'base'});
    if (cmp !== 0) return cmp * mul;
    // Tie-break: newest started first
    const ta = a.created_at ? new Date(a.created_at).getTime() : 0;
    const tb = b.created_at ? new Date(b.created_at).getTime() : 0;
    return tb - ta;
  });
  return scans;
}

function scansSortHeaderHtml(key, label) {
  const active = _scansSort.key === key;
  const ind = active ? (_scansSort.dir === 'asc' ? '▲' : '▼') : '▼';
  const ariaSort = active ? (_scansSort.dir === 'asc' ? 'ascending' : 'descending') : 'none';
  return `<th class="th-sort${active?' active':''}" data-sort="${key}" aria-sort="${ariaSort}">
      <button type="button" class="scan-sort-button" onclick="sortScansColumn('${key}')"
        aria-label="Sort by ${label}${active ? `, currently ${ariaSort}` : ''}">
        ${label}<span class="sort-ind" aria-hidden="true">${ind}</span>
      </button></th>`;
}

function renderScansThead() {

    ${scansSortHeaderHtml('state','State')}

    ${scansSortHeaderHtml('duration','Duration')}

}

function renderScansRows(scans=sortedScans()) {

function renderScansSortControls() {
  const options = [
    ['file','File'],['scan_id','Scan ID'],['state','State'],
    ['started','Started'],['duration','Duration']
  ].map(([key,label]) => `<option value="${key}"${_scansSort.key===key?' selected':''}>${label}</option>`).join('');
  const ascending = _scansSort.dir === 'asc';

function refreshScansTable() {
  const tbody = document.getElementById('scans-tbody');
  const thead = document.getElementById('scans-thead');
  const cards = document.getElementById('scans-card-list');
  const controls = document.getElementById('scans-mobile-toolbar');

  if (tbody) tbody.innerHTML = renderScansRows(scans);
  if (thead) thead.innerHTML = renderScansThead();
  if (cards) cards.innerHTML = renderScansCards(scans);
  if (controls) controls.innerHTML = renderScansSortControls();
}

window.sortScansColumn = function(key) {
  if (_scansSort.key === key) {
    _scansSort.dir = _scansSort.dir === 'asc' ? 'desc' : 'asc';
  } else {
    _scansSort.key = key;
    // Started/duration default newest/longest first; text/state columns A→Z / severity asc
    _scansSort.dir = (key === 'started' || key === 'duration') ? 'desc' : 'asc';
  }
  refreshScansTable();
};

window.setScansSort = function(key) {
  if (!['file','scan_id','state','started','duration'].includes(key)) return;
  if (_scansSort.key !== key) {
    _scansSort.key = key;
    _scansSort.dir = (key === 'started' || key === 'duration') ? 'desc' : 'asc';
  }
  refreshScansTable();
};

let _learnedCache = null;
let _learnedPlat = 'ALL';
/** @type {{key:string, dir:'asc'|'desc'}} */
let _learnedSort = {key: 'severity', dir: 'desc'};

const SEV_RANK = { CRITICAL: 5, HIGH: 4, MEDIUM: 3, LOW: 2, INFO: 1 };

function badgeSev(sev) {

}

function badgePlatform(plat) {

}

function renderRegexCell(regex) {
  const raw = regex || '';

    <span class="regex-text" onclick="toggleRegex(this)">${esc(raw)}</span>

window.toggleRegex = function(el) {

function learnedStoreMeta(stores, plat) {
  return (stores || []).find(s => s.platform === plat) || {platform: plat, path: '', exists: false, count: 0};
}

function learnedRuleSearchText(r) {
  return [r.id, r.scope, r.title, r.category, r.severity, r.platform, r.regex]
    .map(x => String(x||'').toLowerCase()).join(' ');
}

function learnedSortValue(r, key) {
  switch (key) {
    case 'platform': return String(r.platform||'IOS').toUpperCase();
    case 'id': return String(r.id||'').toLowerCase();
    case 'scope': return String(r.scope||'').toLowerCase();
    case 'title': return String(r.title||'').toLowerCase();
    case 'severity': return SEV_RANK[String(r.severity||'INFO').toUpperCase()] || 0;
    case 'cvss': return Number(r.cvssScore||0);
    case 'regex': return String(r.regex||'').toLowerCase();
    case 'created': return r.createdAt ? new Date(r.createdAt).getTime() : 0;
    default: return '';
  }
}

function sortedLearnedRules() {
  const rules = (_learnedCache && _learnedCache.rules) ? _learnedCache.rules.slice() : [];
  const {key, dir} = _learnedSort;
  const mul = dir === 'asc' ? 1 : -1;
  rules.sort((a, b) => {
    const va = learnedSortValue(a, key);
    const vb = learnedSortValue(b, key);
    let cmp = 0;
    if (typeof va === 'number' && typeof vb === 'number') cmp = va - vb;
    else cmp = String(va).localeCompare(String(vb), undefined, {sensitivity:'base'});
    if (cmp !== 0) return cmp * mul;
    return String(a.id||'').localeCompare(String(b.id||''), undefined, {sensitivity:'base'});
  });
  return rules;

function learnedSortHeaderHtml(key, label) {

      <td>${badgeSev(r.severity)}</td>
      <td>${(r.cvssScore||0).toFixed(1)}</td>
      ${renderRegexCell(r.regex)}
      <td>${r.createdAt ? new Date(r.createdAt).toLocaleDateString() : ''}</td>
    </tr>`;
  }).join('');
}

function updateLearnedSummary() {
  const plat = _learnedPlat || 'ALL';
  const q = (document.getElementById('learned-q')?.value || '').trim().toLowerCase();
  const sevCounts = { CRITICAL:0, HIGH:0, MEDIUM:0, LOW:0, INFO:0 };
  const platCounts = { IOS:0, ANDROID:0 };
  let shown = 0;
  (sortedLearnedRules()).forEach(r => {
    const p = String(r.platform||'IOS').toUpperCase();
    const matchP = plat === 'ALL' || p === plat;
    const matchQ = !q || learnedRuleSearchText(r).includes(q);
    if (!matchP || !matchQ) return;
    shown++;
    const sev = String(r.severity||'INFO').toUpperCase();
    if (sev in sevCounts) sevCounts[sev]++;
    else sevCounts.INFO++;
    if (p === 'ANDROID') platCounts.ANDROID++;
    else platCounts.IOS++;
  });

  const setStat = (id, n) => {
    const el = document.getElementById(id);
    if (el) el.textContent = String(n);
  };
  setStat('learned-sev-critical', sevCounts.CRITICAL);
  setStat('learned-sev-high', sevCounts.HIGH);
  setStat('learned-sev-medium', sevCounts.MEDIUM);
  setStat('learned-sev-low', sevCounts.LOW);

  const strip = document.getElementById('learned-plat-strip');
  if (strip) {
    strip.innerHTML = `
      <span class="plat-stat">${badgePlatform('IOS')} <span class="plat-n">${platCounts.IOS}</span> rule(s)</span>
      <span class="plat-stat">${badgePlatform('ANDROID')} <span class="plat-n">${platCounts.ANDROID}</span> rule(s)</span>
      <span class="plat-stat">Visible <span class="plat-n">${shown}</span></span>
      ${sevCounts.INFO ? `<span class="plat-stat">Info <span class="plat-n">${sevCounts.INFO}</span></span>` : ''}`;
  }
  return shown;
}

function applyLearnedFilters() {
  const plat = _learnedPlat || 'ALL';
  const q = (document.getElementById('learned-q')?.value || '').trim().toLowerCase();
  const rows = document.querySelectorAll('#learned-tbody tr');
  let shown = 0;
  rows.forEach(tr => {
    const matchP = plat === 'ALL' || tr.dataset.platform === plat;
    const matchQ = !q || (tr.dataset.search || '').includes(q);
    const ok = matchP && matchQ;
    tr.style.display = ok ? '' : 'none';
    if (ok) shown++;
  });
  updateLearnedSummary();
  const countEl = document.getElementById('learned-shown');
  if (countEl) countEl.textContent = shown + ' shown';
  const emptyEl = document.getElementById('learned-empty');
  if (emptyEl) {
    if (!shown) {
      emptyEl.hidden = false;
      if (q) emptyEl.textContent = 'No rules match this filter.';
      else if (plat === 'ANDROID') emptyEl.textContent = 'No Android learned rules yet. Run an APK scan with LLM enrichment in Find Vulns mode.';
      else if (plat === 'IOS') emptyEl.textContent = 'No iOS learned rules yet. Run an IPA scan with LLM enrichment in Find Vulns mode.';
      else emptyEl.textContent = 'No learned rules yet.';
    } else {
      emptyEl.hidden = true;
    }
    const wrap = document.getElementById('learned-tbl-wrap');
    if (wrap) wrap.hidden = !shown;
  }
  document.querySelectorAll('#learned-tabs .tab').forEach(t => {
    t.classList.toggle('active', t.dataset.plat === plat);
  });
}

function refreshLearnedTable() {
  const tbody = document.getElementById('learned-tbody');
  const thead = document.getElementById('learned-thead');
  if (!tbody) return;
  tbody.innerHTML = renderLearnedRows();
  if (thead) thead.innerHTML = renderLearnedThead();
  applyLearnedFilters();
}

window.sortLearnedColumn = function(key) {
  if (_learnedSort.key === key) {
    _learnedSort.dir = _learnedSort.dir === 'asc' ? 'desc' : 'asc';
  } else {
    _learnedSort.key = key;
    _learnedSort.dir = (key === 'severity' || key === 'cvss' || key === 'created') ? 'desc' : 'asc';
  }
  refreshLearnedTable();
};

function renderLearnedTable(data, platFilter) {
  const ios = learnedStoreMeta(data.stores, 'IOS');
  const and = learnedStoreMeta(data.stores, 'ANDROID');
  const totalAll = (data.stores||[]).reduce((n,s)=>n+(s.count||0), 0);
  const tabCount = (p) => p === 'ALL' ? totalAll
    : (learnedStoreMeta(data.stores, p).count || 0);

  const tabs = ['ALL','IOS','ANDROID'].map(p => {
    const label = p === 'ALL' ? 'All' : (p === 'ANDROID' ? 'Android' : 'iOS');
    return `<div class="tab${platFilter===p?' active':''}" data-plat="${p}" onclick="setLearnedPlat('${p}')">${label} (${tabCount(p)})</div>`;
  }).join('');

  const pathsHtml = `
    <div class="learned-paths">
      <div class="path-row">${badgePlatform('IOS')}
        <code>${esc(ios.path||'')}</code>
        <span>· ${ios.exists ? ios.count+' rule(s)' : 'file not found'}</span>
      </div>
      <div class="path-row">${badgePlatform('ANDROID')}
        <code>${esc(and.path||'')}</code>
        <span>· ${and.exists ? and.count+' rule(s)' : 'file not found'}</span>
      </div>
    </div>`;

  if (!totalAll) {
    return `
      <div class="card">
        <div class="card-title">Learned Rules</div>
        <p style="color:var(--muted);font-size:.875rem;margin-bottom:.75rem">
          No learned rules yet. Run a scan with <strong>LLM enrichment</strong> in
          <em>Find Vulns</em> mode — vulnerabilities the LLM discovers will be
          distilled into reusable detection rules, stored separately per platform.
        </p>
        ${pathsHtml}
        <p style="font-size:.875rem;color:var(--muted)">
          Once stored, every subsequent scan (even without LLM) will check
          for these patterns alongside the built-in MSTG/MASTG rules.
        </p>
      </div>`;
  }

  return `
    <div class="card">
      <div class="card-title" style="justify-content:space-between">
        Learned Rules
        <span style="font-size:.75rem;color:var(--muted);font-weight:400">${totalAll} rule(s) across platforms</span>
      </div>
      <p style="font-size:.85rem;color:var(--muted);margin-bottom:.75rem">
        These rules were auto-generated by the LLM from previous scans.
        They run on every scan for the matching platform, even without LLM enrichment.
      </p>
      ${pathsHtml}
      <div class="tabs" id="learned-tabs" style="margin-bottom:.9rem">${tabs}</div>
      <div class="search-bar">
        <input id="learned-q" type="text" placeholder="Filter by scope, title, ID, severity…" oninput="filterLearned()"/>
      </div>
      <div class="learned-summary" id="learned-summary">
        <div class="grid-4">
          <div class="stat"><div class="stat-val" style="color:var(--high)" id="learned-sev-critical">0</div><div class="stat-label">Critical</div></div>
          <div class="stat"><div class="stat-val" style="color:var(--medium)" id="learned-sev-high">0</div><div class="stat-label">High</div></div>
          <div class="stat"><div class="stat-val" style="color:var(--yellow)" id="learned-sev-medium">0</div><div class="stat-label">Medium</div></div>
          <div class="stat"><div class="stat-val" style="color:var(--low)" id="learned-sev-low">0</div><div class="stat-label">Low</div></div>
        </div>
        <div class="learned-plat-strip" id="learned-plat-strip"></div>
      </div>
      <div id="learned-empty" class="empty" hidden></div>
      <div class="tbl-wrap" id="learned-tbl-wrap"><table>
        <thead id="learned-thead">${renderLearnedThead()}</thead>
        <tbody id="learned-tbody">${renderLearnedRows()}</tbody>
      </table></div>
      <div style="margin-top:.6rem;font-size:.75rem;color:var(--muted)" id="learned-shown"></div>
    </div>`;
}

window.setLearnedPlat = function(plat) {
  _learnedPlat = plat || 'ALL';
  applyLearnedFilters();
};

window.filterLearned = function() {
  applyLearnedFilters();
};

route('learned', async function() {
  render('<div class="loading"><div class="spinner"></div></div>');
  try {
    const data = await api('/learned-rules');
    _learnedCache = data;
    if (!_learnedPlat) _learnedPlat = 'ALL';
    render(renderLearnedTable(data, _learnedPlat));
    applyLearnedFilters();
  } catch(e) {
    render(`<div class="alert alert-error">${esc(e.message)}</div>`);
  }
});


/* ── scan detail view ── */
const TABS = ['summary','vulnerabilities','assessment','functions','strings','resources','entrypoints','llm','log','downloads'];

function tabsForDetail(detail) {
  const mode = String(detail?.llm_mode || '').toLowerCase().replace(/-/g, '_');
  const showOff = mode === 'offensive' || mode === 'offense' || mode === 'frida' || mode === 'bypass';
  if (!showOff) return TABS.slice();
  const tabs = TABS.slice();
  const i = tabs.indexOf('llm');
  tabs.splice(i >= 0 ? i : tabs.length, 0, 'offensive');
  return tabs;
}

function tabLabel(t) {
  return t === 'llm' ? 'Llm' : t.charAt(0).toUpperCase() + t.slice(1);
}

route('scan', async function(id, tab='summary') {
  render('<div class="loading"><div class="spinner"></div></div>');
  let detail;
  try { detail = await api('/scans/'+id); }
  catch(e) { render(`<div class="alert alert-error">${esc(e.message)}</div>`); return; }

  const tabs = tabsForDetail(detail);
  if (tab === 'offensive' && !tabs.includes('offensive')) tab = 'summary';
  const tabsHtml = tabs.map(t=>
    `<div class="tab${t===tab?' active':''}" onclick="goTab('${id}','${t}')">${tabLabel(t)}</div>`
  ).join('');

  render(`
    <div class="detail-header">
      <div>
        <div class="detail-title">${esc(detail.bundle_id || detail.filename)}</div>
        <div class="detail-sub">${esc(detail.filename)} &nbsp;·&nbsp; ${detail.scan_id.slice(0,8)} &nbsp;·&nbsp; ${badge(detail.state)}</div>
      </div>
      <div class="detail-actions">
        ${detail.has_html?`<a class="btn btn-ghost btn-sm" href="/api/v1/scans/${id}/report" target="_blank">HTML Report</a>`:''}
        ${detail.has_sarif?`<a class="btn btn-ghost btn-sm" href="/api/v1/scans/${id}/sarif">Download SARIF</a>`:''}
        <button class="btn btn-danger btn-sm" onclick="deleteScan('${id}', event)">Delete</button>
      </div>
    </div>
    <div class="tabs">${tabsHtml}</div>
    <div id="tab-content"><div class="loading"><div class="spinner"></div></div></div>`);

  await renderTab(id, tab, detail);

  // auto-refresh if running
  if (detail.state === 'queued' || detail.state === 'running') {
    const iv = setInterval(async () => {
      const d = await api('/scans/'+id).catch(()=>null);
      if (!d) return;
      if (d.state === 'done' || d.state === 'error') {
        clearInterval(iv);
        location.hash = '#/scan/' + id + '/summary';
      }
    }, 3000);
  }
});

window.goTab = function(id, tab) {
  history.replaceState(null,'','#/scan/'+id+'/'+tab);
  document.querySelectorAll('.tab').forEach(t=>{
    t.classList.toggle('active', t.textContent.toLowerCase()===tab);
  });
  api('/scans/'+id).then(detail => renderTab(id, tab, detail));
};

async function renderTab(id, tab, detail) {
  const el = document.getElementById('tab-content');
  if (!el) return;
  if (typeof closeLlmDrawer === 'function') closeLlmDrawer();
  if (typeof closeAssessDrawer === 'function') closeAssessDrawer();
  try {
    switch(tab) {
      case 'summary':
        el.innerHTML = await tabSummary(detail);
        postSummaryHydrate(id);
        break;
      case 'vulnerabilities': await tabVulnerabilities(el, id, detail); break;
      case 'assessment':      await tabAssessment(el, id, detail); break;
      case 'functions':       await tabFunctions(el, id, detail); break;
      case 'strings':     await tabStrings(el, id, detail); break;
      case 'resources':   await tabResources(el, id); break;
      case 'entrypoints': await tabEntryPoints(el, id, detail); break;
      case 'offensive':   await tabOffensive(el, id, detail); break;
      case 'llm':         await tabLlm(el, id, detail); break;
      case 'log':         await tabLog(el, id); break;
      case 'downloads':   el.innerHTML = tabDownloads(id, detail); break;
      default:            el.innerHTML = '<div class="empty">Unknown tab.</div>';
    }
  } catch(e) {
    el.innerHTML = `<div class="alert alert-error">${esc(e.message)}</div>`;
  }
}

/* ── log → human-friendly error reason ── */
function extractErrorReason(log) {
  if (!log) return {reason:'', hint:''};

  // Known patterns ranked by specificity (first match wins)
  const patterns = [
    {
      re: /chainedImport.*null|DyldChainedImport\.getName/,
      reason: 'Ghidra Mach-O loader crashed on chained-fixups — a chained import entry has a null target name. This is a known upstream bug in Ghidra (verified present in 12.0.4 and 12.1) triggered by some IPAs built with recent Xcode toolchains.',
      hint: 'There is no clean workaround as of Ghidra 12.1. Options: (a) wait for an upstream fix, (b) re-build the IPA with chained-fixups disabled (linker flag <code>-fixup_chains</code> in some toolchain configs), or (c) skip this app from your scan queue. The CLI now fails fast (~15s) instead of hanging, so retrying gains nothing.',
    },
    {
      re: /DyldChainedFixups[\s\S]{0,200}NullPointerException/,
      reason: 'Ghidra Mach-O loader hit a NullPointerException while processing dyld chained fixups.',
      hint: 'Known Ghidra Mach-O parser issue. See the full log for the specific cause, and check the Ghidra issue tracker for updates.',
    },
    {
      re: /osgi\.ee=UNKNOWN|GhidraScriptLoadException|ClassNotFoundException: DumpClassData/,
      reason: 'Ghidra imported the IPA, but DumpClassData.java failed to load. Root cause is usually an unsupported Java version for Ghidra\'s OSGi script loader (osgi.ee=UNKNOWN) — common with Homebrew Java 23/25.',
      hint: 'Install Temurin/OpenJDK <strong>21</strong>, then restart Malimite with <code>export GHIDRA_JAVA_HOME=$(/usr/libexec/java_home -v 21)</code> (or point it at your JDK 21 home). Ghidra 11.x expects Java 17/21, not 25.',
    },
    {
      re: /Import succeeded[\s\S]{0,2000}before heartbeat|Post-analysis succeeded[\s\S]{0,2000}before heartbeat|before heartbeat[\s\S]{0,800}post-script likely failed|SCRIPT ERROR: DumpClassData/,
      reason: 'Ghidra imported the binary successfully, but DumpClassData never connected back to Malimite (heartbeat missing). This is a post-script/IPC failure, not a Mach-O parse crash.',
      hint: 'Open the full log and search for <code>SCRIPT ERROR</code> / <code>osgi.ee</code>. If you see Java 23/25, switch Ghidra to Java 21 via <code>GHIDRA_JAVA_HOME</code>.',
    },
    {
      re: /Ghidra subprocess exited[\s\S]{0,200}before heartbeat/,
      reason: 'Ghidra exited before our post-script could connect. Often a Mach-O loader crash during import — but if the log also shows Import succeeded, treat it as a DumpClassData/IPC failure instead.',
      hint: 'Check the [ghidra-output] ERROR REPORT lines in the full log for the specific Ghidra exception or DumpClassData stack trace.',
    },
    {
      re: /Ghidra subprocess exited[\s\S]{0,200}before data/,
      reason: 'Ghidra started the post-script but the script died before sending data. Usually a script error or out-of-memory during decompilation.',
      hint: 'Check Ghidra script output and consider raising -Xmx for large binaries.',
    },
    {
      re: /Timed out[\s\S]{0,200}waiting for Ghidra data connection/,
      reason: 'Heartbeat succeeded, but DumpClassData never opened the data connection within 30 minutes. The post-script was likely still in early setup — or hung — before sending CONNECTED (not merely “binary too large”).',
      hint: 'Check [ghidra-output] for DumpClassData progress. After CONNECTED, long Swift decompiles are expected and are no longer limited by the 30-min accept watchdog. If this persists, look for script errors between HEARTBEAT and CONNECTED.',
    },
    {
      re: /Timed out[\s\S]{0,200}waiting for Ghidra heartbeat/,
      reason: 'Ghidra never reached the DumpClassData heartbeat within 30 minutes. Import/analysis may still be running, or Ghidra stalled before the post-script.',
      hint: 'Check [ghidra-output] for import progress or ERROR REPORT. Very large binaries can take a long time to import before the post-script starts.',
    },
    {
      re: /Timed out[\s\S]{0,200}waiting for Ghidra/,
      reason: 'Ghidra ran for the full accept deadline (30 min) without connecting. Binary may still be importing, or the post-script stalled before HEARTBEAT/CONNECTED.',
      hint: 'Check [ghidra-output] for progress. After CONNECTED, payload transfer is not limited by this deadline — exclude noisy libraries via CoreConfig if decompile itself is too slow.',
    },
    {
      re: /Only \.ipa(?: or \.apk)? files|wrong extension|not a valid IPA|not an APK/i,
      reason: 'Uploaded file failed IPA validation.',
      hint: 'Make sure the file is a real `.ipa` (not a renamed .zip) and has at least one .app bundle inside.',
    },
    {
      re: /ANTHROPIC_API_KEY missing|OPENAI_API_KEY missing/,
      reason: 'LLM enrichment was enabled but the corresponding API key was not provided.',
      hint: 'Either provide a valid API key on upload, or disable LLM in the upload form.',
    },
    {
      re: /OutOfMemoryError/,
      reason: 'Java ran out of heap memory during analysis.',
      hint: 'Try a smaller IPA or run the CLI with `-Xmx4g` (or higher) in JAVA_OPTS.',
    },
  ];

  for (const p of patterns) {
    if (p.re.test(log)) return {reason: p.reason, hint: p.hint};
  }

  // Fallback: surface the last "Caused by:" line, or last RuntimeException line
  const causedBy = log.match(/Caused by: [^\n]+/g);
  if (causedBy && causedBy.length) {
    return {reason: causedBy[causedBy.length - 1].trim(), hint: ''};
  }
  const runtimeEx = log.match(/^\S*Exception:[^\n]+/gm);
  if (runtimeEx && runtimeEx.length) {
    return {reason: runtimeEx[runtimeEx.length - 1].trim(), hint: ''};
  }
  return {reason: '(no exception found in log — check full log for context)', hint:''};
}

/* ── summary tab ── */
async function tabSummary(d) {
  if (d.state !== 'done') {
    const isPending = d.state === 'queued' || d.state === 'running';
    if (isPending) {
      return `<div class="alert alert-warn">
          Analysis is <strong>${d.state}</strong> — this page will refresh automatically.
        </div>
        ${d.has_log?`<div class="card"><div class="card-title">Live log</div>
          <div id="live-log" class="log-box">Loading…</div></div>`:''}`;
    }
    // state === 'error' — fetch log tail, extract friendly reason
    let logTail = '';
    let reason  = 'Scan exited with code ' + (d.exit_code ?? '?');
    let hint    = '';
    try {
      const r = await api('/scans/'+d.scan_id+'/log?tail=500');
      logTail = (r.lines || []).join('\n');
      const extracted = extractErrorReason(logTail);
      if (extracted.reason) reason = extracted.reason;
      if (extracted.hint)   hint   = extracted.hint;
    } catch(_) {}

    return `
      <div class="alert alert-error">
        <strong>Scan failed</strong> — exit code ${d.exit_code ?? '?'}.
      </div>
      <div class="card" style="border-left:4px solid var(--red)">
        <div class="card-title">Why did this fail?</div>
        <p style="font-family:monospace;font-size:.82rem;line-height:1.55;color:var(--text);white-space:pre-wrap">${esc(reason)}</p>
        ${hint ? `<div class="alert alert-info" style="margin-top:.75rem">${hint}</div>` : ''}
      </div>
      <div class="card">
        <div class="card-title" style="justify-content:space-between">
          <span>Last ${Math.min(40, (logTail.split('\n').length))} log lines</span>
          <a href="#/scan/${d.scan_id}/log" style="font-size:.75rem;font-weight:400">View full log →</a>
        </div>
        <div class="log-box">${esc(logTail.split('\n').slice(-40).join('\n')) || '(log empty)'}</div>
      </div>`;
  }
  const archs = (d.architectures||[]).join(', ') || '—';
  return `
    <div class="grid-4" style="margin-bottom:1rem">
      <div class="stat"><div class="stat-val">${num(d.class_count)}</div><div class="stat-label">Classes</div></div>
      <div class="stat"><div class="stat-val">${num(d.function_count)}</div><div class="stat-label">Functions</div></div>
      <div class="stat"><div class="stat-val">${num(d.string_count)}</div><div class="stat-label">Strings</div></div>
      <div class="stat" style="cursor:pointer" onclick="goTab('${d.scan_id}','vulnerabilities')">
        <div class="stat-val" style="color:${(d.vulnerability_counts?.total||0)>0?'var(--high)':'var(--text)'}">${num(d.vulnerability_counts?.total)}</div>
        <div class="stat-label">Vulnerabilities ${d.vulnerability_counts?.CRITICAL?'<span class="badge badge-critical" style="margin-left:.3rem">'+d.vulnerability_counts.CRITICAL+' CRIT</span>':''}</div>
        ${(d.vulnerability_counts?.occurrences||0) > (d.vulnerability_counts?.total||0)
          ? `<div class="stat-sub">${num(d.vulnerability_counts.occurrences)} occurrences</div>` : ''}
      </div>
    </div>
    <div class="grid-2">
      <div class="card">
        <div class="card-title">Bundle</div>
        <div class="kv">
          <span class="kv-key">Platform</span><span class="kv-val">${esc(d.platform||'IOS')}</span>
          <span class="kv-key">Identifier</span><span class="kv-val">${esc(d.bundle_id||'—')}</span>
          <span class="kv-key">Executable</span><span class="kv-val">${esc(d.bundle_executable||'—')}</span>
          ${d.platform==='ANDROID' ? `
          <span class="kv-key">Min / Target SDK</span><span class="kv-val">${esc(d.min_sdk??'—')} / ${esc(d.target_sdk??'—')}</span>
          ` : `
          <span class="kv-key">Swift</span><span class="kv-val">${d.is_swift?'Yes':'No'}</span>
          <span class="kv-key">Universal</span><span class="kv-val">${d.is_universal?'Yes':'No'}</span>
          <span class="kv-key">Architectures</span><span class="kv-val">${esc(archs)}</span>
          `}
        </div>
      </div>
      <div class="card">
        <div class="card-title">${d.platform==='ANDROID' ? 'Android' : 'Signing'}</div>
        <div class="kv">
          ${d.platform==='ANDROID' ? `
          <span class="kv-key">Package</span><span class="kv-val">${esc(d.bundle_id||'—')}</span>
          <span class="kv-key">Decompiler</span><span class="kv-val">JADX</span>
          ` : `
          <span class="kv-key">Team ID</span><span class="kv-val">${esc(d.team_id||'—')}</span>
          <span class="kv-key">Profile</span><span class="kv-val">${esc(d.provisioning_profile||'—')}</span>
          <span class="kv-key">Expiry</span><span class="kv-val">${esc(d.provisioning_expiry||'—')}</span>
          `}
        </div>
      </div>
      <div class="card">
        <div class="card-title">Scan</div>
        <div class="kv">
          <span class="kv-key">Scan ID</span><span class="kv-val">${esc(d.scan_id)}</span>
          <span class="kv-key">File</span><span class="kv-val">${esc(d.filename)}</span>
          <span class="kv-key">LLM</span><span class="kv-val">${d.llm_enabled?esc(d.llm_provider)+' / '+esc(d.llm_mode):'disabled'}</span>

          <span class="kv-key">Duration</span><span class="kv-val">${dur(d.started_at, d.finished_at)}</span>
        </div>
      </div>
      <div class="card">
        <div class="card-title">Entry Points (${num(d.entry_point_count)})</div>
        <div id="ep-mini"><div class="spinner"></div></div>
      </div>
    </div>`;
}

/** Parse Android "name.type:class" and native "native:library/symbol" entry points. */
function parseEntryPoint(raw) {
  const s = String(raw || '');
  const native = s.match(/^native:([^/]+)\/(.+)$/);
  if (native) return { raw: s, name: native[1], type: 'native', cls: native[2], short: native[2] };
  const m = s.match(/^([^.:]+)\.([a-zA-Z]+):(.+)$/);
  if (!m) return { raw: s, name: s, type: '', cls: '', short: s };
  const cls = m[3];
  const short = cls.includes('.') ? cls.split('.').pop() : cls;
  return { raw: s, name: m[1], type: m[2].toLowerCase(), cls, short };
}

function renderEntryPointItem(raw) {
  const ep = parseEntryPoint(raw);
  if (!ep.type) {
    return `<li class="ep-item" title="${escAttr(ep.raw)}"><span class="ep-class">${esc(ep.raw)}</span></li>`;
  }
  return `<li class="ep-item" title="${escAttr(ep.raw)}">
    <span class="ep-type ep-type-${escAttr(ep.type)}">${esc(ep.type)}</span>
    <span class="ep-name">${esc(ep.name)}</span>
    <span class="ep-class">${esc(ep.short)}</span>
  </li>`;
}

async function postSummaryHydrate(id) {
  const previewSize = 6;
  const el = document.getElementById('ep-mini');
  if (!el) return;
  try {
    const eps = await api('/scans/'+id+'/entrypoints');
    // The original element is detached whenever the scan or tab is re-rendered.
    if (!el.isConnected || el !== document.getElementById('ep-mini')) return;
    if (!eps.length) { el.innerHTML='<div class="empty" style="padding:.5rem">None detected.</div>'; return; }
    const preview = eps.slice(0, previewSize);
    const count = eps.length > previewSize
      ? `<span class="ep-summary-count">Showing ${preview.length} of ${eps.length.toLocaleString()}</span>`
      : '<span></span>';
    const href = '#/scan/' + encodeURIComponent(String(id)) + '/entrypoints';
    el.innerHTML = '<ul class="ep-list">'+preview.map(renderEntryPointItem).join('')+'</ul>'
      + `<div class="ep-summary-footer">${count}<a href="${escAttr(href)}">View all entry points →</a></div>`;
  } catch(_) {
    if (el.isConnected && el === document.getElementById('ep-mini')) {
      el.innerHTML='<span class="muted">—</span>';
    }
  }
}

function renderFnPagination(id, page, size, total) {
  const el = document.getElementById('fn-pages');

  let html = `<span>${total.toLocaleString()} total</span>`;
  if (page>0) html+=`<button class="page-btn" onclick="fnPage('${id}',${page-1})">←</button>`;
  const start=Math.max(0,page-2), end=Math.min(pages,page+3);
  for(let i=start;i<end;i++)
    html+=`<button class="page-btn${i===page?' active':''}" onclick="fnPage('${id}',${i})">${i+1}</button>`;
  if (page<pages-1) html+=`<button class="page-btn" onclick="fnPage('${id}',${page+1})">→</button>`;
  el.innerHTML=html;
}

let stringsRequestSeq = 0;

async function tabStrings(el, id, detail) {
  if (detail.state !== 'done') { el.innerHTML=`<div class="alert alert-warn">Scan not complete.</div>`; return; }
  const root = document.createElement('div');
  root.id = 'strings-root';
  root.innerHTML = `

    </div>

    <div id="str-pages" class="pagination strings-pagination"></div>`;
  el.replaceChildren(root);

  const state = {page:1, size:50, query:''};
  const search = () => {
    state.query = root.querySelector('#str-q').value.trim();
    state.page = 1;
    loadStrings(root, id, state);
  };
  root.querySelector('#str-search').addEventListener('click', search);
  root.querySelector('#str-q').addEventListener('keydown', event => {
    if (event.key === 'Enter') search();
  });
  await loadStrings(root, id, state);

async function loadStrings(root, id, state) {
  const table = root.querySelector('#str-table');
  const pager = root.querySelector('#str-pages');
  if (!table || !pager) return;
  const requestSeq = ++stringsRequestSeq;
  table.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
  pager.innerHTML = '';
  try {
    const params = new URLSearchParams({page:state.page, size:state.size});
    if (state.query) params.set('q', state.query);
    const data = await api('/scans/'+id+'/strings?'+params);
    if (requestSeq !== stringsRequestSeq || !root.isConnected
        || root !== document.getElementById('strings-root')) return;

    const items = Array.isArray(data.items) ? data.items : [];
    const total = Math.max(0, Number(data.total) || 0);
    const page = Math.max(1, Number(data.page) || 1);
    const size = Math.max(1, Number(data.size) || state.size);
    const pages = Math.max(0, Number(data.pages) || 0);
    state.page = page;

    table.innerHTML = items.length
      ? `<div class="tbl-wrap"><table class="strings-table">
          <thead><tr><th>Address</th><th>Value</th><th>Segment</th><th>Label</th></tr></thead>
          <tbody>${items.map(s=>`<tr>
            <td class="mono">${esc(s.address||'')}</td>
            <td class="truncate" title="${escAttr(s.value||'')}">${esc(s.value||'')}</td>
            <td>${esc(s.segment||'')}</td>
            <td>${esc(s.label||'')}</td>
          </tr>`).join('')}</tbody>
        </table></div>`
      : '<div class="empty">No strings found.</div>';

    const first = items.length ? (page - 1) * size + 1 : 0;
    const last = items.length ? first + items.length - 1 : 0;
    pager.innerHTML = `<span>Showing ${esc(String(first))}–${esc(String(last))} of ${esc(total.toLocaleString())} · Page ${esc(String(pages ? page : 0))} of ${esc(String(pages))}</span>
      <span class="strings-pagination-actions">
        <button class="page-btn" data-page="prev" ${page <= 1 ? 'disabled' : ''}>Previous</button>
        <button class="page-btn" data-page="next" ${pages === 0 || page >= pages ? 'disabled' : ''}>Next</button>
      </span>`;
    pager.querySelector('[data-page="prev"]').onclick = () => {
      if (state.page > 1) { state.page--; loadStrings(root, id, state); }
    };
    pager.querySelector('[data-page="next"]').onclick = () => {
      if (state.page < pages) { state.page++; loadStrings(root, id, state); }
    };
  } catch(e) {
    if (requestSeq === stringsRequestSeq && root.isConnected
        && root === document.getElementById('strings-root')) {
      table.innerHTML=`<div class="alert alert-error">${esc(e.message)}</div>`;
    }
  }
}

async function tabEntryPoints(el, id, detail) {
  if (detail.state !== 'done') { el.innerHTML=`<div class="alert alert-warn">Scan not complete.</div>`; return; }
  const pageSize = 50;
  const root = document.createElement('div');
  root.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
  el.replaceChildren(root);
  try {
    const eps = await api('/scans/'+id+'/entrypoints');
    if (!root.isConnected || !el.contains(root)) return;
    if (!eps.length) { root.innerHTML='<div class="empty">No entry points detected.</div>'; return; }

    let page = 0;

    const renderPage = () => {
      if (!root.isConnected || !el.contains(root)) return;
      const filtered = query
        ? eps.filter(ep => String(ep).toLowerCase().includes(query))
        : eps;
      const pages = Math.max(1, Math.ceil(filtered.length / pageSize));
      page = Math.min(page, pages - 1);

      const list = root.querySelector('#ep-full-list');
      const pager = root.querySelector('#ep-pages');
      const title = root.querySelector('#ep-full-title');

      list.innerHTML = pageItems.length
        ? `<ul class="ep-list" style="font-size:.82rem">${pageItems.map(renderEntryPointItem).join('')}</ul>`
        : '<div class="empty">No entry points match this filter.</div>';
      const totalText = query
        ? `${filtered.length.toLocaleString()} of ${eps.length.toLocaleString()} matching`
        : `${eps.length.toLocaleString()} total`;
      pager.innerHTML = `<span>${totalText} · Page ${page + 1} of ${pages}</span>
        <span class="ep-pagination-actions">
          <button class="page-btn" data-page="prev" ${page === 0 ? 'disabled' : ''}>Previous</button>
          <button class="page-btn" data-page="next" ${page >= pages - 1 ? 'disabled' : ''}>Next</button>
        </span>`;
      pager.querySelector('[data-page="prev"]').onclick = () => { if (page > 0) { page--; renderPage(); } };
      pager.querySelector('[data-page="next"]').onclick = () => { if (page < pages - 1) { page++; renderPage(); } };
    };

    root.querySelector('#ep-filter').addEventListener('input', event => {
      query = event.target.value.trim().toLowerCase();
      page = 0;
      renderPage();
    });
    renderPage();
  } catch(e) {
    if (root.isConnected && el.contains(root)) {
      root.innerHTML=`<div class="alert alert-error">${esc(e.message)}</div>`;
    }
  }
}

    'Search strings, resources, and the manifest or Info.plist for related flags, permissions, and configuration values.',

  ];
  const dynamicChecks = Array.isArray(a.dynamic_checks) && a.dynamic_checks.length ? a.dynamic_checks : [
    'On an authorized test device, exercise the related user flow and record whether the protection is actually enforced at runtime.',
    'Compare behavior on a stock device versus a lab device where the condition this control is meant to detect is present.',

/* ── vulnerabilities tab ── */
/** Group raw vulnerability rows by rule_id (same issue, many assets). */
function groupFindingsByRule(findings) {
  const STATUS_PREF = { open: 0, accepted_risk: 1, fixed: 2, false_positive: 3 };
  const map = new Map();
  for (const f of findings) {
    const key = f.rule_id || `__id_${f.id}`;
    let g = map.get(key);
    if (!g) {
      g = { rule_id: f.rule_id, occurrences: [], representative: f };
      map.set(key, g);
    }
    g.occurrences.push(f);
    const cur = g.representative;
    const stA = STATUS_PREF[(f.status || 'open').toLowerCase()] ?? 9;
    const stB = STATUS_PREF[(cur.status || 'open').toLowerCase()] ?? 9;
    const sevA = SEV_RANK[String(f.effective_severity || f.severity || 'INFO').toUpperCase()] || 0;
    const sevB = SEV_RANK[String(cur.effective_severity || cur.severity || 'INFO').toUpperCase()] || 0;
    // Prefer open/active for triage; then higher severity; then lower id (stable).
    if (stA < stB || (stA === stB && (sevA > sevB || (sevA === sevB && (f.id||0) < (cur.id||0))))) {
      g.representative = f;
    }
  }
  return [...map.values()];
}

function assetDedupeKey(f) {
  return [
    String(f.affected_type||'').trim().toLowerCase(),
    String(f.affected_name||'').trim().toLowerCase(),
    String(f.evidence_location||'').trim().toLowerCase(),
  ].join('\0');
}

function uniqueAffectedAssets(occurrences) {
  const seen = new Set();
  const out = [];
  for (const f of occurrences) {
    const k = assetDedupeKey(f);
    if (seen.has(k)) continue;
    seen.add(k);
    out.push(f);
  }
  return out;
}

function countUniqueIssueSeverities(groups) {
  const counts = { CRITICAL: 0, HIGH: 0, MEDIUM: 0, LOW: 0, INFO: 0 };
  for (const g of groups) {
    const st = (g.representative.status || 'open').toLowerCase();
    // Unique open/active issues (exclude FP + fixed from summary cards)
    if (st === 'false_positive' || st === 'fixed') continue;
    const sev = String(g.representative.effective_severity || g.representative.severity || 'INFO').toUpperCase();
    if (sev in counts) counts[sev]++;
    else counts.INFO++;
  }
  return counts;
}

function renderAffectedAssetsList(assets) {
  if (!assets.length) {
    return `<div class="kv">
      <span class="kv-key">Type</span><span class="kv-val">—</span>
      <span class="kv-key">Name</span><span class="kv-val">—</span>
      <span class="kv-key">Location</span><span class="kv-val">—</span>
    </div>`;
  }
  return `<div class="affected-list">${assets.map(a => `
    <div class="affected-item">
      <div class="aff-name">${esc(a.affected_name || '—')}</div>
      <div class="aff-meta">
        ${esc(a.affected_type || 'asset')}${a.evidence_location ? ' · ' + esc(a.evidence_location) : ''}
      </div>
    </div>`).join('')}</div>`;
}

async function tabVulnerabilities(el, id, detail) {
  if (detail.state !== 'done') {

  }
  el.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
  try {

    if (!findings.length) {
      el.innerHTML = `<div class="card"><div class="card-title">No vulnerabilities detected</div>

    const groups = groupFindingsByRule(findings);
    const counts = countUniqueIssueSeverities(groups);
    const totals = `
      <div class="grid-4" style="margin-bottom:1rem">
        <div class="stat"><div class="stat-val" style="color:var(--high)">${counts.CRITICAL||0}</div><div class="stat-label">Critical</div></div>
        <div class="stat"><div class="stat-val" style="color:var(--medium)">${counts.HIGH||0}</div><div class="stat-label">High</div></div>

      </div>
      <p style="font-size:.75rem;color:var(--muted);margin:-.35rem 0 1rem">

    // Filter bar (severity + status + free-text search)
    const fpCount = groups.filter(g => (g.representative.status || '') === 'false_positive').length;
    const filter = `
      <div class="search-bar">
        <input id="vuln-q" type="text" placeholder="Filter by ID, title, category, severity, status…"/>
        <select id="vuln-sev">

          <option value="LOW">Low</option>
        </select>
        <select id="vuln-status">
          <option value="active">Active only</option>
          <option value="all" selected>Show all</option>
          <option value="open">Open only</option>
          <option value="false_positive">False positive only</option>

          <option value="fixed">Fixed only</option>
        </select>
      </div>
      ${fpCount ? `<div class="alert alert-info" style="margin-bottom:.75rem">
         <strong>${fpCount}</strong> unique issue${fpCount===1?'':'s'} marked as <em>false positive</em> &mdash;
         shown here with a dimmed style, but excluded from generated reports.

      const sev = document.getElementById('vuln-sev')?.value || '';
