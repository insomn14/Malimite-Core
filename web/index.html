function statusKey(s) {
  return s === 'false_positive' ? 'falseposit'
       : s === 'accepted_risk'  ? 'accepted'
       : s === 'fixed'          ? 'fixed'
       : 'open';
}
function statusLabel(s) {
  return s === 'false_positive' ? 'False Positive'
       : s === 'accepted_risk'  ? 'Accepted Risk'
       : s === 'fixed'          ? 'Fixed'
       : 'Open';
}

/* ── AI Fix (per-finding Description/Evidence/Risk/PoC/Remediation rewrite) ── */

const AI_FIX_FIELDS = [
  {key: 'description', label: 'Description'},
  {key: 'evidence',    label: 'Evidence'},
  {key: 'risk',        label: 'Risk (severity/CVSS)'},
  {key: 'poc_steps',   label: 'Proof of Concept'},
  {key: 'remediation', label: 'Remediation'},
];

function renderAiFixPanel(v) {
  const isAiFixed = v.ai_fix_status === 'applied';
  const statusLine = isAiFixed
    ? `<div class="aifix-status">✨ Applied${v.ai_fix_provider ? ` by <strong>${esc(v.ai_fix_provider)}</strong>${v.ai_fix_model ? '/' + esc(v.ai_fix_model) : ''}` : ''}${v.ai_fix_at ? ` on ${new Date(v.ai_fix_at).toLocaleString()}` : ''}.</div>`
    : `<div class="aifix-status">Not yet AI-fixed. The LLM will rewrite the fields below, grounded in this finding (and decompiled source when available), and store them as reversible overrides — the original scanned text is never changed.</div>`;
  const fieldChecks = AI_FIX_FIELDS.map(f =>
    `<label class="aifix-field"><input type="checkbox" name="fields" value="${f.key}" checked/> ${f.label}</label>`
  ).join('');
  return `
    <div class="aifix-panel">
      ${statusLine}
      <form class="triage-form" onsubmit="return false">
        <label>LLM Provider
          <select id="aifix-provider-${v.id}" onchange="onAiFixProviderChange(${v.id})">
            <option value="">Scan default</option>
            <option value="claude">claude</option><option value="claude-oauth">claude (OAuth)</option>
            <option value="openai">openai</option><option value="deepseek">deepseek</option>
            <option value="ollama">ollama</option>
          </select>
        </label>
        <label>Model override (optional)
          <select id="aifix-model-select-${v.id}" hidden onchange="onAiFixModelSelectChange(${v.id})"></select>
          <input type="text" id="aifix-model-${v.id}" placeholder="leave empty for provider default"/>
        </label>
        <div class="full">
          <div style="font-size:.72rem;color:var(--muted);margin-bottom:.3rem">Fields to rewrite</div>
          <div class="aifix-fields" id="aifix-fields-${v.id}">${fieldChecks}</div>
        </div>
        <div class="triage-actions full">
          <button class="btn btn-primary btn-sm" type="button" onclick="runAiFix(${v.id})">✨ Run AI Fix</button>
          ${isAiFixed ? `<button class="btn btn-ghost btn-sm" type="button" onclick="revertAiFix(${v.id})">Revert to original</button>` : ''}
          <button class="btn btn-ghost btn-sm" type="button" onclick="toggleAiFix(${v.id})">Close</button>
          <span class="triage-msg" id="aifix-msg-${v.id}"></span>
        </div>
      </form>
    </div>`;
}

window.toggleAiFix = function(id) {
  const el = document.getElementById('aifix-'+id);
  if (el) el.hidden = !el.hidden;
};

/* Same dropdown-with-Custom-escape-hatch pattern as the upload form / AI Assistant chat bar
   (see onProviderChange/onChatProviderChange), parametrized by finding id since several AI Fix
   panels can be open on the same Vulnerabilities page at once. */
window.onAiFixProviderChange = function(id) {
  const provider = document.getElementById(`aifix-provider-${id}`)?.value || '';
  const modelSelect = document.getElementById(`aifix-model-select-${id}`);
  const modelEl = document.getElementById(`aifix-model-${id}`);
  if (!modelSelect || !modelEl) return;
  const catalog = LLM_MODEL_CATALOG[provider === 'claude-oauth' ? 'claude' : provider];
  if (catalog) {
    modelSelect.innerHTML = catalog.map(m => `<option value="${escAttr(m.value)}">${esc(m.label)}</option>`).join('')
      + `<option value="${LLM_MODEL_CUSTOM}">Custom (type model name)…</option>`;
    modelSelect.value = catalog[0].value;
    modelSelect.hidden = false;
    modelEl.hidden = true;
    modelEl.value = '';
  } else {
    // ollama or "Scan default": no fixed catalog, plain text as before.
    modelSelect.hidden = true;
    modelEl.hidden = false;
  }
};

window.onAiFixModelSelectChange = function(id) {
  const modelSelect = document.getElementById(`aifix-model-select-${id}`);
  const modelEl = document.getElementById(`aifix-model-${id}`);
  if (!modelSelect || !modelEl) return;
  const custom = modelSelect.value === LLM_MODEL_CUSTOM;
  modelEl.hidden = !custom;
  if (custom) { modelEl.value = ''; modelEl.focus(); }
};

window.runAiFix = async function(id) {
  const msg = document.getElementById('aifix-msg-'+id);
  const provider = document.getElementById(`aifix-provider-${id}`).value;
  const modelSelect = document.getElementById(`aifix-model-select-${id}`);
  const modelInput = document.getElementById(`aifix-model-${id}`);
  // Dropdown is shown for providers with a known catalog, unless "Custom…" was chosen.
  const model = (modelSelect && !modelSelect.hidden && modelSelect.value !== LLM_MODEL_CUSTOM)
    ? modelSelect.value
    : modelInput.value.trim();
  const checked = Array.from(document.querySelectorAll(`#aifix-fields-${id} input:checked`)).map(c => c.value);
  if (!checked.length) {
    msg.textContent = 'Select at least one field to rewrite.';
    msg.className = 'triage-msg err';
    return;
  }
  const body = { fields: checked };
  if (provider) body.provider = provider;
  if (model) body.model = model;
  msg.textContent = 'Generating… this can take a moment.'; msg.className = 'triage-msg';
  try {
    const scanId = location.hash.split('/')[2];
    const r = await fetch(`/api/v1/scans/${scanId}/vulnerabilities/${id}/ai-fix`, {
      method: 'POST',
      headers: { ...headers(), 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!r.ok) { const txt = await r.text(); throw new Error(txt); }
    msg.textContent = 'Applied · refreshing…';
    setTimeout(() => router(), 400);
  } catch(e) {
    msg.textContent = 'Error: ' + (e.message || e).slice(0, 300);
    msg.className = 'triage-msg err';
  }
};

window.revertAiFix = async function(id) {
  const msg = document.getElementById('aifix-msg-'+id);
  if (msg) { msg.textContent = 'Reverting…'; msg.className = 'triage-msg'; }
  try {
    const scanId = location.hash.split('/')[2];
    const r = await fetch(`/api/v1/scans/${scanId}/vulnerabilities/${id}/ai-fix/revert`, {
      method: 'POST',
      headers: headers(),
    });
    if (!r.ok) { const txt = await r.text(); throw new Error(txt); }
    if (msg) msg.textContent = 'Reverted · refreshing…';
    setTimeout(() => router(), 400);
  } catch(e) {
    if (msg) { msg.textContent = 'Error: ' + (e.message || e).slice(0, 300); msg.className = 'triage-msg err'; }
  }
};

const AE_FIELDS = [
  {key: 'description', title: 'Description',      desc: 'Improve clarity and provide better context.'},
  {key: 'evidence',    title: 'Evidence',         desc: 'Enhance evidence with more details.'},
  {key: 'risk',        title: 'Risk Analysis',    desc: 'Strengthen risk assessment.'},
  {key: 'poc_steps',   title: 'Proof of Concept', desc: 'Add reproducible steps.'},
  {key: 'remediation', title: 'Remediation',      desc: 'Suggest actionable fixes.'},
];

const AE_PROVIDERS = [
  {value: '',             label: 'Scan default'},
  {value: 'openai',       label: 'OpenAI'},
  {value: 'claude',       label: 'Claude (API key)'},
  {value: 'claude-oauth', label: 'Claude (Pro/Max OAuth)'},
  {value: 'deepseek',     label: 'DeepSeek'},
  {value: 'ollama',       label: 'Ollama'},
];

const AE = {
  scanId: null, detail: null, groups: [],
  selected: new Set(), fields: new Set(AE_FIELDS.map(f => f.key)),
  tab: 'select', q: '', sev: '', provider: '', model: '', customModel: '',
  job: null, history: [], poll: null, tick: null, open: false, error: '',
  sort: 'newest', logView: 'latest', expanded: new Set(), busy: new Set(),
};

function aeRows() {
  return AE.groups.map(g => {
    const v = g.representative;
    return {
      id: v.id, rule_id: v.rule_id || '', title: v.title || '',
      sev: String(v.effective_severity || v.override_severity || v.severity || 'INFO').toUpperCase(),
      cvss: Number(v.effective_cvss_score ?? v.cvss_score ?? 0),
      category: v.category || '', status: (v.status || 'open').toLowerCase(),
      fixed: v.ai_fix_status === 'applied', occ: g.occurrences.length,
    };
  }).sort((a, b) => (SEV_RANK[b.sev] || 0) - (SEV_RANK[a.sev] || 0) || b.cvss - a.cvss);
}

function aeVisibleRows() {
  const q = AE.q.trim().toLowerCase();
  return aeRows().filter(r =>
    (!AE.sev || r.sev === AE.sev) &&
    (!q || `${r.title} ${r.rule_id} ${r.category} ${r.id}`.toLowerCase().includes(q)));
}

function aeRunning() { return AE.job && (AE.job.state === 'queued' || AE.job.state === 'running'); }

function aeModelValue() {
  return AE.model === LLM_MODEL_CUSTOM ? AE.customModel.trim() : AE.model;
}

/* Called on every Vulnerabilities tab render: remembers the scan for the modal and shows a
   banner when a job started earlier (maybe from another tab) is still running. */
function aeBindScan(scanId, detail, groups) {
  if (AE.scanId !== scanId) {
    aeStopPoll();
    Object.assign(AE, {selected: new Set(), job: null, history: [], q: '', sev: '', error: '', tab: 'select'});
  }
  AE.scanId = scanId; AE.detail = detail; AE.groups = groups;
  api(`/scans/${scanId}/auto-enhance`).then(o => {
    if (AE.scanId !== scanId) return;
    AE.history = o.history || [];
    if (o.active) { AE.job = o.active; aeStartPoll(); }
    aeRenderBanner();
    if (AE.open) aeRender();
  }).catch(() => {});
}

function aeRenderBanner() {
  const slot = document.getElementById('ae-banner-slot');
  if (!slot) return;
  if (!aeRunning() || AE.open) { slot.innerHTML = ''; return; }
  const j = AE.job;
  slot.innerHTML = `<div class="ae-banner">✨ Auto Enhance running — ${j.completed}/${j.total} findings processed
    <button class="btn btn-ghost btn-sm" style="margin-left:auto" onclick="openAutoEnhance('log')">View progress</button></div>`;
}

window.openAutoEnhance = function(tab) {
  if (!AE.scanId) return;
  AE.open = true; AE.error = '';
  AE.tab = tab || (aeRunning() ? 'log' : AE.tab || 'select');
  if (!AE.provider && AE.detail?.llm_provider && AE_PROVIDERS.some(p => p.value === AE.detail.llm_provider)) {
    AE.provider = AE.detail.llm_provider;
    const cat = LLM_MODEL_CATALOG[AE.provider];
    AE.model = cat ? (cat.some(m => m.value === AE.detail.llm_model) ? AE.detail.llm_model : cat[0].value) : '';
    AE.customModel = cat ? '' : (AE.detail.llm_model || '');
  }
  let ov = document.getElementById('ae-overlay');
  if (!ov) {
    ov = document.createElement('div');
    ov.id = 'ae-overlay';
    ov.className = 'ae-overlay';
    ov.addEventListener('mousedown', e => { if (e.target === ov) closeAutoEnhance(); });
    document.body.appendChild(ov);
    document.addEventListener('keydown', aeOnKey);
  }
  aeRender();
  aeRenderBanner();
  // refresh the activity log / live job in the background
  api(`/scans/${AE.scanId}/auto-enhance`).then(o => {
    AE.history = o.history || [];
    if (o.active) { AE.job = o.active; aeStartPoll(); if (!tab) AE.tab = 'log'; }
    if (AE.open) aeRender();
  }).catch(() => {});
};

function aeOnKey(e) { if (e.key === 'Escape' && AE.open) closeAutoEnhance(); }

window.closeAutoEnhance = function() {
  AE.open = false;
  aeStopTick();
  document.getElementById('ae-overlay')?.remove();
  document.removeEventListener('keydown', aeOnKey);
  aeRenderBanner();
};

function aeStatusCell(r) {
  if (r.fixed) return '<span class="badge badge-aifix">✨ AI-enhanced</span>';
  if (r.status !== 'open') return `<span class="badge badge-${statusKey(r.status)}">${statusLabel(r.status)}</span>`;
  return '<span style="color:var(--muted)">—</span>';
}

      <tr class="${AE.selected.has(r.id) ? 'sel' : ''}" onclick="aeToggleRow(event, ${r.id})">

        <td><span class="badge badge-${r.sev.toLowerCase()}">${esc(r.sev)}</span></td>
        <td class="c">${r.cvss.toFixed(1)}</td>

        <td class="hide-sm">${aeStatusCell(r)}</td>
        <td class="c"><button class="ae-chev" title="Show this finding in the list" onclick="aeJumpTo(event, ${r.id})">›</button></td>
      </tr>`).join('')
    : `<tr><td colspan="7" class="ae-empty">No findings match the current filter.</td></tr>`;
  const fieldCards = AE_FIELDS.map(f => `
      <label class="ae-field ${AE.fields.has(f.key) ? 'on' : ''}">
        <input type="checkbox" ${AE.fields.has(f.key) ? 'checked' : ''} onchange="aeToggleField('${f.key}', this.checked)">
        ${AE_ICONS[f.key]}
        <div class="ae-field-t">${f.title}</div>
        <div class="ae-field-d">${f.desc}</div>
      </label>`).join('');
  return `
    <div class="ae-tools">
      <input type="search" id="ae-q" placeholder="Search findings by title or ID" value="${escAttr(AE.q)}" oninput="aeSetQuery(this.value)">
      <select onchange="aeSetSev(this.value)">
        ${sevOpt('', 'All severities')}${sevOpt('CRITICAL', 'Critical')}${sevOpt('HIGH', 'High')}${sevOpt('MEDIUM', 'Medium')}${sevOpt('LOW', 'Low')}${sevOpt('INFO', 'Info')}
      </select>
      <label class="ae-check-btn" title="Selects every visible finding that is not AI-enhanced yet">
        <input type="checkbox" ${allSel ? 'checked' : ''} onchange="aeSelectAll(this.checked)"> Select all
      </label>
      <button class="btn btn-ghost" type="button" onclick="aeClear()">Clear</button>
    </div>
    <div class="ae-table-wrap">
      <table class="ae-table">
        <thead><tr>
          <th class="c"><input type="checkbox" ${allSel ? 'checked' : ''} onchange="aeSelectAll(this.checked)" aria-label="Select all"></th>
          <th>Finding</th><th>Severity</th><th class="c">CVSS</th><th class="hide-sm">Category</th><th class="hide-sm">Status</th><th></th>
        </tr></thead>
        <tbody>${body}</tbody>
      </table>
    </div>
    <div class="ae-fields-box">
      <div class="ae-fields-title">${AE_ICONS.sliders} Fields to enhance</div>
      <div class="ae-fields-sub">Choose which AI-generated sections to update for every selected finding.</div>
      <div class="ae-fields">${fieldCards}</div>
    </div>
    <div class="ae-note">⚠️ Original scanner output is preserved; AI changes are saved as reversible overrides.</div>`;
}

const AE_FIELD_TITLE = Object.fromEntries(AE_FIELDS.map(f => [f.key, f.title]));
const AE_ITEM_STATE = {
  pending:   {label: 'Queued',    cls: 'pending'},
  running:   {label: 'Enhancing', cls: 'running'},
  applied:   {label: 'Completed', cls: 'applied'},
  failed:    {label: 'Failed',    cls: 'failed'},
  cancelled: {label: 'Skipped',   cls: 'cancelled'},
};

/* The live/just-finished job first, then the persisted history without its duplicate. */
function aeRuns() {
  const runs = AE.job ? [AE.job] : [];
  for (const h of AE.history) if (!AE.job || h.job_id !== AE.job.job_id) runs.push(h);
  return runs;
}

function aeFmtClock(ms) {
  const t = Math.max(0, Math.round((ms || 0) / 1000));
  const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), sec = t % 60;
  return [h, m, sec].map(n => String(n).padStart(2, '0')).join(':');
}

function aeFmtDur(ms) {
  if (ms == null) return '';
  const t = Math.max(0, Math.round(ms / 1000));
  return `${String(Math.floor(t / 60)).padStart(2, '0')}:${String(t % 60).padStart(2, '0')}s`;
}

function aeElapsed(run) {
  if (!run.started_at) return 0;
  const end = (run.state === 'queued' || run.state === 'running') ? Date.now() : (run.finished_at || Date.now());
  return end - run.started_at;
}

function aeSortedItems(run) {
  const items = [...(run.items || [])];
  const rank = it => it.state === 'running' ? 1 : it.state === 'pending' ? 2 : 0;
  const t = it => it.finished_at || it.started_at || 0;
  if (AE.sort === 'oldest') {
    return items.sort((x, y) => rank(x) - rank(y) || t(x) - t(y));
  }
  // newest first: live work on top, then most recently finished, queued last
  const rnk = it => it.state === 'running' ? 0 : it.state === 'pending' ? 2 : 1;
  return items.sort((x, y) => rnk(x) - rnk(y) || t(y) - t(x));
}

function aeRunBanner(run) {
  const busy = run.state === 'queued' || run.state === 'running';
  const n = run.total, who = `${esc(run.provider)}/${esc(run.model)}`;
  const when = run.finished_at ? new Date(run.finished_at).toLocaleString() : '';
  let kind, title, sub, action = '';
  if (busy && run.cancel_requested) {
    kind = 'cancelling'; title = 'Cancelling batch…';
    sub = 'Findings already in progress will finish; the rest are being skipped.';
  } else if (busy) {
    kind = 'running'; title = 'AI Enhancement in Progress';
    sub = `Processing ${n} selected finding${n === 1 ? '' : 's'} with ${who}. This may take a few minutes…`;
    action = `<button class="ae-cancel" type="button" onclick="aeCancel('${run.job_id}')"><span class="ae-stop"></span>Cancel Batch</button>`;
  } else if (run.state === 'cancelled') {
    kind = 'cancelled'; title = 'Batch cancelled';
    sub = `${run.succeeded} of ${n} enhanced with ${who} before it was stopped · ${when}`;
  } else if (run.state === 'error') {
    kind = 'error'; title = 'Batch stopped unexpectedly';
    sub = esc(run.error || 'Unknown error');
  } else if (run.failed) {
    kind = 'partial'; title = 'AI Enhancement finished with errors';
    sub = `${run.succeeded} of ${n} enhanced with ${who} · ${when} — retry the failed findings below.`;
  } else if (run.cancelled) {
    kind = 'partial'; title = 'AI Enhancement finished — some findings skipped';
    sub = `${run.succeeded} of ${n} enhanced with ${who} · ${when} — ${run.cancelled} skipped, retry them below.`;
  } else {
    kind = 'done'; title = 'AI Enhancement Complete';
    sub = `${run.succeeded} of ${n} finding${n === 1 ? '' : 's'} enhanced with ${who} · ${when}`;
  }
  const icon = busy ? AE_ICONS.refresh : kind === 'done' ? AE_ICONS.check : kind === 'cancelled' ? AE_ICONS.stopCircle : AE_ICONS.alert;
  return `
    <div class="ae-run-banner is-${kind}">
      <div class="ae-run-icon ${busy ? 'spin' : ''}">${icon}</div>
      <div class="ae-run-text"><div class="ae-run-title">${title}</div><div class="ae-run-sub">${sub}</div></div>
      ${action}
    </div>`;
}

function aeRunStats(run) {
  const total = run.total || 0;
  const processed = (run.succeeded || 0) + (run.failed || 0);  // skipped (cancelled) findings were never processed
  const pct = total ? Math.round(processed / total * 100) : 0;
  const r = 15, c = 2 * Math.PI * r, done = total ? (run.succeeded || 0) / total : 0;
  const failPart = total ? (run.failed || 0) / total : 0;
  return `
    <div class="ae-stats">
      <div class="ae-stat ae-stat-ring">
        <svg viewBox="0 0 40 40" class="ae-ring">
          <circle cx="20" cy="20" r="${r}" class="ae-ring-bg"/>
          <circle cx="20" cy="20" r="${r}" class="ae-ring-ok" stroke-dasharray="${(done * c).toFixed(2)} ${c.toFixed(2)}"/>
          <circle cx="20" cy="20" r="${r}" class="ae-ring-fail" stroke-dasharray="${(failPart * c).toFixed(2)} ${c.toFixed(2)}"
                  stroke-dashoffset="${(-done * c).toFixed(2)}"/>
        </svg>
        <div><div class="ae-stat-val">${run.succeeded || 0} / ${total}</div><div class="ae-stat-lbl">Completed</div></div>
      </div>
      <div class="ae-stat">
        <span class="ae-stat-ico is-fail">${AE_ICONS.alert}</span>
        <div><div class="ae-stat-val">${run.failed || 0}</div><div class="ae-stat-lbl">Failed</div></div>
      </div>
      <div class="ae-stat">
        <span class="ae-stat-ico">${AE_ICONS.clock}</span>
        <div><div class="ae-stat-val" data-ae-elapsed="${run.job_id}">${aeFmtClock(aeElapsed(run))}</div><div class="ae-stat-lbl">Elapsed Time</div></div>
      </div>
      <div class="ae-stat ae-stat-bar">
        <div class="ae-bar"><div style="width:${pct}%"></div></div>
        <span class="ae-bar-pct">${pct}%</span>
      </div>
    </div>`;
}

function aeTimeline(run) {
  const items = aeSortedItems(run);
  if (!items.length) return '<div class="ae-empty">No findings in this run.</div>';
  const canRetry = !(run.cancel_requested && (run.state === 'running' || run.state === 'queued'));
  return `<div class="ae-tl">${items.map(it => {
    const st = AE_ITEM_STATE[it.state] || AE_ITEM_STATE.pending;
    const key = `${run.job_id}:${it.vuln_id}`;
    const open = AE.expanded.has(key);
    const mark = it.state === 'applied' ? AE_ICONS.checkFilled
               : it.state === 'failed' ? AE_ICONS.alertFilled
               : it.state === 'running' ? '<span class="ae-spinner"></span>'
               : it.state === 'cancelled' ? AE_ICONS.stopCircle : '<span class="ae-dot"></span>';
    const meta = [it.rule_id, it.category ? it.category.charAt(0) + it.category.slice(1).toLowerCase() : '']
      .filter(Boolean).map(esc).join(' · ');
    const fieldsTxt = (it.updated_fields || []).map(k => AE_FIELD_TITLE[k] || k).join(', ');
    const retrying = AE.busy.has(key);
    const retryBtn = canRetry && (it.state === 'failed' || it.state === 'cancelled')
      ? `<button class="ae-retry" type="button" ${retrying ? 'disabled' : ''} onclick="aeRetry('${run.job_id}', ${it.vuln_id})">${AE_ICONS.refresh}${retrying ? 'Retrying…' : 'Retry Finding'}</button>` : '';
    let line = '';
    if (it.state === 'applied' && it.updated_fields === undefined) {
      line = `<div class="ae-tl-upd">${AE_ICONS.checkFilled}<strong>Enhanced</strong></div>`;  // pre-detail log entry
    } else if (it.state === 'applied') {
      line = fieldsTxt
        ? `<div class="ae-tl-upd">${AE_ICONS.checkFilled}<strong>Updated:</strong>&nbsp;${esc(fieldsTxt)}</div>`
        : `<div class="ae-tl-upd is-muted">No field needed changes.</div>`;
    } else if (it.state === 'failed') {
      line = `<div class="ae-tl-err">${AE_ICONS.alertFilled}<span><strong>Error:</strong> ${esc(it.error || 'Unknown error')}</span>${retryBtn}</div>`;
    } else if (it.state === 'cancelled') {
      line = `<div class="ae-tl-skip"><span>Skipped — the batch was cancelled before this finding started.</span>${retryBtn}</div>`;
    } else if (it.state === 'running') {
      line = `<div class="ae-tl-upd is-muted">Rewriting ${esc((run.fields || []).map(k => AE_FIELD_TITLE[k] || k).join(', '))}…</div>`;
    } else {
      line = `<div class="ae-tl-upd is-muted">Waiting in queue…</div>`;
    }
    const changes = it.changes || {};
    const details = open ? `
      <div class="ae-tl-details">
        ${Object.keys(changes).length
          ? (it.updated_fields || Object.keys(changes)).map(k => `
              <div class="ae-chg"><div class="ae-chg-k">${esc(AE_FIELD_TITLE[k] || k)}</div><div class="ae-chg-v">${esc(changes[k] || '')}</div></div>`).join('')
          : `<div class="ae-chg-none">${it.state === 'applied' ? 'Field details were not recorded for this run.' : 'No changes were written — the original scanned text is unchanged.'}</div>`}
        <div class="ae-chg-meta">Finding #${it.vuln_id}${it.severity ? ` · ${esc(it.severity)}` : ''}${it.attempts > 1 ? ` · attempt ${it.attempts}` : ''}${it.finished_at ? ` · ${new Date(it.finished_at).toLocaleTimeString()}` : ''}
          · <a href="#" onclick="aeJumpTo(event, ${it.vuln_id})">Show finding</a></div>
      </div>` : '';
    return `
      <div class="ae-tl-item">
        <div class="ae-tl-mark is-${st.cls}">${mark}</div>
        <div class="ae-tl-card ${it.state === 'failed' ? 'is-failed' : ''}">
          <div class="ae-tl-top">
            <div class="ae-tl-main">
              <div class="ae-tl-title">${esc(it.title || ('Finding #' + it.vuln_id))}</div>
              <div class="ae-tl-sub">${meta}</div>
            </div>
            <span class="ae-st-pill is-${st.cls}">${st.label}</span>
            <span class="ae-tl-dur">${aeFmtDur(it.duration_ms)}</span>
            <button class="ae-tl-more" type="button" onclick="aeToggleDetails('${key}')">View Details
              <span class="ae-caret ${open ? 'up' : ''}">${AE_ICONS.chevron}</span></button>
          </div>
          ${line}
          ${details}
        </div>
      </div>`;
  }).join('')}</div>`;
}

function aeLogPane() {
  const runs = aeRuns();
  if (!runs.length) {
    return `<div class="ae-empty ae-empty-lg">${AE_ICONS.sparkle}<div><strong>No AI enhancement activity yet</strong></div>
      <div>Select findings and click <em>Run Auto Enhance</em> — progress and results will appear here.</div></div>`;
  }
  if (AE.logView === 'full') {
    return `
      <div class="ae-act-head"><div class="ae-act-title">Full Activity Log <span class="ae-count">${runs.length} run${runs.length === 1 ? '' : 's'}</span></div>
        ${aeSortSelect()}</div>
      ${runs.map((run, i) => `
        <details class="ae-run" ${i === 0 ? 'open' : ''}>
          <summary>
            ${aeRunPill(run)}
            <strong>${run.succeeded || 0}/${run.total} enhanced</strong>
            <span class="ae-run-meta">${new Date(run.finished_at || run.created_at).toLocaleString()} · ${esc(run.provider)}/${esc(run.model)}
              · ${aeFmtClock(aeElapsed(run))} · ${esc((run.fields || []).map(k => AE_FIELD_TITLE[k] || k).join(', '))}</span>
          </summary>
          ${aeTimeline(run)}
        </details>`).join('')}`;
  }
  const run = runs[0];
  return `
    <div class="ae-run-box">
      ${aeRunBanner(run)}
      ${aeRunStats(run)}
    </div>
    <div class="ae-act-head"><div class="ae-act-title">AI Enhancement Activity</div>${aeSortSelect()}</div>
    ${aeTimeline(run)}`;
}

function aeRunPill(run) {
  const busy = run.state === 'running' || run.state === 'queued';
  const [cls, label] = busy ? ['running', 'Running']
    : run.state === 'cancelled' ? ['cancelled', 'Cancelled']
    : run.state === 'error' ? ['failed', 'Error']
    : (run.failed || run.cancelled) ? ['partial', 'Partial'] : ['applied', 'Completed'];
  return `<span class="ae-st-pill is-${cls}">${label}</span>`;
}

function aeSortSelect() {
  return `<label class="ae-sort"><select onchange="aeSetSort(this.value)">
      <option value="newest" ${AE.sort === 'newest' ? 'selected' : ''}>Newest First</option>
      <option value="oldest" ${AE.sort === 'oldest' ? 'selected' : ''}>Oldest First</option>
    </select></label>`;
}

function aeRender() {
  const ov = document.getElementById('ae-overlay');
  if (!ov) return;
  const prevFocus = document.activeElement?.id;
  const caret = prevFocus === 'ae-q' ? document.activeElement.selectionStart : null;
  const scrolls = ['.ae-body', '.ae-table-wrap'].map(s => ov.querySelector(s)?.scrollTop || 0);
  const total = AE.groups.length;
  const latestRun = aeRuns()[0];
  const catalog = LLM_MODEL_CATALOG[AE.provider];
  const modelCtl = catalog
    ? `<span class="ae-model-row"><select onchange="aeSetModel(this.value)">
         ${catalog.map(m => `<option value="${escAttr(m.value)}" ${AE.model === m.value ? 'selected' : ''}>${esc(m.label)}</option>`).join('')}
         <option value="${LLM_MODEL_CUSTOM}" ${AE.model === LLM_MODEL_CUSTOM ? 'selected' : ''}>Custom (type model name)…</option>
       </select>
       ${AE.model === LLM_MODEL_CUSTOM ? `<input type="text" placeholder="model name" value="${escAttr(AE.customModel)}" oninput="AE.customModel=this.value">` : ''}</span>`
    : `<input type="text" placeholder="${AE.provider ? 'model name' : 'scan default model'}" value="${escAttr(AE.customModel)}"
              oninput="AE.customModel=this.value" ${AE.provider ? '' : 'disabled'}>`;
  const scanDefault = AE.detail?.llm_provider && AE.detail.llm_provider !== 'none'
    ? `Scan default (${AE.detail.llm_provider}${AE.detail.llm_model ? '/' + AE.detail.llm_model : ''})` : 'Scan default';

  const nSel = AE.selected.size, nFields = AE.fields.size;
  const runBtn = `<button class="btn btn-primary" type="button" onclick="aeRunFromAnyTab()"
        ${(aeRunning() || (AE.tab === 'select' && (!nSel || !nFields))) ? 'disabled' : ''}
        title="${aeRunning() ? 'A batch is already running for this scan' : ''}">
        ${AE_ICONS.sparkle.replace('<svg ', '<svg width="15" height="15" ')} Run Auto Enhance</button>`;
  let footInfo, actions;
  if (AE.tab === 'log') {
    footInfo = aeRuns().length ? `<button class="btn btn-ghost ae-fulllog" type="button" onclick="aeToggleFullLog()">
        ${AE_ICONS.description}${AE.logView === 'full' ? 'Back to Latest Run' : 'View Full Log'}</button>` : '';
    actions = `<button class="btn btn-ghost" type="button" onclick="closeAutoEnhance()">Close</button>${runBtn}`;
  } else {
    footInfo = aeRunning()
      ? 'A batch is running — follow it in the Activity Log tab.'
      : `${nSel} finding${nSel === 1 ? '' : 's'} selected · ${nFields} field${nFields === 1 ? '' : 's'} per finding`;
    actions = `<button class="btn btn-ghost" type="button" onclick="closeAutoEnhance()">Cancel</button>${runBtn}`;
  }

  ov.innerHTML = `
    <div class="ae-modal" role="dialog" aria-modal="true" aria-labelledby="ae-title">
      <div class="ae-head">
        <div class="ae-icon">${AE_ICONS.sparkle}</div>
        <div>
          <div class="ae-title" id="ae-title">Auto Enhanced</div>
          <div class="ae-sub">Improve finding write-ups with AI while preserving original scan evidence.</div>
        </div>
        <button class="ae-x" type="button" aria-label="Close" onclick="closeAutoEnhance()">×</button>
      </div>
      <div class="ae-body">
        <div class="ae-llm">
          <label>LLM Provider
            <select onchange="aeSetProvider(this.value)" ${aeRunning() ? 'disabled' : ''}>
              ${AE_PROVIDERS.map(p => `<option value="${p.value}" ${AE.provider === p.value ? 'selected' : ''}>${p.value ? p.label : esc(scanDefault)}</option>`).join('')}
            </select>
          </label>
          <label>Model ${modelCtl}</label>
          <div class="ae-pill">🗄 ${total} finding${total === 1 ? '' : 's'} available</div>
        </div>
        <div class="ae-tabs" role="tablist">
          <button class="ae-tab ${AE.tab === 'select' ? 'active' : ''}" role="tab" onclick="aeSetTab('select')">
            Select Findings<span class="ae-count">${total}</span></button>
          <button class="ae-tab ${AE.tab === 'log' ? 'active' : ''}" role="tab" onclick="aeSetTab('log')">
            Activity Log<span class="ae-count">${latestRun ? (latestRun.items || []).length : 0}</span>
            ${aeRunning() ? '<span class="ae-live-dot" title="Running"></span>' : ''}</button>
        </div>
        ${AE.tab === 'log' ? aeLogPane() : aeSelectPane()}
        ${AE.error ? `<div class="ae-err" style="margin-top:.6rem">${esc(AE.error)}</div>` : ''}
      </div>
      <div class="ae-foot">
        <span class="ae-foot-info">${footInfo}</span>
        ${actions}
      </div>
    </div>`;
  ['.ae-body', '.ae-table-wrap'].forEach((s, i) => {
    const el = ov.querySelector(s);
    if (el) el.scrollTop = scrolls[i];
  });
  if (prevFocus === 'ae-q') {
    const q = document.getElementById('ae-q');
    if (q) { q.focus(); if (caret != null) q.setSelectionRange(caret, caret); }
  }
  aeSyncTick();
}

/* Elapsed Time ticks every second while a batch runs, without re-rendering the modal. */
function aeSyncTick() {
  const need = AE.open && AE.tab === 'log' && aeRunning();
  if (need && !AE.tick) {
    AE.tick = setInterval(() => {
      if (!AE.job) return;
      document.querySelectorAll(`[data-ae-elapsed="${AE.job.job_id}"]`)
        .forEach(el => { el.textContent = aeFmtClock(aeElapsed(AE.job)); });
    }, 1000);
  } else if (!need) aeStopTick();
}
function aeStopTick() { if (AE.tick) { clearInterval(AE.tick); AE.tick = null; } }

window.aeSetSort = v => { AE.sort = v; aeRender(); };
window.aeToggleFullLog = () => { AE.logView = AE.logView === 'full' ? 'latest' : 'full'; aeRender(); };
window.aeToggleDetails = key => { AE.expanded.has(key) ? AE.expanded.delete(key) : AE.expanded.add(key); aeRender(); };
window.aeRunFromAnyTab = () => {
  if (!AE.selected.size || !AE.fields.size) {
    AE.tab = 'select';
    AE.error = AE.selected.size ? 'Choose at least one field to enhance.' : 'Select at least one finding to enhance.';
    return aeRender();
  }
  aeRun();
};

window.aeCancel = async function(jobId) {
  try {
    AE.job = await api(`/scans/${AE.scanId}/auto-enhance/jobs/${jobId}/cancel`, {method: 'POST'});
  } catch (e) { AE.error = 'Could not cancel: ' + (e.message || e); }
  aeRender();
};

window.aeRetry = async function(jobId, vulnId) {
  const key = `${jobId}:${vulnId}`;
  AE.busy.add(key); AE.error = ''; aeRender();
  try {
    AE.job = await api(`/scans/${AE.scanId}/auto-enhance/jobs/${jobId}/items/${vulnId}/retry`, {method: 'POST'});
    AE.logView = 'latest';
    aeStartPoll();
  } catch (e) {
    AE.error = 'Could not retry: ' + (e.message || e);
  } finally {
    AE.busy.delete(key);
    aeRender();
  }
};

window.aeSetQuery = q => { AE.q = q; aeRender(); };
window.aeSetSev = s => { AE.sev = s; aeRender(); };
window.aeSetTab = t => { AE.tab = t; AE.error = ''; aeRender(); };
window.aeSetModel = m => { AE.model = m; if (m !== LLM_MODEL_CUSTOM) AE.customModel = ''; aeRender(); };
window.aeSetProvider = p => {
  AE.provider = p;
  const cat = LLM_MODEL_CATALOG[p];
  AE.model = cat ? cat[0].value : '';
  AE.customModel = '';
  aeRender();
};
window.aeToggleField = (k, on) => { on ? AE.fields.add(k) : AE.fields.delete(k); aeRender(); };
window.aeToggleRow = (ev, id) => {
  if (ev.target.closest('.ae-chev')) return;
  AE.selected.has(id) ? AE.selected.delete(id) : AE.selected.add(id);
  aeRender();
};
window.aeSelectAll = on => {
  // Only findings not yet AI-enhanced; a re-run stays an explicit per-row choice.
  for (const r of aeVisibleRows()) if (!r.fixed) on ? AE.selected.add(r.id) : AE.selected.delete(r.id);
  aeRender();
};
window.aeClear = () => { AE.selected.clear(); aeRender(); };
window.aeJumpTo = (ev, id) => {
  ev.stopPropagation();
  closeAutoEnhance();
  const card = document.getElementById('vuln-' + id);
  if (!card) return;
  card.style.display = '';
  const body = card.querySelector('.vuln-body');
  if (body && body.hidden) card.querySelector('.vuln-head')?.click();
  card.scrollIntoView({behavior: 'smooth', block: 'start'});
};

window.aeRun = async function() {
  if (!AE.selected.size || !AE.fields.size) return;
  const body = {vuln_ids: [...AE.selected], fields: AE_FIELDS.map(f => f.key).filter(k => AE.fields.has(k))};
  if (AE.provider) body.provider = AE.provider;
  const model = aeModelValue();
  if (AE.provider && model) body.model = model;
  AE.error = '';
  try {
    const job = await api(`/scans/${AE.scanId}/auto-enhance`, {
      method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body),
    });
    AE.job = job;
    AE.tab = 'log';
    AE.logView = 'latest';
    AE.selected.clear();
    aeRender();
    aeStartPoll();
  } catch (e) {
    AE.error = 'Could not start Auto Enhance: ' + (e.message || e);
    aeRender();
  }
};

function aeStopPoll() { if (AE.poll) { clearInterval(AE.poll); AE.poll = null; } }

function aeStartPoll() {
  aeStopPoll();
  const scanId = AE.scanId;
  AE.poll = setInterval(async () => {
    if (!AE.job || AE.scanId !== scanId) return aeStopPoll();
    try {
      const j = await api(`/scans/${scanId}/auto-enhance/jobs/${AE.job.job_id}`);
      AE.job = j;
      if (!aeRunning()) {
        aeStopPoll();
        const o = await api(`/scans/${scanId}/auto-enhance`).catch(() => null);
        if (o) AE.history = o.history || [];
        // Re-render the cards underneath (and the modal's Status column, via aeBindScan) so the
        // new AI-enhanced badges show up right away; the modal overlay lives outside the routed view.
        if (location.hash.includes(scanId)) router();
      }
      if (AE.open) aeRender();
      aeRenderBanner();
    } catch (_) { /* transient — keep polling */ }
  }, 1500);
}

      <label>Status
        <select name="status">

window.toggleTriage = function(id) {
  const el = document.getElementById('triage-'+id);
  if (el) el.hidden = !el.hidden;
};

window.submitTriage = async function(ev, id) {
  ev.preventDefault();
  const form = ev.target;
  const msg  = document.getElementById('triage-msg-'+id);
  const body = {};
  for (const [k, v] of new FormData(form)) {
    if (k === 'override_cvss_score') {
      body[k] = v === '' ? null : parseFloat(v);
    } else {
      body[k] = v;
    }
  }
  msg.textContent = 'Saving…'; msg.className = 'triage-msg';
  try {
    const scanId = location.hash.split('/')[2];
    const r = await fetch(`/api/v1/scans/${scanId}/vulnerabilities/${id}`, {
      method: 'PATCH',
      headers: { ...headers(), 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!r.ok) { const txt = await r.text(); throw new Error(txt); }
    msg.textContent = 'Saved · refreshing…';
    setTimeout(() => router(), 400);
  } catch(e) {
    msg.textContent = 'Error: ' + (e.message || e).slice(0, 200);
    msg.className = 'triage-msg err';
  }
};

window.toggleVuln = function(i) {
  const body = document.getElementById('vbody-'+i);
  const chev = document.getElementById('chev-'+i);
  if (!body) return;
  body.hidden = !body.hidden;
  if (chev) chev.textContent = body.hidden ? '▾' : '▴';
};

/* ── Offensive tab (Mockup C) ── */
const OFF_PHASES = [
  {id:'ENVIRONMENT', n:1, title:'Environment', blurb:'Root/JB hooks'},
  {id:'TRANSPORT',   n:2, title:'Transport',   blurb:'SSL pinning bypass'},
  {id:'SECRETS',     n:3, title:'Secrets',     blurb:'Crypto intercept'},
  {id:'SESSION',     n:4, title:'Session',     blurb:'Biometric / token hooks'},
];
const OFF_CAT_PHASE = {
  ROOT_DETECTION:'ENVIRONMENT', JAILBREAK:'ENVIRONMENT',
  SSL_PINNING:'TRANSPORT', CRYPTO:'SECRETS',
  BIOMETRIC:'SESSION', OTHER:'SESSION',
};
const OFF_PAGE_SIZE = 8;
let _offState = {scanId:null, phase:'ENVIRONMENT', targets:[], selected:0, page:0};

function parseOffensiveTargets(raw='') {
  const text = String(raw||'').trim();
  if (!text) return [];
  const tryObj = (s) => {
    try {
      const o = JSON.parse(s);
      if (o && Array.isArray(o.offensive_targets)) return o.offensive_targets;
    } catch(_) {}
    return null;
  };
  let candidate = text;
  const whole = candidate.match(/^```(?:json)?\s*([\s\S]*?)```$/i);
  if (whole) candidate = whole[1].trim();
  let arr = tryObj(candidate);
  if (arr) return arr;
  const fenceRe = /```(?:json)?\s*([\s\S]*?)```/gi;
  let m;
  while ((m = fenceRe.exec(text)) !== null) {
    arr = tryObj(m[1].trim());
    if (arr) return arr;
  }
  const key = '"offensive_targets"';
  let from = 0, best = -1;
  while (true) {
    const ki = text.indexOf(key, from);
    if (ki < 0) break;
    let i = ki - 1;
    while (i >= 0 && /\s/.test(text[i])) i--;
    if (i >= 0 && text[i] === '{') best = i;
    from = ki + 1;
  }
  if (best >= 0) {
    let depth = 0, inStr = false, esc = false, end = -1;
    for (let i = best; i < text.length; i++) {
      const c = text[i];
      if (inStr) {
        if (esc) esc = false;
        else if (c === '\\') esc = true;
        else if (c === '"') inStr = false;
      } else {
        if (c === '"') inStr = true;
        else if (c === '{') depth++;
        else if (c === '}') { depth--; if (depth === 0) { end = i + 1; break; } }
      }
    }
    if (end > best) {
      arr = tryObj(text.slice(best, end));
      if (arr) return arr;
    }
  }
  return [];
}

function offPhaseOf(t) {
  const p = String(t.phase||'').toUpperCase();
  if (OFF_PHASES.some(x => x.id === p)) return p;
  const c = String(t.category||'OTHER').toUpperCase().replace(/-/g,'_');
  return OFF_CAT_PHASE[c] || 'SESSION';
}

function collectOffensiveTargets(findings) {
  const out = [];
  for (const f of findings || []) {
    if (String(f.mode||'').toUpperCase() !== 'OFFENSIVE') continue;
    for (const t of parseOffensiveTargets(f.finding)) {
      if (!t || typeof t !== 'object') continue;
      out.push({
        ...t,
        phase: offPhaseOf(t),
        _fn: f.function_name || '',
        _cls: f.class_name || '',
      });
    }
  }
  return out;
}

async function tabOffensive(el, id, detail) {
  if (detail.state !== 'done') {
    el.innerHTML = `<div class="alert alert-warn">Scan not complete — Offensive playbooks appear when analysis finishes.</div>`;
    return;
  }
  el.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
  try {
    const findings = await api('/scans/'+id+'/llm');
    const targets = collectOffensiveTargets(findings);
    // Also surface if llm_mode is offensive but Mode field missing on older rows
    if (!targets.length && String(detail.llm_mode||'').toLowerCase() === 'offensive') {
      for (const f of findings) {
        for (const t of parseOffensiveTargets(f.finding)) {
          if (!t || typeof t !== 'object') continue;
          targets.push({...t, phase: offPhaseOf(t), _fn: f.function_name||'', _cls: f.class_name||''});
        }
      }
    }
    _offState = {scanId:id, phase:'ENVIRONMENT', targets, selected:0, page:0};
    if (!targets.length) {
      el.innerHTML = `<div class="card"><div class="card-title">No Offensive targets</div>
        <p style="color:var(--muted);font-size:.85rem">No Frida playbooks were stored for this scan. Re-run with Scan Mode = Offensive.</p>
        <p style="margin-top:.75rem"><button class="btn btn-ghost btn-sm" onclick="goTab('${id}','assessment')">Open Assessment →</button></p>
      </div>`;
      return;
    }
    // Prefer first phase that has targets
    for (const p of OFF_PHASES) {
      if (targets.some(t => t.phase === p.id)) { _offState.phase = p.id; break; }
    }
    el.innerHTML = `<div class="off-campaign" id="off-root"></div>`;
    renderOffensiveCampaign();
  } catch (e) {
    el.innerHTML = `<div class="alert alert-error">${esc(e.message)}</div>`;
  }
}

function renderOffensiveCampaign() {
  const root = document.getElementById('off-root');
  if (!root) return;
  const {phase, targets, selected, scanId} = _offState;
  const counts = Object.fromEntries(OFF_PHASES.map(p => [p.id, targets.filter(t => t.phase === p.id).length]));
  const inPhase = targets.filter(t => t.phase === phase);
  const sel = Math.min(Math.max(0, selected), Math.max(0, inPhase.length - 1));
  _offState.selected = sel;
  const t = inPhase[sel];
  const pageCount = Math.max(1, Math.ceil(inPhase.length / OFF_PAGE_SIZE));
  const page = Math.min(Math.max(0, _offState.page || 0), pageCount - 1);
  _offState.page = page;
  const pageStart = page * OFF_PAGE_SIZE;
  const pageItems = inPhase.slice(pageStart, pageStart + OFF_PAGE_SIZE);
  const firstNo = inPhase.length ? pageStart + 1 : 0;
  const lastNo = pageStart + pageItems.length;

  root.innerHTML = `
    <div class="alert alert-warn" style="font-size:.78rem">Authorized testing only — Frida scripts for apps you are permitted to instrument.</div>
    <div class="card" style="padding:1rem">
      <div class="card-title" style="margin-bottom:.85rem">Offensive campaign</div>
      <div class="off-phases">
        ${OFF_PHASES.map(p => `
          <button type="button" class="off-phase${p.id===phase?' active':''}" onclick="offSelectPhase('${p.id}')">
            <div class="off-phase-label">Phase ${p.n}</div>
            <div class="off-phase-title">${esc(p.title)}</div>
            <div class="off-phase-count">${counts[p.id]||0} · ${esc(p.blurb)}</div>
          </button>`).join('')}
      </div>
    </div>
    <div class="off-split">
      <div class="off-list">
        <div class="off-list-head">Targets in ${esc(phase.toLowerCase())}</div>
        <div class="off-list-body" role="listbox" aria-label="Targets in ${esc(phase.toLowerCase())}">
          ${inPhase.length ? pageItems.map((x,j) => { const i = pageStart + j; return `
            <div class="off-target${i===sel?' active':''}" role="option" tabindex="0" aria-selected="${i===sel?'true':'false'}" onclick="offSelectTarget(${i})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();offSelectTarget(${i})}">
              <div class="off-target-title">${esc(x.title||'Untitled')}</div>
              <div class="off-target-meta">
                ${sevBadgeLevel(String(x.priority||'MEDIUM').toUpperCase())}
                ${x.category ? `<span class="off-target-cat">${esc(x.category)}</span>` : ''}
              </div>
            </div>`; }).join('') : '<div class="empty" style="padding:1rem">No targets in this phase.</div>'}
        </div>
        ${inPhase.length ? `<div class="off-list-foot">
          <span class="off-list-count">${firstNo}–${lastNo} of ${inPhase.length}</span>
          ${pageCount > 1 ? `<span class="off-list-pager">
            <button type="button" class="page-btn" aria-label="Previous page" onclick="offSetPage(${page-1})" ${page===0?'disabled':''}>‹ Prev</button>
            <span>${page+1} / ${pageCount}</span>
            <button type="button" class="page-btn" aria-label="Next page" onclick="offSetPage(${page+1})" ${page>=pageCount-1?'disabled':''}>Next ›</button>
          </span>` : ''}
        </div>` : ''}
      </div>
      <div class="off-detail">
        <div class="off-detail-head">Playbook detail</div>
        <div class="off-detail-body" id="off-detail-body">
          ${t ? renderOffensiveDetail(t) : '<div class="empty">Select a target.</div>'}
        </div>
      </div>
    </div>
    <div class="off-toolbar">
      <a class="btn btn-primary btn-sm" href="/api/v1/scans/${scanId}/offensive/kit" id="off-kit-link">Export Frida kit</a>
      <button type="button" class="btn btn-ghost btn-sm" onclick="offCopyAllScripts()">Copy all scripts</button>
      <button type="button" class="btn btn-ghost btn-sm" onclick="goTab('${scanId}','assessment')">Open Assessment →</button>
    </div>`;

  const kit = document.getElementById('off-kit-link');
  if (kit) {
    kit.addEventListener('click', async (ev) => {
      ev.preventDefault();
      try {
        const r = await fetch(`/api/v1/scans/${scanId}/offensive/kit`, {headers: headers()});
        if (!r.ok) throw new Error(await r.text());
        const blob = await r.blob();
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `malimite-offensive-kit-${scanId.slice(0,8)}.zip`;
        a.click();
        URL.revokeObjectURL(a.href);
      } catch (e) { alert('Kit export failed: ' + (e.message||e)); }

  }

window.offSelectPhase = function(phase) {
  _offState.phase = phase;
  _offState.selected = 0;
  _offState.page = 0;
  renderOffensiveCampaign();
};
window.offSelectTarget = function(i) {
  _offState.selected = i;
  renderOffensiveCampaign();
};
window.offSetPage = function(p) {
  const inPhase = _offState.targets.filter(t => t.phase === _offState.phase);
  const pageCount = Math.max(1, Math.ceil(inPhase.length / OFF_PAGE_SIZE));
  _offState.page = Math.min(Math.max(0, p), pageCount - 1);
  renderOffensiveCampaign();
};

function _offCurrentTarget() {
  const inPhase = _offState.targets.filter(t => t.phase === _offState.phase);
  return inPhase[_offState.selected] || null;
}

window.offCopyScript = async function() {
  const t = _offCurrentTarget();
  if (!t?.frida_script) return;
  try {
    await navigator.clipboard.writeText(t.frida_script);
  } catch(_) {
    prompt('Copy script:', t.frida_script);
  }
};
window.offSaveScript = function() {
  const t = _offCurrentTarget();
  if (!t?.frida_script) return;
  const slug = String(t.title||'script').replace(/[^a-zA-Z0-9._-]+/g,'_').slice(0,50);
  const blob = new Blob([t.frida_script], {type:'text/javascript'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = slug + '.js';
  a.click();

};
window.offCopyAllScripts = async function() {
  const phase = _offState.phase;
  const list = _offState.targets.filter(t => t.phase === phase && t.frida_script);
  const all = _offState.targets.filter(t => t.frida_script);
  const use = list.length ? list : all;
  const text = use.map(t => `// === ${t.title||'target'} (${t.phase||''}) ===\n${t.frida_script}`).join('\n\n');
  if (!text) { alert('No scripts to copy'); return; }
  try { await navigator.clipboard.writeText(text); }
  catch(_) { prompt('Copy scripts:', text); }
};

/* ── llm tab ── */
let llmRequestSeq = 0;
let _llmFindings = [];
let _llmDrawerOpen = false;
/** @type {{key:string, dir:'asc'|'desc'}} */
let _llmSort = {key:'status', dir:'desc'};
let _llmSelectedIdx = -1;
/** @type {{root:HTMLElement, id:string, state:{page:number, size:number, query:string}}|null} */
let _llmLoad = null;
const LLM_SERVER_SORT = {function:1, class:1, mode:1};

const LLM_STATUS_RANK = {
  CRITICAL: 7, HIGH: 6, MEDIUM: 5, LOW: 4, INFO: 3, UNPARSED: 2, CLEAN: 1
};

function parseLlmPayload(raw='') {
  const text = String(raw||'').trim();
  if (!text) return {kind:'empty', vulns:[]};

  const asVulns = (obj) => {
    if (obj && Array.isArray(obj.vulnerabilities)) {
      return {kind: obj.vulnerabilities.length ? 'vulns' : 'empty', vulns: obj.vulnerabilities, raw: text};
    }
    return null;
  };

  // 1) Whole response, optionally fence-wrapped
  let candidate = text;
  const wholeFence = candidate.match(/^```(?:json)?\s*([\s\S]*?)```$/i);
  if (wholeFence) candidate = wholeFence[1].trim();
  try {
    const parsed = asVulns(JSON.parse(candidate));
    if (parsed) return parsed;
  } catch (_) { /* continue */ }

  // 2) Any fenced block in the response
  const fenceRe = /```(?:json)?\s*([\s\S]*?)```/gi;
  let m;
  while ((m = fenceRe.exec(text)) !== null) {
    try {
      const parsed = asVulns(JSON.parse(m[1].trim()));
      if (parsed) return parsed;
    } catch (_) { /* continue */ }
  }

  // 3) Last embedded {"vulnerabilities":...} after prose (brace-balanced)
  const key = '"vulnerabilities"';
  let from = 0, bestStart = -1;
  while (true) {
    const keyIdx = text.indexOf(key, from);
    if (keyIdx < 0) break;
    let i = keyIdx - 1;
    while (i >= 0 && /\s/.test(text[i])) i--;
    if (i >= 0 && text[i] === '{') bestStart = i;
    from = keyIdx + 1;
  }
  if (bestStart >= 0) {
    let depth = 0, inStr = false, esc = false, end = -1;
    for (let i = bestStart; i < text.length; i++) {
      const c = text[i];
      if (inStr) {
        if (esc) esc = false;
        else if (c === '\\') esc = true;
        else if (c === '"') inStr = false;
      } else {
        if (c === '"') inStr = true;
        else if (c === '{') depth++;
        else if (c === '}') {
          depth--;
          if (depth === 0) { end = i + 1; break; }
        }
      }
    }
    if (end > bestStart) {
      try {
        const parsed = asVulns(JSON.parse(text.slice(bestStart, end)));
        if (parsed) return parsed;
      } catch (_) { /* prose / non-JSON */ }
    }
  }

  return {kind:'prose', raw: text};
}

function llmStatusBadge(parsed) {
  if (parsed.kind === 'empty') return '<span class="badge badge-done">CLEAN</span>';
  if (parsed.kind === 'vulns') {
    const worst = parsed.vulns.reduce((acc, v) => {
      const order = {CRITICAL:4, HIGH:3, MEDIUM:2, LOW:1};
      const s = String(v.severity||'').toUpperCase();
      return (order[s]||0) > (order[acc]||0) ? s : acc;
    }, '');
    return worst ? sevBadgeLevel(worst) : `<span class="badge badge-high">${parsed.vulns.length} FINDING${parsed.vulns.length===1?'':'S'}</span>`;
  }
  // Prose/CoT without recoverable JSON — do NOT keyword-match CRITICAL/HIGH in the narrative
  // (that falsely implies a promoted Vulnerabilities-tab finding).
  return '<span class="badge badge-info">UNPARSED</span>';
}

/** Status label used for severity sorting (not display). */
function llmStatusSortKey(parsed) {
  if (parsed.kind === 'empty') return 'CLEAN';
  if (parsed.kind !== 'vulns') return 'UNPARSED';
  const order = {CRITICAL:4, HIGH:3, MEDIUM:2, LOW:1, INFO:0};
  let worst = '', best = -1;
  for (const v of parsed.vulns) {
    const s = String(v.severity||'').toUpperCase();
    const r = order[s];
    if (r != null && r > best) { best = r; worst = s; }
  }
  // Findings with no severity still surface above UNPARSED/CLEAN
  return worst || 'INFO';
}

function llmPreviewText(parsed) {
  if (parsed.kind === 'empty') return 'No vulnerabilities found';
  if (parsed.kind === 'vulns') {
    const titles = parsed.vulns.map(v => v.title || v.scope || 'Finding').filter(Boolean);
    return titles.length ? titles.join(' · ') : `${parsed.vulns.length} vulnerability(ies)`;
  }
  const t = (parsed.raw||'').replace(/\s+/g,' ').trim();
  return t.length > 120 ? t.slice(0,117)+'…' : t;
}

function llmSortValue(f, key) {
  const parsed = parseLlmPayload(f.finding);
  switch (key) {
    case 'status': return LLM_STATUS_RANK[llmStatusSortKey(parsed)] || 0;
    case 'function': return String(f.function_name||'').toLowerCase();
    case 'class': return String(f.class_name||'').toLowerCase();
    case 'mode': return String(f.mode||'').toLowerCase();
    case 'preview': return llmPreviewText(parsed).toLowerCase();
    default: return '';
  }
}

function applyLlmSort() {
  const {key, dir} = _llmSort;
  const mul = dir === 'asc' ? 1 : -1;
  _llmFindings.sort((a, b) => {
    const va = llmSortValue(a, key);
    const vb = llmSortValue(b, key);
    let cmp = 0;
    if (typeof va === 'number' && typeof vb === 'number') cmp = va - vb;
    else cmp = String(va).localeCompare(String(vb), undefined, {sensitivity:'base'});
    if (cmp !== 0) return cmp * mul;
    // Tie-break: function name A→Z (independent of primary direction)
    if (key !== 'function') {
      return String(a.function_name||'').localeCompare(String(b.function_name||''), undefined, {sensitivity:'base'});
    }
    return 0;
  });
}

function llmSortHeaderHtml(key, label) {
  const active = _llmSort.key === key;
  const ind = active ? (_llmSort.dir === 'asc' ? '▲' : '▼') : '▼';
  return `<th class="th-sort${active?' active':''}" data-sort="${key}"
      onclick="event.stopPropagation();sortLlmColumn('${key}')"
      title="Sort by ${label}">${label}<span class="sort-ind" aria-hidden="true">${ind}</span></th>`;
}

function renderLlmTableRows() {
  return _llmFindings.map((f, i) => {
    const parsed = parseLlmPayload(f.finding);
    const preview = llmPreviewText(parsed);
    const sel = i === _llmSelectedIdx ? ' selected' : '';
    return `<tr class="llm-row${sel}" data-idx="${i}" onclick="openLlmDrawer(${i})">
      <td>${llmStatusBadge(parsed)}</td>
      <td class="mono truncate" style="max-width:200px" title="${escAttr(f.function_name)}">${esc(f.function_name)}</td>
      <td class="truncate" style="max-width:160px" title="${escAttr(f.class_name||'')}">${esc(f.class_name||'—')}</td>
      <td>${esc(f.mode||'')}</td>
      <td><div class="llm-preview" title="${escAttr(preview)}">${esc(preview)}</div></td>
    </tr>`;
  }).join('');
}

function refreshLlmTable() {
  const tbody = document.getElementById('llm-findings-tbody');
  const thead = document.getElementById('llm-findings-thead');
  if (!tbody) return;
  tbody.innerHTML = renderLlmTableRows();
  if (thead) {
    thead.innerHTML = `<tr>
      ${llmSortHeaderHtml('status','Status')}
      ${llmSortHeaderHtml('function','Function')}
      ${llmSortHeaderHtml('class','Class')}
      ${llmSortHeaderHtml('mode','Mode')}
      ${llmSortHeaderHtml('preview','Preview')}
    </tr>`;
  }
}

window.sortLlmColumn = function(key) {
  const selected = _llmSelectedIdx >= 0 ? _llmFindings[_llmSelectedIdx] : null;
  if (_llmSort.key === key) {
    _llmSort.dir = _llmSort.dir === 'asc' ? 'desc' : 'asc';
  } else {
    _llmSort.key = key;
    // Status defaults to severity-desc; text columns default A→Z
    _llmSort.dir = key === 'status' ? 'desc' : 'asc';
  }
  if (LLM_SERVER_SORT[key] && _llmLoad) {
    _llmLoad.state.page = 1;
    loadLlmFindings(_llmLoad.root, _llmLoad.id, _llmLoad.state);
    return;
  }
  applyLlmSort();
  if (selected) {
    _llmSelectedIdx = _llmFindings.indexOf(selected);
  }
  refreshLlmTable();
};

function renderLlmDrawerBody(f) {
  const parsed = parseLlmPayload(f.finding);
  if (parsed.kind === 'empty') {
    return `<div class="llm-empty-state">
      <strong>No vulnerabilities found</strong>
      The model returned an empty vulnerability list for this function.
    </div>`;
  }
  if (parsed.kind === 'vulns') {
    return `<div class="llm-section-label">${parsed.vulns.length} vulnerabilit${parsed.vulns.length===1?'y':'ies'}</div>` +
      parsed.vulns.map(v => {
        const sev = String(v.severity||'').toUpperCase();
        const desc = fieldOr(v.description, 'No description provided for this finding.');
        const poc = fieldOr(v.poc_steps, 'No PoC provided.');
        const rem = fieldOr(v.remediation, 'No remediation guidance provided.');
        const evidence = fieldOr(v.evidence, '');
        const regex = fieldOr(v.detection_regex, '');
        return `<div class="llm-vuln-item">
          <div class="llm-vuln-item-head">
            ${sevBadgeLevel(sev)}
            ${v.scope?`<span class="meta-chip">${esc(v.scope)}</span>`:''}
            <span class="llm-vuln-item-title">${esc(v.title||'Untitled finding')}</span>
          </div>
          <p style="font-size:.85rem;line-height:1.55;margin-bottom:.5rem">${esc(desc)}</p>
          <div class="llm-kv">
            ${v.cvss!=null?`<span class="k">CVSS</span><span class="v">${esc(String(v.cvss))}</span>`:''}
            ${v.cwe?`<span class="k">CWE</span><span class="v">${esc(v.cwe)}</span>`:''}
          </div>
          ${!isEmptyField(evidence)?`<div class="vuln-section"><div class="vuln-section-title">Evidence</div><div class="vuln-code">${esc(evidence)}</div></div>`:''}
          <div class="vuln-section"><div class="vuln-section-title">PoC steps</div><div class="vuln-poc">${esc(poc)}</div></div>
          <div class="vuln-section"><div class="vuln-section-title">Remediation</div><p style="font-size:.85rem">${esc(rem)}</p></div>
          ${!isEmptyField(regex)?`<div class="vuln-section"><div class="vuln-section-title">Detection regex</div><div class="vuln-code">${esc(regex)}</div></div>`:''}
        </div>`;
      }).join('');
  }
  return `<div class="llm-section-label">Analysis</div><pre class="llm-prose">${esc(parsed.raw||'')}</pre>`;
}

function closeLlmDrawer() {
  _llmDrawerOpen = false;
  _llmSelectedIdx = -1;
  const drawer = document.getElementById('llm-drawer');
  const backdrop = document.getElementById('llm-drawer-backdrop');
  if (drawer) drawer.classList.remove('open');
  if (backdrop) backdrop.classList.remove('open');
  $$('.llm-row.selected').forEach(r => r.classList.remove('selected'));
  document.removeEventListener('keydown', onLlmDrawerKeydown);
}

function onLlmDrawerKeydown(e) {
  if (e.key === 'Escape') closeLlmDrawer();
}

window.openLlmDrawer = function(idx) {
  const f = _llmFindings[idx];
  if (!f) return;
  const drawer = document.getElementById('llm-drawer');
  const backdrop = document.getElementById('llm-drawer-backdrop');
  const title = document.getElementById('llm-drawer-title');
  const meta = document.getElementById('llm-drawer-meta');
  const body = document.getElementById('llm-drawer-body');
  if (!drawer || !body) return;

  _llmSelectedIdx = idx;
  const parsed = parseLlmPayload(f.finding);
  title.textContent = f.function_name || 'LLM finding';
  meta.innerHTML = `
    ${llmStatusBadge(parsed)}
    ${f.mode?`<span class="meta-chip">${esc(f.mode)}</span>`:''}
    ${f.class_name?`<span class="meta-chip">${esc(f.class_name)}</span>`:''}
  `;
  body.innerHTML = renderLlmDrawerBody(f);

  $$('.llm-row').forEach(r => r.classList.toggle('selected', Number(r.dataset.idx) === idx));
  backdrop.classList.add('open');
  drawer.classList.add('open');
  _llmDrawerOpen = true;
  document.removeEventListener('keydown', onLlmDrawerKeydown);
  document.addEventListener('keydown', onLlmDrawerKeydown);
  drawer.focus({preventScroll:true});
};

window.closeLlmDrawer = closeLlmDrawer;

async function tabLlm(el, id, detail) {
  closeLlmDrawer();
  _llmFindings = [];
  _llmSelectedIdx = -1;
  _llmSort = {key:'status', dir:'desc'};
  _llmLoad = null;
  if (!detail.llm_enabled) {
    el.innerHTML=`<div class="alert alert-info">LLM enrichment was not enabled for this scan.
      Re-run with LLM enabled to see findings.</div>`; return;
  }
  if (detail.state !== 'done') { el.innerHTML=`<div class="alert alert-warn">Scan not complete.</div>`; return; }

  const root = document.createElement('div');
  root.id = 'llm-root';
  root.innerHTML = `
    <div class="search-bar">
      <input id="llm-q" type="text" placeholder="Search findings…" autocomplete="off"/>
      <button id="llm-search" class="btn btn-primary btn-sm">Search</button>
    </div>
    <div id="llm-table"><div class="loading"><div class="spinner"></div></div></div>
    <div id="llm-pages" class="pagination llm-pagination"></div>
    <div id="llm-drawer-backdrop" class="llm-drawer-backdrop" onclick="closeLlmDrawer()"></div>
    <aside id="llm-drawer" class="llm-drawer" tabindex="-1" role="dialog" aria-label="LLM finding detail">
      <div class="llm-drawer-head">
        <div class="llm-drawer-head-main">
          <div id="llm-drawer-title" class="llm-drawer-title"></div>
          <div id="llm-drawer-meta" class="llm-drawer-meta"></div>
        </div>
        <button type="button" class="llm-drawer-close" onclick="closeLlmDrawer()" aria-label="Close">×</button>
      </div>
      <div id="llm-drawer-body" class="llm-drawer-body"></div>
    </aside>`;
  el.replaceChildren(root);

  const state = {page:1, size:50, query:''};
  _llmLoad = {root, id, state};
  const search = () => {
    state.query = root.querySelector('#llm-q').value.trim();
    state.page = 1;
    loadLlmFindings(root, id, state);
  };
  root.querySelector('#llm-search').addEventListener('click', search);
  root.querySelector('#llm-q').addEventListener('keydown', event => {
    if (event.key === 'Enter') search();
  });
  await loadLlmFindings(root, id, state);
}

async function loadLlmFindings(root, id, state) {
  const table = root.querySelector('#llm-table');
  const pager = root.querySelector('#llm-pages');
  if (!table || !pager) return;
  closeLlmDrawer();
  _llmSelectedIdx = -1;
  const requestSeq = ++llmRequestSeq;
  table.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
  pager.innerHTML = '';
  try {
    const params = new URLSearchParams({page:String(state.page), size:String(state.size)});
    if (state.query) params.set('q', state.query);
    if (LLM_SERVER_SORT[_llmSort.key]) {
      params.set('sort', _llmSort.key);
      params.set('dir', _llmSort.dir);
    }
    const data = await api('/scans/'+id+'/llm?'+params);
    if (requestSeq !== llmRequestSeq || !root.isConnected
        || root !== document.getElementById('llm-root')) return;

    const items = Array.isArray(data.items) ? data.items : [];
    const total = Math.max(0, Number(data.total) || 0);
    const page = Math.max(1, Number(data.page) || 1);
    const size = Math.max(1, Number(data.size) || state.size);
    const pages = Math.max(0, Number(data.pages) || 0);
    state.page = page;
    _llmFindings = items;
    applyLlmSort();

    table.innerHTML = items.length
      ? `<div class="tbl-wrap"><table class="llm-table">
          <thead id="llm-findings-thead"></thead>
          <tbody id="llm-findings-tbody"></tbody>
        </table></div>`
      : `<div class="empty">${state.query ? 'No LLM findings match this search.' : 'No LLM findings.'}</div>`;
    if (items.length) refreshLlmTable();

    const first = items.length ? (page - 1) * size + 1 : 0;
    const last = items.length ? first + items.length - 1 : 0;
    pager.innerHTML = `<span>Showing ${esc(String(first))}–${esc(String(last))} of ${esc(total.toLocaleString())} · Page ${esc(String(pages ? page : 0))} of ${esc(String(pages))}</span>
      <span class="llm-pagination-actions">
        <button class="page-btn" data-page="prev" ${page <= 1 ? 'disabled' : ''}>Previous</button>
        <button class="page-btn" data-page="next" ${pages === 0 || page >= pages ? 'disabled' : ''}>Next</button>
      </span>`;
    pager.querySelector('[data-page="prev"]').onclick = () => {
      if (state.page > 1) { state.page--; loadLlmFindings(root, id, state); }
    };
    pager.querySelector('[data-page="next"]').onclick = () => {
      if (state.page < pages) { state.page++; loadLlmFindings(root, id, state); }
    };
  } catch(e) {
    if (requestSeq === llmRequestSeq && root.isConnected
        && root === document.getElementById('llm-root')) {
      table.innerHTML=`<div class="alert alert-error">${esc(e.message)}</div>`;
    }
  }
}

/* ── log tab ── */
async function tabLog(el, id) {
  el.innerHTML='<div class="loading"><div class="spinner"></div></div>';
  try {
    const {lines} = await api('/scans/'+id+'/log?tail=500');
    el.innerHTML = `<div class="log-box">${lines.map(esc).join('\n')}</div>`;
  } catch(e) { el.innerHTML=`<div class="alert alert-error">${esc(e.message)}</div>`; }
}

/* ── downloads tab ── */
function tabDownloads(id, detail) {
  const rows = [
    ['SARIF 2.1 Report', 'findings.sarif', detail.has_sarif, `/api/v1/scans/${id}/sarif`],
    ['HTML Report', 'report.html', detail.has_html, `/api/v1/scans/${id}/report`],
    ['Analysis Log', 'analysis.log', detail.has_log, `/api/v1/scans/${id}/log`],
    ['Uploaded package', detail.filename, detail.has_package, `/api/v1/scans/${id}/package`],
  ];
  return `<div class="card">
    <div class="card-title">Downloads</div>
    <table>
      <thead><tr><th>File</th><th>Available</th><th></th></tr></thead>
      <tbody>${rows.map(([name, file, avail, url])=>`<tr>
        <td>${esc(name)}</td>
        <td>${avail?'<span class="badge badge-done">Ready</span>':'<span class="badge badge-queued">Not generated</span>'}</td>
        <td>${avail?`<a class="btn btn-primary btn-sm" href="${url}" target="_blank">Open / Download</a>`:'—'}</td>
      </tr>`).join('')}</tbody>
    </table>
  </div>
  <div class="card" style="margin-top:1rem">
    <div class="card-title">Raw API</div>
    <div style="font-size:.8rem;font-family:monospace;line-height:2">
      <div>GET <a href="/api/v1/scans/${id}" target="_blank">/api/v1/scans/${id}</a></div>
      <div>GET <a href="/api/v1/scans/${id}/functions" target="_blank">/api/v1/scans/${id}/functions</a></div>
      <div>GET <a href="/api/v1/scans/${id}/strings" target="_blank">/api/v1/scans/${id}/strings</a></div>
      <div>GET <a href="/api/v1/scans/${id}/resources" target="_blank">/api/v1/scans/${id}/resources</a></div>
      <div>GET <a href="/api/v1/scans/${id}/entrypoints" target="_blank">/api/v1/scans/${id}/entrypoints</a></div>
      <div>GET <a href="/api/v1/scans/${id}/llm" target="_blank">/api/v1/scans/${id}/llm</a></div>
    </div>
    <p style="margin-top:.75rem;font-size:.75rem;color:var(--muted)">
      Full OpenAPI spec at <a href="/docs">/docs</a>
    </p>
  </div>`;
}

/* ── init ── */
router();
</script>
</body>
</html>
