<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Malimite — IPA Scanner</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f8f9fb;--surface:#fff;--border:#e2e4e9;--text:#1a1d23;
  --muted:#6b7280;--accent:#5571f7;--accent-h:#3d56e0;
  --high:#dc2626;--medium:#d97706;--low:#2563eb;--info:#6b7280;
  --green:#16a34a;--red:#dc2626;--yellow:#ca8a04;
  --radius:8px;--shadow:0 1px 3px rgba(0,0,0,.08);
}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}

/* nav */
nav{background:var(--surface);border-bottom:1px solid var(--border);padding:0 1.5rem;display:flex;align-items:center;gap:1rem;height:52px;position:sticky;top:0;z-index:100}
.nav-logo{font-weight:700;font-size:1.1rem;color:var(--text);display:flex;align-items:center;gap:.4rem}
.nav-logo svg{width:22px;height:22px}
nav a.nav-link{color:var(--muted);font-size:.875rem;padding:.25rem .5rem;border-radius:4px}
nav a.nav-link:hover,nav a.nav-link.active{color:var(--text);background:var(--bg)}
.nav-spacer{flex:1;min-width:0}
.nav-apikey{display:flex;align-items:center;gap:.5rem;min-width:0;font-size:.8rem;color:var(--muted)}
.nav-apikey input{min-width:0;padding:.3rem .5rem;border:1px solid var(--border);border-radius:4px;font-size:.8rem;width:160px;max-width:100%}
@media(max-width:900px){
  nav{height:auto;min-height:52px;flex-wrap:wrap;padding:.55rem 1.5rem}
  .nav-spacer{display:none}
  .nav-apikey{margin-left:auto}
}
@media(max-width:520px){
  nav{gap:.4rem .75rem;padding:.55rem 1rem}
  .nav-apikey{width:100%;margin-left:0}
  .nav-apikey input{flex:1;width:auto}
}

/* layout */
main{width:100%;max-width:1100px;min-width:0;margin:0 auto;padding:1.5rem}
main.main-wide{max-width:1500px}
main>*,#tab-content{min-width:0;max-width:100%}

/* cards */
.card{min-width:0;max-width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:1.25rem}
.card + .card{margin-top:1rem}
.card-title{min-width:0;font-weight:600;font-size:.95rem;margin-bottom:.75rem;display:flex;align-items:center;gap:.5rem}

/* grid */
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem}
.grid-4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.75rem}
.grid-2>*,.grid-3>*,.grid-4>*{min-width:0;max-width:100%}
@media(max-width:900px){
  .grid-2{grid-template-columns:1fr}
  .grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:640px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}}

/* stat tile */
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:.9rem 1.1rem}
.stat-val{font-size:1.6rem;font-weight:700;line-height:1}
.stat-label{font-size:.75rem;color:var(--muted);margin-top:.25rem}
.stat-sub{font-size:.65rem;color:var(--muted);margin-top:.2rem;opacity:.85}

/* upload */
.drop-zone{border:2px dashed var(--border);border-radius:var(--radius);padding:3rem;text-align:center;cursor:pointer;transition:all .15s}
.drop-zone:hover,.drop-zone.drag-over{background:#f0f3ff;border-color:var(--accent)}
.drop-zone p{color:var(--muted);font-size:.9rem;margin-top:.5rem}
.drop-file-btn{display:inline-block;margin-top:.8rem;padding:.5rem 1.2rem;background:var(--accent);color:#fff;border-radius:var(--radius);font-weight:600;cursor:pointer;font-size:.875rem}
.drop-file-btn:hover{background:var(--accent-h)}
input[type=file]{display:none}
.picked-file{display:flex;align-items:center;gap:.75rem;padding:.9rem 1.1rem;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius)}
.picked-file-icon{font-size:1.6rem;line-height:1}
.picked-file-name{font-weight:600;word-break:break-all}
.picked-file-meta{color:var(--muted);font-size:.78rem;margin-top:.15rem}
.picked-file-change{margin-left:auto;flex-shrink:0}
.scan-options-title{font-size:.85rem;font-weight:600;margin:1.1rem 0 .5rem}
.run-scan-row{display:flex;align-items:center;gap:.75rem;margin-top:1.1rem}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.45rem .9rem;border-radius:var(--radius);font-size:.8rem;font-weight:600;cursor:pointer;border:none;transition:background .12s}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent-h)}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}.btn-ghost:hover{background:var(--bg)}
.btn-danger{background:#fee2e2;color:var(--red)}.btn-danger:hover{background:#fecaca}
.btn-sm{padding:.3rem .65rem;font-size:.75rem}

/* badges */
.badge{display:inline-block;padding:.15rem .5rem;border-radius:999px;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.badge-queued{background:#f3f4f6;color:var(--muted)}
.badge-running{background:#fef3c7;color:var(--yellow)}
.badge-done{background:#dcfce7;color:var(--green)}
.badge-error{background:#fee2e2;color:var(--red)}
.badge-critical{background:#fce7f3;color:#9d174d;border:1px solid #f9a8d4}
.badge-high{background:#fee2e2;color:var(--high)}
.badge-medium{background:#fef3c7;color:var(--medium)}
.badge-low{background:#dbeafe;color:var(--low)}
.badge-info{background:#f3f4f6;color:var(--info)}
.badge-ios{background:#e0e7ff;color:#3730a3}
.badge-android{background:#dcfce7;color:#166534}

/* vulnerability cards */
.vuln-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:.75rem;overflow:hidden}
.vuln-head{display:flex;align-items:center;gap:.75rem;padding:.75rem 1rem;cursor:pointer;user-select:none;transition:background .1s}
.vuln-head:hover{background:var(--bg)}
.vuln-head-l{display:flex;align-items:center;gap:.6rem;flex:1;min-width:0;flex-wrap:wrap}
.vuln-head-r{display:flex;align-items:center;gap:.6rem;font-size:.72rem;color:var(--muted)}
.vuln-id{font-size:.72rem;color:var(--muted);font-weight:600}
.vuln-title{font-weight:600;font-size:.88rem;color:var(--text);flex:1;min-width:0}
.vuln-cvss{font-size:.72rem;font-weight:700;color:var(--muted);background:var(--bg);padding:.1rem .45rem;border-radius:4px}
.vuln-cat{padding:.1rem .5rem;background:var(--bg);border-radius:4px;font-weight:600}
.vuln-chev{font-size:.75rem;color:var(--muted)}
.vuln-body{padding:0 1rem 1rem;border-top:1px solid var(--border)}
.vuln-section{margin-top:1rem}
.vuln-section p{font-size:.85rem;line-height:1.55;color:var(--text)}
.vuln-section-title{font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.4rem}
.vuln-code,.vuln-poc{background:#111;color:#e2e8f0;padding:.65rem .85rem;border-radius:6px;font-family:monospace;font-size:.72rem;white-space:pre-wrap;word-break:break-word;max-height:300px;overflow-y:auto}
.vuln-poc{background:#0c1a2b;color:#bcd9ff}

/* triage editor */
.vuln-card.is-fp{opacity:.55}
.vuln-card.is-fp .vuln-title{text-decoration:line-through;text-decoration-color:#999}
.vuln-card.is-overridden{box-shadow:inset 3px 0 0 var(--accent)}
.vuln-status-strip{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;font-size:.72rem;color:var(--muted);margin-bottom:.6rem;padding:.4rem .6rem;background:var(--bg);border-radius:4px}
.vuln-status-strip .label{font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.triage-form{background:var(--bg);border-radius:6px;padding:.8rem;margin-top:.85rem;display:grid;grid-template-columns:1fr 1fr;gap:.6rem;align-items:end}
.triage-form .full{grid-column:1/-1}
.triage-form label{display:flex;flex-direction:column;gap:.25rem;font-size:.75rem;color:var(--muted);font-weight:600}
.triage-form select,.triage-form input,.triage-form textarea{padding:.35rem .55rem;border:1px solid var(--border);border-radius:4px;font-size:.8rem;font-family:inherit;background:var(--surface)}
.triage-form textarea{resize:vertical;min-height:60px}
.triage-actions{display:flex;gap:.4rem;align-items:center}
.triage-msg{font-size:.72rem;color:var(--green);font-weight:600}
.triage-msg.err{color:var(--red)}
.btn-link{background:transparent;border:0;color:var(--accent);font-size:.72rem;font-weight:600;cursor:pointer;padding:.2rem .4rem}
.btn-link:hover{text-decoration:underline}
.badge-falseposit{background:#e5e7eb;color:#374151}
.badge-accepted{background:#fef3c7;color:#92400e}
.badge-fixed{background:#dcfce7;color:#166534}
.badge-open{background:#dbeafe;color:#1e40af}

/* AI Fix */
.badge-aifix{background:#ede9fe;color:#6d28d9;border:1px solid #ddd6fe}
.vuln-card.is-ai-fixed{box-shadow:inset 3px 0 0 #8b5cf6}
.vuln-card.is-overridden.is-ai-fixed{box-shadow:inset 3px 0 0 var(--accent),inset 6px 0 0 #8b5cf6}
.vuln-status-strip-ai{background:#f5f3ff;color:#6d28d9}
.aifix-panel{background:var(--bg);border-radius:6px;padding:.8rem;margin-top:.85rem}
.aifix-status{font-size:.78rem;color:var(--muted);margin-bottom:.7rem;line-height:1.5}
.aifix-fields{display:flex;flex-wrap:wrap;gap:.5rem .9rem}
.aifix-field{display:flex;align-items:center;gap:.3rem;font-size:.78rem;font-weight:500;color:var(--text)}

/* Auto Enhance (bulk AI Fix modal) */
.vuln-toolbar{display:flex;align-items:center;justify-content:space-between;gap:.75rem;flex-wrap:wrap;margin:-.35rem 0 1rem}
.vuln-toolbar p{margin:0;font-size:.75rem;color:var(--muted)}
.btn-ae{background:#eef0ff;color:var(--accent);border:1px solid #c7d0ff}.btn-ae:hover{background:#e0e5ff}
.ae-banner{display:flex;align-items:center;gap:.6rem;background:#f5f3ff;border:1px solid #ddd6fe;color:#5b21b6;border-radius:var(--radius);padding:.5rem .8rem;font-size:.8rem;margin-bottom:.9rem}
.ae-overlay{position:fixed;inset:0;background:rgba(17,24,39,.45);z-index:300;display:flex;align-items:center;justify-content:center;padding:1.25rem}
.ae-modal{background:var(--surface);border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.28);width:min(820px,100%);max-height:calc(100vh - 2.5rem);display:flex;flex-direction:column;overflow:hidden}
.ae-head{display:flex;gap:.8rem;align-items:flex-start;padding:1.2rem 1.4rem .3rem}
.ae-icon{width:40px;height:40px;border-radius:50%;background:#eef0ff;color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.ae-icon svg{width:22px;height:22px}
.ae-title{font-size:1.3rem;font-weight:700;line-height:1.25}
.ae-sub{color:var(--muted);font-size:.85rem;margin-top:.15rem}
.ae-x{margin-left:auto;width:32px;height:32px;border:none;background:none;color:var(--muted);font-size:1.4rem;line-height:1;cursor:pointer;border-radius:6px;flex:none}
.ae-x:hover{background:var(--bg);color:var(--text)}
.ae-body{padding:.7rem 1.4rem 1rem;overflow:auto;flex:1;min-height:0}
.ae-llm{display:grid;grid-template-columns:1fr 1fr auto;gap:.8rem;align-items:end}
.ae-llm label{display:flex;flex-direction:column;gap:.3rem;font-size:.8rem;font-weight:500;min-width:0}
.ae-llm select,.ae-llm input,.ae-tools select,.ae-tools input{padding:.5rem .65rem;border:1px solid var(--border);border-radius:8px;font:inherit;font-size:.85rem;background:var(--surface);color:var(--text);min-width:0}
.ae-model-row{display:flex;gap:.4rem;min-width:0}.ae-model-row>*{flex:1 1 0;min-width:0}
.ae-pill{background:#eef0ff;color:var(--accent);border-radius:999px;padding:.55rem 1rem;font-weight:600;font-size:.8rem;white-space:nowrap}
.ae-tabs{display:flex;gap:1.6rem;border-bottom:1px solid var(--border);margin:1rem 0 .8rem}
.ae-tab{padding:.55rem .3rem;cursor:pointer;color:var(--muted);font:inherit;font-weight:500;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;background:none}
.ae-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.ae-count{background:#eef0ff;color:var(--accent);border-radius:999px;padding:0 .45rem;font-size:.72rem;margin-left:.35rem;font-weight:600}
.ae-tools{display:flex;gap:.5rem;align-items:center;margin-bottom:.6rem;flex-wrap:wrap}
.ae-tools input[type=search]{flex:1 1 220px}
.ae-check-btn{display:inline-flex;align-items:center;gap:.4rem;padding:.45rem .7rem;border:1px solid var(--border);border-radius:8px;font-size:.82rem;cursor:pointer;background:var(--surface)}
.ae-table-wrap{border:1px solid var(--border);border-radius:8px;max-height:300px;overflow:auto}
table.ae-table{width:100%;border-collapse:collapse;font-size:.82rem}
.ae-table th{position:sticky;top:0;z-index:1;background:#f3f4f6;text-align:left;font-weight:600;padding:.5rem .6rem;font-size:.78rem;white-space:nowrap;text-transform:none;letter-spacing:0;color:var(--text)}
.ae-table td{padding:.5rem .6rem;border-top:1px solid var(--border);vertical-align:middle}
.ae-table tr{cursor:pointer}.ae-table tr:hover td{background:#fafbff}
.ae-table tr.sel td{background:#f3f5ff}
.ae-table td.c,.ae-table th.c{text-align:center}
.ae-table .ae-rule{display:block;font-size:.7rem;color:var(--muted);font-family:ui-monospace,monospace}
.ae-chev{border:none;background:none;color:var(--muted);cursor:pointer;font-size:1rem;padding:0 .2rem}
.ae-chev:hover{color:var(--accent)}
.ae-empty{padding:1.2rem;text-align:center;color:var(--muted);font-size:.82rem}
.ae-fields-box{background:#f7f8ff;border:1px solid var(--border);border-radius:10px;padding:.8rem .9rem;margin-top:.9rem}
.ae-fields-title{font-weight:600;font-size:.88rem;display:flex;align-items:center;gap:.45rem}
.ae-fields-title svg{width:16px;height:16px;color:var(--muted)}
.ae-fields-sub{font-size:.75rem;color:var(--muted);margin:.1rem 0 .65rem}
.ae-fields{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.5rem}
.ae-field{position:relative;display:block;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:.6rem .55rem .55rem 1.9rem;cursor:pointer;min-width:0}
.ae-field input{position:absolute;left:.6rem;top:.65rem}
.ae-field.on{border-color:#c7d0ff;box-shadow:0 0 0 1px #c7d0ff}
.ae-field svg{width:16px;height:16px;color:var(--text);display:block;margin-bottom:.3rem}
.ae-field-t{font-weight:600;font-size:.8rem}
.ae-field-d{font-size:.7rem;color:var(--muted);line-height:1.35}
.ae-note{background:#fff7ed;border:1px solid #fed7aa;color:#7c2d12;border-radius:8px;padding:.55rem .8rem;font-size:.78rem;margin-top:.8rem;display:flex;gap:.5rem;align-items:center}
.ae-foot{display:flex;align-items:center;gap:.6rem;padding:.9rem 1.4rem;border-top:1px solid var(--border)}
.ae-foot-info{margin-right:auto;color:var(--muted);font-size:.8rem}
.ae-foot .btn{padding:.55rem 1.1rem;font-size:.85rem}
.ae-foot .btn:disabled{opacity:.5;cursor:not-allowed}
.ae-err{color:var(--red);font-size:.78rem}
.ae-live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-left:.4rem;vertical-align:middle;animation:aePulse 1.2s ease-in-out infinite}
@keyframes aePulse{50%{opacity:.25}}
@keyframes aeSpin{to{transform:rotate(360deg)}}
/* Activity Log: run summary */
.ae-run-box{border:1px solid #dfe3ff;border-radius:12px;overflow:hidden;margin-bottom:1rem}
.ae-run-banner{display:flex;align-items:center;gap:.8rem;padding:.75rem .9rem;background:#eef0ff}
.ae-run-banner.is-done{background:#ecfdf3}.ae-run-banner.is-partial{background:#fff7ed}
.ae-run-banner.is-cancelled,.ae-run-banner.is-cancelling{background:#f3f4f6}.ae-run-banner.is-error{background:#fef2f2}
.ae-run-icon{width:38px;height:38px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex:none;color:var(--accent);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.is-done .ae-run-icon{color:var(--green)}.is-partial .ae-run-icon{color:var(--medium)}.is-error .ae-run-icon{color:var(--red)}
.is-cancelled .ae-run-icon,.is-cancelling .ae-run-icon{color:var(--muted)}
.ae-run-icon svg{width:20px;height:20px}
.ae-run-icon.spin svg{animation:aeSpin 1.4s linear infinite}
.ae-run-text{min-width:0;flex:1}
.ae-run-title{font-weight:700;font-size:.92rem}
.ae-run-sub{font-size:.78rem;color:var(--muted);margin-top:.1rem}
.ae-cancel{display:inline-flex;align-items:center;gap:.45rem;border:1px solid var(--accent);color:var(--accent);background:#fff;border-radius:8px;padding:.45rem .8rem;font:inherit;font-size:.8rem;font-weight:600;cursor:pointer;flex:none}
.ae-cancel:hover{background:#f5f7ff}
.ae-stop{width:10px;height:10px;border-radius:2px;background:var(--accent)}
.ae-stats{display:grid;grid-template-columns:auto auto auto 1fr;align-items:center;background:var(--surface)}
.ae-stat{display:flex;align-items:center;gap:.65rem;padding:.8rem 1rem;border-left:1px solid var(--border);min-width:0}
.ae-stat:first-child{border-left:0}
.ae-stat-val{font-size:1.05rem;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.ae-stat-lbl{font-size:.75rem;color:var(--muted)}
.ae-ring{width:40px;height:40px;transform:rotate(-90deg);flex:none}
.ae-ring circle{fill:none;stroke-width:4.5}
.ae-ring-bg{stroke:#e8ebff}.ae-ring-ok{stroke:var(--accent);stroke-linecap:round;transition:stroke-dasharray .4s}.ae-ring-fail{stroke:var(--red)}
.ae-stat-ico{width:24px;height:24px;color:var(--text);flex:none}.ae-stat-ico.is-fail{color:var(--red)}
.ae-stat-ico svg{width:24px;height:24px}
.ae-stat-bar{gap:.8rem}
.ae-bar{flex:1;height:8px;background:#e8ebff;border-radius:99px;overflow:hidden}
.ae-bar>div{height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.ae-bar-pct{font-size:.8rem;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
/* Activity Log: timeline */
.ae-act-head{display:flex;align-items:center;justify-content:space-between;gap:.6rem;margin:.2rem 0 .7rem}
.ae-act-title{font-weight:700;font-size:1rem}
.ae-sort select{border:none;background:none;font:inherit;font-size:.82rem;font-weight:600;color:var(--text);cursor:pointer;padding:.2rem}
.ae-tl{position:relative;padding-left:2.1rem}
.ae-tl::before{content:'';position:absolute;left:.72rem;top:.6rem;bottom:.6rem;width:2px;background:#e5e7eb}
.ae-tl-item{position:relative;margin-bottom:.6rem}
.ae-tl-mark{position:absolute;left:-2.1rem;top:.7rem;width:1.45rem;height:1.45rem;display:flex;align-items:center;justify-content:center;background:var(--surface);border-radius:50%}
.ae-tl-mark svg{width:1.45rem;height:1.45rem}
.ae-tl-mark.is-applied{color:var(--accent)}.ae-tl-mark.is-failed{color:var(--red)}.ae-tl-mark.is-cancelled{color:var(--muted)}
.ae-dot{width:10px;height:10px;border-radius:50%;border:2px solid #cbd5e1;background:var(--surface)}
.ae-spinner{width:16px;height:16px;border:2.5px solid #dfe3ff;border-top-color:var(--accent);border-radius:50%;animation:aeSpin .8s linear infinite}
.ae-tl-card{border:1px solid var(--border);border-radius:10px;padding:.7rem .85rem;background:var(--surface)}
.ae-tl-card.is-failed{border-color:#fecaca}
.ae-tl-top{display:flex;align-items:flex-start;gap:.75rem}
.ae-tl-main{flex:1;min-width:0}
.ae-tl-title{font-weight:600;font-size:.88rem;line-height:1.35}
.ae-tl-sub{font-size:.76rem;color:var(--muted);margin-top:.1rem}
.ae-st-pill{flex:none;border-radius:999px;padding:.15rem .6rem;font-size:.72rem;font-weight:600;white-space:nowrap}
.ae-st-pill.is-applied{background:#dcfce7;color:#15803d}.ae-st-pill.is-failed{background:#fee2e2;color:#b91c1c}
.ae-st-pill.is-running{background:#e0e7ff;color:#4338ca}.ae-st-pill.is-pending{background:#f3f4f6;color:var(--muted)}
.ae-st-pill.is-cancelled{background:#f3f4f6;color:#4b5563}.ae-st-pill.is-partial{background:#fef3c7;color:#92400e}
.ae-tl-dur{flex:none;width:3.6rem;text-align:right;font-size:.8rem;color:var(--text);font-variant-numeric:tabular-nums;padding-top:.1rem}
.ae-tl-more{flex:none;display:inline-flex;align-items:center;gap:.2rem;border:none;background:none;color:var(--accent);font:inherit;font-size:.78rem;font-weight:500;cursor:pointer;padding:.1rem 0}
.ae-caret svg{width:14px;height:14px;display:block;transition:transform .15s}.ae-caret.up svg{transform:rotate(180deg)}
.ae-tl-upd{display:flex;align-items:center;gap:.35rem;font-size:.8rem;margin-top:.45rem;flex-wrap:wrap}
.ae-tl-upd svg{width:15px;height:15px;color:var(--green);flex:none}
.ae-tl-upd.is-muted{color:var(--muted);font-style:italic}
.ae-tl-err{display:flex;align-items:center;gap:.5rem;background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:.5rem .6rem;margin-top:.55rem;font-size:.8rem;color:#7f1d1d}
.ae-tl-err>svg{width:16px;height:16px;color:var(--red);flex:none}
.ae-tl-err>span{flex:1;min-width:0}
.ae-tl-skip{display:flex;align-items:center;gap:.5rem;font-size:.8rem;color:var(--muted);margin-top:.45rem}
.ae-tl-skip>span{flex:1}
.ae-retry{display:inline-flex;align-items:center;gap:.35rem;flex:none;border:1px solid var(--border);background:var(--surface);border-radius:7px;padding:.3rem .6rem;font:inherit;font-size:.76rem;font-weight:600;color:var(--text);cursor:pointer}
.ae-retry:hover{border-color:var(--accent);color:var(--accent)}.ae-retry:disabled{opacity:.6;cursor:wait}
.ae-retry svg{width:14px;height:14px}
.ae-tl-details{margin-top:.6rem;border-top:1px dashed var(--border);padding-top:.55rem;display:flex;flex-direction:column;gap:.45rem}
.ae-chg-k{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.ae-chg-v{font-size:.8rem;white-space:pre-wrap;word-break:break-word;background:#f9fafb;border-radius:6px;padding:.4rem .55rem;margin-top:.15rem}
.ae-chg-none{font-size:.8rem;color:var(--muted)}
.ae-chg-meta{font-size:.72rem;color:var(--muted)}
.ae-empty-lg{display:flex;flex-direction:column;align-items:center;gap:.35rem;padding:2rem 1rem}
.ae-empty-lg svg{width:28px;height:28px;color:var(--accent)}
.ae-run{border:1px solid var(--border);border-radius:10px;margin-bottom:.7rem;padding:0 .8rem}
.ae-run>summary{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;padding:.7rem 0;cursor:pointer;font-size:.84rem;list-style:none}
.ae-run>summary::-webkit-details-marker{display:none}
.ae-run[open]>summary{border-bottom:1px solid var(--border);margin-bottom:.7rem}
.ae-run-meta{color:var(--muted);font-size:.75rem}
.ae-fulllog svg{width:15px;height:15px}
.ae-foot-info .ae-fulllog{color:var(--text)}
@media(max-width:720px){.ae-llm{grid-template-columns:1fr}.ae-fields{grid-template-columns:repeat(2,minmax(0,1fr))}.ae-table .hide-sm{display:none}.ae-stats{grid-template-columns:1fr 1fr}.ae-stat:nth-child(3){border-left:0}.ae-stat-bar{grid-column:1/-1;border-left:0}.ae-tl-top{flex-wrap:wrap}.ae-tl-dur{width:auto}}

/* table */
.tbl-wrap{width:100%;max-width:100%;min-width:0;overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:.8rem}
th,td{padding:.5rem .75rem;text-align:left;border-bottom:1px solid var(--border)}
th{font-weight:600;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;background:var(--bg)}
tr:hover td{background:#fafbfc}
td.mono{font-family:monospace;font-size:.75rem}
td.truncate{max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* tabs */
.tabs{display:flex;gap:0;width:100%;max-width:100%;min-width:0;overflow-x:auto;overflow-y:hidden;contain:inline-size;overscroll-behavior-x:contain;border-bottom:2px solid var(--border);margin-bottom:1.25rem;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.tab{flex:0 0 auto;white-space:nowrap;padding:.5rem 1rem;font-size:.8rem;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:color .1s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}

/* log */
.log-box{max-width:100%;background:#111;color:#e2e8f0;border-radius:var(--radius);padding:.9rem 1rem;font-family:monospace;font-size:.72rem;max-height:400px;overflow:auto;white-space:pre-wrap;word-break:break-all}

/* Functions tab: JADX-GUI-style file tree + source viewer */
.fn-wrap{display:flex;gap:0;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;height:calc(100vh - 220px);min-height:420px}
.fn-tree-pane{flex:0 0 var(--fn-tree-w,280px);border-right:1px solid var(--border);display:flex;flex-direction:column;background:var(--surface);overflow:hidden}
.fn-drag-handle{flex:0 0 auto;width:6px;cursor:col-resize;background:transparent}
.fn-drag-handle:hover,.fn-drag-handle.dragging{background:var(--accent)}
.fn-tree-search{padding:.6rem;border-bottom:1px solid var(--border)}
.fn-tree-search input{width:100%;padding:.4rem .6rem;border:1px solid var(--border);border-radius:var(--radius);font-size:.8rem}
.fn-tree-list{flex:1;overflow-y:auto;font-size:.8rem;padding:.25rem 0}
.fn-tree-node{padding:.3rem .5rem;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:.3rem}
.fn-tree-node:hover{background:var(--bg)}
.fn-tree-node.active{background:var(--bg);font-weight:600}
.fn-tree-arrow{display:inline-block;width:1em;color:var(--muted);font-size:.7rem}
.fn-tree-label{overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:.35rem}
.fn-tree-sev{display:inline-block;width:6px;height:6px;border-radius:50%;flex:0 0 auto}
.fn-tree-sev.CRITICAL{background:#9d174d}
.fn-tree-sev.HIGH{background:var(--high)}
.fn-tree-sev.MEDIUM{background:var(--medium)}
.fn-tree-sev.LOW{background:var(--low)}
.fn-drawer-toggle{display:none;margin-top:.5rem}

.fn-viewer-pane{flex:1;min-width:0;display:flex;flex-direction:column}
.fn-open-tabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--border);flex:0 0 auto;scrollbar-width:thin}
.fn-open-tab{display:flex;align-items:center;gap:.5rem;padding:.4rem .7rem;font-size:.78rem;border-right:1px solid var(--border);cursor:pointer;white-space:nowrap;color:var(--muted)}
.fn-open-tab.active{color:var(--text);background:var(--bg)}
.fn-open-tab-close{opacity:.55;padding:0 .15rem}
.fn-open-tab-close:hover{opacity:1}
.fn-viewer-body{flex:1;min-height:0;display:flex;flex-direction:column}
.fn-breadcrumb{padding:.5rem .75rem;font-size:.75rem;color:var(--muted);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-family:monospace}
.fn-breadcrumb-actions{display:flex;align-items:center;gap:.4rem;font-family:inherit}
.fn-outline{position:relative}
.fn-outline summary{cursor:pointer;list-style:none;padding:.3rem .6rem;font-size:.72rem;border:1px solid var(--border);border-radius:var(--radius);color:var(--muted)}
.fn-outline summary::-webkit-details-marker{display:none}
.fn-outline[open] summary{color:var(--text);border-color:var(--accent)}
.fn-outline-list{position:absolute;right:0;top:calc(100% + .3rem);background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);box-shadow:var(--shadow);max-height:300px;overflow-y:auto;z-index:20;min-width:220px}
.fn-outline-item{padding:.4rem .7rem;font-size:.75rem;cursor:pointer;white-space:nowrap;color:var(--text)}
.fn-outline-item:hover{background:var(--bg)}
.fn-code-scroll{flex:1;overflow-y:auto;display:flex;align-items:flex-start;background:#0d1117;
  scrollbar-width:thin;scrollbar-color:#30363d #0d1117}
.fn-code-scroll::-webkit-scrollbar{width:10px;height:10px}
.fn-code-scroll::-webkit-scrollbar-track{background:#0d1117}
.fn-code-scroll::-webkit-scrollbar-thumb{background:#30363d;border-radius:6px;border:2px solid #0d1117}
.fn-code-scroll::-webkit-scrollbar-thumb:hover{background:#484f58}
.fn-gutter{flex:0 0 auto;margin:0;padding:.85rem .9rem;color:#4b5563;font-size:.78rem;line-height:1.65;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  text-align:right;user-select:none;white-space:pre;background:#090c10;border-right:1px solid #1c232c}
.fn-code-pre{flex:1;overflow-x:auto;overflow-y:hidden;margin:0;padding:.85rem 1.1rem;font-size:.78rem;line-height:1.65;min-width:0;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  scrollbar-width:thin;scrollbar-color:#30363d #0d1117}
.fn-code-pre::-webkit-scrollbar{height:10px}
.fn-code-pre::-webkit-scrollbar-track{background:#0d1117}
.fn-code-pre::-webkit-scrollbar-thumb{background:#30363d;border-radius:6px;border:2px solid #0d1117}
.fn-code-pre::-webkit-scrollbar-thumb:hover{background:#484f58}
.hljs{background:#0d1117!important}

@media(max-width:900px){
  .fn-wrap{height:calc(100vh - 180px)}
  .fn-tree-pane{position:fixed;top:0;left:0;bottom:0;width:min(320px,85vw);z-index:210;
    transform:translateX(-100%);transition:transform .22s ease;box-shadow:8px 0 24px rgba(0,0,0,.08)}
  .fn-tree-pane.open{transform:translateX(0)}
  .fn-tree-backdrop{display:block;position:fixed;inset:0;background:rgba(26,29,35,.28);z-index:205;opacity:0;pointer-events:none;transition:opacity .2s}
  .fn-tree-backdrop.open{opacity:1;pointer-events:auto}
  .fn-drawer-toggle{display:inline-flex}
}
.fn-tree-backdrop{display:none}
@media(max-width:640px){
  .fn-open-tab{padding:.35rem .5rem;font-size:.72rem}
  .fn-tree-pane{width:min(280px,85vw)}
}

/* search bar */
.search-bar{display:flex;gap:.5rem;margin-bottom:1rem}
.search-bar input,.search-bar select{min-width:0;padding:.4rem .7rem;border:1px solid var(--border);border-radius:var(--radius);font-size:.8rem;flex:1}
.search-bar select{flex:0 0 auto;max-width:280px}

/* pagination */
.pagination{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;min-width:0;max-width:100%;margin-top:.75rem;font-size:.8rem;color:var(--muted)}
.pagination .page-btn{padding:.3rem .65rem;border:1px solid var(--border);border-radius:4px;cursor:pointer;background:var(--surface)}
.pagination .page-btn:hover{background:var(--bg)}
.pagination .page-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.pagination .page-btn:disabled{cursor:not-allowed;opacity:.45;background:var(--surface)}
.strings-table{min-width:700px}
.res-row-highlight td{background:#fef3c7!important;animation:res-flash 1.6s ease-out 1}
@keyframes res-flash{from{background:#fde68a}to{background:#fef3c7}}
.strings-pagination{justify-content:space-between}
.strings-pagination-actions{display:flex;align-items:center;gap:.5rem}
.llm-table{min-width:700px}
.llm-pagination{justify-content:space-between}
.llm-pagination-actions{display:flex;align-items:center;gap:.5rem}

/* scan list row */
.scan-row{display:flex;align-items:center;gap:1rem;min-width:0;padding:.75rem 1rem;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s}
.scan-row>:first-child{min-width:0}
.scan-row:hover{background:var(--bg)}
.scan-name{font-weight:600;font-size:.875rem;overflow-wrap:anywhere}
.scan-meta{font-size:.75rem;color:var(--muted)}
.scan-meta span+span::before{content:" · "}

/* all scans */
.scans-card{overflow:hidden}
.scans-card-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.75rem;margin-bottom:1rem}
.scans-card-head .card-title{margin:0}
.scans-table{table-layout:fixed}
.scans-table th:nth-child(1){width:34%}
.scans-table th:nth-child(2){width:12%}
.scans-table th:nth-child(3){width:11%}
.scans-table th:nth-child(4){width:22%}
.scans-table th:nth-child(5){width:11%}
.scans-table th:nth-child(6){width:10%}
.scans-table td{vertical-align:middle}
.scans-table td:nth-child(2),.scans-table td:nth-child(4),.scans-table td:nth-child(5){white-space:nowrap}
.scans-table td:last-child{text-align:right}
.scans-file-link{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.scan-sort-button{display:inline-flex;align-items:center;gap:.2rem;border:0;background:transparent;color:inherit;font:inherit;font-weight:inherit;text-transform:inherit;letter-spacing:inherit;cursor:pointer}
.scan-sort-button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
.scans-mobile-toolbar,.scans-card-list{display:none}
.scans-mobile-toolbar{align-items:center;flex-wrap:wrap;gap:.5rem;margin-bottom:.75rem}
.scans-mobile-toolbar label{font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.scans-mobile-toolbar select{min-width:0;flex:1;padding:.4rem .6rem;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text);font:inherit}
.scans-direction{flex-shrink:0;justify-content:center;min-width:6.5rem}
.scans-card-list{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.scans-list-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.8rem 1rem;padding:1rem;background:var(--surface);border-bottom:1px solid var(--border)}
.scans-list-item:last-child{border-bottom:0}
.scans-list-main{min-width:0}
.scans-list-name{display:block;font-weight:650;font-size:.9rem;line-height:1.4;overflow-wrap:anywhere;word-break:break-word}
.scans-list-meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.65rem 1rem;margin-top:.75rem}
.scans-meta-item{min-width:0}
.scans-meta-label{display:block;margin-bottom:.1rem;color:var(--muted);font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.scans-meta-value{display:block;min-width:0;font-size:.78rem;overflow-wrap:anywhere}
.scans-list-actions{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;gap:.75rem}
@media(max-width:900px){
  .scans-desktop{display:none}
  .scans-mobile-toolbar,.scans-card-list{display:flex}
  .scans-card-list{flex-direction:column}
}
@media(max-width:520px){
  main{padding:1rem}
  .card{padding:1rem}
  .scans-card-head{align-items:stretch}
  .scans-card-head .card-title{flex:1 1 8rem}
  .scans-list-item{gap:.75rem;padding:.85rem}
  .scans-list-meta{grid-template-columns:repeat(2,minmax(0,1fr))}
}

/* progress */
progress{width:100%;height:6px;border-radius:3px;appearance:none;margin-top:.75rem}
progress::-webkit-progress-bar{background:var(--border);border-radius:3px}
progress::-webkit-progress-value{background:var(--accent);border-radius:3px}

/* alerts */
.alert{padding:.75rem 1rem;border-radius:var(--radius);font-size:.85rem;margin-bottom:1rem}
.alert-info{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}
.alert-error{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}
.alert-warn{background:#fffbeb;color:#92400e;border:1px solid #fde68a}

/* detail header */
.detail-header{display:flex;align-items:flex-start;gap:1rem;min-width:0;max-width:100%;margin-bottom:1.25rem}
.detail-header>:first-child{min-width:0}
.detail-title{font-size:1.1rem;font-weight:700;overflow-wrap:anywhere}
.detail-sub{font-size:.8rem;color:var(--muted);margin-top:.2rem;overflow-wrap:anywhere}
.detail-actions{margin-left:auto;display:flex;gap:.5rem}

/* kv list */
.kv{display:grid;grid-template-columns:minmax(6rem,160px) minmax(0,1fr);gap:.35rem .75rem;font-size:.82rem}
.kv-key{min-width:0;color:var(--muted);font-weight:500}
.kv-val{min-width:0;font-family:monospace;overflow-wrap:anywhere;word-break:normal}
@media(max-width:900px){
  .detail-header{flex-wrap:wrap}
  .detail-header>:first-child{flex:1 1 28rem}
  .detail-actions{flex-wrap:wrap;justify-content:flex-end}
}
@media(max-width:640px){
  .detail-actions{width:100%;margin-left:0;justify-content:flex-start}
  .kv{grid-template-columns:minmax(5.5rem,7rem) minmax(0,1fr)}
}

/* entry-point lists (summary mini + full tab) */
.ep-list{list-style:none;margin:0;padding:0}
.ep-item{display:flex;align-items:baseline;gap:.45rem;padding:.35rem 0;border-bottom:1px solid var(--border);font-size:.78rem;line-height:1.45;min-width:0}
.ep-item:last-child{border-bottom:none}
.ep-type{flex-shrink:0;font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:.1rem .4rem;border-radius:4px;background:var(--bg);color:var(--muted)}
.ep-type-activity{background:#dbeafe;color:#1e40af}
.ep-type-service{background:#dcfce7;color:#166534}
.ep-type-receiver{background:#fef3c7;color:#92400e}
.ep-type-provider{background:#e0e7ff;color:#3730a3}
.ep-type-native{background:#f3e8ff;color:#6b21a8}
.ep-name{font-weight:600;color:var(--text);flex-shrink:0}
.ep-class{font-family:monospace;color:var(--muted);overflow-wrap:anywhere;word-break:break-word;min-width:0}
#ep-mini .ep-item{overflow:hidden}
#ep-mini .ep-name,#ep-mini .ep-class{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#ep-mini .ep-name{flex-shrink:1}
.ep-summary-footer{display:flex;align-items:center;justify-content:space-between;gap:.75rem;margin-top:.75rem;padding-top:.65rem;border-top:1px solid var(--border);font-size:.75rem}
.ep-summary-count{color:var(--muted)}
.ep-pagination{justify-content:space-between;flex-wrap:wrap}
.ep-pagination-actions{display:flex;align-items:center;gap:.5rem}

/* loading / empty */
.loading{text-align:center;padding:3rem;color:var(--muted)}
.empty{text-align:center;padding:2.5rem;color:var(--muted);font-size:.875rem}

/* spinner */
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite;display:inline-block}

/* hidden */
[hidden]{display:none!important}

/* LLM findings list + detail drawer */
.llm-row{cursor:pointer}
.llm-row:hover td{background:#f0f3ff}
.llm-row.selected td{background:#eef2ff}
.llm-row.selected td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.llm-preview{color:var(--muted);font-size:.75rem;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.th-sort{cursor:pointer;user-select:none;white-space:nowrap}
.th-sort:hover{color:var(--text)}
.th-sort .sort-ind{display:inline-block;min-width:0.9em;margin-left:.2rem;font-size:.65rem;color:var(--muted);opacity:0}
.th-sort:hover .sort-ind{opacity:.45}
.th-sort.active{color:var(--text)}
.th-sort.active .sort-ind{opacity:1;color:var(--accent)}
.llm-drawer-backdrop{position:fixed;inset:0;background:rgba(26,29,35,.28);z-index:200;opacity:0;pointer-events:none;transition:opacity .2s}
.llm-drawer-backdrop.open{opacity:1;pointer-events:auto}
.llm-drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100vw);max-width:100%;visibility:hidden;background:var(--surface);border-left:1px solid var(--border);box-shadow:-8px 0 24px rgba(0,0,0,.08);z-index:210;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .22s ease,visibility 0s linear .22s;outline:none}
.llm-drawer.open{visibility:visible;transform:translateX(0);transition-delay:0s}
.llm-drawer-head{display:flex;align-items:flex-start;gap:.75rem;padding:1rem 1.1rem;border-bottom:1px solid var(--border);flex-shrink:0}
.llm-drawer-head-main{flex:1;min-width:0}
.llm-drawer-title{font-weight:700;font-size:.95rem;word-break:break-word}
.llm-drawer-meta{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;margin-top:.45rem;font-size:.72rem;color:var(--muted)}
.meta-chip{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:.1rem .45rem;font-weight:600;font-size:.72rem;color:var(--muted)}
.llm-drawer-close{flex-shrink:0;width:32px;height:32px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--muted);font-size:1.1rem;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.llm-drawer-close:hover{background:var(--bg);color:var(--text)}
.llm-drawer-body{flex:1;overflow-y:auto;padding:1rem 1.1rem 1.5rem}

    {value:'claude-opus-5-5', label:'Claude Opus 5.5'},
    {value:'claude-fable-5-1', label:'Claude Fable 5.1'},

const LLM_MODEL_CUSTOM = '__custom__';

window.onProviderChange = function() {
  const provider = document.getElementById('llm-provider')?.value || 'none';
  const keyRow   = document.getElementById('llm-key-row');
  const keyLabel = document.getElementById('llm-key-label');
  if (!keyRow) return;
  const needsKey = provider === 'openai' || provider === 'claude' || provider === 'deepseek';
  keyRow.hidden = !needsKey;
  if (provider === 'openai') keyLabel.innerHTML = 'OpenAI API Key (sk-...) <span style="color:var(--red)">*</span>';
  if (provider === 'claude') keyLabel.innerHTML = 'Anthropic API Key (sk-ant-...) <span style="color:var(--red)">*</span>';
  if (provider === 'deepseek') keyLabel.innerHTML = 'DeepSeek API Key <span style="color:var(--red)">*</span>';
  const oauthHint = document.getElementById('llm-oauth-hint');
  if (oauthHint) {
    oauthHint.hidden = provider !== 'claude-oauth';
    if (provider === 'claude-oauth') refreshOauthStatus();
  }

  const modelEl = document.getElementById('llm-model');
  const modelSelect = document.getElementById('llm-model-select');
  if (modelEl && modelSelect) {
    const catalog = LLM_MODEL_CATALOG[provider];
    if (catalog) {
      modelSelect.innerHTML = catalog.map(m => `<option value="${escAttr(m.value)}">${esc(m.label)}</option>`).join('')
        + `<option value="${LLM_MODEL_CUSTOM}">Custom (type model name)…</option>`;
      modelSelect.value = catalog[0].value;
      modelSelect.hidden = false;
      modelEl.hidden = true;
      modelEl.value = '';
    } else {
      // ollama (every install's local model list is different) or no provider: plain text, as before.
      modelSelect.hidden = true;
      modelEl.hidden = false;
      modelEl.placeholder = provider === 'ollama' ? 'e.g. llama3 (leave empty for default)' : 'leave empty for default';
    }
  }
  // Clear any previous error when switching provider
  clearKeyError();
};

window.onModelSelectChange = function() {
  const modelSelect = document.getElementById('llm-model-select');
  const modelEl = document.getElementById('llm-model');
  if (!modelSelect || !modelEl) return;
  const custom = modelSelect.value === LLM_MODEL_CUSTOM;
  modelEl.hidden = !custom;
  if (custom) { modelEl.value = ''; modelEl.placeholder = 'Type the exact model name'; modelEl.focus(); }
};

/* Same dropdown-with-Custom-escape-hatch pattern as the upload form's "Model override" field,
   reused here for the AI Assistant chat bar's own provider/model pair. claude-oauth shares
   claude's model catalog — it is the same Claude models, just authenticated differently. */
window.onChatProviderChange = function() {
  const provider = document.getElementById('chat-provider')?.value || '';
  const modelSelect = document.getElementById('chat-model-select');
  const modelEl = document.getElementById('chat-model');
  if (!modelSelect || !modelEl) return;
  const catalog = LLM_MODEL_CATALOG[provider === 'claude-oauth' ? 'claude' : provider];
  if (catalog) {
    modelSelect.innerHTML = catalog.map(m => `<option value="${escAttr(m.value)}">${esc(m.label)}</option>`).join('')
      + `<option value="${LLM_MODEL_CUSTOM}">Custom (type model name)…</option>`;
    modelSelect.value = catalog[0].value;
    modelSelect.hidden = false;
    modelEl.hidden = true;
  } else {
    modelSelect.hidden = true;
    modelEl.hidden = false;
  }
};

window.onChatModelSelectChange = function() {
  const modelSelect = document.getElementById('chat-model-select');
  const modelEl = document.getElementById('chat-model');
  if (!modelSelect || !modelEl) return;
  const custom = modelSelect.value === LLM_MODEL_CUSTOM;
  modelEl.hidden = !custom;
  if (custom) { modelEl.value = ''; modelEl.focus(); }

window.clearKeyError = function() {
  const keyInput = document.getElementById('llm-api-key');
  const keyError = document.getElementById('llm-key-error');
  if (keyInput) keyInput.style.borderColor = '';
  if (keyError) keyError.hidden = true;
};

/* ── Claude OAuth status/import (provider = claude-oauth) ── */
window.refreshOauthStatus = async function() {
  const textEl = document.getElementById('oauth-status-text');
  const ccRow = document.getElementById('oauth-claude-code-row');
  if (!textEl) return;
  try {
    const s = await api('/auth/claude-oauth/status');
    textEl.textContent = s.configured
      ? ' A session is already stored on the server — ready to use.'
      : ' No session stored on the server yet.';
    if (ccRow) ccRow.hidden = !(s.claude_code_detected && !s.configured);
  } catch (e) {
    textEl.textContent = ' Could not check status: ' + (e.message || e);
  }
};

window.importFromClaudeCode = async function() {
  const errEl = document.getElementById('oauth-import-err');
  errEl.innerHTML = '';
  try {
    const r = await api('/auth/claude-oauth/import-claude-code', {method: 'POST'});
    if (r.changed) {
      errEl.innerHTML = `<div class="alert alert-info" style="margin-top:.4rem">Imported a new token (${esc(r.token_fingerprint)}).</div>`;
    } else {
      // Same access_token as what was already stored — most likely sync-claude-oauth.sh
      // (run on the host) hadn't finished writing a fresh one yet when this ran. Say so
      // plainly instead of a bare "ok" that looks identical to a real new import.
      errEl.innerHTML = `<div class="alert alert-warn" style="margin-top:.4rem">
        Imported the <strong>same</strong> token that was already stored (${esc(r.token_fingerprint)}) — nothing changed.
        If chat/scans still fail after this, the server operator likely needs to re-run
        <code>./sync-claude-oauth.sh</code> on the host and wait for it to finish
        <strong>before</strong> clicking Import again.
      </div>`;
    }
    refreshOauthStatus();
  } catch (e) {
    errEl.innerHTML = `<div class="alert alert-error" style="margin-top:.4rem">${esc(e.message || String(e))}</div>`;
  }
};

window.importOauthToken = async function() {
  const errEl = document.getElementById('oauth-import-err');
  errEl.innerHTML = '';
  const access_token = document.getElementById('oauth-imp-access').value.trim();
  const refresh_token = document.getElementById('oauth-imp-refresh').value.trim();
  const expires_at_ms = parseInt(document.getElementById('oauth-imp-expires').value.trim(), 10);
  if (!access_token || !refresh_token || !Number.isFinite(expires_at_ms)) {
    errEl.innerHTML = '<div class="alert alert-error" style="margin-top:.4rem">Fill in all three fields (expiresAt must be a number).</div>';
    return;
  }
  try {
    await api('/auth/claude-oauth/import-token', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({access_token, refresh_token, expires_at_ms}),
    });
    document.getElementById('oauth-imp-access').value = '';
    document.getElementById('oauth-imp-refresh').value = '';
    document.getElementById('oauth-imp-expires').value = '';
    refreshOauthStatus();
  } catch (e) {
    errEl.innerHTML = `<div class="alert alert-error" style="margin-top:.4rem">${esc(e.message || String(e))}</div>`;
  }
};

window.onLlmModeChange = function() {
  const mode = document.getElementById('llm-mode')?.value || '';
  const warn = document.getElementById('offensive-warn');
  const help = document.getElementById('llm-mode-help');
  if (warn) warn.hidden = mode !== 'offensive';
  if (help) {
    help.textContent = ({
      summarize: 'Fast Scan = scopes MSTG + optional LLM to first-party app code and native libs. On .ipa, Ghidra still decompiles the whole binary first (no first-party skip at that step), so this does not shorten the decompile phase.',
      find_vulns: 'Full Scan = includes third-party Java/native. MSTG on everything ingested; optional LLM FIND_VULNS.',
      auto_fix: 'Auto Fix = reconstruct decompiled code. First-party scope (same as Fast Scan).',
      offensive: 'Offensive = first-party Frida playbooks plus a small security-SDK allowlist. Requires LLM on.'
    })[mode] || '';
  }
  if (mode === 'offensive') {
    const provider = document.getElementById('llm-provider');
    if (provider && (provider.value === 'none' || !provider.value)) {
      provider.value = 'deepseek';
      onProviderChange();
    }
  }
};

/* ── config ── */
const KEY_LS = 'malimite.apikey';   // remembered in this browser only; best-effort (storage can be blocked)
const keyEl = () => document.getElementById('nav-key');
function apiKey() { return keyEl() ? keyEl().value : ''; }
(function initKey() {
  const el = keyEl();
  if (!el) return;
  try { el.value = localStorage.getItem(KEY_LS) || ''; } catch (_) {}
  el.addEventListener('change', () => {
    try { el.value ? localStorage.setItem(KEY_LS, el.value) : localStorage.removeItem(KEY_LS); } catch (_) {}
    router();   // reload whatever is on screen with the new key
  });
})();

function headers(extra={}) {
  const h = {'Accept':'application/json', ...extra};
  if (apiKey()) h['X-Api-Key'] = apiKey();
  return h;
}

/* FastAPI's `detail` is a plain string for a hand-raised HTTPException, but a list of
   {type,loc,msg,ctx} objects for a Pydantic request-validation failure (422) — shown raw via
   JSON.stringify before this, e.g. `[{"type":"string_too_long",...}]`. */
function formatApiErrorDetail(detail) {
  if (typeof detail === 'string') return detail;
  if (Array.isArray(detail)) {
    return detail.map(e => {
      const field = Array.isArray(e.loc) ? e.loc[e.loc.length - 1] : '';
      return field ? `${field}: ${e.msg}` : (e.msg || JSON.stringify(e));
    }).join('; ');
  }
  return JSON.stringify(detail);
}

async function api(path, opts={}) {
  // `...opts` must come first: opts itself can carry a `headers` key (e.g. a PATCH/POST body's
  // Content-Type), and spreading it after a computed `headers:` entry would silently overwrite
  // that entry — including the X-Api-Key header headers() adds — with the caller's raw value.
  const r = await fetch('/api/v1' + path, {...opts, headers: headers(opts.headers||{})});
  if (!r.ok) {
    if (r.status === 401) {
      if (keyEl()) keyEl().focus();
      const err = new Error(apiKey() ? 'Invalid API key — check the "API Key" field (top right).'
                               : 'This server requires an API key — enter it in the "API Key" field (top right).');
      err.status = 401;
      throw err;
    }
    let msg = await r.text().catch(()=>'');
    try { const j = JSON.parse(msg); if (j && j.detail != null) msg = formatApiErrorDetail(j.detail); } catch (_) {}
    const err = new Error(msg || r.statusText);
    err.status = r.status;
    throw err;
  }
  return r.json();
}

/* Plain <a href="/api/v1/..."> links cannot send the X-Api-Key header, so with a key set they are fetched with it
   and handed to the browser as a blob (report/log open in a tab, everything else downloads). */
document.addEventListener('click', async ev => {
  const a = ev.target.closest && ev.target.closest('a[href^="/api/v1/"]');
  if (!a || !apiKey() || ev.defaultPrevented) return;
  ev.preventDefault();
  const popup = a.target === '_blank' ? window.open('', '_blank') : null;   // opened synchronously: popup blockers
  try {
    const r = await fetch(a.getAttribute('href'), {headers: headers({'Accept': '*/*'})});
    if (!r.ok) throw new Error(r.status === 401 ? 'Invalid API key' : ((await r.text().catch(()=>'')) || r.statusText).slice(0, 200));
    const url = URL.createObjectURL(await r.blob());
    if (popup) { popup.location = url; }
    else {
      const m = (r.headers.get('content-disposition') || '').match(/filename="?([^";]+)/);
      const d = document.createElement('a');
      d.href = url;
      d.download = a.getAttribute('download') || (m && m[1]) || a.getAttribute('href').split('?')[0].split('/').pop();
      document.body.appendChild(d); d.click(); d.remove();
    }
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  } catch (e) {
    if (popup) popup.close();
    alert('Download failed: ' + (e.message || e));
  }
});

/* ── router ── */
const routes = {};
function route(pattern, fn) { routes[pattern] = fn; }

function router() {
  const hash = location.hash.replace(/^#\/?/,'') || '';
  document.querySelectorAll('.nav-link').forEach(a => {
    const r = a.dataset.route;
    a.classList.toggle('active',
      (r==='home' && hash==='') || (r!=='home' && hash.startsWith(r)));
  });
  const parts = hash.split('/');
  if (parts[0]==='scan' && parts[1]) return routes['scan'](parts[1], parts[2]||'summary');
  if (routes[parts[0]]) return routes[parts[0]](parts[1]);
  routes['home']();
}

window.addEventListener('hashchange', router);
function render(html) {
  const app = document.getElementById('app');
  app.classList.remove('main-wide');   // every full-page route resets the Functions-tab width exception
  app.innerHTML = html;
}
function $(s) { return document.querySelector(s); }
function $$(s) { return [...document.querySelectorAll(s)]; }

/* ── utils ── */
function badge(state) {
  const normalized = String(state||'queued').toLowerCase();
  const safeState = ['queued','running','done','error'].includes(normalized) ? normalized : 'queued';
  return `<span class="badge badge-${safeState}">${esc(state||'queued')}</span>`;
}
function sevBadge(text='') {
  if (/\bCRITICAL\b/i.test(text)) return '<span class="badge badge-critical">CRITICAL</span>';
  if (/\bHIGH\b/i.test(text)) return '<span class="badge badge-high">HIGH</span>';
  if (/\bMEDIUM\b/i.test(text)) return '<span class="badge badge-medium">MEDIUM</span>';
  if (/\bLOW\b/i.test(text)) return '<span class="badge badge-low">LOW</span>';
  return '<span class="badge badge-info">INFO</span>';
}
function sevBadgeLevel(level='') {
  const s = String(level||'').toUpperCase();
  if (s === 'CRITICAL') return '<span class="badge badge-critical">CRITICAL</span>';
  if (s === 'HIGH') return '<span class="badge badge-high">HIGH</span>';
  if (s === 'MEDIUM') return '<span class="badge badge-medium">MEDIUM</span>';
  if (s === 'LOW') return '<span class="badge badge-low">LOW</span>';
  if (!s) return '<span class="badge badge-info">INFO</span>';
  return `<span class="badge badge-info">${esc(s)}</span>`;
}
function fmt(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleString();
}
function dur(a, b) {
  if (!a||!b) return '—';
  const ms = new Date(b)-new Date(a);
  if (ms < 60000) return (ms/1000).toFixed(1)+'s';
  return (ms/60000).toFixed(1)+'m';
}
function esc(s='') {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escAttr(s='') {
  return esc(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function num(n) { return n==null?'—':n.toLocaleString(); }

function scanModeLabel(mode='') {
  const m = String(mode||'').toLowerCase().replace(/-/g, '_');
  if (['find_vulns','vulns','vuln','full','full_scan','fullscan'].includes(m)) return 'Full Scan';
  if (['auto_fix','autofix','fix'].includes(m)) return 'Auto Fix';
  if (['offensive','offense','frida','bypass'].includes(m)) return 'Offensive';
  return 'Fast Scan';
}

/** True for blank or LLM filler like "...", "…", "1. ...\n2. ...". */
function isEmptyField(s) {
  if (s == null) return true;
  const t = String(s).trim();
  if (!t) return true;
  if (/^[.\u2026\s]+$/.test(t)) return true;
  if (/^(todo|tbd|n\/a|none|placeholder)$/i.test(t)) return true;
  if (/^(\d+\.\s*[.\u2026]+\s*)+$/s.test(t)) return true;
  return false;
}
function fieldOr(s, fallback) {
  return isEmptyField(s) ? fallback : s;
}

function fmtBytes(n) {
  if (!Number.isFinite(n)) return '';
  const u = ['B','KB','MB','GB']; let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return (i === 0 ? n : n.toFixed(1)) + ' ' + u[i];
}

route('home', async function() {
  let pendingFile = null;

  function pickFile(file) {
    if (!file) return;
    const n = file.name.toLowerCase();
    if (!n.endsWith('.ipa') && !n.endsWith('.apk') && !n.endsWith('.xapk')) { alert('Only .ipa, .apk or .xapk files accepted'); return; }
    pendingFile = file;
    paintUploadCard();
  }

  async function doUpload(file) {
    // Validate: API key required when provider needs one
    let provider = $('#llm-provider').value;
    const mode = $('#llm-mode').value;
    if (mode === 'offensive' && (provider === 'none' || !provider)) {
      provider = 'deepseek';
      const pEl = $('#llm-provider');
      if (pEl) pEl.value = provider;
      onProviderChange();
    }
    if (mode === 'offensive' && provider === 'none') {
      alert('Offensive mode requires LLM Enrichment — select a provider.');
      return;
    }
    const needsKey = provider === 'openai' || provider === 'claude' || provider === 'deepseek';
    const apiKeyVal = ($('#llm-api-key')?.value || '').trim();
    if (needsKey && !apiKeyVal) {
      const keyInput = $('#llm-api-key');
      const keyError = $('#llm-key-error');
      if (keyInput) keyInput.style.borderColor = 'var(--red)';
      if (keyError) keyError.hidden = false;
      keyInput?.focus();
      return;
    }

    const fd = new FormData();
    fd.append('file', file);
    fd.append('llm_enabled', provider !== 'none');
    fd.append('llm_provider', provider);
    fd.append('llm_mode', mode);
    fd.append('llm_model', (() => {
      const sel = $('#llm-model-select');
      // The select stays visible with "Custom" picked (so the user can switch back without
      // re-choosing a provider) — only read from it when it's showing a real catalog entry.
      if (sel && !sel.hidden && sel.value !== LLM_MODEL_CUSTOM) return sel.value;
      return $('#llm-model').value;
    })());
    fd.append('llm_api_key', apiKeyVal);
    fd.append('assessment_enabled', $('#assessment-enabled')?.checked !== false);
    fd.append('ios_light', !!$('#ios-light')?.checked);
    const ascEl = $('#decompiler-asc');
    fd.append('decompiler', (ascEl && ascEl.checked) ? 'asc' : 'jadx');

    const bar = $('#upload-bar');
    const runBtn = $('#run-scan-btn');
    const changeBtn = $('#change-file');
    if (runBtn) { runBtn.disabled = true; runBtn.textContent = 'Starting…'; }
    if (changeBtn) changeBtn.disabled = true;
    bar.hidden = false; bar.value = 0;
    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/v1/scans');
    if (apiKey()) xhr.setRequestHeader('X-Api-Key', apiKey());
    xhr.upload.onprogress = e => { bar.value = (e.loaded/e.total)*100; };
    xhr.onload = () => {
      bar.value = 100;
      try {
        const j = JSON.parse(xhr.responseText);
        if (j.scan_id) { location.hash = '#/scan/' + j.scan_id; return; }
        throw new Error(xhr.responseText);
      } catch(_) {
        let detail = xhr.responseText;
        try { detail = formatApiErrorDetail(JSON.parse(xhr.responseText).detail); } catch(__) {}
        alert('Could not start scan: ' + detail);
      }
      if (runBtn) { runBtn.disabled = false; runBtn.textContent = 'Run Scan'; }
      if (changeBtn) changeBtn.disabled = false;
    };
    xhr.onerror = () => {
      alert('Network error');
      if (runBtn) { runBtn.disabled = false; runBtn.textContent = 'Run Scan'; }
      if (changeBtn) changeBtn.disabled = false;
    };
    xhr.send(fd);
  }

  render(`
  <div style="max-width:680px;margin:0 auto">
    <div class="card" style="margin-bottom:1rem">
      <div class="card-title">Upload package</div>
      <div id="upload-card-inner"></div>
    </div>

    <div class="card">
      <div class="card-title" style="justify-content:space-between">
        Recent scans
        <a href="#/scans" style="font-size:.75rem;font-weight:400">View all →</a>
      </div>
      <div id="recent-list"><div class="loading"><div class="spinner"></div></div></div>
    </div>
  </div>`);

  // The card-title stays fixed; only this inner slot swaps between the drop-zone (step 1) and
  // the options form (step 2) as the user picks/changes a file — never the whole page.
  function paintUploadCard() {
    $('#upload-card-inner').innerHTML = pendingFile ? renderScanOptionsHtml(pendingFile) : renderDropZoneHtml();
    if (pendingFile) {
      $('#change-file').addEventListener('click', () => { pendingFile = null; paintUploadCard(); });
      $('#run-scan-btn').addEventListener('click', () => doUpload(pendingFile));
      onProviderChange();
      onLlmModeChange();
    } else {
      const drop = $('#drop');
      const fileEl = $('#ipa-file');
      ['dragenter','dragover'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add('drag-over')}));
      ['dragleave','drop'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove('drag-over')}));
      drop.addEventListener('drop', ev=>pickFile(ev.dataTransfer.files[0]));
      fileEl.addEventListener('change', ev=>pickFile(ev.target.files[0]));
    }
  }
  paintUploadCard();

  try {
    const scans = await api('/scans');
    const list = document.getElementById('recent-list');
    if (!scans.length) { list.innerHTML = '<div class="empty">No scans yet.</div>'; return; }
    list.innerHTML = scans.slice(0,5).map(s => `
      <div class="scan-row" onclick="location.hash='#/scan/${s.scan_id}'">
        <div style="flex:1">
          <div class="scan-name">${esc(s.filename)}</div>
          <div class="scan-meta"><span>${fmt(s.created_at)}</span><span>${esc(s.scan_id.slice(0,8))}</span></div>
        </div>
        ${badge(s.state)}
      </div>`).join('');
  } catch(e) {
    document.getElementById('recent-list').innerHTML = `<div class="alert alert-error">${esc(e.message)}</div>`;
  }
});

/* ── scans list view ── */
let _scansCache = [];
/** @type {{key:string, dir:'asc'|'desc'}} */
let _scansSort = {key: 'started', dir: 'desc'};

/** Workflow severity: error < running < queued < done */
const SCAN_STATE_RANK = { error: 0, running: 1, queued: 2, done: 3 };

function scanDurationMs(s) {
  if (!s || !s.started_at || !s.finished_at) return null;
  const ms = new Date(s.finished_at) - new Date(s.started_at);
  return Number.isFinite(ms) ? ms : null;
}

function scanSortValue(s, key) {
  switch (key) {
    case 'file': return String(s.filename||'').toLowerCase();
    case 'scan_id': return String(s.scan_id||'').toLowerCase();
    case 'state': return SCAN_STATE_RANK[String(s.state||'').toLowerCase()] ?? 99;
    case 'started': return s.created_at ? new Date(s.created_at).getTime() : 0;
    case 'duration': {
      const ms = scanDurationMs(s);
      // Missing/running duration sorts first when asc, last when desc
      return ms == null ? -1 : ms;
    }
    default: return '';
  }
}

function sortedScans() {
  const scans = _scansCache.slice();
  const {key, dir} = _scansSort;
  const mul = dir === 'asc' ? 1 : -1;
  scans.sort((a, b) => {
    const va = scanSortValue(a, key);
    const vb = scanSortValue(b, key);
    let cmp = 0;
    if (typeof va === 'number' && typeof vb === 'number') cmp = va - vb;
    else cmp = String(va).localeCompare(String(vb), undefined, {sensitivity:'base'});
    if (cmp !== 0) return cmp * mul;
    // Tie-break: newest started first
    const ta = a.created_at ? new Date(a.created_at).getTime() : 0;
    const tb = b.created_at ? new Date(b.created_at).getTime() : 0;
    return tb - ta;
  });
  return scans;
}

function scansSortHeaderHtml(key, label) {
  const active = _scansSort.key === key;
  const ind = active ? (_scansSort.dir === 'asc' ? '▲' : '▼') : '▼';
  const ariaSort = active ? (_scansSort.dir === 'asc' ? 'ascending' : 'descending') : 'none';
  return `<th class="th-sort${active?' active':''}" data-sort="${key}" aria-sort="${ariaSort}">
      <button type="button" class="scan-sort-button" onclick="sortScansColumn('${key}')"
        aria-label="Sort by ${label}${active ? `, currently ${ariaSort}` : ''}">
        ${label}<span class="sort-ind" aria-hidden="true">${ind}</span>
      </button></th>`;
}

function renderScansThead() {
  return `<tr>
    ${scansSortHeaderHtml('file','File')}
    ${scansSortHeaderHtml('scan_id','Scan ID')}
    ${scansSortHeaderHtml('state','State')}

    ${scansSortHeaderHtml('duration','Duration')}
    <th></th>
  </tr>`;
}

function renderScansRows(scans=sortedScans()) {
  return scans.map(s => {
    const id = String(s.scan_id||'');
    const filename = String(s.filename||'Untitled scan');
    return `
    <tr>
      <td><a class="scans-file-link" href="#/scan/${encodeURIComponent(id)}" title="${escAttr(filename)}">${esc(filename)}</a></td>
      <td class="mono" title="${escAttr(id)}">${esc(id.slice(0,8))}</td>
      <td>${badge(s.state)}</td>
      <td>${fmt(s.created_at)}</td>

/* ── learned rules view ── */
let _learnedCache = null;
let _learnedPlat = 'ALL';
/** @type {{key:string, dir:'asc'|'desc'}} */
let _learnedSort = {key: 'severity', dir: 'desc'};

const SEV_RANK = { CRITICAL: 5, HIGH: 4, MEDIUM: 3, LOW: 2, INFO: 1 };

function badgeSev(sev) {
  const cls = (sev||'INFO').toLowerCase();
  return `<span class="badge badge-${cls}">${esc(sev||'INFO')}</span>`;
}

function badgePlatform(plat) {
  const p = String(plat||'IOS').toUpperCase();
  const cls = p === 'ANDROID' ? 'android' : 'ios';
  const label = p === 'ANDROID' ? 'Android' : 'iOS';
  return `<span class="badge badge-${cls}">${label}</span>`;
}

function renderRegexCell(regex) {
  const raw = regex || '';
  const long = raw.length > 64;
  return `<td class="regex-cell${long?' long':''}" title="${escAttr(raw)}">
    <span class="regex-text" onclick="toggleRegex(this)">${esc(raw)}</span>
    ${long?`<button type="button" class="regex-toggle" onclick="toggleRegex(this)">Show more</button>`:''}
  </td>`;
}

window.toggleRegex = function(el) {
  const cell = el.closest('.regex-cell');
  if (!cell) return;
  const open = cell.classList.toggle('expanded');
  const btn = cell.querySelector('.regex-toggle');
  if (btn) btn.textContent = open ? 'Show less' : 'Show more';
};

function learnedStoreMeta(stores, plat) {
  return (stores || []).find(s => s.platform === plat) || {platform: plat, path: '', exists: false, count: 0};
}

function learnedRuleSearchText(r) {
  return [r.id, r.scope, r.title, r.category, r.severity, r.platform, r.regex]
    .map(x => String(x||'').toLowerCase()).join(' ');
}

function learnedSortValue(r, key) {
  switch (key) {
    case 'platform': return String(r.platform||'IOS').toUpperCase();
    case 'id': return String(r.id||'').toLowerCase();
    case 'scope': return String(r.scope||'').toLowerCase();
    case 'title': return String(r.title||'').toLowerCase();
    case 'severity': return SEV_RANK[String(r.severity||'INFO').toUpperCase()] || 0;
    case 'cvss': return Number(r.cvssScore||0);
    case 'regex': return String(r.regex||'').toLowerCase();
    case 'created': return r.createdAt ? new Date(r.createdAt).getTime() : 0;
    default: return '';
  }
}

function sortedLearnedRules() {
  const rules = (_learnedCache && _learnedCache.rules) ? _learnedCache.rules.slice() : [];
  const {key, dir} = _learnedSort;
  const mul = dir === 'asc' ? 1 : -1;
  rules.sort((a, b) => {
    const va = learnedSortValue(a, key);
    const vb = learnedSortValue(b, key);
    let cmp = 0;
    if (typeof va === 'number' && typeof vb === 'number') cmp = va - vb;
    else cmp = String(va).localeCompare(String(vb), undefined, {sensitivity:'base'});
    if (cmp !== 0) return cmp * mul;
    return String(a.id||'').localeCompare(String(b.id||''), undefined, {sensitivity:'base'});
  });
  return rules;
}

function learnedSortHeaderHtml(key, label) {
  const active = _learnedSort.key === key;
  const ind = active ? (_learnedSort.dir === 'asc' ? '▲' : '▼') : '▼';
  return `<th class="th-sort${active?' active':''}" data-sort="${key}"
      onclick="sortLearnedColumn('${key}')"
      title="Sort by ${label}">${label}<span class="sort-ind" aria-hidden="true">${ind}</span></th>`;
}

function renderLearnedThead() {
  return `<tr>
    ${learnedSortHeaderHtml('platform','Platform')}
    ${learnedSortHeaderHtml('id','Rule ID')}
    ${learnedSortHeaderHtml('scope','Scope')}
    ${learnedSortHeaderHtml('title','Title')}
    ${learnedSortHeaderHtml('severity','Severity')}
    ${learnedSortHeaderHtml('cvss','CVSS')}
    ${learnedSortHeaderHtml('regex','Regex')}
    ${learnedSortHeaderHtml('created','Created')}
  </tr>`;
}

function renderLearnedRows() {
  return sortedLearnedRules().map(r => {
    const plat = String(r.platform||'IOS').toUpperCase();
    return `<tr data-search="${escAttr(learnedRuleSearchText(r))}" data-platform="${escAttr(plat)}"
        data-severity="${escAttr(String(r.severity||'INFO').toUpperCase())}">
      <td>${badgePlatform(plat)}</td>
      <td class="mono">${esc(r.id||'')}</td>
      <td>${esc(r.scope||'')}</td>
      <td>${esc(r.title||'')}</td>
      <td>${badgeSev(r.severity)}</td>
      <td>${(r.cvssScore||0).toFixed(1)}</td>
      ${renderRegexCell(r.regex)}
      <td>${r.createdAt ? new Date(r.createdAt).toLocaleDateString() : ''}</td>
    </tr>`;
  }).join('');
}

function updateLearnedSummary() {
  const plat = _learnedPlat || 'ALL';
  const q = (document.getElementById('learned-q')?.value || '').trim().toLowerCase();
  const sevCounts = { CRITICAL:0, HIGH:0, MEDIUM:0, LOW:0, INFO:0 };
  const platCounts = { IOS:0, ANDROID:0 };
  let shown = 0;
  (sortedLearnedRules()).forEach(r => {
    const p = String(r.platform||'IOS').toUpperCase();
    const matchP = plat === 'ALL' || p === plat;
    const matchQ = !q || learnedRuleSearchText(r).includes(q);
    if (!matchP || !matchQ) return;
    shown++;
    const sev = String(r.severity||'INFO').toUpperCase();
    if (sev in sevCounts) sevCounts[sev]++;
    else sevCounts.INFO++;
    if (p === 'ANDROID') platCounts.ANDROID++;
    else platCounts.IOS++;
  });

  const setStat = (id, n) => {
    const el = document.getElementById(id);
    if (el) el.textContent = String(n);
  };
  setStat('learned-sev-critical', sevCounts.CRITICAL);
  setStat('learned-sev-high', sevCounts.HIGH);
  setStat('learned-sev-medium', sevCounts.MEDIUM);
  setStat('learned-sev-low', sevCounts.LOW);

  const strip = document.getElementById('learned-plat-strip');
  if (strip) {
    strip.innerHTML = `
      <span class="plat-stat">${badgePlatform('IOS')} <span class="plat-n">${platCounts.IOS}</span> rule(s)</span>
      <span class="plat-stat">${badgePlatform('ANDROID')} <span class="plat-n">${platCounts.ANDROID}</span> rule(s)</span>
      <span class="plat-stat">Visible <span class="plat-n">${shown}</span></span>
      ${sevCounts.INFO ? `<span class="plat-stat">Info <span class="plat-n">${sevCounts.INFO}</span></span>` : ''}`;
  }
  return shown;
}

function applyLearnedFilters() {
  const plat = _learnedPlat || 'ALL';
  const q = (document.getElementById('learned-q')?.value || '').trim().toLowerCase();
  const rows = document.querySelectorAll('#learned-tbody tr');
  let shown = 0;
  rows.forEach(tr => {
    const matchP = plat === 'ALL' || tr.dataset.platform === plat;
    const matchQ = !q || (tr.dataset.search || '').includes(q);
    const ok = matchP && matchQ;
    tr.style.display = ok ? '' : 'none';
    if (ok) shown++;
  });
  updateLearnedSummary();
  const countEl = document.getElementById('learned-shown');
  if (countEl) countEl.textContent = shown + ' shown';
  const emptyEl = document.getElementById('learned-empty');
  if (emptyEl) {
    if (!shown) {
      emptyEl.hidden = false;
      if (q) emptyEl.textContent = 'No rules match this filter.';
      else if (plat === 'ANDROID') emptyEl.textContent = 'No Android learned rules yet. Run an APK scan with LLM enrichment in Full Scan mode.';
      else if (plat === 'IOS') emptyEl.textContent = 'No iOS learned rules yet. Run an IPA scan with LLM enrichment in Full Scan mode.';
      else emptyEl.textContent = 'No learned rules yet.';
    } else {
      emptyEl.hidden = true;
    }
    const wrap = document.getElementById('learned-tbl-wrap');
    if (wrap) wrap.hidden = !shown;
  }
  document.querySelectorAll('#learned-tabs .tab').forEach(t => {
    t.classList.toggle('active', t.dataset.plat === plat);
  });
}

function refreshLearnedTable() {
  const tbody = document.getElementById('learned-tbody');
  const thead = document.getElementById('learned-thead');
  if (!tbody) return;
  tbody.innerHTML = renderLearnedRows();
  if (thead) thead.innerHTML = renderLearnedThead();
  applyLearnedFilters();
}

window.sortLearnedColumn = function(key) {
  if (_learnedSort.key === key) {
    _learnedSort.dir = _learnedSort.dir === 'asc' ? 'desc' : 'asc';
  } else {
    _learnedSort.key = key;
    _learnedSort.dir = (key === 'severity' || key === 'cvss' || key === 'created') ? 'desc' : 'asc';
  }
  refreshLearnedTable();
};

function renderLearnedTable(data, platFilter) {
  const ios = learnedStoreMeta(data.stores, 'IOS');
  const and = learnedStoreMeta(data.stores, 'ANDROID');
  const totalAll = (data.stores||[]).reduce((n,s)=>n+(s.count||0), 0);
  const tabCount = (p) => p === 'ALL' ? totalAll
    : (learnedStoreMeta(data.stores, p).count || 0);

  const tabs = ['ALL','IOS','ANDROID'].map(p => {
    const label = p === 'ALL' ? 'All' : (p === 'ANDROID' ? 'Android' : 'iOS');
    return `<div class="tab${platFilter===p?' active':''}" data-plat="${p}" onclick="setLearnedPlat('${p}')">${label} (${tabCount(p)})</div>`;
  }).join('');

  const pathsHtml = `
    <div class="learned-paths">
      <div class="path-row">${badgePlatform('IOS')}
        <code>${esc(ios.path||'')}</code>
        <span>· ${ios.exists ? ios.count+' rule(s)' : 'file not found'}</span>
      </div>
      <div class="path-row">${badgePlatform('ANDROID')}
        <code>${esc(and.path||'')}</code>
        <span>· ${and.exists ? and.count+' rule(s)' : 'file not found'}</span>
      </div>
    </div>`;

  if (!totalAll) {
    return `
      <div class="card">
        <div class="card-title">Learned Rules</div>
        <p style="color:var(--muted);font-size:.875rem;margin-bottom:.75rem">
          No learned rules yet. Run a scan with <strong>LLM enrichment</strong> in
          <em>Full Scan</em> mode — vulnerabilities the LLM discovers will be
          distilled into reusable detection rules, stored separately per platform.
        </p>
        ${pathsHtml}
        <p style="font-size:.875rem;color:var(--muted)">
          Once stored, every subsequent scan (even without LLM) will check
          for these patterns alongside the built-in MSTG/MASTG rules.
        </p>
      </div>`;
  }

  return `
    <div class="card">
      <div class="card-title" style="justify-content:space-between">
        Learned Rules
        <span style="font-size:.75rem;color:var(--muted);font-weight:400">${totalAll} rule(s) across platforms</span>
      </div>
      <p style="font-size:.85rem;color:var(--muted);margin-bottom:.75rem">
        These rules were auto-generated by the LLM from previous scans.
        They run on every scan for the matching platform, even without LLM enrichment.
      </p>
      ${pathsHtml}
      <div class="tabs" id="learned-tabs" style="margin-bottom:.9rem">${tabs}</div>
      <div class="search-bar">
        <input id="learned-q" type="text" placeholder="Filter by scope, title, ID, severity…" oninput="filterLearned()"/>
      </div>
      <div class="learned-summary" id="learned-summary">
        <div class="grid-4">
          <div class="stat"><div class="stat-val" style="color:var(--high)" id="learned-sev-critical">0</div><div class="stat-label">Critical</div></div>
          <div class="stat"><div class="stat-val" style="color:var(--medium)" id="learned-sev-high">0</div><div class="stat-label">High</div></div>
          <div class="stat"><div class="stat-val" style="color:var(--yellow)" id="learned-sev-medium">0</div><div class="stat-label">Medium</div></div>
          <div class="stat"><div class="stat-val" style="color:var(--low)" id="learned-sev-low">0</div><div class="stat-label">Low</div></div>
        </div>
        <div class="learned-plat-strip" id="learned-plat-strip"></div>
      </div>
      <div id="learned-empty" class="empty" hidden></div>
      <div class="tbl-wrap" id="learned-tbl-wrap"><table>
        <thead id="learned-thead">${renderLearnedThead()}</thead>
        <tbody id="learned-tbody">${renderLearnedRows()}</tbody>
      </table></div>
      <div style="margin-top:.6rem;font-size:.75rem;color:var(--muted)" id="learned-shown"></div>
    </div>`;
}

window.setLearnedPlat = function(plat) {

  applyLearnedFilters();
