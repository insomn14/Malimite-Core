/* ── recent scans (home) ── */
const _recentDetails = new Map();   // scan_id -> ScanDetail of finished scans (immutable once done)
let _homeScans = [];                // newest /scans snapshot from Home, for the duplicate-scan warning
let _recentTimer = null;

function fmtShort(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return isNaN(d) ? '—' : d.toLocaleString(undefined, {month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit'});
}

/* True when a finished scan stored nothing at all. The API's `empty_result` flag is authoritative,
   but the counts are enough to derive the same verdict, so the UI stays correct against a server
   build that predates the flag. */
function isEmptyScan(d) {
  if (!d) return false;
  if (d.empty_result) return true;
  if (String(d.state || '') !== 'done') return false;
  const known = ['class_count', 'function_count', 'string_count', 'entry_point_count']
    .some(k => typeof d[k] === 'number');
  if (!known) return false;   // counts were never read (missing DB) — no verdict
  return !(d.class_count || d.function_count || d.string_count || d.entry_point_count);
}

function statePill(state, emptyResult) {
  const s = String(state || 'queued').toLowerCase();
  if (s === 'done' && emptyResult) {
    return `<span class="st-pill st-empty" title="The analyzer finished without storing any results — re-run this scan">${ico('alert')} Incomplete</span>`;
  }
  const map = {
    done: ['st-done', 'circleCheck', 'Done'], running: ['st-running', 'loader', 'Running'],
    queued: ['st-queued', 'clock', 'Queued'], error: ['st-error', 'circleX', 'Failed'],
  };
  const [cls, icon, label] = map[s] || map.queued;
  return `<span class="st-pill ${cls}">${ico(icon, s === 'running' ? 'ico-spin' : '')} ${label}</span>`;
}

/* Every "this scan produced nothing usable" surface shares one message, so the reason is never
   confused with a clean result. `what` names the section, e.g. "Vulnerabilities". */
function emptyResultHtml(detail, what) {
  return `<div class="state-panel empty"><span class="big">${ico('alert')}</span>
    <div><strong>This scan produced no results</strong>
      The analyzer exited successfully but stored no classes, functions, strings or entry points, so
      ${esc(String(what || 'this section').toLowerCase())} cannot be trusted. Re-run the scan (avoid running two
      scans of the same app at once) and check the <a href="#/scan/${esc(String(detail?.scan_id || ''))}/log">Log</a> tab.</div></div>`;
}

function sevBarHtml(c) {
  const parts = [['CRITICAL', 's-c'], ['HIGH', 's-h'], ['MEDIUM', 's-m'], ['LOW', 's-l'], ['INFO', 's-i']];
  const total = parts.reduce((n, [k]) => n + (c?.[k] || 0), 0);
  if (!total) return '<div class="sev-bar clean" title="No open findings"></div>';
  const title = parts.filter(([k]) => c[k]).map(([k]) => `${c[k]} ${k.toLowerCase()}`).join(', ');
  return `<div class="sev-bar" title="${escAttr(title)}" role="img" aria-label="${escAttr(title)}">`
    + parts.filter(([k]) => c[k]).map(([k, cls]) => `<i class="${cls}" style="flex:${c[k]}"></i>`).join('') + '</div>';
}

function recentRowHtml(s, d) {
  const id = String(s.scan_id || '');
  const name = String(s.filename || 'Untitled scan');
  const state = String(s.state || 'queued').toLowerCase();
  const plat = String(d?.platform || '').toUpperCase();
  const kind = plat === 'IOS' ? 'ios' : plat === 'ANDROID' ? 'android' : packageKindOf(name);
  const {count, bar} = scanFindingsParts(s, d);
  return `
    <div class="rs-row" data-rs="${escAttr(id)}" data-href="#/scan/${escAttr(encodeURIComponent(id))}" role="link" tabindex="0"
      aria-label="${escAttr(name)}, ${escAttr(state)}">
      ${platTile(kind)}
      <div class="rs-main">
        <div class="rs-name" title="${escAttr(name)}">${esc(name)}</div>
        <div class="rs-meta"><span>${platformName(kind)}</span><span>${esc(fmtShort(s.created_at))}</span></div>
      </div>
      <div class="rs-state">${statePill(state, isEmptyScan(d))}</div>
      <div class="rs-count-cell" style="grid-area:count">${count}</div>
      <div class="rs-bar">${bar}</div>
      ${scanRowMenuHtml(s)}
    </div>`;
}

async function loadRecentScans() {
  clearTimeout(_recentTimer);
  const list = document.getElementById('recent-list');
  if (!list) return;
  let scans;
  try { scans = await api('/scans'); }
  catch (e) {
    if (document.getElementById('recent-list')) list.innerHTML = `<div class="alert alert-error" style="margin:0">${esc(e.message)}</div>`;
    return;
  }
  if (!document.getElementById('recent-list')) return;   // navigated away meanwhile
  _homeScans = Array.isArray(scans) ? scans : [];
  const top = (Array.isArray(scans) ? scans : []).slice(0, 5);
  const count = document.getElementById('recent-count');
  if (count) count.textContent = scans.length ? `${scans.length} total` : '';
  if (!top.length) {
    list.innerHTML = `<div class="rs-empty">${ico('history')}<strong style="color:var(--text)">No scans yet</strong>Upload your first app above to see results here.</div>`;
    return;
  }
  list.innerHTML = top.map(s => recentRowHtml(s, _recentDetails.get(s.scan_id))).join('');
  await Promise.all(top.filter(s => s.state === 'done' && !_recentDetails.has(s.scan_id)).map(async s => {
    let d = null;
    try { d = await api('/scans/' + encodeURIComponent(s.scan_id)); } catch (_) {}
    _recentDetails.set(s.scan_id, d);
    const row = document.querySelector(`.rs-row[data-rs="${CSS.escape(s.scan_id)}"]`);
    if (row) row.outerHTML = recentRowHtml(s, d);
  }));
  // Live-refresh while anything is still in flight, for as long as this list is on screen.
  if (top.some(s => s.state === 'queued' || s.state === 'running')) {
    _recentTimer = setTimeout(() => { if (document.getElementById('recent-list')) loadRecentScans(); }, 5000);
  }
}

// One delegated handler for every recent-scan row: navigate, keyboard, row menu, delete.
document.addEventListener('click', ev => {
  const t = ev.target;
  document.querySelectorAll('details.rs-menu[open]').forEach(m => { if (!m.contains(t)) m.open = false; });
  const del = t.closest && t.closest('[data-delete]');
  if (del) { deleteScan(del.dataset.delete, ev); return; }
  if (t.closest && t.closest('.rs-menu')) return;
  const row = t.closest && t.closest('.rs-row[data-href]');
  if (row) location.hash = row.dataset.href;
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') document.querySelectorAll('details.rs-menu[open]').forEach(m => { m.open = false; });
  const row = ev.target.closest && ev.target.closest('.rs-row[data-href]');
  if (row && ev.target === row && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); location.hash = row.dataset.href; }
});

route('home', async function() {
  let pendingFile = null;

  function pickFile(file) {
    if (!file) return;
    const n = file.name.toLowerCase();
    if (!n.endsWith('.ipa') && !n.endsWith('.apk') && !n.endsWith('.xapk')) {
      const msg = `“${file.name}” is not a supported package. Choose an .apk, .ipa or .xapk file.`;
      const err = document.getElementById('drop-error');
      if (err) { err.innerHTML = ico('alert') + `<span>${esc(msg)}</span>`; err.hidden = false; }
      else alert(msg);
      return;
    }
    pendingFile = file;
    paintUploadCard();
  }

  function wireDrop(el, onFile) {
    let depth = 0;   // dragenter/leave fire for every child; count so the highlight doesn't flicker
    el.addEventListener('dragenter', ev => { ev.preventDefault(); depth++; el.classList.add('drag-over'); });
    el.addEventListener('dragover', ev => { ev.preventDefault(); });
    el.addEventListener('dragleave', () => { if (--depth <= 0) { depth = 0; el.classList.remove('drag-over'); } });
    el.addEventListener('drop', ev => { ev.preventDefault(); depth = 0; el.classList.remove('drag-over'); onFile(ev.dataTransfer.files[0]); });
  }

  /* Two heavy scans of the same package running at once is what starved a real scan down to zero
     results (see the empty_result guard). Warn — do not block: the user may know better. */
  function duplicateScan() {
    if (!pendingFile) return null;
    const name = pendingFile.name.toLowerCase();
    return _homeScans.find(s => String(s.filename || '').toLowerCase() === name
      && (s.state === 'queued' || s.state === 'running')) || null;
  }

  function paintDupWarn() {
    const box = document.getElementById('dup-warn');
    if (!box) return;
    const dup = duplicateScan();
    box.hidden = !dup;
    if (dup) {
      box.innerHTML = `${ico('alert')}<span><strong>A scan of this file is already ${esc(dup.state)}</strong>
        (${esc(dup.scan_id.slice(0, 8))}). Running a second one at the same time can starve both — wait for it
        to finish first.</span>`;
    }
  }

  function collectPrefs() {
    return {
      mode: $('#llm-mode').value,
      llmOn: !!$('#llm-enabled')?.checked,
      provider: $('#llm-provider')?.value || '',
      model: currentLlmModel(),
      assessment: $('#assessment-enabled').checked,
      decompiler: $('#decompiler-asc')?.checked ? 'asc' : (loadScanPrefs().decompiler || 'jadx'),
      iosLight: $('#ios-light') ? $('#ios-light').checked : !!loadScanPrefs().iosLight,
    };
  }

  function setUploading(on, pct) {
    const form = $('#scan-form');
    const btn = $('#run-scan-btn');
    if (form) form.disabled = on;
    if (!btn) return;
    btn.innerHTML = on
      ? ico('loader', 'ico-spin') + (pct >= 100 ? ' Starting…' : ` Uploading ${Math.round(pct || 0)}%`)
      : ico('play') + ' Run Scan';
    $('#upload-bar').style.width = on ? `${pct || 0}%` : '0';
  }

  function showRunError(msg) {
    const box = $('#run-error');
    if (!box) { alert(msg); return; }
    box.textContent = msg;
    box.hidden = !msg;
  }

  async function doUpload(file) {
    showRunError('');
    const dup = duplicateScan();
    if (dup && !confirm('A scan of this file is already ' + dup.state + '. Running another one now can starve both scans and produce an incomplete result. Continue anyway?')) return;
    const mode = $('#llm-mode').value;
    if (mode === 'offensive' && !$('#llm-enabled')?.checked) { if ($('#llm-enabled')) { $('#llm-enabled').checked = true; onLlmToggle(true); } }
    const llmOn = !!$('#llm-enabled')?.checked;
    // No API key is collected here at all — the provider dropdown only ever offers providers
    // the Config tab already reports as connected (see renderScanOptionsHtml's providerOpts),
    // so there's nothing left to validate client-side. The server still re-checks (create_scan
    // in main.py) in case Config changed in another tab between page load and Run Scan.
    const provider = llmOn ? ($('#llm-provider')?.value || 'none') : 'none';
    if (mode === 'offensive' && provider === 'none') {
      showRunError('Offensive mode requires an LLM provider. Connect one in the Config tab first.');
      return;
    }
    saveScanPrefs(collectPrefs());

    const fd = new FormData();
    fd.append('file', file);
    fd.append('llm_enabled', provider !== 'none');
    fd.append('llm_provider', provider);
    fd.append('llm_mode', mode);
    fd.append('llm_model', llmOn ? currentLlmModel() : '');
    fd.append('assessment_enabled', $('#assessment-enabled')?.checked !== false);
    fd.append('ios_light', !!$('#ios-light')?.checked);
    const ascEl = $('#decompiler-asc');
    fd.append('decompiler', (ascEl && ascEl.checked) ? 'asc' : 'jadx');

    setUploading(true, 0);
    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/v1/scans');
    if (apiKey()) xhr.setRequestHeader('X-Api-Key', apiKey());
    xhr.upload.onprogress = e => { if (e.lengthComputable) setUploading(true, (e.loaded / e.total) * 100); };
    xhr.upload.onload = () => setUploading(true, 100);
    xhr.onload = () => {
      try {
        const j = JSON.parse(xhr.responseText);
        if (j.scan_id) { location.hash = '#/scan/' + j.scan_id; return; }
      } catch (_) {}
      let detail = xhr.responseText;
      try { detail = formatApiErrorDetail(JSON.parse(xhr.responseText).detail); } catch (_) {}
      if (xhr.status === 401) detail = 'Invalid or missing server API key — set it in the "API Key" field (top right).';
      setUploading(false);
      showRunError('Could not start scan: ' + (detail || `HTTP ${xhr.status}`));
    };
    xhr.onerror = () => { setUploading(false); showRunError('Network error — the upload did not reach the server.'); };
    xhr.send(fd);
  }

  render(`
  <div class="home-wrap">
    <input type="file" id="ipa-file" accept=".ipa,.apk,.xapk"/>
    <div id="upload-slot"></div>
    <section class="panel" id="recent-panel">
      <div class="panel-head">${ico('history')} Recent Scans
        <span class="panel-head-r"><span class="muted-count" id="recent-count"></span>
          <a href="#/scans" class="link-strong">View all ${ico('arrowRight')}</a></span>
      </div>
      <div id="recent-list" class="rs-list">
        ${'<div class="rs-row" style="cursor:default"><span class="skel" style="height:42px;width:42px;border-radius:11px"></span><div class="rs-main"><span class="skel" style="width:55%"></span><span class="skel" style="width:35%;margin-top:.4rem"></span></div></div>'.repeat(3)}
      </div>
    </section>
  </div>`);

  // One picker serves both "Browse files" (step 1) and "Change file" (step 2).
  const fileEl = $('#ipa-file');
  fileEl.addEventListener('change', () => { pickFile(fileEl.files[0]); fileEl.value = ''; });

  // Only the upload slot swaps between the drop zone (step 1) and the configuration form (step 2)
  // as the user picks/changes a file — never the whole page. Nothing touches the server until Run Scan.
  async function paintUploadCard() {
    const slot = $('#upload-slot');
    if (!slot) return;
    $('#recent-panel').hidden = !!pendingFile;
    if (!pendingFile) {
      slot.innerHTML = renderDropZoneHtml();
      const drop = $('#drop');
      drop.addEventListener('click', () => fileEl.click());
      drop.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); fileEl.click(); } });
      wireDrop(drop, pickFile);
      return;
    }
    const prefs = loadScanPrefs();
    // Needed up front so the provider <select> can disable anything not connected yet (see
    // renderScanOptionsHtml) — fetched fresh each time step 2 paints so a key added in the
    // Config tab in another browser tab shows up on the very next file pick.
    let configData;
    try { configData = await fetchConfigProviders(); } catch (_) { configData = {providers: []}; }
    slot.innerHTML = renderScanOptionsHtml(pendingFile, prefs, configData);
    $('#change-file').addEventListener('click', () => fileEl.click());
    wireDrop($('#picked'), pickFile);
    $('#run-scan-btn').addEventListener('click', () => doUpload(pendingFile));
    $('#llm-mode').addEventListener('change', onLlmModeChange);
    $('#llm-enabled')?.addEventListener('change', () => onLlmToggle(false));
    $('#llm-provider')?.addEventListener('change', () => onProviderChange());
    $('#llm-model-select')?.addEventListener('change', onModelSelectChange);
    $('#llm-model')?.addEventListener('input', updateRunSummary);
    $$('#scan-form input[name=decompiler], #assessment-enabled, #ios-light').forEach(el => el.addEventListener('change', updateRunSummary));
    if ($('#llm-provider')) onProviderChange(prefs.provider === $('#llm-provider').value ? (prefs.model || '') : '');
    onLlmToggle(true);
    onLlmModeChange();
    paintDupWarn();
    window.scrollTo({top: 0});
  }
  paintUploadCard();
  loadRecentScans();
});

/* ── scans list view ──
   Same visual language as Home's "Recent Scans": rows with platform tile, status pill, findings
   count + severity bar and a row menu. Adds search, state/platform filters, sortable columns and
   pagination; findings are fetched lazily (per visible page) and cached with Home's cache. */
let _scansCache = [];
/** @type {{key:string, dir:'asc'|'desc'}} */
let _scansSort = {key: 'started', dir: 'desc'};
let _scansView = {q: '', state: 'all', plat: 'all', page: 1};
const SCANS_PAGE_SIZE = 20;
let _scansTimer = null;

/** Workflow severity: error < running < queued < done */
const SCAN_STATE_RANK = { error: 0, running: 1, queued: 2, done: 3 };

function scanDurationMs(s) {
  if (!s || !s.started_at || !s.finished_at) return null;
  const ms = new Date(s.finished_at) - new Date(s.started_at);
  return Number.isFinite(ms) ? ms : null;
}

function scanKindOf(s) {
  const p = String(_recentDetails.get(s.scan_id)?.platform || '').toUpperCase();
  return p === 'IOS' ? 'ios' : p === 'ANDROID' ? 'android' : packageKindOf(s.filename);
}

function scanStateGroup(s) {
  const st = String(s.state || 'queued').toLowerCase();
  if (st === 'done') return isEmptyScan(_recentDetails.get(s.scan_id)) ? 'error' : 'done';
  return st === 'error' ? 'error' : 'active';
}

function scanSortValue(s, key) {
  switch (key) {
    case 'file': return String(s.filename||'').toLowerCase();
    case 'mode': return scanModeLabel(s.llm_mode).toLowerCase();
    case 'state': return SCAN_STATE_RANK[String(s.state||'').toLowerCase()] ?? 99;
    case 'findings': {
      const c = _recentDetails.get(s.scan_id)?.vulnerability_counts;
      return c ? (c.total || 0) : -1;
    }
    case 'started': return s.created_at ? new Date(s.created_at).getTime() : 0;
    case 'duration': {
      const ms = scanDurationMs(s);
      return ms == null ? -1 : ms;   // missing/running sorts first when asc, last when desc
    }
    default: return '';
  }
}

function sortedScans() {
  const scans = _scansCache.slice();
  const {key, dir} = _scansSort;
  const mul = dir === 'asc' ? 1 : -1;
  scans.sort((a, b) => {
    const va = scanSortValue(a, key), vb = scanSortValue(b, key);
    let cmp = (typeof va === 'number' && typeof vb === 'number') ? va - vb
      : String(va).localeCompare(String(vb), undefined, {sensitivity:'base'});
    if (cmp !== 0) return cmp * mul;
    const ta = a.created_at ? new Date(a.created_at).getTime() : 0;   // tie-break: newest first
    const tb = b.created_at ? new Date(b.created_at).getTime() : 0;
    return tb - ta;
  });
  return scans;
}

function filteredScans() {
  const {q, state, plat} = _scansView;
  const needle = q.trim().toLowerCase();
  return sortedScans().filter(s =>
    (state === 'all' || scanStateGroup(s) === state)
    && (plat === 'all' || scanKindOf(s) === plat)
    && (!needle || `${s.filename} ${s.scan_id} ${scanModeLabel(s.llm_mode)} ${s.llm_provider}`.toLowerCase().includes(needle)));
}

/** Findings count + severity bar for a scan row (shared by Home and the Scans page). */
function scanFindingsParts(s, d) {
  const state = String(s.state || 'queued').toLowerCase();
  if (state === 'done') {
    if (isEmptyScan(d)) return {count: '<span class="rs-count muted">No results</span>', bar: '<div class="sev-bar"></div>'};
    const c = d?.vulnerability_counts;
    if (d === undefined) return {count: '<span class="skel" style="width:70px"></span>', bar: '<span class="skel"></span>'};
    if (!c) return {count: '<span class="rs-count muted">—</span>', bar: '<div class="sev-bar"></div>'};
    const n = c.total || 0;
    return {
      count: n ? `<span class="rs-count">${num(n)} finding${n === 1 ? '' : 's'}</span>` : '<span class="rs-count muted">No findings</span>',
      bar: sevBarHtml(c),
    };
  }
  if (state === 'running' || state === 'queued') {
    return {count: `<span class="rs-count muted">${state === 'running' ? 'Scanning…' : 'Waiting…'}</span>`, bar: '<div class="sev-bar indet"></div>'};
  }
  return {count: '<span class="rs-count muted">No results</span>', bar: '<div class="sev-bar"></div>'};
}

function scanRowMenuHtml(s) {
  const id = String(s.scan_id || '');
  const name = String(s.filename || 'Untitled scan');
  const href = '#/scan/' + encodeURIComponent(id);
  return `<details class="rs-menu">
      <summary aria-label="Actions for ${escAttr(name)}">${ico('more')}</summary>
      <div class="rs-menu-pop">
        <a href="${href}">${ico('arrowRight')} Open scan</a>
        ${s.state === 'done' ? `<a href="/api/v1/scans/${encodeURIComponent(id)}/report" target="_blank" rel="noopener">${ico('external')} HTML report</a>` : ''}
        <button type="button" class="danger" data-delete="${escAttr(id)}">${ico('trash')} Delete scan</button>
      </div>
    </details>`;
}

function scanListRowHtml(s, d) {
  const id = String(s.scan_id || '');
  const name = String(s.filename || 'Untitled scan');
  const state = String(s.state || 'queued').toLowerCase();
  const kind = scanKindOf(s);
  const {count, bar} = scanFindingsParts(s, d);
  const llm = s.llm_enabled && s.llm_provider && s.llm_provider !== 'none';
  return `
    <div class="rs-row sl-row" data-rs="${escAttr(id)}" data-href="#/scan/${escAttr(encodeURIComponent(id))}" role="link" tabindex="0"
      aria-label="${escAttr(name)}, ${escAttr(state)}">
      ${platTile(kind)}
      <div class="rs-main">
        <div class="rs-name" title="${escAttr(name)}">${esc(name)}</div>
        <div class="rs-meta"><span>${platformName(kind)}</span><span class="mono" title="${escAttr(id)}">${esc(id.slice(0, 8))}</span><span class="m-only">${esc(fmtShort(s.created_at))}</span></div>
      </div>
      <div class="sl-mode"><span class="chip mode-chip" title="${escAttr(scanModeLabel(s.llm_mode) + (llm ? ' · LLM: ' + s.llm_provider : ''))}">${ico(llm ? 'sparkles' : (SCAN_MODES[s.llm_mode]?.icon || 'zap'))} ${esc(scanModeLabel(s.llm_mode))}</span></div>
      <div class="rs-state">${statePill(state, isEmptyScan(d))}</div>
      <div class="sl-find">${count}${bar}</div>
      <div class="sl-date" title="${escAttr(fmt(s.created_at))}">${esc(fmtShort(s.created_at))}</div>
      <div class="sl-dur">${dur(s.started_at, s.finished_at)}</div>
      ${scanRowMenuHtml(s)}
    </div>`;
}

function scansSortBtn(key, label, cls = '') {
  const active = _scansSort.key === key;
  const ind = active && _scansSort.dir === 'asc' ? '▲' : '▼';
  const aria = active ? (_scansSort.dir === 'asc' ? 'ascending' : 'descending') : 'none';
  return `<span class="${cls}"><button type="button" class="sort-btn${active ? ' active' : ''}" data-sort="${key}"
    aria-label="Sort by ${label}${active ? ', currently ' + aria : ''}">${label}<span class="sort-ind" aria-hidden="true">${ind}</span></button></span>`;
}

function segHtml(attr, current, items) {
  return items.map(([v, label, n, icon]) => `<button type="button" data-${attr}="${v}" class="${current === v ? 'active' : ''}"
    aria-pressed="${current === v}">${icon ? ico(icon) : ''}${label}${n != null ? ` <span class="n">${n}</span>` : ''}</button>`).join('');
}

function pagerHtml(page, pages, total, size, attr) {
  if (total <= size) return `<span>${total} result${total === 1 ? '' : 's'}</span><span></span>`;
  const from = (page - 1) * size + 1, to = Math.min(total, page * size);
  const nums = [];
  for (let p = 1; p <= pages; p++) {
    if (p === 1 || p === pages || Math.abs(p - page) <= 1) nums.push(p);
    else if (nums[nums.length - 1] !== '…') nums.push('…');
  }
  return `<span>Showing ${from}–${to} of ${total}</span>
    <div class="pager-btns">
      <button type="button" data-${attr}="${page - 1}" ${page <= 1 ? 'disabled' : ''} aria-label="Previous page">‹</button>
      ${nums.map(p => p === '…' ? '<button type="button" disabled>…</button>'
        : `<button type="button" data-${attr}="${p}" class="${p === page ? 'active' : ''}" aria-current="${p === page ? 'page' : 'false'}">${p}</button>`).join('')}
      <button type="button" data-${attr}="${page + 1}" ${page >= pages ? 'disabled' : ''} aria-label="Next page">›</button>
    </div>`;
}

/** Fetch scan details for done scans not cached yet (4 at a time) and re-render their rows. */
async function hydrateScanRows(scans, rowHtml) {
  const need = scans.filter(s => s.state === 'done' && !_recentDetails.has(s.scan_id));
  let i = 0;
  const worker = async () => {
    while (i < need.length) {
      const s = need[i++];
      let d = null;
      try { d = await api('/scans/' + encodeURIComponent(s.scan_id)); } catch (_) {}
      _recentDetails.set(s.scan_id, d);
      const row = document.querySelector(`.rs-row[data-rs="${CSS.escape(s.scan_id)}"]`);
      if (row) row.outerHTML = rowHtml(s, d);
    }
  };
  await Promise.all([worker(), worker(), worker(), worker()]);
}

function renderScansList() {
  const body = document.getElementById('sl-body');
  if (!body) return;
  const all = _scansCache;
  const counts = {all: all.length, done: 0, active: 0, error: 0};
  const pcounts = {all: all.length, android: 0, ios: 0};
  all.forEach(s => { counts[scanStateGroup(s)]++; const k = scanKindOf(s); if (k in pcounts) pcounts[k]++; });
  document.getElementById('sl-state-seg').innerHTML = segHtml('state', _scansView.state, [
    ['all', 'All', counts.all], ['done', 'Done', counts.done], ['active', 'In progress', counts.active], ['error', 'Failed', counts.error]]);
  document.getElementById('sl-plat-seg').innerHTML = segHtml('plat', _scansView.plat, [
    ['all', 'All platforms'], ['android', 'Android', pcounts.android], ['ios', 'iOS', pcounts.ios]]);
  document.getElementById('sl-head').innerHTML = scansSortBtn('file', 'File') + scansSortBtn('mode', 'Mode', 'h-mode')
    + scansSortBtn('state', 'Status') + scansSortBtn('findings', 'Findings') + scansSortBtn('started', 'Started')
    + scansSortBtn('duration', 'Duration', 'h-dur') + '<span></span>';
  const ms = document.getElementById('sl-sort-mobile');
  if (ms) ms.value = `${_scansSort.key}:${_scansSort.dir}`;
  const sub = document.getElementById('sl-sub');
  if (sub) sub.textContent = `${counts.all} scan${counts.all === 1 ? '' : 's'}` + (counts.active ? ` · ${counts.active} in progress` : '') + (counts.error ? ` · ${counts.error} failed` : '');

  const list = filteredScans();
  const pages = Math.max(1, Math.ceil(list.length / SCANS_PAGE_SIZE));
  _scansView.page = Math.min(Math.max(1, _scansView.page), pages);
  const pageItems = list.slice((_scansView.page - 1) * SCANS_PAGE_SIZE, _scansView.page * SCANS_PAGE_SIZE);
  const filtered = _scansView.q || _scansView.state !== 'all' || _scansView.plat !== 'all';
  document.getElementById('sl-head').hidden = !pageItems.length;
  body.innerHTML = pageItems.length ? pageItems.map(s => scanListRowHtml(s, _recentDetails.get(s.scan_id))).join('')
    : `<div class="empty-state"><div class="es-ico">${ico('scanSearch')}</div><strong>No scans match these filters</strong>
        Try another search term or reset the filters.
        <button type="button" class="btn btn-outline" data-clear-filters>${ico('refresh')} Clear filters</button></div>`;
  document.getElementById('sl-pager').innerHTML = pagerHtml(_scansView.page, pages, list.length, SCANS_PAGE_SIZE, 'page');
  document.getElementById('sl-clear').hidden = !filtered;
  hydrateScanRows(pageItems, scanListRowHtml);
}

async function refreshScansData() {
  clearTimeout(_scansTimer);
  try {
    const scans = await api('/scans');
    if (!document.getElementById('sl-body')) return;
    _scansCache = Array.isArray(scans) ? scans : [];
    renderScansList();
  } catch (_) { /* keep showing the last good list */ }
  if (document.getElementById('sl-body') && _scansCache.some(s => scanStateGroup(s) === 'active')) {
    _scansTimer = setTimeout(refreshScansData, 5000);
  }
}

route('scans', async function() {
  clearTimeout(_scansTimer);
  render(`<div class="page-wrap"><div class="loading"><div class="spinner"></div></div></div>`);
  try {
    const scans = await api('/scans');
    _scansCache = Array.isArray(scans) ? scans : [];
  } catch (e) {
    render(`<div class="page-wrap"><div class="alert alert-error">${esc(e.message)}</div></div>`);
    return;
  }
  const head = `
    <div class="page-head">
      <div class="page-head-main">
        <div class="page-ico">${ico('history')}</div>
        <div><h1 class="page-title">All Scans</h1><div class="page-sub" id="sl-sub"></div></div>
      </div>
      <div class="page-head-r"><a href="#/" class="btn btn-primary btn-lg">${ico('cloudUpload')} New Scan</a></div>
    </div>`;
  if (!_scansCache.length) {
    render(`<div class="page-wrap">${head}<section class="panel"><div class="empty-state">
      <div class="es-ico">${ico('cloudUpload')}</div><strong>No scans yet</strong>
      Upload an APK, IPA or XAPK to run your first security scan.
      <a href="#/" class="btn btn-primary btn-lg">${ico('folderOpen')} Upload application</a></div></section></div>`);
    return;
  }
  render(`
    <div class="page-wrap" id="scans-page">
      ${head}
      <div class="toolbar">
        <label class="search-ctl">${ico('scanSearch')}
          <input id="sl-q" class="ctl" type="search" placeholder="Search by file name, scan ID or mode…" value="${escAttr(_scansView.q)}" aria-label="Search scans"/></label>
        <div class="seg" id="sl-state-seg" role="group" aria-label="Filter by status"></div>
        <div class="seg" id="sl-plat-seg" role="group" aria-label="Filter by platform"></div>
      </div>
      <section class="panel">
        <div class="result-line" style="margin-bottom:.6rem">
          <span class="mobile-sort">Sort
            <select id="sl-sort-mobile" class="ctl" aria-label="Sort scans">
              ${[['started:desc','Newest first'],['started:asc','Oldest first'],['file:asc','File A→Z'],['state:asc','Status'],
                 ['findings:desc','Most findings'],['duration:desc','Longest']].map(([v,l]) => `<option value="${v}">${l}</option>`).join('')}
            </select></span>
          <button type="button" class="btn btn-ghost btn-sm" id="sl-clear" data-clear-filters hidden>${ico('refresh')} Clear filters</button>
        </div>
        <div class="list-head sl-head sl-cols" id="sl-head"></div>
        <div class="rs-list" id="sl-body"></div>
        <div class="pager" id="sl-pager"></div>
      </section>
    </div>`);

  const page = document.getElementById('scans-page');
  page.addEventListener('click', ev => {
    const t = ev.target.closest('button');
    if (!t || t.disabled) return;
    if (t.dataset.sort) {
      const key = t.dataset.sort;
      if (_scansSort.key === key) _scansSort.dir = _scansSort.dir === 'asc' ? 'desc' : 'asc';
      else { _scansSort.key = key; _scansSort.dir = ['started', 'duration', 'findings'].includes(key) ? 'desc' : 'asc'; }
    } else if (t.dataset.state) { _scansView.state = t.dataset.state; _scansView.page = 1; }
    else if (t.dataset.plat) { _scansView.plat = t.dataset.plat; _scansView.page = 1; }
    else if (t.dataset.page) { _scansView.page = Number(t.dataset.page); page.scrollIntoView({block: 'start', behavior: 'smooth'}); }
    else if ('clearFilters' in t.dataset) {
      _scansView = {q: '', state: 'all', plat: 'all', page: 1};
      document.getElementById('sl-q').value = '';
    } else return;
    renderScansList();
  });
  let qTimer = null;
  document.getElementById('sl-q').addEventListener('input', ev => {
    clearTimeout(qTimer);
    qTimer = setTimeout(() => { _scansView.q = ev.target.value; _scansView.page = 1; renderScansList(); }, 120);
  });
  document.getElementById('sl-sort-mobile').addEventListener('change', ev => {
    const [key, dir] = ev.target.value.split(':');
    _scansSort = {key, dir};
    renderScansList();
  });
  renderScansList();
  if (_scansCache.some(s => scanStateGroup(s) === 'active')) _scansTimer = setTimeout(refreshScansData, 5000);
});

window.deleteScan = async function(id, ev) {
  ev?.preventDefault();
  ev?.stopPropagation();
  if (!confirm('Delete this scan? Its results and uploaded package are removed permanently.')) return;
  const r = await fetch('/api/v1/scans/'+encodeURIComponent(String(id)), {method:'DELETE', headers: headers()});
  if (!r.ok && r.status !== 404) {
    alert('Could not delete scan: ' + (((await r.text().catch(() => '')) || r.statusText).slice(0, 200)));
    return;
  }
  _recentDetails.delete(String(id));
  router();
};

/* ── learned rules view ── */
let _learnedCache = null;
let _learnedPlat = 'ALL';
let _learnedSev = '';           // '' = every severity, else CRITICAL/HIGH/MEDIUM/LOW/INFO
let _learnedQ = '';
let _learnedRows = [];          // currently displayed (filtered + sorted) rules, indexed by the drawer
/** @type {{key:string, dir:'asc'|'desc'}} */
let _learnedSort = {key: 'severity', dir: 'desc'};

const SEV_RANK = { CRITICAL: 5, HIGH: 4, MEDIUM: 3, LOW: 2, INFO: 1 };

function badgeSev(sev) {
  const cls = (sev||'INFO').toLowerCase();
  return `<span class="badge badge-${cls}">${esc(sev||'INFO')}</span>`;
}

function badgePlatform(plat) {
  const p = String(plat||'IOS').toUpperCase();
  const cls = p === 'ANDROID' ? 'android' : 'ios';
  const label = p === 'ANDROID' ? 'Android' : 'iOS';
  return `<span class="badge badge-${cls}">${label}</span>`;
}

function cvssHtml(score) {
  const n = Number(score || 0);
  const cls = n >= 9 ? 'c' : n >= 7 ? 'h' : n >= 4 ? 'm' : n > 0 ? 'l' : '';
  return `<span class="cvss ${cls}" title="CVSS ${n.toFixed(1)}">${n.toFixed(1)}</span>`;
}

function learnedStoreMeta(stores, plat) {
  return (stores || []).find(s => s.platform === plat) || {platform: plat, path: '', exists: false, count: 0};
}

function learnedRuleSearchText(r) {
  return [r.id, r.scope, r.title, r.category, r.severity, r.platform, r.regex, r.cwe, r.description]
    .map(x => String(x||'').toLowerCase()).join(' ');
}

function learnedSortValue(r, key) {
  switch (key) {
    case 'id': return String(r.id||'').toLowerCase();
    case 'title': return String(r.title||'').toLowerCase();
    case 'severity': return SEV_RANK[String(r.severity||'INFO').toUpperCase()] || 0;
    case 'cvss': return Number(r.cvssScore||0);
    case 'regex': return String(r.regex||'').toLowerCase();
    case 'created': return r.createdAt ? new Date(r.createdAt).getTime() : 0;
    default: return '';
  }
}

function sortedLearnedRules() {
  const rules = (_learnedCache && _learnedCache.rules) ? _learnedCache.rules.slice() : [];
  const {key, dir} = _learnedSort;
  const mul = dir === 'asc' ? 1 : -1;
  rules.sort((a, b) => {
    const va = learnedSortValue(a, key), vb = learnedSortValue(b, key);
    const cmp = (typeof va === 'number' && typeof vb === 'number') ? va - vb
      : String(va).localeCompare(String(vb), undefined, {sensitivity:'base'});
    if (cmp !== 0) return cmp * mul;
    return String(a.id||'').localeCompare(String(b.id||''), undefined, {sensitivity:'base'});
  });
  return rules;
}

function learnedPlatOf(r) { return String(r.platform||'IOS').toUpperCase() === 'ANDROID' ? 'ANDROID' : 'IOS'; }
function learnedSevOf(r) { const s = String(r.severity||'INFO').toUpperCase(); return s in SEV_RANK ? s : 'INFO'; }

function learnedSortBtn(key, label, cls = '') {
  const active = _learnedSort.key === key;
  const ind = active && _learnedSort.dir === 'asc' ? '▲' : '▼';
  return `<span class="${cls}"><button type="button" class="sort-btn${active ? ' active' : ''}" data-lsort="${key}"
    aria-label="Sort by ${label}">${label}<span class="sort-ind" aria-hidden="true">${ind}</span></button></span>`;
}

function learnedRowHtml(r, idx) {
  const plat = learnedPlatOf(r);
  const kind = plat === 'ANDROID' ? 'android' : 'ios';
  const tags = [r.scope, r.cwe].filter(Boolean).map(t => `<span class="lr-tag">${esc(t)}</span>`).join('');
  return `<div class="lr-row" role="button" tabindex="0" data-lidx="${idx}" aria-label="${escAttr((r.id || '') + ': ' + (r.title || ''))}">
    <div class="lr-rule">${platTile(kind).replace('class="plat-tile', 'class="plat-tile lr-plat')}<span class="lr-id" title="${escAttr(r.id||'')}">${esc(r.id||'')}</span></div>
    <div class="lr-main" style="min-width:0"><div class="lr-title">${esc(r.title||'Untitled rule')}</div>${tags ? `<div class="lr-sub">${tags}</div>` : ''}</div>
    ${badgeSev(learnedSevOf(r))}
    ${cvssHtml(r.cvssScore)}
    <code class="lr-regex" title="${escAttr(r.regex||'')}">${esc(r.regex||'')}</code>
    <span class="lr-date">${r.createdAt ? esc(new Date(r.createdAt).toLocaleDateString(undefined, {month:'short', day:'numeric', year:'numeric'})) : '—'}</span>
    <span class="lr-chev">${ico('arrowRight')}</span>
  </div>`;
}

function renderLearnedList() {
  const body = document.getElementById('lr-body');
  if (!body) return;
  const q = _learnedQ.trim().toLowerCase();
  const all = sortedLearnedRules();
  const inPlat = all.filter(r => _learnedPlat === 'ALL' || learnedPlatOf(r) === _learnedPlat);
  const inQuery = inPlat.filter(r => !q || learnedRuleSearchText(r).includes(q));
  _learnedRows = inQuery.filter(r => !_learnedSev || learnedSevOf(r) === _learnedSev);

  const pc = {ALL: all.length, IOS: 0, ANDROID: 0};
  all.forEach(r => pc[learnedPlatOf(r)]++);
  document.getElementById('lr-plat-seg').innerHTML = segHtml('lplat', _learnedPlat, [
    ['ALL', 'All', pc.ALL], ['IOS', 'iOS', pc.IOS], ['ANDROID', 'Android', pc.ANDROID]]);

  // Severity tiles count what the platform + search filters leave, so clicking one is predictable.
  const sc = {CRITICAL: 0, HIGH: 0, MEDIUM: 0, LOW: 0, INFO: 0};
  inQuery.forEach(r => sc[learnedSevOf(r)]++);
  const tiles = ['CRITICAL', 'HIGH', 'MEDIUM', 'LOW'].concat(sc.INFO ? ['INFO'] : []);
  document.getElementById('lr-tiles').innerHTML = tiles.map(k => `
    <button type="button" class="sev-tile t-${k.toLowerCase()}${_learnedSev === k ? ' active' : ''}${_learnedSev && _learnedSev !== k ? ' dim' : ''}"
      data-lsev="${k}" aria-pressed="${_learnedSev === k}" title="${_learnedSev === k ? 'Show every severity' : 'Show only ' + k.toLowerCase() + ' rules'}">
      <span class="n">${sc[k]}</span><span class="l">${k.charAt(0) + k.slice(1).toLowerCase()} ${ico('check')}</span></button>`).join('');

  document.getElementById('lr-head').innerHTML = learnedSortBtn('id', 'Rule') + learnedSortBtn('title', 'Title')
    + learnedSortBtn('severity', 'Severity') + learnedSortBtn('cvss', 'CVSS') + learnedSortBtn('regex', 'Detection regex', 'h-regex')
    + learnedSortBtn('created', 'Created', 'h-date') + '<span></span>';
  document.getElementById('lr-head').hidden = !_learnedRows.length;

  const filtered = !!(q || _learnedSev || _learnedPlat !== 'ALL');
  document.getElementById('lr-clear').hidden = !filtered;
  document.getElementById('lr-count').textContent = filtered
    ? `Showing ${_learnedRows.length} of ${all.length} rules` : `${all.length} rules`;

  if (_learnedRows.length) {
    body.innerHTML = _learnedRows.map(learnedRowHtml).join('');
  } else {
    const msg = q || _learnedSev ? 'No rules match these filters.'
      : _learnedPlat === 'ANDROID' ? 'No Android learned rules yet. Run an APK scan with LLM enrichment in Full Scan mode.'
      : _learnedPlat === 'IOS' ? 'No iOS learned rules yet. Run an IPA scan with LLM enrichment in Full Scan mode.'
      : 'No learned rules yet.';
    body.innerHTML = `<div class="empty-state"><div class="es-ico">${ico('scanSearch')}</div><strong>Nothing to show</strong>${esc(msg)}
      ${filtered ? `<button type="button" class="btn btn-outline" data-lclear>${ico('refresh')} Clear filters</button>` : ''}</div>`;
  }
}

function closeRuleDrawer() {
  document.getElementById('rule-drawer')?.classList.remove('open');
  document.getElementById('rule-drawer-backdrop')?.classList.remove('open');
  $$('.lr-row.selected').forEach(r => r.classList.remove('selected'));
}

function openRuleDrawer(idx) {
  const r = _learnedRows[idx];
  const drawer = document.getElementById('rule-drawer');
  if (!r || !drawer) return;
  const plat = learnedPlatOf(r);
  document.getElementById('rule-drawer-title').textContent = r.title || r.id || 'Learned rule';
  document.getElementById('rule-drawer-meta').innerHTML = `${badgePlatform(plat)} ${badgeSev(learnedSevOf(r))} ${cvssHtml(r.cvssScore)}
    ${r.cwe ? `<span class="meta-chip">${esc(r.cwe)}</span>` : ''}${r.scope ? `<span class="meta-chip">${esc(r.scope)}</span>` : ''}`;
  const section = (label, html) => html ? `<div class="rule-sec"><div class="llm-section-label">${label}</div>${html}</div>` : '';
  const code = (text, id) => `<div class="rule-code"><pre id="${id}">${esc(text)}</pre>
    <button type="button" class="copy-btn" data-copy="${id}">${ico('fileText')} Copy</button></div>`;
  document.getElementById('rule-drawer-body').innerHTML = [
    section('Description', isEmptyField(r.description) ? '' : `<p>${esc(r.description)}</p>`),
    section('Remediation', isEmptyField(r.remediation) ? '' : `<p>${esc(r.remediation)}</p>`),
    section('Detection regex', r.regex ? code(r.regex, 'rule-regex') : ''),
    section('Proof of concept', isEmptyField(r.pocTemplate) ? '' : code(r.pocTemplate, 'rule-poc')),
    section('Details', `<div class="rule-kv">
      <span class="k">Rule ID</span><span class="v mono">${esc(r.id || '—')}</span>
      <span class="k">Platform</span><span class="v">${plat === 'ANDROID' ? 'Android' : 'iOS'}</span>
      ${r.category ? `<span class="k">Category</span><span class="v">${esc(r.category)}</span>` : ''}
      ${r.target ? `<span class="k">Matches</span><span class="v">${esc(r.target)}</span>` : ''}
      ${r.referenceUrl ? `<span class="k">Source</span><span class="v">${/^https?:\/\//.test(r.referenceUrl)
        ? `<a href="${escAttr(r.referenceUrl)}" target="_blank" rel="noopener">${esc(r.referenceUrl)}</a>` : esc(r.referenceUrl)}</span>` : ''}
      <span class="k">Created</span><span class="v">${r.createdAt ? esc(new Date(r.createdAt).toLocaleString()) : '—'}</span>
    </div>`),
  ].join('');
  $$('.lr-row').forEach(el => el.classList.toggle('selected', Number(el.dataset.lidx) === idx));
  drawer.classList.add('open');
  document.getElementById('rule-drawer-backdrop').classList.add('open');
  drawer.focus();
}

function renderLearnedPage(data) {
  const ios = learnedStoreMeta(data.stores, 'IOS');
  const and = learnedStoreMeta(data.stores, 'ANDROID');
  const totalAll = (data.stores||[]).reduce((n,s)=>n+(s.count||0), 0);
  const storeCard = (m, kind, label) => `
    <div class="store-card">
      ${platTile(kind)}
      <div class="store-main"><div class="store-name">${label} rule store</div>
        <div class="store-path" title="${escAttr(m.path||'')}">${esc(m.path || '—')}</div></div>
      <span class="store-count${m.exists ? '' : ' missing'}">${m.exists ? `${m.count} rule${m.count === 1 ? '' : 's'}` : 'Not created yet'}</span>
    </div>`;
  const head = `
    <div class="page-head">
      <div class="page-head-main">
        <div class="page-ico">${ico('sparkles')}</div>
        <div><h1 class="page-title">Learned Rules</h1>
          <div class="page-sub">Detection rules the LLM distilled from previous scans. They run on every scan for the matching platform — even without LLM enrichment.</div></div>
      </div>
    </div>
    <div class="store-row">${storeCard(ios, 'ios', 'iOS')}${storeCard(and, 'android', 'Android')}</div>`;

  if (!totalAll) {
    return `<div class="page-wrap">${head}
      <section class="panel"><div class="empty-state">
        <div class="es-ico">${ico('sparkles')}</div><strong>No learned rules yet</strong>
        Run a scan with <b>LLM Enrichment</b> in <b>Full Scan</b> mode. Vulnerabilities the LLM discovers are distilled into
        reusable detection rules, stored per platform, and checked on every later scan alongside the built-in MASTG rules.
        <a href="#/" class="btn btn-primary btn-lg">${ico('cloudUpload')} Start a scan</a>
      </div></section></div>`;
  }
  return `
    <div class="page-wrap" id="learned-page">
      ${head}
      <div class="sev-tiles" id="lr-tiles" role="group" aria-label="Filter by severity"></div>
      <div class="toolbar">
        <label class="search-ctl">${ico('scanSearch')}
          <input id="learned-q" class="ctl" type="search" placeholder="Search by ID, title, scope, CWE, regex…" value="${escAttr(_learnedQ)}" aria-label="Search learned rules"/></label>
        <div class="seg" id="lr-plat-seg" role="group" aria-label="Filter by platform"></div>
      </div>
      <section class="panel">
        <div class="result-line" style="margin-bottom:.6rem">
          <span id="lr-count"></span>
          <button type="button" class="btn btn-ghost btn-sm" id="lr-clear" data-lclear hidden>${ico('refresh')} Clear filters</button>
        </div>
        <div class="list-head lr-head lr-cols" id="lr-head"></div>
        <div class="lr-list" id="lr-body"></div>
      </section>
      <div id="rule-drawer-backdrop" class="llm-drawer-backdrop"></div>
      <aside id="rule-drawer" class="llm-drawer" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="rule-drawer-title">
        <div class="llm-drawer-head">
          <div class="llm-drawer-head-main">
            <div id="rule-drawer-title" class="llm-drawer-title"></div>
            <div id="rule-drawer-meta" class="llm-drawer-meta"></div>
          </div>
          <button type="button" class="llm-drawer-close" data-close-drawer aria-label="Close">×</button>
        </div>
        <div id="rule-drawer-body" class="llm-drawer-body"></div>
      </aside>
    </div>`;
}

route('learned', async function() {
  render('<div class="page-wrap"><div class="loading"><div class="spinner"></div></div></div>');
  let data;
  try { data = await api('/learned-rules'); }
  catch (e) { render(`<div class="page-wrap"><div class="alert alert-error">${esc(e.message)}</div></div>`); return; }
  _learnedCache = data;
  render(renderLearnedPage(data));
  const page = document.getElementById('learned-page');
  if (!page) return;
  page.addEventListener('click', async ev => {
    const t = ev.target;
    if (t.id === 'rule-drawer-backdrop' || t.closest('[data-close-drawer]')) { closeRuleDrawer(); return; }
    const copy = t.closest('[data-copy]');
    if (copy) {
      const text = document.getElementById(copy.dataset.copy)?.textContent || '';
      try { await navigator.clipboard.writeText(text); copy.innerHTML = ico('check') + ' Copied'; }
      catch (_) { copy.textContent = 'Copy failed'; }
      setTimeout(() => { copy.innerHTML = ico('fileText') + ' Copy'; }, 1500);
      return;
    }
    const row = t.closest('.lr-row');
    if (row) { openRuleDrawer(Number(row.dataset.lidx)); return; }
    const b = t.closest('button');
    if (!b) return;
    if (b.dataset.lsort) {
      const key = b.dataset.lsort;
      if (_learnedSort.key === key) _learnedSort.dir = _learnedSort.dir === 'asc' ? 'desc' : 'asc';
      else { _learnedSort.key = key; _learnedSort.dir = ['severity', 'cvss', 'created'].includes(key) ? 'desc' : 'asc'; }
    } else if (b.dataset.lsev) _learnedSev = _learnedSev === b.dataset.lsev ? '' : b.dataset.lsev;
    else if (b.dataset.lplat) _learnedPlat = b.dataset.lplat;
    else if ('lclear' in b.dataset) {
      _learnedPlat = 'ALL'; _learnedSev = ''; _learnedQ = '';
      document.getElementById('learned-q').value = '';
    } else return;
    renderLearnedList();
  });
  page.addEventListener('keydown', ev => {
    if (ev.key === 'Escape') { closeRuleDrawer(); return; }
    const row = ev.target.closest && ev.target.closest('.lr-row');
    if (row && ev.target === row && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); openRuleDrawer(Number(row.dataset.lidx)); }
  });
  let qTimer = null;
  document.getElementById('learned-q').addEventListener('input', ev => {
    clearTimeout(qTimer);
    qTimer = setTimeout(() => { _learnedQ = ev.target.value; renderLearnedList(); }, 120);
  });
  renderLearnedList();
});


/* ── Config page (centralized LLM provider credentials) ──────────────────────
   Single source of truth for every API key / OAuth session the server uses for LLM
   Enrichment, the AI Assistant and AI Fix — the upload form (Home) never collects a key
   itself; it only shows providers this page reports as configured. */
let _configCache = null;   // last GET /config/providers response, reused by renderHomeOptions()
let _configOpenForm = null; // provider id whose inline Connect/Edit form is expanded

function configProviderStatus(data, provider) {
  return (data?.providers || []).find(p => p.provider === provider) || {configured: false, source: 'none', masked: {}, fields: {}};
}

async function fetchConfigProviders() {
  _configCache = await api('/config/providers');
  return _configCache;
}

function cfgpBadgeHtml(st) {
  if (st.configured) return `<span class="cfgp-badge on">${ico('circleCheck')} Connected</span>`;
  return `<span class="cfgp-badge off">${ico('circleX')} Not connected</span>`;
}

function cfgpSourceLabel(st) {
  if (!st.configured) return '';
  if (st.source === 'env') return 'Configured via server .env';
  if (st.updated_at) return `Connected · updated ${fmtShort(st.updated_at)}`;
  return 'Connected';
}

function cfgpFieldsSummaryHtml(st) {
  const bits = [];
  for (const [k, v] of Object.entries(st.masked || {})) bits.push(`<span class="cfgp-kv">${k.replace(/_/g,' ')}: <code>${esc(v)}</code></span>`);
  for (const [k, v] of Object.entries(st.fields || {})) {
    if (k === 'updated_at') continue;
    bits.push(`<span class="cfgp-kv">${k.replace(/_/g,' ')}: <code>${esc(String(v))}</code></span>`);
  }
  return bits.length ? `<div class="cfgp-meta">${bits.join('')}</div>` : '';
}

function renderConfigProviderForm(provider, meta, st) {
  const fieldsHtml = meta.fields.map(f => `
    <label>${esc(f.label)}
      <input class="ctl" type="${f.type}" id="cfgp-f-${provider}-${f.key}" placeholder="${escAttr(f.placeholder)}" autocomplete="off" spellcheck="false"/>
    </label>`).join('');
  return `
    <div class="cfgp-form" id="cfgp-form-${provider}">
      ${fieldsHtml}
      <div class="cfgp-note" id="cfgp-note-${provider}">${esc(LLM_KEY_NOTE)}</div>
      <div style="display:flex;gap:.4rem;flex-wrap:wrap">
        <button type="button" class="btn btn-primary btn-sm" onclick="saveConfigProvider('${provider}')">${ico('check')} Save</button>
        <button type="button" class="btn btn-outline btn-sm" onclick="testConfigProvider('${provider}')" id="cfgp-test-${provider}">${ico('plug')} Test Connection</button>
        ${st.configured ? `<button type="button" class="btn btn-ghost btn-sm" onclick="deleteConfigProvider('${provider}')">${ico('trash')} Remove</button>` : ''}
        <button type="button" class="btn btn-ghost btn-sm" onclick="toggleConfigForm('${provider}', false)">Cancel</button>
      </div>
    </div>`;
}

function renderConfigOauthCard(data) {
  const st = configProviderStatus(data, 'claude-oauth');
  const meta = CONFIG_PROVIDER_META['claude-oauth'];
  const isDefault = data.default_provider === 'claude-oauth';
  return `
    <div class="cfgp-card${st.configured ? ' is-configured' : ''}" id="cfgp-card-claude-oauth">
      <div class="cfgp-card-top">
        <div class="cfgp-icon">${esc(meta.textIcon)}</div>
        <div class="cfgp-main">
          <div class="cfgp-name">${esc(meta.name)} ${cfgpBadgeHtml(st)} ${isDefault ? '<span class="cfgp-badge default">Default</span>' : ''}</div>
          <div class="cfgp-desc">${esc(meta.desc)}</div>
        </div>
      </div>
      <div class="cfgp-meta" id="oauth-status-text-cfg">Checking status…</div>
      <div class="cfgp-actions">
        ${!isDefault ? `<button type="button" class="btn btn-outline btn-sm" onclick="setConfigDefault('claude-oauth')">Set as default</button>` : ''}
      </div>
      <div id="oauth-claude-code-row-cfg" hidden style="display:flex;flex-wrap:wrap;align-items:center;gap:.5rem">
        <button type="button" class="btn btn-outline btn-sm" onclick="importFromClaudeCode()">Import from Claude Code CLI</button>
        <span style="font-size:.72rem;color:var(--muted)">Found a <code>claude /login</code> session on this server — one click reuses it.</span>
      </div>
      <details>
        <summary style="cursor:pointer;font-weight:600;font-size:.78rem">…or paste a token manually</summary>
        <p style="font-size:.72rem;margin:.4rem 0;color:var(--muted)">
          From <code>~/.claude/.credentials.json</code>'s <code>claudeAiOauth</code> object (wherever you last
          ran <code>claude /login</code>). Sent straight to this server — never shown elsewhere.
        </p>
        <div style="display:flex;flex-direction:column;gap:.35rem;max-width:420px">
          <input id="oauth-imp-access" class="ctl" type="password" placeholder="accessToken (sk-ant-oat01-...)"/>
          <input id="oauth-imp-refresh" class="ctl" type="password" placeholder="refreshToken (sk-ant-ort01-...)"/>
          <input id="oauth-imp-expires" class="ctl" type="text" placeholder="expiresAt (epoch milliseconds)"/>
          <button type="button" class="btn btn-outline btn-sm" onclick="importOauthToken()" style="align-self:flex-start">Import token</button>
        </div>
      </details>
      <div id="oauth-import-err"></div>
    </div>`;
}

function renderConfigProviderCard(data, provider) {
  if (provider === 'claude-oauth') return renderConfigOauthCard(data);
  const st = configProviderStatus(data, provider);
  const meta = CONFIG_PROVIDER_META[provider];
  const isDefault = data.default_provider === provider;
  const openForm = _configOpenForm === provider;
  return `
    <div class="cfgp-card${st.configured ? ' is-configured' : ''}" id="cfgp-card-${provider}">
      <div class="cfgp-card-top">
        <div class="cfgp-icon">${esc(meta.textIcon)}</div>
        <div class="cfgp-main">
          <div class="cfgp-name">${esc(meta.name)} ${cfgpBadgeHtml(st)} ${isDefault ? '<span class="cfgp-badge default">Default</span>' : ''}</div>
          <div class="cfgp-desc">${esc(meta.desc)}</div>
          ${cfgpFieldsSummaryHtml(st)}
          ${st.configured ? `<div class="cfgp-meta">${esc(cfgpSourceLabel(st))}</div>` : ''}
        </div>
      </div>
      <div class="cfgp-actions">
        <button type="button" class="btn ${st.configured ? 'btn-outline' : 'btn-primary'} btn-sm" onclick="toggleConfigForm('${provider}', ${!openForm})">
          ${ico(st.configured ? 'settings' : 'plug')} ${st.configured ? 'Edit' : 'Connect'}
        </button>
        ${st.configured && !isDefault ? `<button type="button" class="btn btn-ghost btn-sm" onclick="setConfigDefault('${provider}')">Set as default</button>` : ''}
      </div>
      ${openForm ? renderConfigProviderForm(provider, meta, st) : ''}
    </div>`;
}

function renderConfigPage(data) {
  const cards = CONFIG_PROVIDER_ORDER.map(p => renderConfigProviderCard(data, p)).join('');
  return `
    <div class="page-wrap" id="config-page">
      <div class="cfgp-intro">
        <div class="si">${ico('sparkles')}</div>
        <div class="cfgp-intro-main">
          <h2>Connect your LLM providers</h2>
          <p>Add an API key or OAuth session once here — the upload form and AI Assistant pick from whatever is connected. Keys are stored only on this server, never in the browser.</p>
        </div>
      </div>
      <div class="cfgp-head">
        <div>
          <h2>Your LLM Providers</h2>
          <p>Manage connected providers, set a default, and test connections.</p>
        </div>
      </div>
      <div class="cfgp-grid">${cards}</div>
    </div>`;
}

window.toggleConfigForm = function(provider, open) {
  _configOpenForm = open ? provider : null;
  if (_configCache) render(renderConfigPage(_configCache));
  if (provider === 'claude-oauth') refreshOauthStatusCfg();
};

window.saveConfigProvider = async function(provider) {
  const meta = CONFIG_PROVIDER_META[provider];
  const note = document.getElementById(`cfgp-note-${provider}`);
  const body = {};
  for (const f of meta.fields) {
    body[f.key] = (document.getElementById(`cfgp-f-${provider}-${f.key}`)?.value || '').trim();
  }
  const anyFilled = Object.values(body).some(v => v);
  if (!anyFilled) {
    if (note) { note.textContent = 'Fill in at least one field.'; note.className = 'cfgp-note err'; }
    return;
  }
  try {
    await api(`/config/providers/${provider}`, {
