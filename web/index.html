  if (!totalAll) {
    return `<div class="page-wrap">${head}
      <section class="panel"><div class="empty-state">
        <div class="es-ico">${ico('sparkles')}</div><strong>No learned rules yet</strong>
        Run a scan with <b>LLM Enrichment</b> in <b>Full Scan</b> mode. Vulnerabilities the LLM discovers are distilled into
        reusable detection rules, stored per platform, and checked on every later scan alongside the built-in MASTG rules.
        <a href="#/" class="btn btn-primary btn-lg">${ico('cloudUpload')} Start a scan</a>
      </div></section></div>`;
  }
  return `
    <div class="page-wrap" id="learned-page">
      ${head}
      <div class="sev-tiles" id="lr-tiles" role="group" aria-label="Filter by severity"></div>
      <div class="toolbar">
        <label class="search-ctl">${ico('scanSearch')}
          <input id="learned-q" class="ctl" type="search" placeholder="Search by ID, title, scope, CWE, regex…" value="${escAttr(_learnedQ)}" aria-label="Search learned rules"/></label>
        <div class="seg" id="lr-plat-seg" role="group" aria-label="Filter by platform"></div>
      </div>
      <section class="panel">
        <div class="result-line" style="margin-bottom:.6rem">
          <span id="lr-count"></span>
          <button type="button" class="btn btn-ghost btn-sm" id="lr-clear" data-lclear hidden>${ico('refresh')} Clear filters</button>
        </div>
        <div class="list-head lr-head lr-cols" id="lr-head"></div>
        <div class="lr-list" id="lr-body"></div>
      </section>
      <div id="rule-drawer-backdrop" class="llm-drawer-backdrop"></div>

        <div class="llm-drawer-head">
          <div class="llm-drawer-head-main">
            <div id="rule-drawer-title" class="llm-drawer-title"></div>
            <div id="rule-drawer-meta" class="llm-drawer-meta"></div>
          </div>
          <button type="button" class="llm-drawer-close" data-close-drawer aria-label="Close">×</button>
        </div>
        <div id="rule-drawer-body" class="llm-drawer-body"></div>
      </aside>
    </div>`;
}

route('learned', async function() {
  render('<div class="page-wrap"><div class="loading"><div class="spinner"></div></div></div>');
  let data;
  try { data = await api('/learned-rules'); }
  catch (e) { render(`<div class="page-wrap"><div class="alert alert-error">${esc(e.message)}</div></div>`); return; }
  _learnedCache = data;
  render(renderLearnedPage(data));
  const page = document.getElementById('learned-page');
  if (!page) return;
  page.addEventListener('click', async ev => {
    const t = ev.target;
    if (t.id === 'rule-drawer-backdrop' || t.closest('[data-close-drawer]')) { closeRuleDrawer(); return; }
    const copy = t.closest('[data-copy]');
    if (copy) {
      const text = document.getElementById(copy.dataset.copy)?.textContent || '';
      try { await navigator.clipboard.writeText(text); copy.innerHTML = ico('check') + ' Copied'; }
      catch (_) { copy.textContent = 'Copy failed'; }
      setTimeout(() => { copy.innerHTML = ico('fileText') + ' Copy'; }, 1500);
      return;
    }
    const row = t.closest('.lr-row');
    if (row) { openRuleDrawer(Number(row.dataset.lidx)); return; }
    const b = t.closest('button');
    if (!b) return;
    if (b.dataset.lsort) {
      const key = b.dataset.lsort;
      if (_learnedSort.key === key) _learnedSort.dir = _learnedSort.dir === 'asc' ? 'desc' : 'asc';
      else { _learnedSort.key = key; _learnedSort.dir = ['severity', 'cvss', 'created'].includes(key) ? 'desc' : 'asc'; }
    } else if (b.dataset.lsev) _learnedSev = _learnedSev === b.dataset.lsev ? '' : b.dataset.lsev;
    else if (b.dataset.lplat) _learnedPlat = b.dataset.lplat;
    else if ('lclear' in b.dataset) {
      _learnedPlat = 'ALL'; _learnedSev = ''; _learnedQ = '';
      document.getElementById('learned-q').value = '';
    } else return;
    renderLearnedList();
  });
  page.addEventListener('keydown', ev => {
    if (ev.key === 'Escape') { closeRuleDrawer(); return; }
    const row = ev.target.closest && ev.target.closest('.lr-row');
    if (row && ev.target === row && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); openRuleDrawer(Number(row.dataset.lidx)); }
  });
  let qTimer = null;
  document.getElementById('learned-q').addEventListener('input', ev => {
    clearTimeout(qTimer);
    qTimer = setTimeout(() => { _learnedQ = ev.target.value; renderLearnedList(); }, 120);
  });
  renderLearnedList();
});


/* ── Config page (centralized LLM provider credentials) ──────────────────────
   Single source of truth for every API key / OAuth session the server uses for LLM
   Enrichment, the AI Assistant and AI Fix — the upload form (Home) never collects a key
   itself; it only shows providers this page reports as configured. */
let _configCache = null;   // last GET /config/providers response, reused by renderHomeOptions()
let _configOpenForm = null; // provider id whose inline Connect/Edit form is expanded

function configProviderStatus(data, provider) {
  return (data?.providers || []).find(p => p.provider === provider) || {configured: false, source: 'none', masked: {}, fields: {}};
}

async function fetchConfigProviders() {
  _configCache = await api('/config/providers');
  return _configCache;
}

function cfgpBadgeHtml(st) {
  if (st.configured) return `<span class="cfgp-badge on">${ico('circleCheck')} Connected</span>`;
  return `<span class="cfgp-badge off">${ico('circleX')} Not connected</span>`;
}

function cfgpSourceLabel(st) {
  if (!st.configured) return '';
  if (st.source === 'env') return 'Configured via server .env';
  if (st.updated_at) return `Connected · updated ${fmtShort(st.updated_at)}`;
  return 'Connected';
}

function cfgpFieldsSummaryHtml(st) {
  const bits = [];
  for (const [k, v] of Object.entries(st.masked || {})) bits.push(`<span class="cfgp-kv">${k.replace(/_/g,' ')}: <code>${esc(v)}</code></span>`);
  for (const [k, v] of Object.entries(st.fields || {})) {
    if (k === 'updated_at') continue;
    bits.push(`<span class="cfgp-kv">${k.replace(/_/g,' ')}: <code>${esc(String(v))}</code></span>`);
  }
  return bits.length ? `<div class="cfgp-meta">${bits.join('')}</div>` : '';
}

function renderConfigProviderForm(provider, meta, st) {
  const fieldsHtml = meta.fields.map(f => `
    <label>${esc(f.label)}
      <input class="ctl" type="${f.type}" id="cfgp-f-${provider}-${f.key}" placeholder="${escAttr(f.placeholder)}" autocomplete="off" spellcheck="false"/>
    </label>`).join('');
  return `
    <div class="cfgp-form" id="cfgp-form-${provider}">
      ${fieldsHtml}
      <div class="cfgp-note" id="cfgp-note-${provider}">${esc(LLM_KEY_NOTE)}</div>
      <div style="display:flex;gap:.4rem;flex-wrap:wrap">
        <button type="button" class="btn btn-primary btn-sm" onclick="saveConfigProvider('${provider}')">${ico('check')} Save</button>
        <button type="button" class="btn btn-outline btn-sm" onclick="testConfigProvider('${provider}')" id="cfgp-test-${provider}">${ico('plug')} Test Connection</button>
        ${st.configured ? `<button type="button" class="btn btn-ghost btn-sm" onclick="deleteConfigProvider('${provider}')">${ico('trash')} Remove</button>` : ''}
        <button type="button" class="btn btn-ghost btn-sm" onclick="toggleConfigForm('${provider}', false)">Cancel</button>
      </div>
    </div>`;
}

// Holds the login_id of the browser login currently awaiting a pasted code — set by
// startClaudeOauthLogin(), consumed (and cleared) by submitClaudeOauthCode(). Module-level
// rather than per-render state because the Config page's own re-renders (e.g. a
// fetchConfigProviders() refresh while the paste form is open) must not lose it.
let _claudeOauthLoginId = null;
let _claudeOauthPasteOpen = false;

function renderConfigOauthCard(data) {
  const st = configProviderStatus(data, 'claude-oauth');
  const meta = CONFIG_PROVIDER_META['claude-oauth'];
  const isDefault = data.default_provider === 'claude-oauth';
  return `
    <div class="cfgp-card${st.configured ? ' is-configured' : ''}" id="cfgp-card-claude-oauth">
      <div class="cfgp-card-top">
        <div class="cfgp-icon">${esc(meta.textIcon)}</div>
        <div class="cfgp-main">
          <div class="cfgp-name">${esc(meta.name)} ${cfgpBadgeHtml(st)} ${isDefault ? '<span class="cfgp-badge default">Default</span>' : ''}</div>
          <div class="cfgp-desc">${esc(meta.desc)}</div>
        </div>
      </div>

/** "Login with Claude": asks the server for a fresh authorize URL (PKCE handled entirely
    server-side — no secret ever reaches this script), opens it in a new tab, and reveals the
    "paste the code back" form. Mirrors clicking `claude /login` from a terminal that has no
    browser of its own: a separate browser does the signing-in, and a short code comes back. */
window.startClaudeOauthLogin = async function() {
  // Opened synchronously, in the SAME tick as the click, same pattern the report-download
  // handler uses below (search window.open('', '_blank')) — most popup blockers only allow a
  // new tab opened directly from a user gesture; by the time the /start response below comes
  // back (an awaited network round-trip), that gesture has already lapsed. An empty about:blank
  // tab opened right now and redirected once the real URL is known survives that restriction.
  const popup = window.open('', '_blank', 'noopener');
  try {
    const r = await api('/auth/claude-oauth/start', {method: 'POST'});
    _claudeOauthLoginId = r.login_id;
    _claudeOauthPasteOpen = true;
    if (popup) popup.location = r.authorize_url;
    if (_configCache) render(renderConfigPage(_configCache));
    if (!popup) {
      const n = document.getElementById('oauth-paste-note');
      if (n) {
        n.className = 'cfgp-note warn';
        n.innerHTML = `Your browser blocked the popup — <a href="${escAttr(r.authorize_url)}" target="_blank" rel="noopener">open Claude's sign-in page manually</a>, then paste the code it shows you below.`;
      }
    }
    setTimeout(() => document.getElementById('oauth-paste-code')?.focus(), 50);
  } catch (e) {
    if (popup) popup.close();
    alert('Could not start Claude login: ' + (e.message || e));
  }
};

window.cancelClaudeOauthLogin = function() {
  _claudeOauthLoginId = null;
  _claudeOauthPasteOpen = false;
  if (_configCache) render(renderConfigPage(_configCache));
};

window.submitClaudeOauthCode = async function() {
  const input = document.getElementById('oauth-paste-code');
  const btn = document.getElementById('oauth-paste-submit');
  const note = document.getElementById('oauth-paste-note');
  const code = (input?.value || '').trim();
  if (!code) {
    if (note) { note.textContent = 'Paste the authentication code first.'; note.className = 'cfgp-note err'; }
    return;
  }
  if (!_claudeOauthLoginId) {
    if (note) { note.textContent = 'This login attempt expired — click Login with Claude again.'; note.className = 'cfgp-note err'; }
    return;
  }
  if (btn) { btn.disabled = true; btn.innerHTML = ico('loader', 'ico-spin') + ' Submitting…'; }
  try {
    await api('/auth/claude-oauth/exchange', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({login_id: _claudeOauthLoginId, code}),
    });
    _claudeOauthLoginId = null;
    _claudeOauthPasteOpen = false;
    await fetchConfigProviders();
    render(renderConfigPage(_configCache));
    refreshOauthStatusCfg();
  } catch (e) {
    if (note) { note.textContent = e.message || String(e); note.className = 'cfgp-note err'; }
  } finally {
    if (btn) { btn.disabled = false; btn.innerHTML = ico('check') + ' Submit code'; }
  }
};

/** A built-in provider counts as "added" once it is connected — except Ollama, whose always-on
    env default does not mean the user ever added it. */
function cfgpAdded(data, p) {
  const st = configProviderStatus(data, p);
  return st.configured && !(p === 'ollama' && st.source === 'env');
}

function renderConfigPage(data) {
  // Only providers the user has added (or the server's .env already provides) get a card; the rest
  // are added from the "Add LLM Provider" dialog. Claude OAuth keeps its own card (login flow);
  // Ollama's always-on default is not "added" until saved from the dialog.
  const cards = CONFIG_PROVIDER_ORDER.filter(p => p === 'claude-oauth' || cfgpAdded(data, p)).map(p => renderConfigProviderCard(data, p)).join('')
    + (data.providers || []).filter(p => p.custom).map(p => renderCustomProviderCard(data, p)).join('');
  return `

}

window.toggleConfigForm = function(provider, open) {

window.saveConfigProvider = async function(provider) {
  const meta = CONFIG_PROVIDER_META[provider];
  const note = document.getElementById(`cfgp-note-${provider}`);
  const body = {};
  for (const f of meta.fields) {
    body[f.key] = (document.getElementById(`cfgp-f-${provider}-${f.key}`)?.value || '').trim();
  }
  const anyFilled = Object.values(body).some(v => v);
  if (!anyFilled) {
    if (note) { note.textContent = 'Fill in at least one field.'; note.className = 'cfgp-note err'; }
    return;
  }
  try {
    await api(`/config/providers/${provider}`, {
      method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body),
    });
    _configOpenForm = null;
    await fetchConfigProviders();
    render(renderConfigPage(_configCache));
  } catch (e) {
    if (note) { note.textContent = e.message || String(e); note.className = 'cfgp-note err'; }
  }
};

window.testConfigProvider = async function(provider) {
  const meta = CONFIG_PROVIDER_META[provider];
  const note = document.getElementById(`cfgp-note-${provider}`);
  const btn = document.getElementById(`cfgp-test-${provider}`);
  const body = {provider, api_key: '', model: ''};
  for (const f of meta.fields) {
    const v = (document.getElementById(`cfgp-f-${provider}-${f.key}`)?.value || '').trim();
    if (f.key === 'api_key') body.api_key = v;
    else if (['access_key_id','secret_access_key','region','base_url'].includes(f.key)) body[f.key] = v;
  }
  if (btn) { btn.disabled = true; btn.innerHTML = ico('loader', 'ico-spin') + ' Testing…'; }
  try {
    const r = await api('/llm/test', {method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body)});
    if (note) { note.textContent = r.message || (r.ok ? 'Connected.' : 'Connection failed.'); note.className = 'cfgp-note ' + (r.ok ? 'ok' : 'err'); }
  } catch (e) {
    if (note) { note.textContent = e.message || String(e); note.className = 'cfgp-note err'; }
  } finally {
    if (btn) { btn.disabled = false; btn.innerHTML = ico('plug') + ' Test Connection'; }
  }
};

window.deleteConfigProvider = async function(provider) {
  if (!confirm(`Remove the stored credentials for ${CONFIG_PROVIDER_META[provider]?.name || provider}? Scans/chat will fall back to the server's .env configuration for this provider, if any.`)) return;

    await api(`/config/providers/${provider}`, {method: 'DELETE'});

function cmCapture() {
  if (!_cm) return;
  const el = id => document.getElementById(id);

  set('cm-url', 'base_url', x => x.trim()); set('cm-proto', 'protocol'); set('cm-key', 'api_key', x => x.trim());
  set('cm-headers', 'headers');
  if (el('cm-id') || el('cm-fetch')) _cm.models = [...document.querySelectorAll('.cm-model-in')].map(i => i.value.trim());
  document.querySelectorAll('.cm-bf').forEach(i => { _cm.bf[i.dataset.key] = i.value.trim(); });
  document.querySelectorAll('.cm-opt').forEach(i => { _cm.opts[i.dataset.key] = i.type === 'checkbox' ? i.checked : i.value.trim(); });

    return f.type === 'bool'
      ? `<label class="cm-opt-chk">${input}<span><b style="font-size:.8rem">${esc(f.label)}</b><span class="cm-hint" style="display:block">${esc(f.hint)}</span></span></label>`
      : `<label>${esc(f.label)}${input}<span class="cm-hint">${esc(f.hint)}</span></label>`;
  }).join('')
  + `<div class="cm-hint">Server-side Ollama settings such as <code>OLLAMA_FLASH_ATTENTION=1</code> and <code>OLLAMA_KV_CACHE_TYPE=q8_0</code> are environment variables of the Ollama process, not per-request options. Applies to the AI Assistant, AI Fix, Auto Enhance and LLM-enriched scans.</div>`;

function cmOllamaOptionsBody() {
  const o = {};
  for (const f of OLLAMA_OPTS) {
    const v = _cm.opts[f.key];
    if (v === '' || v == null) continue;
    if (f.type === 'number') {
      o[f.key] = Number(v);
      if (!Number.isFinite(o[f.key]) || o[f.key] < f.min || o[f.key] > f.max) throw new Error(`${f.label} must be between ${f.min} and ${f.max}.`);
    }
    else o[f.key] = f.type === 'bool' ? !!v : v;
  }
  return o;
}

window.cmPreset = function(name) { cmCapture(); _cm.opts = {...OLLAMA_PRESETS[name]}; _cm.adv = true; renderCustomModal(); };

const cmAdv = (m, inner, title = 'Customized settings') => `<details class="cm-adv" ${m.adv ? 'open' : ''} ontoggle="_cm && (_cm.adv = this.open)"><summary>${title}</summary><div class="cm-adv-body">${inner}</div></details>`;

function cmBodyHtml(m) {
  if (m.tab === 'custom') return cmEndpointHtml(m) + cmKeyHtml(m) + cmModelsHeadersHtml(m);
  const opts = `<optgroup label="Built-in">${CM_BUILTIN.map(p => `<option value="${p}"${m.sel === p ? ' selected' : ''}>${esc(CONFIG_PROVIDER_META[p].name)}${cfgpAdded(_configCache, p) ? ' ✓' : ''}</option>`).join('')}</optgroup>`
    + `<optgroup label="OpenAI-compatible">${CM_PRESETS.map(p => `<option value="p:${p.id}"${m.sel === 'p:' + p.id ? ' selected' : ''}>${esc(p.name)}</option>`).join('')}</optgroup>`;
  const pick = `<label>Provider<select class="ctl" id="cm-sel" onchange="cmSelect(this.value)">${opts}</select></label>`;
  if (!cmIsBuiltin()) return pick + cmKeyHtml(m) + cmAdv(m, cmEndpointHtml(m) + cmModelsHeadersHtml(m));
  const meta = CONFIG_PROVIDER_META[m.sel];
  const field = f => `<label>${esc(f.label)}<input class="ctl cm-bf" data-key="${f.key}" type="${f.type}" value="${escAttr(m.bf[f.key] || '')}" placeholder="${escAttr(f.placeholder)}" autocomplete="off" spellcheck="false"/></label>`;
  const ollama = m.sel === 'ollama';   // its Base URL is the one real setting, so it is not tucked away
  const top = meta.fields.filter(f => ollama || CM_TOP_FIELDS.includes(f.key)), rest = meta.fields.filter(f => !ollama && !CM_TOP_FIELDS.includes(f.key));
  return pick + `<p class="cm-hint" style="margin:0">${esc(meta.desc)}</p>` + top.map(field).join('')
    + (top.length && !ollama ? `<div class="cm-hint">${esc(LLM_KEY_NOTE.replace('It is never stored.', 'It is stored only on this server.'))}</div>` : '')
    + (ollama ? cmModelsHtml(m) + cmAdv(m, cmOllamaOptsHtml(m), 'Advanced parameters') : '')
    + (rest.length ? cmAdv(m, rest.map(field).join('')) : '');
}

function renderCustomModal() {
  let ov = document.getElementById('cm-overlay');
  if (!_cm) { ov?.remove(); return; }
  if (!ov) {
    ov = document.createElement('div'); ov.id = 'cm-overlay'; ov.className = 'ae-overlay';
    ov.addEventListener('mousedown', e => { if (e.target === ov) closeCustomProvider(); });
    document.body.appendChild(ov);
  }
  const m = _cm;
  ov.innerHTML = `
    <div class="cm-modal" role="dialog" aria-modal="true" aria-labelledby="cm-title">
      <div class="cm-head">
        <div><h3 id="cm-title">${m.editing ? 'Edit custom model provider' : 'Add LLM provider'}</h3>
          <p>${m.tab === 'third' ? 'Pick a provider from the catalog and enter its API key.' : 'Connect any OpenAI-compatible or Anthropic-compatible endpoint.'}</p></div>
        <button type="button" class="btn btn-ghost btn-sm" onclick="closeCustomProvider()" aria-label="Close">${ico('x')}</button>
      </div>
      <div class="cm-body">
        ${m.editing ? '' : `<div class="cm-tabs">
          <button type="button" class="cm-tab${m.tab === 'third' ? ' on' : ''}" onclick="cmTab('third')">${ico('layers')} Third-party model provider</button>
          <button type="button" class="cm-tab${m.tab === 'custom' ? ' on' : ''}" onclick="cmTab('custom')">${ico('code')} Custom model API</button>
        </div>`}
        ${cmBodyHtml(m)}
        <div class="cfgp-note ${m.msg ? (m.ok ? 'ok' : 'err') : ''}" id="cm-msg" role="status">${esc(m.msg)}</div>
      </div>
      <div class="cm-foot">
        <button type="button" class="btn btn-outline" onclick="closeCustomProvider()">Cancel</button>
        ${m.force ? `<button type="button" class="btn btn-outline" onclick="cmSave(true)">Save anyway</button>` : ''}
        <button type="button" class="btn btn-primary" id="cm-save" onclick="cmSave(false)" ${m.busy ? 'disabled' : ''}>Test connection &amp; save</button>
      </div>
    </div>`;
}

window.editOllama = function() {
  openCustomProvider();
  const st = (_configCache?.providers || []).find(p => p.provider === 'ollama');
  if (st?.fields?.base_url) _cm.bf.base_url = st.fields.base_url;
  cmSelect('ollama');
};

window.closeCustomProvider = function() { _cm = null; renderCustomModal(); };
window.cmTab = function(t) { cmCapture(); _cm.tab = t; _cm.msg = ''; _cm.force = false; renderCustomModal(); };
window.cmSelect = function(v) {
  cmCapture();
  _cm.sel = v; _cm.msg = ''; _cm.force = false;
  const p = CM_PRESETS.find(x => 'p:' + x.id === v);
  if (p) Object.assign(_cm, {id: p.id, name: p.name, base_url: p.url, protocol: 'openai', headers: p.headers || '', models: ['']});
  else {
    const st = (_configCache?.providers || []).find(x => x.provider === v);
    _cm.models = [...(st?.models || [])].concat('').slice(0, 501);
    if (v === 'ollama') _cm.opts = {...OLLAMA_PRESETS.balanced, ...(st?.options || {})};   // show the values actually in effect
  }
  renderCustomModal();
};
window.cmToggleKey = function() { cmCapture(); _cm.showKey = !_cm.showKey; renderCustomModal(); };
window.cmAddModel = function() { cmCapture(); _cm.models.push(''); renderCustomModal(); document.querySelector('.cm-model-in:last-of-type')?.focus(); };
window.cmRemoveModel = function(i) { cmCapture(); _cm.models.splice(i, 1); renderCustomModal(); };

function cmHeaders() {
  const h = {};
  for (const line of (_cm.headers || '').split('\n')) {
    const i = line.indexOf(':');
    if (i > 0 && line.slice(0, i).trim()) h[line.slice(0, i).trim()] = line.slice(i + 1).trim();
  }
  return h;
}

async function cmProbe() {
  return api('/config/custom-providers/probe', {method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({protocol: _cm.protocol, base_url: _cm.base_url, api_key: _cm.api_key, headers: cmHeaders(), provider_id: _cm.editing ? _cm.id : ''})});
}

const OLLAMA_URL = 'http://localhost:11434';
async function cmProbeOllama() {
  const r = await api('/llm/test', {method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({provider: 'ollama', base_url: _cm.bf.base_url || OLLAMA_URL})});
  if (r.ok && !Array.isArray(r.models)) throw new Error('The server is running an older version that cannot list Ollama models — restart it.');
  return r;
}

window.cmFetchModels = async function() {
  cmCapture();
  const builtin = cmIsBuiltin();
  if (!builtin && !_cm.base_url) { _cm.msg = 'Enter the Base URL first.'; _cm.ok = false; _cm.adv = true; renderCustomModal(); return; }
  const btn = document.getElementById('cm-fetch');
  if (btn) { btn.disabled = true; btn.innerHTML = ico('loader', 'ico-spin') + ' Fetching…'; }
  try {
    const r = builtin ? await cmProbeOllama() : await cmProbe();
    cmCapture();
    if (r.ok) _cm.models = [...new Set([..._cm.models.filter(Boolean), ...r.models])].slice(0, 500);
    _cm.msg = r.message; _cm.ok = r.ok;
  } catch (e) { _cm.msg = e.message || String(e); _cm.ok = false; }
  renderCustomModal();
};

async function cmFinish() {
  _cm = null; renderCustomModal();
  await fetchConfigProviders();
  render(renderConfigPage(_configCache));
}

async function cmSaveBuiltin(force) {
  const p = _cm.sel, meta = CONFIG_PROVIDER_META[p], body = {};
  for (const f of meta.fields) body[f.key] = _cm.bf[f.key] || '';
  if (p === 'ollama' && !body.base_url) body.base_url = OLLAMA_URL;
  if (p !== 'ollama' && !CM_TOP_FIELDS.some(k => body[k])) {
    _cm.msg = `Enter the ${meta.fields.find(f => CM_TOP_FIELDS.includes(f.key)).label}.`; _cm.ok = false; renderCustomModal(); return;
  }
  _cm.busy = true; _cm.force = false; _cm.ok = true; _cm.msg = force ? '' : 'Testing connection…'; renderCustomModal();
  try {
    if (p === 'ollama') { body.models = _cm.models.filter(Boolean); body.options = cmOllamaOptionsBody(); }
    if (!force) {
      const r = await api('/llm/test', {method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({provider: p, api_key: body.api_key || '', access_key_id: body.access_key_id || '',
                              secret_access_key: body.secret_access_key || '', region: body.region || '', base_url: p === 'ollama' ? body.base_url : ''})});
      if (!r.ok) { _cm.busy = false; _cm.force = true; _cm.ok = false; _cm.msg = r.message; renderCustomModal(); return; }
      if (p === 'ollama' && !body.models.length) body.models = (r.models || []).slice(0, 100);   // nothing typed: keep what Ollama lists
    }
    await api(`/config/providers/${p}`, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
    await cmFinish();
  } catch (e) { _cm.busy = false; _cm.ok = false; _cm.msg = e.message || String(e); renderCustomModal(); }
}

window.cmSave = async function(force) {
  cmCapture();
  if (cmIsBuiltin()) return cmSaveBuiltin(force);
  if (!_cm.id || !_cm.base_url) { _cm.msg = 'Provider ID and Base URL are required.'; _cm.ok = false; _cm.adv = true; renderCustomModal(); return; }
  _cm.busy = true; _cm.force = false; _cm.msg = force ? '' : 'Testing connection…'; _cm.ok = true; renderCustomModal();
  try {
    let models = _cm.models.filter(Boolean);
    if (!force) {
      const r = await cmProbe();
      if (!r.ok) { _cm.busy = false; _cm.force = true; _cm.ok = false; _cm.msg = r.message; renderCustomModal(); return; }
      if (!models.length) models = r.models.slice(0, 100);   // nothing typed: use what the endpoint lists
    }
    await api(`/config/custom-providers/${encodeURIComponent(_cm.id)}`, {method: 'PUT', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({name: _cm.name, protocol: _cm.protocol, base_url: _cm.base_url, api_key: _cm.api_key,
                            models, headers: cmHeaders()})});
    await cmFinish();
  } catch (e) { _cm.busy = false; _cm.ok = false; _cm.msg = e.message || String(e); renderCustomModal(); }
};

window.deleteCustomProvider = async function(pid) {
  if (!confirm(`Remove the custom provider "${pid}"? Scans that used it will need another provider.`)) return;
  try {
    await api(`/config/providers/${encodeURIComponent(pid)}`, {method: 'DELETE'});
    await fetchConfigProviders();
    render(renderConfigPage(_configCache));
  } catch (e) { alert('Remove failed: ' + (e.message || e)); }
};

/* Config page's own OAuth status refresh — same backend call as the old upload-form widget
   (refreshOauthStatus), but targets this page's element ids so both can coexist harmlessly
   during the transition and nothing breaks if one half of the DOM isn't mounted. */
window.refreshOauthStatusCfg = async function() {
  const textEl = document.getElementById('oauth-status-text-cfg');
  const ccRow = document.getElementById('oauth-claude-code-row-cfg');
  if (!textEl) return;

  } catch (e) {
    textEl.textContent = 'Could not check status: ' + (e.message || e);

route('config', async function() {
  render('<div class="page-wrap"><div class="loading"><div class="spinner"></div></div></div>');
  let data;
  try { data = await fetchConfigProviders(); }
  catch (e) { render(`<div class="page-wrap"><div class="alert alert-error">${esc(e.message)}</div></div>`); return; }
