# Malimite IPA Security Scan — Bitbucket Pipelines
# Add to your repository root as bitbucket-pipelines.yml or merge the
# 'malimite-scan' step into your existing pipeline.
#
# Required repository variables (Repository settings → Pipelines → Repository variables):
#   MALIMITE_IMAGE     — Docker image (default: ghcr.io/malimite/malimite:latest)
#   GHIDRA_HOME        — path inside container  (default: /opt/ghidra)
#   LLM_PROVIDER       — openai | claude | ollama | none
#   OPENAI_API_KEY     — (secured)
#   ANTHROPIC_API_KEY  — (secured)
#   IPA_PATH           — relative path to .ipa in repo (default: app.ipa)

image: atlassian/default-image:4

definitions:
  steps:
    - step: &malimite-scan
        name: Malimite IPA Security Scan
        services:
          - docker
        script:
          - export MALIMITE_IMAGE="${MALIMITE_IMAGE:-ghcr.io/malimite/malimite:latest}"
          - export IPA="${IPA_PATH:-app.ipa}"
          - export FAIL_ON="${FAIL_ON:-HIGH}"
          - export LLM_MODE="${LLM_MODE:-find_vulns}"
          - mkdir -p malimite-report
          - |
            docker run --rm \
              -v "$BITBUCKET_CLONE_DIR:/work" \
              -e GHIDRA_HOME="${GHIDRA_HOME:-/opt/ghidra}" \
              -e LLM_PROVIDER="${LLM_PROVIDER:-none}" \
              -e LLM_MODE="$LLM_MODE" \
              -e OPENAI_API_KEY="${OPENAI_API_KEY:-}" \
              -e ANTHROPIC_API_KEY="${ANTHROPIC_API_KEY:-}" \
              "$MALIMITE_IMAGE" \
              malimite "/work/$IPA" \
                --out /work/malimite-report \
                --sarif \
                --html \
                --llm \
                --llm-mode "$LLM_MODE" \
                --fail-on "$FAIL_ON"
        artifacts:
          - malimite-report/**

pipelines:
  default:
    - step: *malimite-scan

  branches:
    main:
      - step: *malimite-scan

  pull-requests:
    '**':
      - step: *malimite-scan
