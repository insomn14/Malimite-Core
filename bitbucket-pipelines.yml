# Malimite Security Scan — Bitbucket Pipelines template
#
# This file lives in Malimite-Core as a reference. Copy the relevant parts (or the whole
# 'malimite-scan' step below) into the MOBILE APP repository's own bitbucket-pipelines.yml —
# this is NOT meant to run inside the Malimite-Core repo itself.
#
# Uses tools/malimite-ci (a zero-dependency Python client, stdlib only) to upload a built
# APK/IPA to a running malimite-web server, wait for the scan, and fail the build if a finding
# at or above $FAIL_ON is present. The server itself does the actual Ghidra/JADX analysis — see
# deploy/EC2_DEPLOYMENT.md in Malimite-Core for how to stand one up. This template does NOT run
# `docker run malimite` locally: no Docker image for a standalone scanner is currently published
# (see README.md's "CI/CD integration" section for the current status of that approach).
#
# Required repository/workspace variables (Repository settings -> Pipelines -> Repository
# variables; mark MALIMITE_API_KEY as Secured):
#   MALIMITE_URL       — base URL of the malimite-web server, e.g. http://malimite.internal:7070
#   MALIMITE_API_KEY    — the server's configured API_KEY (Secured)
#   APP_PATH            — relative path to the built .apk/.ipa/.xapk in this repo (default: app.apk)
#   FAIL_ON             — NONE | LOW | MEDIUM | HIGH (default: HIGH)
#
# malimite_ci.py auto-detects BITBUCKET_BUILD_NUMBER/BITBUCKET_REPO_FULL_NAME/BITBUCKET_COMMIT
# and tags the scan with them — no extra configuration needed for that part.
#
# TRIGGER STRATEGY: release-tags-only (chosen over scanning every push/PR). A full scan can take
# minutes on a large IPA and the server has a bounded concurrency budget (MAX_CONCURRENT_SCANS,
# default 3) — scanning every PR across several teams' repos would compete for those slots and
# slow down everyone's PR feedback loop. Scanning only release builds trades fast-per-PR feedback
# for a predictable, low server load: every tag matching v* (e.g. v1.2.0) triggers a scan; plain
# commits/PRs to any branch do not. Adjust the `tags: 'v*'` pattern below to match your team's
# actual release-tagging convention if it differs.

image: python:3.12-slim

definitions:
  steps:
    # EXAMPLE build step — replace with your repo's actual build (Gradle for Android, xcodebuild
    # for iOS, etc). Only here so this file is runnable as-is for a quick first try; its only job
    # is to produce the file APP_PATH points at before the scan step below runs.
    - step: &build
        name: Build release APK
        image: eclipse-temurin:17-jdk
        caches:
          - gradle
        script:
          - ./gradlew assembleRelease
          - cp app/build/outputs/apk/release/app-release.apk app.apk
        artifacts:
          - app.apk

    - step: &malimite-scan
        name: Malimite Security Scan
        script:
          - APP_PATH="${APP_PATH:-app.apk}"
          - |
            if [ ! -f "$APP_PATH" ]; then
              echo "error: $APP_PATH not found — build your app before this step, or set APP_PATH" >&2
              exit 1
            fi
          - curl -fsSL -o malimite_ci.py
              "https://raw.githubusercontent.com/insomn14/Malimite-Core/main/tools/malimite-ci/malimite_ci.py"
          - |
            python3 malimite_ci.py \
              --url "$MALIMITE_URL" \
              --api-key "$MALIMITE_API_KEY" \
              --file "$APP_PATH" \
              --fail-on "${FAIL_ON:-HIGH}" \
              --json-out malimite-result.json
        artifacts:
          - malimite-result.json

pipelines:
  # Release-only trigger: runs ONLY when a tag matching v* is pushed (e.g. `git tag v1.2.0 &&
  # git push origin v1.2.0`), not on regular commits/PRs to any branch.
  tags:
    'v*':
      - step: *build        # replace with your repo's actual build step(s) — produces APP_PATH
      - step: *malimite-scan
